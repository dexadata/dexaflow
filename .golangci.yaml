# .golangci.yaml
# Lint configuration for Dexaflow (golangci-lint v2 schema).
# Enforces Go Report Card A+ (ADR 0012) plus security and correctness checks (ADR 0014).
version: "2"

run:
  modules-download-mode: readonly
  allow-parallel-runners: true
  tests: true

linters:
  default: none
  enable:
    # ─── Go Report Card A+ baseline (gofmt lives under `formatters`) ───
    - govet              # Suspicious constructs
    - gocyclo            # Cyclomatic complexity
    - ineffassign        # Ineffectual assignments
    - misspell           # Spelling errors

    # ─── Modern replacements / supersets ───
    - revive             # Modern golint replacement; enforces GoDoc on exports
    - staticcheck        # Comprehensive static analysis (absorbs gosimple/stylecheck in v2)
    - unused             # Unused identifiers
    - errcheck           # Every returned error must be handled

    # ─── Security (ADR 0014) ───
    - gosec              # Security-oriented antipatterns
    - depguard           # Allowed registry client packages (ADR 0073)

    # ─── Correctness / quality ───
    - gocritic           # Opinionated style and performance hints
    - bodyclose          # HTTP body must be closed
    - contextcheck       # Context propagation correctness
    - durationcheck      # Suspicious time.Duration math
    - errorlint          # Proper error wrapping (errors.Is/As, %w)
    - exhaustive         # Exhaustive switch statements on enums
    - gocheckcompilerdirectives  # //go: directives parse correctly
    - nilerr             # No `return nil` when err is non-nil
    - nilnil             # No `return nil, nil`
    - noctx              # HTTP requests must use context
    - prealloc           # Preallocate slices when length is known
    - predeclared        # Don't shadow predeclared identifiers
    - reassign           # Don't reassign package-level vars
    - sqlclosecheck      # sql.Rows / sql.Stmt must be closed
    - unconvert          # Unnecessary type conversions
    - wastedassign       # Wasted assignments

    # ─── Style consistency ───
    - whitespace         # Trailing whitespace
    - tagliatelle        # Struct tag naming consistency
    - nolintlint         # Every //nolint names its linters and says why (#1572)

  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
      # A directive can be needed on one platform or golangci-lint version and
      # not another (field widths in syscall structs, gosec rule changes), so
      # an unused one is not a finding.
      allow-unused: true
    depguard:
      rules:
        # ADR 0073 section 3: the CLI's registry client may use only these
        # go-containerregistry packages. pkg/v1/daemon wraps the Docker SDK
        # (ADR 0015); k8schain and pkg/v1/google pull cloud SDKs into the CLI.
        # The longest match wins, so the allow entries carve out of the deny.
        registry-client:
          list-mode: lax
          files:
            - "!$test"
            - "!**/test/load/**"
          deny:
            - pkg: github.com/google/go-containerregistry
              desc: "only the packages ADR 0073 section 3 allows"
            - pkg: github.com/docker/docker
              desc: "the Docker SDK is refused (ADR 0015)"
            - pkg: github.com/moby/moby
              desc: "the Docker SDK is refused (ADR 0015)"
            - pkg: github.com/docker/cli
              desc: "reached only through authn.DefaultKeychain (ADR 0073)"
            - pkg: github.com/docker/docker-credential-helpers
              desc: "reached only through authn.DefaultKeychain (ADR 0073)"
          allow:
            - github.com/google/go-containerregistry/pkg/name
            - github.com/google/go-containerregistry/pkg/authn$
            - github.com/google/go-containerregistry/pkg/v1$
            - github.com/google/go-containerregistry/pkg/v1/remote$
            # The error type of remote, to tell a missing manifest from a
            # registry that could not be read; linked by remote already.
            - github.com/google/go-containerregistry/pkg/v1/remote/transport$
            - github.com/google/go-containerregistry/pkg/v1/mutate
            - github.com/google/go-containerregistry/pkg/v1/tarball
            - github.com/google/go-containerregistry/pkg/v1/empty
            - github.com/google/go-containerregistry/pkg/v1/types
        # Tests may also stand up an in-memory registry and random images,
        # and so may the load harnesses, which are never part of a binary
        # (test/load/deploy_p50 serves one on the loopback).
        registry-client-tests:
          list-mode: lax
          files:
            - "$test"
            - "**/test/load/**"
          deny:
            - pkg: github.com/google/go-containerregistry/pkg/v1/daemon
              desc: "wraps the Docker SDK (ADR 0015)"
            - pkg: github.com/google/go-containerregistry/pkg/authn/k8schain
              desc: "pulls cloud SDKs into the CLI (ADR 0073)"
            - pkg: github.com/google/go-containerregistry/pkg/v1/google
              desc: "pulls cloud SDKs into the CLI (ADR 0073)"
            - pkg: github.com/docker/docker
              desc: "the Docker SDK is refused (ADR 0015)"
            - pkg: github.com/moby/moby
              desc: "the Docker SDK is refused (ADR 0015)"
        # The API, the scheduler and the executor take their settings and
        # stores as their own or domain types, mapped in cmd/dexaflow-server
        # (#1948). Tests may still build them from config or storage.
        layering:
          list-mode: lax
          files:
            - "**/internal/api/**"
            - "**/internal/scheduler/**"
            - "**/internal/executor/**"
            - "!$test"
          deny:
            - pkg: github.com/dexadata/dexaflow/internal/config
              desc: "map config onto api or domain types in cmd/dexaflow-server (#1948)"
            - pkg: github.com/dexadata/dexaflow/internal/storage
              desc: "depend on an interface the server wires a store into (#1948)"
    gocyclo:
      # ADR 0012: hard cap at 15. Critical paths target <=10 but that is not enforced here.
      min-complexity: 15

    govet:
      enable-all: true
      disable:
        - fieldalignment   # Pedantic; we accept the cost for readability

    misspell:
      locale: US

    revive:
      severity: warning
      enable-all-rules: false
      rules:
        # Exports must have GoDoc starting with the identifier name (ADR 0012)
        - name: exported
          severity: error
          disabled: false
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
        - name: package-comments
          severity: error
        - name: var-naming
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
          disabled: true   # Often a false positive on interface implementations
        - name: unreachable-code
        - name: redefines-builtin-id

    staticcheck:
      checks: ["all"]

    gosec:
      severity: medium
      confidence: medium
      excludes:
        - G104  # Audited via errcheck instead
        - G304  # File path from variable — common in CLI tools, audited case by case
      config:
        G306: "0644"      # Required file permissions for written files
        G302: "0644"

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - hugeParam        # Premature optimization; profile first
        - rangeValCopy     # Same as above
        - paramTypeCombine # Stylistic preference, not enforced

    errcheck:
      check-type-assertions: true
      check-blank: true

    exhaustive:
      default-signifies-exhaustive: true

    tagliatelle:
      case:
        use-field-name: false
        rules:
          json: snake
          yaml: snake
          xml: camel

  exclusions:
    rules:
      # Generated code (sqlc, protobuf) is not subject to lint
      - path: internal/storage/queries/.*\.go
        linters:
          - revive
          - staticcheck
          - errcheck
          - gosec
      - path: proto/.*\.go
        linters:
          - revive
          - staticcheck
          - errcheck
          - gosec
      - path: .*\.pb\.go
        linters:
          - revive
          - staticcheck
          - errcheck
          - gosec
      # Test files have relaxed rules
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - gocyclo
      # Examples in /examples may use _ for clarity
      - path: examples/.*
        linters:
          - errcheck

formatters:
  enable:
    - gofmt              # Canonical Go formatting (ADR 0012)

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
      colors: true
