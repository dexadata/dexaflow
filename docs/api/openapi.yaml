        "200":
          description: Log content
          content:
            text/plain:
              schema: { type: string }
        "503":
          $ref: "#/components/responses/AuthUnavailable"

  /api/v2/dags/{dag_id}/clearTaskInstances:
    parameters:
      - $ref: "#/components/parameters/DagID"
    post:
      summary: Clear task instances (queue them for re-run)
      operationId: clearTaskInstances
      tags: [Task Instances]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClearTaskInstancesRequest"
      responses:
        "200":
          description: >-
            The task instances cleared, or with dry_run (the default) the ones
            the clear would reset. Carries run_on_latest_version_not_applied
            when run_on_latest_version was asked and a run keeps its version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskInstanceCollection"
        "409":
          description: >-
            Not answered since ADR 0086, which replaced the refusal of a clear
