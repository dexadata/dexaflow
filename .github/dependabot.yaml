version: 2
updates:
  # Go modules
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: ["dependencies", "go"]
    open-pull-requests-limit: 10

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "ci"]

  # Docker base images.
  #
  # These three entries previously pointed at /runtime/python-3.10, -3.11 and
  # -3.12, none of which exist in this repository. Dependabot silently finds no
  # manifest at a missing directory, so base-image updates never ran at all —
  # the config looked configured and did nothing. scripts/check-dependabot-dirs.sh
  # now fails CI on a path that does not resolve.
  #
  # Scoped to the images that ship: the two deploy images and the task runtime
  # base. The examples ship no Dockerfile; their images are generated from
  # dexaflow.yaml at build time.
  - package-ecosystem: docker
    directories:
      - "/deploy"
      - "/runtime"
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-base-images:
        patterns: ["*"]
    labels: ["dependencies", "docker"]

  # Python dependencies. Both projects carry their own pyproject.toml; only
  # /parser was covered before, so runtime/python's dependencies went unwatched.
  - package-ecosystem: pip
    directories:
      - "/parser"
      - "/runtime/python"
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        patterns: ["*"]
    labels: ["dependencies", "python"]

  # npm. Both manifests are installed with `npm ci` in CI and had no update
  # entry (#1553). The root package.json pins playwright-core, which
  # scripts/check-playwright-pin.sh holds equal to PLAYWRIGHT_VERSION in
  # ci.yaml: a bump PR from here fails that gate until the same PR moves the
  # ci.yaml pin too, which is the review step that pin exists for.
  # /website carries the Docsy PostCSS toolchain.
  - package-ecosystem: npm
    directories:
      - "/"
      - "/website"
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    labels: ["dependencies"]
