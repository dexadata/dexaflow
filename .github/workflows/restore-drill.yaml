name: Database backup & restore drill

# Periodic restore drill for Lite and Pro (#1995, ADR 0090).
# A backup that was never restored does not count as a backup.
# This workflow exercises taking a logical backup, clearing the database,
# restoring the backup into the empty database, and verifying the server boots
# cleanly and passes /readyz and authentication checks.
on:
  schedule:
    - cron: "0 4 * * 1"
  push:
    tags: ["v*-rc.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  restore-drill:
    name: Restore drill (clean database recovery verification)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leoflow
          POSTGRES_PASSWORD: leoflow
          POSTGRES_DB: leoflow_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leoflow -d leoflow_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run restore drill E2E
        run: bash test/e2e/restore-drill-e2e.sh
