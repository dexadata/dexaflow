# One-off copy of the current release's published images and chart from the
# old owner namespace (ghcr.io/neochaotic) to the org namespace (ghcr.io/dexadata).
#
# The repository moved from neochaotic/leoflow to dexadata/leoflow, and GHCR
# packages do not move with a repository. Release workflows publish under
# `github.repository_owner`, so the next release lands in ghcr.io/dexadata on
# its own. Until then, the defaults on main (Helm values, the published runtime
# base used by `leoflow compile`, the helm-ci upgrade guard) point at
# ghcr.io/dexadata, so the latest release has to exist there too.
#
# Manual trigger only. Older tags stay in ghcr.io/neochaotic and keep working.
name: Mirror images to org namespace
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to copy, without the leading v"
        required: true
        default: "0.4.8"

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      SRC: ghcr.io/neochaotic
      DST: ghcr.io/dexadata
      VERSION: ${{ inputs.version }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Copy images (multi-arch manifests preserved)
        run: |
          set -euo pipefail
          copy() {
            echo "copy ${SRC}/$1 -> ${DST}/$1"
            docker buildx imagetools create --tag "${DST}/$1" "${SRC}/$1"
          }
          for tag in "${VERSION}" "v${VERSION}"; do
            copy "leoflow-server:${tag}"
            copy "leoflow-migrate:${tag}"
          done
          copy "leoflow-migrate:latest"
          for py in 3.10 3.11 3.12 3.13; do
            copy "leoflow-runtime:py${py}"
            copy "leoflow-runtime:py${py}-v${VERSION}"
          done

      - name: Copy Helm chart
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm pull "oci://${SRC}/charts/leoflow" --version "${VERSION}"
          helm push "leoflow-${VERSION}.tgz" "oci://${DST}/charts"

      - name: Verify anonymous pulls
        run: |
          set -euo pipefail
          docker logout ghcr.io
          for ref in "leoflow-server:v${VERSION}" "leoflow-migrate:v${VERSION}" "leoflow-runtime:py3.11"; do
            docker buildx imagetools inspect "${DST}/${ref}" >/dev/null \
              && echo "public: ${DST}/${ref}" \
              || echo "::warning::${DST}/${ref} is not anonymously pullable; set the package visibility to public"
          done
