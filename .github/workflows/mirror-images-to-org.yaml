# One-off copy of the current release's published images and chart from the
# old owner namespace (ghcr.io/neochaotic) to the org namespace (ghcr.io/dexadata).
#
# The repository moved from neochaotic/leoflow to dexadata/leoflow, and GHCR
# packages do not move with a repository. Release workflows publish under
# `github.repository_owner`, so the next release lands in ghcr.io/dexadata on
# its own. Before that, the defaults on main (Helm values, the published
# runtime base used by `leoflow compile`, the helm-ci upgrade guard) move to
# ghcr.io/dexadata, so the latest release has to exist there first. Run this
# before merging the change that moves those defaults.
#
# Manual trigger only, and safe to re-run: `--force` overwrites the same tags
# with the same digests. Older tags stay in ghcr.io/neochaotic and keep working.
name: Mirror images to org namespace
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to copy, without the leading v"
        required: true
        default: "0.4.8"

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      SRC: ghcr.io/neochaotic
      DST: ghcr.io/dexadata
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate the version input
        run: |
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.2.3 (got '${VERSION}')"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # `cosign copy` moves the image or chart together with its signatures and
      # attestations, so `cosign verify` keeps working on the copy. The copies keep
      # the original signing identity (github.com/neochaotic/leoflow workflows);
      # the docs accept both identities.
      - name: Copy images and chart with signatures
        run: |
          set -euo pipefail
          # copy SRC_REF [DST_REF]: DST_REF defaults to SRC_REF.
          copy() {
            echo "copy ${SRC}/$1 -> ${DST}/${2:-$1}"
            cosign copy --force "${SRC}/$1" "${DST}/${2:-$1}"
          }
          # Each image under its pre-rename name and its dexaflow-* name, so the
          # defaults on main can move to dexaflow-* before the first release
          # published under that name.
          for name in server migrate; do
            for tag in "${VERSION}" "v${VERSION}"; do
              copy "leoflow-${name}:${tag}"
              copy "leoflow-${name}:${tag}" "dexaflow-${name}:${tag}"
            done
          done
          copy "leoflow-migrate:latest"
          copy "leoflow-migrate:latest" "dexaflow-migrate:latest"
          for py in 3.10 3.11 3.12 3.13; do
            for tag in "py${py}" "py${py}-v${VERSION}"; do
              copy "leoflow-runtime:${tag}"
              copy "leoflow-runtime:${tag}" "dexaflow-runtime:${tag}"
            done
          done
          copy "charts/leoflow:${VERSION}"

      - name: Verify anonymous pulls
        run: |
          set -euo pipefail
          docker logout ghcr.io
          for ref in "leoflow-server:v${VERSION}" "leoflow-migrate:v${VERSION}" "leoflow-runtime:py3.11" \
                     "dexaflow-server:v${VERSION}" "dexaflow-migrate:v${VERSION}" "dexaflow-runtime:py3.11"; do
            docker manifest inspect "${DST}/${ref}" >/dev/null \
              && echo "public: ${DST}/${ref}" \
              || echo "::warning::${DST}/${ref} is not anonymously pullable; set the package visibility to public"
          done
