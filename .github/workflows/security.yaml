name: Security

# release-* as well as main (ADR 0062): a release branch ships, so its pushes
# keep their own code scanning baseline, under that branch's ref.
on:
  push:
    branches: [main, "release-*"]
  pull_request:
    branches: [main, "release-*"]
  schedule:
    - cron: "0 6 * * 1"  # Weekly on Monday at 06:00 UTC

permissions:
  contents: read
  security-events: write    # Required for SARIF upload to GitHub Security tab

env:
  GO_VERSION: "1.26.6"

# A newer push to the same pull request supersedes this run, so the older one
# is cancelled instead of holding runners the newer one needs. Every other run
# (pushes to main and release-*, tags, schedules, manual runs) gets a group of
# its own, keyed by run id: a shared group would still cancel a WAITING run
# when a third one arrives, whatever cancel-in-progress says, and
# cut-release.sh refuses to tag a commit whose run was cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # govulncheck: Go-aware vulnerability scanning (ADR 0014)
  # Reports only vulnerabilities reachable by our code; zero false positives.
  # ─────────────────────────────────────────────────────────────────────
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck -show verbose ./...

      # `./...` matches packages in THIS module and nothing else, so it does not
      # reach the second binary we publish: the golang-migrate CLI in
      # `leoflow-migrate`, which deploy/Dockerfile.migrate compiles from
      # upstream's own `cmd/migrate` main package at the version pinned in our
      # go.mod (#1039). That package is inside our module graph but outside
      # `./...`, which is precisely the gap that let the old third-party image
      # accumulate 50 fixable CRITICAL/HIGH unseen — naming it here is what
      # keeps the gap closed rather than merely reset.
      #
      # The build tags matter: golang-migrate registers database drivers behind
      # them, so an untagged analysis would scan a binary with no drivers in it
      # — not the one that ships. scripts/check-migrate-cli-build-tags.sh fails
      # CI when these tags and the Dockerfile's disagree.
      - name: Run govulncheck on the published migrate CLI
        run: govulncheck -tags postgres,pgx5 -show verbose github.com/golang-migrate/migrate/v4/cmd/migrate

  # ─────────────────────────────────────────────────────────────────────
  # CodeQL: GitHub's semantic SAST (ADR 0014)
  # Free for public repos. Catches taint flow / control flow issues.
  # ─────────────────────────────────────────────────────────────────────
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [go, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"

  # ─────────────────────────────────────────────────────────────────────
  # Trivy: FILESYSTEM scanning of this repository (ADR 0014)
  #
  # This job reads our module graph and lock files. It scans no image, and the
  # job name says so: it was called "Trivy (image scan)" for many releases with
  # `scan-type: fs` underneath, and the maintainer drew the wrong conclusion
  # from that name twice in one day, in both directions (#1036). Container
  # images are scanned by two blocking jobs below — `server-image` and
  # `migrate-image` (#1039) — and by .github/workflows/image-scan.yaml, which
  # covers leoflow-runtime on a schedule (#1034). A third copy here would only
  # duplicate them.
  #
  # Runs on PRs too (#437): a fixable dependency CVE must fail its own PR check,
  # not slip through and redden main on the post-merge run (as it did in #436 and
  # #439). ignore-unfixed keeps the gate to actionable, fixable findings only.
  # ─────────────────────────────────────────────────────────────────────
  trivy:
    name: Trivy (filesystem scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Filesystem scan of the repo (dependencies + committed secrets).
      # trivy-ignorefile-exempt: .trivyignore.yaml holds accepted CONTAINER IMAGE
      # findings — OS and vendored-binary CVEs in bases we do not author. This scan
      # reads our own module graph and lock files, a different population with a
      # different owner, and wiring the image list in here would let one accepted
      # base-image finding silently suppress the same CVE in code we wrote.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif

      # Upload the SARIF baseline to the Security tab only on push/schedule. On a
      # PR the scan still gates the check (exit-code 1 above), but we do not upload
      # so a PR run cannot collide with or overwrite the main branch baseline under
      # the shared trivy-fs category (#437).
      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ─────────────────────────────────────────────────────────────────────
  # leoflow-server image scan — the BLOCKING half of the container policy.
  #
  # This is the one image whose contents are entirely ours: distroless static
  # (Debian 13, the same base as leoflow-migrate) plus a Go binary built from
  # this repository's go.mod. Apart from the six distroless base packages (see
  # the migrate job below) there is no OS package set to inherit CVEs from, so a
  # finding here is caused by a commit and closed by a `go get`. That makes it
  # the only image where a PR-blocking gate is fair: the person who turns it
  # red is the person who can turn it green.
  #
  # `leoflow-migrate` is gated by its own job below, on the same criterion, since
  # #1039 made it true of that image too. `leoflow-runtime` is NOT gated here: it
  # inherits a Debian package set that acquires CVEs with no commit of ours, so a
  # blocking gate on it would fail whoever pushes next rather than whoever can fix
  # it, and would be switched off within a week. It is scanned on a schedule
  # instead — see .github/workflows/image-scan.yaml.
  #
  # Policy: fixable only, CRITICAL/HIGH blocks. `ignore-unfixed` is what makes
  # this sustainable: severity says how bad a finding is, fixability says whether
  # anyone can do anything about it, and only the second is a gate criterion.
  # Baseline at the time of writing: leoflow-server reports ZERO findings under
  # this policy (1 total finding, nothing CRITICAL/HIGH, nothing fixable), so the
  # gate starts green and any red is a real regression.
  #
  # ── The image built here is the one we publish ───────────────────────
  #
  # It has to be, or the gate is theatre. Trivy keys `stdlib` findings to the Go
  # toolchain recorded in the binary's build info, not to the module graph: the
  # migrate image used to report 21 HIGH `stdlib` findings purely because the
  # third-party binary it shipped was built with go1.25.4 (#1039). Scanning a
  # binary built by a different toolchain than the release one scans a different
  # vulnerability set
  # — blind to a stdlib CVE that affects the shipped toolchain, and red for one
  # that does not.
  #
  # `deploy/Dockerfile.server` compiles from source inside `golang:<toolchain>-
  # bookworm` and is the developer/kind convenience path. GoReleaser publishes
  # `deploy/Dockerfile.server.release`, which copies in a binary the release
  # workflow builds with GO_VERSION. So this job reproduces the release recipe —
  # same toolchain, same `CGO_ENABLED=0 -trimpath`, same distroless base — and
  # scans that. GO_VERSION here is the same literal as release.yaml's, go.mod's
  # `toolchain` line and both Dockerfiles' `ARG GO_VERSION` default;
  # scripts/check-go-toolchain-pin.sh fails when any of them disagree (#1036).
  # Before that gate existed, this comment spent two paragraphs arguing for a
  # base tag one minor ahead of the toolchain go.mod pinned, and nothing noticed.
  #
  # A floating major.minor build tag would also have quietly broken the fairness
  # argument this gate rests on. A stdlib CVE in a floating build tag is closed
  # by a base rebuild, not by a `go get` — it would redden the blocking gate for
  # whoever opened the next unrelated PR, which is exactly the scenario used to
  # justify NOT gating runtime and migrate. Pinning to the release toolchain
  # keeps "a finding here is closed by a commit" true.
  #
  # Residual gap, stated rather than papered over: this builds HEAD's binary, not
  # a published tag. A CVE in an already-published `leoflow-server` that HEAD no
  # longer produces is not visible here — the daily scan and the Security tab
  # baseline from `main` are where that shows up.
  #
  # Cost: compiling with actions/setup-go (module + build cache across runs) and
  # then a COPY into distroless is minutes, where `docker build` of the
  # from-source Dockerfile re-downloaded and recompiled everything on every run.
  # The job stays on every event deliberately — it is meant to be a required
  # check, and a `paths:`-skipped required check never reports and blocks the PR
  # forever.
  # ─────────────────────────────────────────────────────────────────────
  server-image:
    name: Trivy (leoflow-server image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # The GoReleaser recipe for the `dexaflow-server` binary (.goreleaser.yaml,
      # builds id: dexaflow-server): CGO-free, -trimpath, version metadata in
      # ldflags. The ldflag VALUES do not affect what Trivy reports — it reads
      # the module list and toolchain from the build info — but the toolchain and
      # the build mode do, so those match exactly.
      - name: Build the release binary (the GoReleaser recipe)
        run: |
          set -euo pipefail
          mkdir -p dist/image-scan-context
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w \
              -X github.com/dexadata/dexaflow/internal/version.version=ci \
              -X github.com/dexadata/dexaflow/internal/version.gitCommit=${GITHUB_SHA}" \
            -o dist/image-scan-context/dexaflow-server ./cmd/dexaflow-server
          go version -m dist/image-scan-context/dexaflow-server | head -3

      # deploy/Dockerfile.server.release is the file .goreleaser.yaml points at
      # for both published arches. It COPYs `dexaflow-server` from the build
      # context, so the context is the staging directory holding it.
      - name: Build leoflow-server image (the published Dockerfile)
        run: docker build -f deploy/Dockerfile.server.release -t leoflow-server:ci dist/image-scan-context

      # Report: every FIXABLE finding at any severity, so the Security tab shows
      # the MEDIUM/LOW ones the gate deliberately does not block on. Unfixed
      # findings are excluded here too — an alert nobody can ever close is not
      # visibility, it is noise that teaches people to ignore the tab.
      - name: Trivy image scan (SARIF report)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: image
          image-ref: leoflow-server:ci
          scanners: vuln
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy-server-image.sarif

      # Same rule as the filesystem scan above (#437): gate on every event, but
      # upload only off pull_request, so a PR run cannot overwrite the main
      # branch baseline under a shared category.
      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: trivy-server-image.sarif
          category: trivy-server-image

      # Gate: fixable CRITICAL/HIGH only.
      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: image
          image-ref: leoflow-server:ci
          scanners: vuln
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

  # ─────────────────────────────────────────────────────────────────────
  # leoflow-migrate image scan — the second half of the BLOCKING gate.
  #
  # This image was the strongest argument for the report-only lane: it was
  # `FROM migrate/migrate` — Alpine plus a third-party Go binary — and the daily
  # scan found 84 fixable findings in it, 50 of them CRITICAL/HIGH, none of them
  # produced or closeable by a commit here.
  #
  # #1039 changed what the image is, and therefore which lane it belongs in.
  # `deploy/Dockerfile.migrate` now compiles golang-migrate's own CLI from the
  # version in our go.mod onto distroless static, so the image is a Go binary we
  # build, our SQL files, and the six base packages distroless carries
  # (base-files, ca-certificates, media-types, netbase, tzdata, tzdata-legacy).
  # Not zero OS packages — six instead of Alpine's full set. Every finding in the
  # Go half is closed by a `go get` or a toolchain bump, which is the criterion
  # the server gate above rests on: "the person who turns it red is the person
  # who can turn it green".
  #
  # The six are the residual, and they are why this gate does not need an off
  # switch. A fixable finding in one of them is not closeable here — you wait for
  # Google to rebuild the base — so it gets a dated entry in .trivyignore.yaml,
  # which enforces a statement, an expiry and a 180-day cap. A reviewed,
  # self-expiring exception is what keeps a blocking gate from becoming a
  # disabled one, and it is the same posture leoflow-server already runs under.
  #
  # A Go stdlib advisory with no released fix carries no FixedVersion, so
  # --ignore-unfixed drops it and the gate stays green until the patch ships —
  # at which point the remedy is an ARG GO_VERSION bump in this repo.
  #
  # Unlike leoflow-server there is no separate release Dockerfile to reproduce:
  # `deploy/Dockerfile.migrate` IS the file release.yaml builds and pushes, so
  # building it here scans the published recipe rather than an approximation.
  # Its pinned GO_VERSION defaults to the same toolchain as this workflow's, and
  # the build stage cross-compiles, so the amd64 image built here is byte-for-
  # byte the recipe the release runs.
  #
  # Baseline at the time of writing: ZERO findings under this policy (zero
  # unfiltered, too), so the gate starts green and any red is a real regression.
  # ─────────────────────────────────────────────────────────────────────
  migrate-image:
    name: Trivy (leoflow-migrate image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No build-args: the Dockerfile's own GO_VERSION default is the pin, and
      # scripts/check-migrate-cli-build-tags.sh asserts it equals this
      # workflow's GO_VERSION. Overriding it here would scan a toolchain the
      # release does not use.
      - name: Build leoflow-migrate image (the published Dockerfile)
        run: docker build -f deploy/Dockerfile.migrate -t leoflow-migrate:ci .

      # Report: every FIXABLE finding at any severity, so the Security tab shows
      # the MEDIUM/LOW ones the gate deliberately does not block on.
      - name: Trivy image scan (SARIF report)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: image
          image-ref: leoflow-migrate:ci
          scanners: vuln
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy-migrate-image.sarif

      # Same rule as every other scan here (#437): gate on every event, upload
      # only off pull_request so a PR run cannot overwrite the main baseline.
      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: trivy-migrate-image.sarif
          category: trivy-migrate-image

      # Gate: fixable CRITICAL/HIGH only.
      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: image
          image-ref: leoflow-migrate:ci
          scanners: vuln
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

  # ─────────────────────────────────────────────────────────────────────
  # Gitleaks: secret scanning
  # ─────────────────────────────────────────────────────────────────────
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Run the pinned gitleaks binary directly (no Docker / Docker Hub). The v2
      # action makes GitHub API calls that crash under the default token; and a
      # `docker run zricethezav/gitleaks:latest` pull from Docker Hub is rate-limited
      # and flaked on a transient registry timeout ("context deadline exceeded",
      # exit 125) on a main push. The release tarball from GitHub is reliable in
      # Actions, version-pinned (reproducible rules), and the download is retried.
      # `dir .` auto-loads the repo's .gitleaks.toml allowlist.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          ok=0
          for i in 1 2 3; do
            if curl -fsSL "$url" -o /tmp/gitleaks.tgz; then ok=1; break; fi
            echo "::warning::gitleaks download attempt ${i} failed; retrying in 5s"; sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::could not download gitleaks v${GITLEAKS_VERSION} after 3 attempts"; exit 1; }
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks dir . --no-banner --redact --exit-code 1

  # ─────────────────────────────────────────────────────────────────────
  # Python EOL watch (#1031)
  # Every other signal in this workflow reacts to a CVE that already exists.
  # A base image that stops being rebuilt produces the opposite: the CVEs
  # accumulate and the image never changes, because docker-library/python
  # stops rebuilding an EOL line the day after it goes EOL. So this one asks
  # the calendar (endoflife.date) instead, and it runs here because this is
  # where the schedule already lives.
  #
  # It does not block anything on a date: the script exits 0 for every finding
  # and non-zero only when it cannot do its own job (feed down, feed reshaped).
  # A finding opens an issue instead, deduplicated by the python-eol label, so
  # it reaches a person rather than an annotation on a scheduled run nobody
  # opens. Issue-opening is limited to the schedule — a PR must not file one.
  # ─────────────────────────────────────────────────────────────────────
  python-eol:
    name: Python EOL watch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A PR must not go red because endoflife.date is down. The findings still
    # appear as annotations on the PR run — a contributor editing the enum sees
    # them — but only push and schedule treat the watchdog's own failure as red,
    # where a rerun is the whole remedy and nobody is blocked meanwhile.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check every published Python line against endoflife.date
        id: eol
        run: |
          # pipefail explicitly: the Actions default shell does not set it, and
          # `tee` would otherwise swallow the script's own failure exit.
          set -euo pipefail
          bash scripts/python-eol-warn.sh | tee "$RUNNER_TEMP/python-eol.md"

      - name: Open a tracking issue
        if: github.event_name == 'schedule' && steps.eol.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.eol.outputs.title }}
        run: |
          set -euo pipefail
          # The label is both the filing category and the dedupe key, so create
          # it if it is missing rather than failing the run on its absence.
          gh label create python-eol --color FBCA04 \
            --description "A published Python runtime base is approaching or past upstream EOL" \
            2>/dev/null || true
          existing="$(gh issue list --state open --label python-eol --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "python-eol issue #${existing} is already open; commenting instead of filing a duplicate"
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/python-eol.md"
            exit 0
          fi
          gh issue create --title "$TITLE" --label python-eol --body-file "$RUNNER_TEMP/python-eol.md"
