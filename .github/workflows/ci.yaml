name: CI

# release-* is the per-minor branch every patch is tagged from (ADR 0062). A
# cherry-pick PR to it gets the same CI as a PR to main, and so does the push
# that merges it, because cut-release.sh tags only a merge commit that is green.
on:
  push:
    branches: [main, "release-*"]
  pull_request:
    branches: [main, "release-*"]
  # The merge queue (#1569) tests each pull request on top of the queue
  # before it merges, and a required check has to report there too, or the
  # queue waits on it forever. No job in this file reads the pull_request
  # payload unguarded: tdd-check is pull_request only, and the heavy k3d gate
  # treats every event other than pull_request as "run".
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

env:
  # proxy.golang.org sometimes resets a large module download ("stream error:
  # INTERNAL_ERROR"), which failed whole jobs before any test ran. With "|" Go
  # falls back to the module's own source on any proxy error (with "," only on
  # 404/410); go.sum and sum.golang.org still verify every module.
  GOPROXY: https://proxy.golang.org|direct
  GO_VERSION: "1.26.10"
  PYTHON_VERSION: "3.11"
  GOLANGCI_LINT_VERSION: "v2.12.2"

# A newer push to the same pull request supersedes this run, so the older one
# is cancelled instead of holding runners the newer one needs. Every other run
# (pushes to main and release-*, tags, schedules, manual runs) gets a group of
# its own, keyed by run id: a shared group would still cancel a WAITING run
# when a third one arrives, whatever cancel-in-progress says, and
# cut-release.sh refuses to tag a commit whose run was cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Lint enforces ADR 0012 (Go Report Card A+ floor)
  # ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (golangci-lint A+ enforcement)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # #1942: no Go production file over 1,500 lines (#1580), and the files
      # already over it, pinned in scripts/go-file-length-allowlist.txt, never
      # grow. Shares this job so the check costs no extra runner, and runs
      # first because it takes milliseconds.
      - name: Go files stay under the length limit
        run: bash scripts/check-go-file-length.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # No golangci-lint cache: on 2026-10-28 a restored cache made staticcheck
      # report SA5011 after t.Fatal nil checks in files no PR touched, while a
      # clean run of the same commit found nothing. A cold run takes about as
      # long as a warm one here (four minutes), so the cache buys nothing.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          skip-cache: true

  # ─────────────────────────────────────────────────────────────────────
  # Proto drift: the generated gRPC code (proto/agent/v1) is committed, so a
  # change to proto/agent.proto without re-running `buf generate` would ship a
  # stale stub. Regenerate in CI and fail if the working tree differs.
  # ─────────────────────────────────────────────────────────────────────
  proto-drift:
    name: Proto generated code is in sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Plugins are pinned: protoc-gen-go to the go.mod version, protoc-gen-go-grpc
      # to v1.6.2 — these MUST match the versions the committed code was generated
      # with, or this check reports false drift.
      - name: Install protoc-gen plugins
        run: |
          set -euo pipefail
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@$(go list -m -f '{{.Version}}' google.golang.org/protobuf)"
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: buf generate
        run: buf generate
      - name: Fail on drift
        run: |
          if ! git diff --exit-code -- proto/; then
            echo "::error::proto/agent/v1 is out of sync with proto/agent.proto. Run 'buf generate' and commit." >&2
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────
  # pkg/client is generated from docs/api/openapi.yaml (ADR 0050 D8). A spec
  # change without re-running `make pkg-client` would ship a stale client.
  # Regenerate in CI and fail if the working tree differs.
  # ─────────────────────────────────────────────────────────────────────
  pkg-client-drift:
    name: pkg/client is in sync with the OpenAPI spec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Regenerate pkg/client
        run: make pkg-client
      - name: Fail on drift
        run: |
          if ! git diff --exit-code -- pkg/client/client.gen.go; then
            echo "::error::pkg/client/client.gen.go is out of sync with docs/api/openapi.yaml. Run 'make pkg-client' and commit." >&2
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────
  # The MCP server (ADR 0050) is exercised end-to-end against the REAL binary:
  # the test builds leoflow-mcp and drives it over the actual MCP protocol
  # (stdio) — catching wiring/transport bugs the in-process handler tests miss.
  # Hermetic (the control plane is an httptest server), so it runs in CI.
  # ─────────────────────────────────────────────────────────────────────
  mcp-e2e:
    name: MCP server e2e (real binary over stdio + http)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: MCP binary e2e
        run: go test -tags e2e ./internal/mcp/

  # ─────────────────────────────────────────────────────────────────────
  # Lint the GitHub Actions workflows themselves (actionlint). A malformed
  # workflow can silently fail to trigger or break a release; catching schema and
  # expression errors here keeps the CI/release workflows valid before they merge.
  # ─────────────────────────────────────────────────────────────────────
  workflow-lint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

  # ─────────────────────────────────────────────────────────────────────
  # Tests (ADR 0011: TDD with coverage floor per phase)
  # ─────────────────────────────────────────────────────────────────────
  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # the base branch's coverage artifact, for the delta
    outputs:
      badge: ${{ steps.gate.outputs.badge }}
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: leoflow
          POSTGRES_PASSWORD: leoflow
          POSTGRES_DB: leoflow_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: mirror.gcr.io/library/redis:7
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgres://leoflow:leoflow@localhost:5432/leoflow_test?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...

      # The per-package change in the job summary (#1572) compares against
      # the profile the base branch's own run uploaded: the pull request's
      # or merge queue's base commit, or the commit a push replaced, else
      # the newest green push run of the branch. Without one the summary
      # says so; this step never fails the job.
      - name: Fetch the base branch's coverage profile
        id: base
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || github.ref_name }}
        run: |
          label=$(BASE_REF="${BASE_REF#refs/heads/}" scripts/coverage-base.sh base-coverage.out)
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Enforce coverage floor
        id: gate
        # The floor and the exclude list live in scripts/coverage-gate.sh,
        # shared with the pre-commit hook so the two cannot drift (ADR 0011).
        env:
          BASE_LABEL: ${{ steps.base.outputs.label }}
        run: scripts/coverage-gate.sh coverage.out base-coverage.out "$BASE_LABEL"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out

  # The README coverage badge (#1572): shields.io reads a one-file endpoint
  # document from the badges branch, which this job replaces after each
  # green test run on main. No service account, token or repository setting:
  # the run's own token writes the branch, which no ruleset covers. The
  # branch holds one parentless commit, so it never grows. A run whose commit
  # is no longer main's head leaves the badge to the newer run. A failure
  # here must not turn main red (cut-release.sh tags only a green run), so
  # the job may fail on its own.
  coverage-badge:
    name: Coverage badge
    needs: test
    if: github.repository == 'dexadata/dexaflow' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: write # replace the badges branch
    steps:
      - name: Publish coverage.json on the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
          BADGE: ${{ needs.test.outputs.badge }}
        run: |
          set -euo pipefail
          repo="repos/${GITHUB_REPOSITORY}"
          head=$(gh api "$repo/git/ref/heads/main" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main moved to ${head:0:8}; its run publishes the badge"
            exit 0
          fi
          blob=$(gh api "$repo/git/blobs" -f content="$BADGE" -f encoding=utf-8 --jq .sha)
          tree=$(jq -n --arg sha "$blob" '{tree: [{path: "coverage.json", mode: "100644", type: "blob", sha: $sha}]}' |
            gh api "$repo/git/trees" --input - --jq .sha)
          commit=$(gh api "$repo/git/commits" -f "message=coverage of ${GITHUB_SHA}" -f "tree=$tree" --jq .sha)
          gh api -X PATCH "$repo/git/refs/heads/badges" -f "sha=$commit" -F force=true >/dev/null 2>&1 ||
            gh api "$repo/git/refs" -f ref=refs/heads/badges -f "sha=$commit" >/dev/null
          echo "badges branch at ${commit:0:8}: $BADGE"

  # ─────────────────────────────────────────────────────────────────────
  # Shell scripts drive CI and every release cut, and nothing linted them
  # (#1572). shellcheck runs at warning severity, where the tree is clean;
  # the info and style findings are a later tightening.
  # ─────────────────────────────────────────────────────────────────────
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck every tracked script
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck -S warning

  # ─────────────────────────────────────────────────────────────────────
  # Dockerfile lint (#1572). A warning or an error fails the job; the info
  # findings (numeric USER, consecutive RUN) stay as a report. A finding
  # that is deliberate carries a `# hadolint ignore=<rule>` with its reason
  # in the Dockerfile.
  # ─────────────────────────────────────────────────────────────────────
  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One job with a step per Dockerfile, not a matrix: the runners are
    # shared, and seven jobs per pull request cost more than they report.
    # Each step runs even when an earlier one failed, so one run reports
    # every Dockerfile.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: hadolint deploy/Dockerfile.cli.release
        if: ${{ !cancelled() }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: deploy/Dockerfile.cli.release
          failure-threshold: warning
      - name: hadolint deploy/Dockerfile.mcp.release
        if: ${{ !cancelled() }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: deploy/Dockerfile.mcp.release
          failure-threshold: warning
      - name: hadolint deploy/Dockerfile.migrate
        if: ${{ !cancelled() }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: deploy/Dockerfile.migrate
          failure-threshold: warning
      - name: hadolint deploy/Dockerfile.server
        if: ${{ !cancelled() }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: deploy/Dockerfile.server
          failure-threshold: warning
      - name: hadolint deploy/Dockerfile.server.release
        if: ${{ !cancelled() }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: deploy/Dockerfile.server.release
          failure-threshold: warning
      - name: hadolint runtime/Dockerfile
        if: ${{ !cancelled() }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: runtime/Dockerfile
          failure-threshold: warning
      - name: hadolint scripts/chaos/Dockerfile
        if: ${{ !cancelled() }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: scripts/chaos/Dockerfile
          failure-threshold: warning

  # ─────────────────────────────────────────────────────────────────────
  # Integration tests (//go:build integration) against real Postgres + Redis.
  # Exercises the DB/lock-binding code excluded from the unit-coverage floor.
  # ─────────────────────────────────────────────────────────────────────
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: leoflow
          POSTGRES_PASSWORD: leoflow
          POSTGRES_DB: leoflow_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: mirror.gcr.io/library/redis:7
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      # The S3 API the segmented log layout is tested against (#1336, #1616):
      # LocalStack, the same mirror image e2e-gates.yaml uses (minio/minio is
      # no longer published on Docker Hub).
      localstack:
        image: mirror.gcr.io/localstack/localstack:4
        env:
          SERVICES: s3
        ports: [4566:4566]
    env:
      DATABASE_URL: postgres://leoflow:leoflow@localhost:5432/leoflow_test?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      DEXAFLOW_TEST_S3_ENDPOINT: http://localhost:4566
      DEXAFLOW_TEST_GCS_ENDPOINT: http://localhost:4443
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Apply migrations
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1
          migrate -path migrations -database "$DATABASE_URL" up

      - name: Wait for the S3 store
        run: |
          for _ in $(seq 60); do
            curl -sf http://localhost:4566/_localstack/health | grep -q '"s3": "\(running\|available\)"' && exit 0
            sleep 2
          done
          echo "LocalStack S3 did not come up" >&2
          exit 1

      # The GCS API the log backend is tested against with its real client
      # (#526 bucket A). A step, not a service: fake-gcs-server takes its scheme
      # and host as flags, and a service container cannot be given arguments.
      - name: Start the GCS emulator
        run: |
          docker run -d --name fake-gcs -p 4443:4443 mirror.gcr.io/fsouza/fake-gcs-server:1.52 \
            -scheme http -port 4443 -public-host localhost:4443
          for _ in $(seq 60); do
            curl -sf http://localhost:4443/storage/v1/b >/dev/null && exit 0
            sleep 1
          done
          echo "fake-gcs-server did not come up" >&2
          docker logs fake-gcs >&2
          exit 1

      - name: Run integration tests
        run: go test -tags integration -race ./...

  # ─────────────────────────────────────────────────────────────────────
  # What the control plane TELLS a caller when its database dies mid-flight.
  # Its own job so it runs beside the other e2e tiers instead of lengthening
  # one; it stops and restarts the Postgres service container, which is why it
  # cannot share a job with anything else.
  # ─────────────────────────────────────────────────────────────────────
  e2e-db-outage:
    name: E2E Lite (database outage → 503, not 401)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        # POSTGRES_DB is leoflow_dev, not leoflow_test: the script migrates and
        # connects to leoflow_dev, and letting the image create it is one less
        # moving part than a psql step (the runner's client) whose only job was
        # to CREATE DATABASE. Same shape the other Lite e2e jobs use.
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: leoflow
          POSTGRES_PASSWORD: leoflow
          POSTGRES_DB: leoflow_dev
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: mirror.gcr.io/library/redis:7
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1
      - name: Database outage behaviour
        run: bash test/e2e/lite-db-outage.sh

  # ─────────────────────────────────────────────────────────────────────
  # End-to-end Lite happy path: `dexaflow setup` → control plane with REAL auth
  # → admin login returns a JWT (and a wrong password is rejected). Runs against
  # throwaway Postgres+Redis services, so the script's leoflow_dev reset is safe.
  # ─────────────────────────────────────────────────────────────────────
  e2e-lite:
    name: E2E Lite (setup → login)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: leoflow
          POSTGRES_PASSWORD: leoflow
          POSTGRES_DB: leoflow_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: mirror.gcr.io/library/redis:7
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Lite happy path (setup → login)
        run: bash test/e2e/lite-login.sh

  # ─────────────────────────────────────────────────────────────────────
  # Genuine binary-only install gate (#587). A built binary, a clean HOME, NO
  # repo on any path, and — deliberately — NO `PYTHONPATH` env. Every other
  # e2e job presets `PYTHONPATH: parser`, which masks the real "download the
  # release and run it" path: `dexaflow compile` must resolve the embedded
  # parser from the binary's own ~/.leoflow/pysrc extraction, and the binary
  # must extract the runtime sources the Lite venv builds from. No Postgres —
  # the bug was in resolution + extraction, not runtime state. ~15 s.
  # ─────────────────────────────────────────────────────────────────────
  binary-only-install:
    name: Binary-only install (no repo, no PYTHONPATH)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Binary-only install (compile + self-extract)
        run: bash test/e2e/binary-only-install.sh

  # ─────────────────────────────────────────────────────────────────────
  # Multi-DAG materialization gate (ADR 0033).
  # Asserts the contract `dag.json.source` carries dag.py byte-for-byte for
  # subdir projects, the parser→spec property the subprocess executor depends
  # on to materialize per-task-instance work dirs. Catches the regression that
  # shipped in v0.0.1-prealpha.21 where multi-DAG workspaces failed every task
  # with `ModuleNotFoundError: No module named 'dag'`. No Postgres needed —
  # the contract is in the compiled artifact, not in any runtime state. ~5 s.
  # ─────────────────────────────────────────────────────────────────────
  e2e-lite-multidag:
    name: E2E Lite (multi-DAG materialization gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The script runs `dexaflow compile`, which spawns the parser via
      # `python3 -m leoflow_parser`. The repo ships the parser source under
      # parser/leoflow_parser; export PYTHONPATH so the import resolves on a
      # bare runner (no pip install, no venv, no extra setup-python action).
      PYTHONPATH: parser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Multi-DAG materialization contract
        run: bash test/e2e/lite-multidag.sh

  # ─────────────────────────────────────────────────────────────────────
  # Lite boot self-heal gate (#404). Two `dexaflow lite` sessions share one
  # external Postgres; the second's boot reconcile must deregister a DAG whose
  # files were removed and clear its orphan import error, while keeping a valid
  # DAG. Catches the regression where the watcher seeded its set-diff from the
  # workspace instead of the control plane, leaving un-removable ghosts.
  # ─────────────────────────────────────────────────────────────────────
  e2e-lite-selfheal:
    name: E2E Lite (boot self-heal gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: leoflow
          POSTGRES_PASSWORD: leoflow
          POSTGRES_DB: leoflow_dev
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # leoflow lite spawns the parser via `python3 -m leoflow_parser`; ship its
      # source on PYTHONPATH so the import resolves on a bare runner.
      PYTHONPATH: parser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Lite boot self-heal (#404)
        run: bash test/e2e/lite-selfheal.sh

  # ─────────────────────────────────────────────────────────────────────
  # Native on-failure alerting gate (#424). A DAG with an `alerts:` block and a
  # single @task that raises is triggered; the scheduler must fire a
  # real webhook POST — resolved from an encrypted managed connection, rendered
  # from the message template — to a local receiver. Exercises the whole Go
  # control-plane chain (compile → dag.json → scheduler → dispatcher → notifier)
  # against a real DB and real connection encryption, which the unit tests can't.
  # ─────────────────────────────────────────────────────────────────────
  e2e-lite-alerts:
    name: E2E Lite (on-failure alerting gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: leoflow
          POSTGRES_PASSWORD: leoflow
          POSTGRES_DB: leoflow_dev
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # leoflow lite spawns the parser via `python3 -m leoflow_parser`; ship its
      # source on PYTHONPATH so the import resolves on a bare runner.
      PYTHONPATH: parser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Native on-failure alerting (#424)
        run: bash test/e2e/lite-alerts.sh

  # ─────────────────────────────────────────────────────────────────────
  # Airflow on_failure_callback gate (#424). A @task that raises must run its
  # native on_failure_callback in the task process, once, on the terminal failure —
  # resolved off the loaded task object (works for an unbound `with DAG():`) and
  # called even though Airflow normalises it to a list. The callback POSTs the real
  # Airflow context to a local receiver; asserts it fired exactly once. Guards the
  # two integration bugs the unit tests (fake resolver/callback) missed.
  # ─────────────────────────────────────────────────────────────────────
  e2e-lite-callback:
    name: E2E Lite (on_failure_callback gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: leoflow
          POSTGRES_PASSWORD: leoflow
          POSTGRES_DB: leoflow_dev
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # leoflow lite spawns the parser via `python3 -m leoflow_parser`; ship its
      # source on PYTHONPATH so the import resolves on a bare runner.
      PYTHONPATH: parser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Airflow on_failure_callback (#424)
        run: bash test/e2e/lite-callback.sh

  # Admission webhook gate (ADR 0100, #2177): with
  # execution.admission.webhook.url set, a refused attempt fails at once with
  # the endpoint's reason and never runs, an admitted one runs as before, and
  # the endpoint never sees the task's environment, source or token.
  e2e-lite-admission:
    name: E2E Lite (admission webhook gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: leoflow
          POSTGRES_PASSWORD: leoflow
          POSTGRES_DB: leoflow_dev
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # leoflow lite spawns the parser via `python3 -m leoflow_parser`; ship its
      # source on PYTHONPATH so the import resolves on a bare runner.
      PYTHONPATH: parser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Admission webhook (#2177)
        run: bash test/e2e/lite-admission.sh

  # Lite dbt gate (#573): a duckdb dbt project — the credential-free focus adapter
  # — must compile with the zero-config profile step (#575), run through the
  # subprocess executor, and materialize its models. Pro dbt is covered by e2e-dbt
  # (k3d); this is the Lite half, which had no e2e at all.
  e2e-lite-dbt:
    name: E2E Lite (dbt duckdb)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: leoflow
          POSTGRES_PASSWORD: leoflow
          POSTGRES_DB: leoflow_dev
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # leoflow lite spawns the parser via `python3 -m leoflow_parser`; ship its
      # source on PYTHONPATH so the import resolves on a bare runner.
      PYTHONPATH: parser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Lite dbt (duckdb) e2e (#573)
        run: bash test/e2e/lite-dbt.sh

  # ─────────────────────────────────────────────────────────────────────
  # Headless SPA crash smoke (test/e2e/ui-smoke.js): boots Lite (managed PG, no
  # Docker), drives the embedded Airflow UI with a real browser, and fails on
  # any uncaught React error. The Go tests cannot see the React layer — the
  # connector config page once shipped broken (catalog omitted standard_fields
  # keys the SPA reads) and only a browser caught it. This guards that whole class
  # plus the logs render contract. ~4 min (chromium + relocatable PG download).
  # ─────────────────────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────────────────────
  # SSO login page: the sign-in page against a real IdP handshake, and the two
  # session-cookie properties only a browser can judge.
  #
  # #1160: a configured deployment must offer the flow and a refused sign-on must
  # come back to the sign-in page. #1191: a break-glass password login on top of
  # a live SSO session must replace the identity (a script cannot overwrite an
  # HttpOnly cookie, which is why the old JS cookie write was silently dropped),
  # and neither path's session cookie may be readable from document.cookie.
  #
  # Separate from ui-smoke on purpose. That job boots Lite with managed
  # Postgres and one server; this needs TWO servers with their own config (an
  # SSO arm and a JWT arm) plus a Postgres the Pro edition can reach, and
  # folding it in would double a job whose own step budget is already tight
  # (see the timeout notes there).
  #
  # It reuses that job's pinned Playwright version and cache key verbatim, so a
  # browser bump moves both together.
  # ─────────────────────────────────────────────────────────────────────
  e2e-sso-login:
    name: SSO login page (real IdP handshake)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_VERSION: "1.64.1"
      LEOFLOW_E2E_DATABASE_URL: postgres://leoflow:leoflow@localhost:5432/leoflow_sso?sslmode=disable
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: leoflow
          POSTGRES_PASSWORD: leoflow
          POSTGRES_DB: leoflow_sso
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Build binaries
        run: make build
      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1
      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install Playwright + Chromium
        timeout-minutes: 6
        run: |
          npm init -y >/dev/null 2>&1
          npm i --no-save playwright-core@"$PLAYWRIGHT_VERSION" playwright@"$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
      # A step timeout so a hang fails as exit 124 naming the command, rather
      # than running the job out of budget into a `cancelled` that says nothing
      # about why (#975).
      - name: Run the SSO login-page e2e
        timeout-minutes: 6
        run: timeout --kill-after=30 300 bash test/e2e/sso-login-page.sh

  ui-smoke:
    name: UI smoke (headless SPA crash check)
    runs-on: ubuntu-latest
    # 15 until the UI contract checks joined the job (#1932), which add about
    # two minutes to a job that used about nine.
    timeout-minutes: 20
    env:
      PYTHONPATH: parser
      PLAYWRIGHT_VERSION: "1.64.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Build binaries
        run: make build
      # Cache the browser so the common path stops depending on a download at
      # all, and give the step its own ceiling. A STEP timeout marks the step
      # and the job `failure`; the job-level timeout-minutes marks them
      # `cancelled`, and since #975 a cancelled run is not a green run — so an
      # over-budget job silently stops a release cut while saying nothing about
      # why. That is what happened on the v0.4.5-rc.2 cut: this step took 539s
      # against its usual 24s, leaving the smoke below it only 209s of the
      # job's 900s for work that needs 213-221s. It was over before it started.
      # The key carries the Playwright version, and the version is pinned. A
      # constant key would freeze on today's chromium revision: actions/cache
      # never overwrites an existing key, so the next Playwright bump would
      # restore the wrong browser, download the right one at full cost, and
      # then refuse to save it — the cache degrades to a pure restore cost and
      # never self-heals until a human edits the key.
      #
      # Pinning also closes an inconsistency: every action here is SHA-pinned
      # and the repo runs govulncheck, CodeQL, gitleaks and Trivy, while this
      # step installed whatever `latest` resolved to — a package whose
      # postinstall downloads a browser binary.
      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      # The install still runs on a cache hit: --with-deps installs OS packages
      # the cache does not carry, and the browser download is the only part the
      # cache shortcuts.
      - name: Install Playwright + Chromium
        timeout-minutes: 6
        run: |
          npm init -y >/dev/null 2>&1
          npm i --no-save playwright-core@"$PLAYWRIGHT_VERSION" playwright@"$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
      - name: Boot Lite and run the UI smoke
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          # `dexaflow setup` prints the admin password once; capture it.
          PW=$(dexaflow setup 2>&1 | tee /tmp/setup.log | grep -oiE 'password:[[:space:]]*[A-Za-z0-9]+' | head -1 | awk '{print $NF}')
          [ -n "$PW" ] || { echo "could not capture admin password"; cat /tmp/setup.log; exit 1; }
          # The admin setup recorded (admin@dexaflow.local on a fresh runner).
          ADMIN_EMAIL=$(sed -n 's/^admin_email:[[:space:]]*"\(.*\)"/\1/p' "$HOME/.dexaflow/config.yaml")
          [ -n "$ADMIN_EMAIL" ] || { echo "setup recorded no admin_email"; cat "$HOME/.dexaflow/config.yaml"; exit 1; }
          # Register the typed-params fixture DAG alongside the scaffolded hello so
          # the trigger dialog has declared params to render its native form from.
          # It lands in the workspace dexaflow setup chose (~/dexaflow by default).
          mkdir -p "$HOME/dexaflow/params_demo"
          cp examples/params_demo/dag.py examples/params_demo/dexaflow.yaml "$HOME/dexaflow/params_demo/"
          # Lite scaffolds its starter only into an EMPTY workspace, and the
          # fixture above makes it non-empty, so scaffold the "hello" starter
          # the smoke drives (logs, Mark as failed, Clear, Gantt) explicitly.
          dexaflow init "$HOME/dexaflow/hello"
          dexaflow lite --port 18080 --postgres managed --executor subprocess \
            --server-bin "$PWD/bin/leoflow-server" --agent-bin "$PWD/bin/leoflow-agent" > /tmp/lite.log 2>&1 &
          for _ in $(seq 1 60); do curl -fsS http://localhost:18080/readyz >/dev/null 2>&1 && break; sleep 3; done
          curl -fsS http://localhost:18080/readyz >/dev/null || { echo "lite did not become ready"; tail -40 /tmp/lite.log; exit 1; }
          TOK=$(leoflow auth create-token --server http://localhost:18080 --username "$ADMIN_EMAIL" --password "$PW")
          # Wait for the scaffolded "hello" DAG to register (its venv installs first), then run it for log content.
          for _ in $(seq 1 40); do curl -fsS -H "Authorization: Bearer $TOK" http://localhost:18080/api/v2/dags/hello >/dev/null 2>&1 && break; sleep 3; done
          curl -fsS -X POST -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' -d '{}' \
            http://localhost:18080/api/v2/dags/hello/dagRuns >/dev/null 2>&1 || true
          # Wait for the typed-params fixture DAG to register too (the trigger-form step needs it).
          for _ in $(seq 1 40); do curl -fsS -H "Authorization: Bearer $TOK" http://localhost:18080/api/v2/dags/params_demo >/dev/null 2>&1 && break; sleep 3; done
          sleep 10
          # A `timeout` here so a hang in the smoke itself fails loudly, as
          # exit 124 naming the command, rather than running the job out of
          # budget into a `cancelled` that says nothing.
          #
          # 180s is 4x the measured node run. An earlier draft used 600s on the
          # reasoning that it "cannot false-kill because the job wall arrives
          # first" — which is exactly why it could never fire either: those are
          # the same property. This step's own instrumentation settled it on the
          # first run: node takes 45s, and it starts around t+334s of a 900s
          # job, so anything above ~560s is unreachable.
          #
          # The duration prints on BOTH paths. Under `set -e` a bare invocation
          # would skip the echo precisely when the timeout tripped, which is the
          # one case it was added for.
          t0=$SECONDS; rc=0
          LEOFLOW_URL=http://localhost:18080 LEOFLOW_USER="$ADMIN_EMAIL" LEOFLOW_PASS="$PW" \
            timeout --kill-after=30 180 node test/e2e/ui-smoke.js || rc=$?
          echo "ui-smoke node run: $((SECONDS - t0))s (rc=$rc)"
          [ "$rc" -eq 0 ] || exit "$rc"

          # The UI contract checks (#1932), against the same Lite. sweep.py
          # loads 23 views and fails on any non-2xx /api or /ui call or console
          # error; clear_version_toggle.py drives the Clear dialog's "Run with
          # latest bundle version" toggle on a run older than the DAG's current
          # version. The Python Playwright is pinned to the Node one, so it
          # reuses the browser cached above. Measured: sweep ~90s, toggle ~10s.
          pip install -q "playwright==$PLAYWRIGHT_VERSION"
          export LEOFLOW_BASE_URL=http://localhost:18080 LEOFLOW_USER="$ADMIN_EMAIL" LEOFLOW_PASSWORD="$PW" LEOFLOW_DAG_ID=hello
          t0=$SECONDS
          timeout --kill-after=30 240 python test/ui-contract/sweep.py
          echo "contract sweep: $((SECONDS - t0))s"
          # A second version of hello, so its oldest run is on an older one and
          # the dialog offers the toggle.
          echo "# second version, for the clear dialog check" >> "$HOME/dexaflow/hello/dag.py"
          for _ in $(seq 1 40); do
            n=$(curl -fsS -H "Authorization: Bearer $TOK" http://localhost:18080/api/v2/dags/hello/dagVersions | python -c 'import json,sys; print(json.load(sys.stdin)["total_entries"])' || echo 0)
            [ "$n" -ge 2 ] && break; sleep 3
          done
          [ "$n" -ge 2 ] || { echo "hello did not register a second version"; tail -40 /tmp/lite.log; exit 1; }
          OLDEST=$(curl -fsS -H "Authorization: Bearer $TOK" "http://localhost:18080/api/v2/dags/hello/dagRuns?limit=1&order_by=run_after" | python -c 'import json,sys; print(json.load(sys.stdin)["dag_runs"][0]["dag_run_id"])')
          LEOFLOW_RUN_ID="$OLDEST" timeout --kill-after=30 120 python test/ui-contract/clear_version_toggle.py

  # ─────────────────────────────────────────────────────────────────────
  # Full pod-per-task e2e on a real k3d cluster (test/e2e/e2e.sh): builds the
  # base + DAG images, runs the control plane on the runner, triggers a DAG, and
  # asserts every task reaches success — including a provider SENSOR
  # (type=airflow_operator, ADR 0040) that runs in its own pod and resolves a
  # managed Connection. This is the operator chain's end-to-end gate. On Linux the
  # pods reach the host control plane via host.k3d.internal (k3d injects it into
  # CoreDNS). ~10 min.
  # ─────────────────────────────────────────────────────────────────────
  operator-e2e:
    name: E2E operators (k3d pod-per-task)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: leoflow
          POSTGRES_PASSWORD: leoflow
          POSTGRES_DB: leoflow
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: mirror.gcr.io/library/redis:7
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # The control plane runs on the runner; k3d pods dial it via host.k3d.internal
      # (Linux only — Docker Desktop uses host.docker.internal, the e2e default).
      LEOFLOW_E2E_HOST_ADDR: host.k3d.internal
      # leoflow compile spawns `python3 -m leoflow_parser`; the parser ships under
      # parser/ and needs no install — just PYTHONPATH (the airflow-free shim).
      PYTHONPATH: parser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the gate below can diff origin/<base>...HEAD (the
          # merge-base must be present). checkout + gate always run; the heavy
          # steps are guarded, so this job always reports its (required) check.
          fetch-depth: 0
      - uses: ./.github/actions/docker-hub-mirror
      # Docs/tooling-only PRs validate nothing here; skip the k3d run but keep
      # reporting this required check. Computes the base..head diff and runs the
      # heavy steps only when a file outside the allowlist changed.
      #
      # .changes/ is in the allowlist because a changelog fragment is inert data
      # that only the release cut reads. Every PR carries one now, including the
      # docs-only ones this gate exists to spare, so leaving it out would have
      # made the skip unreachable for exactly those.
      - name: Gate heavy E2E on code changes
        id: gate
        env:
          # Through the environment, not interpolated into the command text:
          # ${{ }} is substituted before the shell sees it, and git refnames
          # permit ';', '$(' and backticks.
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/ci-heavy-gate.sh "$EVENT_NAME" "$BASE_REF"
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install k3d + kubectl + migrate
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/v5.7.4/install.sh | TAG=v5.7.4 bash
          curl -fsSLO "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1
      - name: Apply migrations
        if: steps.gate.outputs.run == 'true'
        run: ~/go/bin/migrate -path migrations -database "postgres://leoflow:leoflow@localhost:5432/leoflow?sslmode=disable" up
      - name: Build binaries
        if: steps.gate.outputs.run == 'true'
        run: make build
      - name: Run the k3d operator e2e
        if: steps.gate.outputs.run == 'true'
        env:
          # The database is fresh here, so its bootstrap admin must be the new
          # address. Pinning it turns admin_token's fallback to the pre-rename
          # admin@leoflow.local (test/e2e/lib.sh) into a failure in CI.
          DEXAFLOW_E2E_ADMIN_USER: admin@dexaflow.local
        run: bash test/e2e/e2e.sh

  # ─────────────────────────────────────────────────────────────────────
  # Two-process api/scheduler split e2e (ADR 0049; test/e2e/split-two-process.sh):
  # boots role=api + role=scheduler as SEPARATE processes against a shared
  # Postgres/Redis and drives a run that must flow across them via the DB (the api
  # accepts the trigger; the SEPARATE scheduler dispatches the task pods). Also
  # asserts socket-level role isolation. A DEDICATED job with its OWN fresh
  # datastores — deliberately not sharing the operator-e2e DB, so the split
  # scheduler is not handed leftover queued task instances from another run's
  # cluster (which would ImagePullBackOff and add noise/flakiness). ~8 min.
  # ─────────────────────────────────────────────────────────────────────
  split-e2e:
    name: E2E split (k3d two-process api/scheduler)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: leoflow
          POSTGRES_PASSWORD: leoflow
          POSTGRES_DB: leoflow
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: mirror.gcr.io/library/redis:7
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      LEOFLOW_E2E_HOST_ADDR: host.k3d.internal
      PYTHONPATH: parser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the gate below can diff origin/<base>...HEAD (the
          # merge-base must be present). checkout + gate always run; the heavy
          # steps are guarded, so this job always reports its (required) check.
          fetch-depth: 0
      - uses: ./.github/actions/docker-hub-mirror
      # Docs/tooling-only PRs validate nothing here; skip the k3d run but keep
      # reporting this required check. Computes the base..head diff and runs the
      # heavy steps only when a file outside the allowlist changed.
      #
      # .changes/ is in the allowlist because a changelog fragment is inert data
      # that only the release cut reads. Every PR carries one now, including the
      # docs-only ones this gate exists to spare, so leaving it out would have
      # made the skip unreachable for exactly those.
      - name: Gate heavy E2E on code changes
        id: gate
        env:
          # Through the environment, not interpolated into the command text:
          # ${{ }} is substituted before the shell sees it, and git refnames
          # permit ';', '$(' and backticks.
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/ci-heavy-gate.sh "$EVENT_NAME" "$BASE_REF"
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install k3d + kubectl + migrate
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/v5.7.4/install.sh | TAG=v5.7.4 bash
          curl -fsSLO "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1
      - name: Apply migrations
        if: steps.gate.outputs.run == 'true'
        run: ~/go/bin/migrate -path migrations -database "postgres://leoflow:leoflow@localhost:5432/leoflow?sslmode=disable" up
      - name: Build binaries
        if: steps.gate.outputs.run == 'true'
        run: make build
      - name: Run the k3d two-process split e2e (ADR 0049)
        if: steps.gate.outputs.run == 'true'
        run: bash test/e2e/split-two-process.sh

  # e2e-dbt: dbt-native orchestration on a real k3d cluster. dbt-e2e.sh compiles a
  # project to one pod per model; dbt-mixing-e2e.sh proves a subdir project (#401);
  # dbt-connection-e2e.sh proves the managed-connection in-pod profile generation
  # (adversarial: a deliberately-broken baked profiles.yml, regenerated from the
  # connection). All three use a LOCAL postgres warehouse — no cloud credentials.
  # The cloud adapters (snowflake/bigquery/databricks) are still hand-validated in
  # the RC soak; a gated credentialed strategy is tracked in #574.
  e2e-dbt:
    name: E2E dbt (k3d pod-per-model)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: leoflow
          POSTGRES_PASSWORD: leoflow
          POSTGRES_DB: leoflow
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: mirror.gcr.io/library/redis:7
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      LEOFLOW_E2E_HOST_ADDR: host.k3d.internal
      PYTHONPATH: parser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the gate below can diff origin/<base>...HEAD (the
          # merge-base must be present). checkout + gate always run; the heavy
          # steps are guarded, so this job always reports its (required) check.
          fetch-depth: 0
      - uses: ./.github/actions/docker-hub-mirror
      # Docs/tooling-only PRs validate nothing here; skip the k3d run but keep
      # reporting this required check. Computes the base..head diff and runs the
      # heavy steps only when a file outside the allowlist changed.
      #
      # .changes/ is in the allowlist because a changelog fragment is inert data
      # that only the release cut reads. Every PR carries one now, including the
      # docs-only ones this gate exists to spare, so leaving it out would have
      # made the skip unreachable for exactly those.
      - name: Gate heavy E2E on code changes
        id: gate
        env:
          # Through the environment, not interpolated into the command text:
          # ${{ }} is substituted before the shell sees it, and git refnames
          # permit ';', '$(' and backticks.
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/ci-heavy-gate.sh "$EVENT_NAME" "$BASE_REF"
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install k3d + kubectl + migrate + dbt
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/v5.7.4/install.sh | TAG=v5.7.4 bash
          curl -fsSLO "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1
          # Pinned to 1.9.* to match the adapter version every other dbt install
          # in the repo pins (the three dbt e2e images and the adapter-contracts
          # legs); this step was the one that pinned nothing at all.
          #
          # Unpinned it does NOT take a 2.0 pre-release — pip excludes
          # pre-releases by default, and 2.0 has no stable release. It takes
          # dbt-core 1.12.x, whose own requirement on
          # dbt-core-experimental-parser is pre-release-bounded (>=2.0.0b1), and
          # that package ships sdist-only from 2.0.0a5 on. So pip has to build
          # it, the build backend fetches over the network, and this step died
          # on an HTTP 504 with nothing of ours involved. 1.9.11 has no such
          # dependency, which is what actually closes the hole.
          #
          # The pin lives in test/e2e/constraints-dbt.txt, shared with every
          # other dbt install of the tests (#957).
          pip install --quiet -c test/e2e/constraints-dbt.txt dbt-core "dbt-postgres==1.9.*"
      - name: Apply migrations
        if: steps.gate.outputs.run == 'true'
        run: ~/go/bin/migrate -path migrations -database "postgres://leoflow:leoflow@localhost:5432/leoflow?sslmode=disable" up
      - name: Build binaries
        if: steps.gate.outputs.run == 'true'
        run: make build
      - name: Run the dbt e2e (postgres warehouse)
        if: steps.gate.outputs.run == 'true'
        run: bash test/e2e/dbt-e2e.sh
      - name: Run the dbt mixing e2e (subdir + --project-dir, #401)
        if: steps.gate.outputs.run == 'true'
        run: bash test/e2e/dbt-mixing-e2e.sh
      - name: Run the dbt managed-connection e2e (in-pod profile generation, #573)
        if: steps.gate.outputs.run == 'true'
        run: bash test/e2e/dbt-connection-e2e.sh

  # dbt-adapter-contracts (#574): the profiles.yml Dexaflow emits for each cloud
  # warehouse must be accepted by that warehouse's REAL dbt adapter — right field
  # names, alias resolution, required fields, auth-mode wiring — validated by
  # constructing the adapter's own Credentials from our emitted profile (no live
  # query, no credentials). One adapter per leg (they pin conflicting deps).
  # A live-query gate needs real warehouse secrets and is maintainer-owned.
  dbt-adapter-contracts:
    name: dbt adapter contracts (${{ matrix.adapter }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # dbt-core is pinned to 1.9.* on every leg (test/e2e/constraints-dbt.txt,
        # #957), which keeps the resolver off the
        # 2.0 pre-release parser (a source build that fetches a wheel at build time),
        # so a plain source/wheel install is enough. One adapter per leg: their dep
        # pins conflict in a shared venv.
        adapter: [snowflake, bigquery, databricks]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ${{ matrix.adapter }} adapter + pytest
        run: python -m pip install --quiet -c test/e2e/constraints-dbt.txt pytest dbt-core "dbt-${{ matrix.adapter }}==1.9.*"
      - name: Contract test (${{ matrix.adapter }})
        run: PYTHONPATH=runtime/python python -m pytest runtime/python/tests/test_dbt_adapter_contracts.py -q -k ${{ matrix.adapter }}

  # deploy-e2e: the real `dexaflow deploy` path on k3d with a registry the cluster
  # pulls from (test/e2e/deploy-e2e.sh, ADR 0041). One `dexaflow deploy` builds for
  # the cluster arch, pushes to a k3d-managed registry, captures the digest,
  # re-pins dag.json, registers -- then the cluster pulls the digest-pinned image
  # and runs it. Gates the build/push/digest/register glue. ~10 min.
  #
  # It then redeploys while a run is in flight and runs again (#1707), once per
  # warm pool mode: deploy behaves the same with warm pools on and off. The off
  # leg keeps the job's original name and gate. The warm pools leg costs as much
  # again, so its gate (`--scope warm-pools`) runs it only when the warm
  # placement or deploy path changed (test/README.md, `warm-paths`).
  deploy-e2e:
    name: ${{ matrix.warm_pools == 'on' && 'E2E deploy (k3d + registry, warm pools on)' || 'E2E deploy (k3d + registry)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Quoted: unquoted on and off are YAML 1.1 booleans.
        warm_pools: ["off", "on"]
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: leoflow
          POSTGRES_PASSWORD: leoflow
          POSTGRES_DB: leoflow
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: mirror.gcr.io/library/redis:7
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # k3d pods dial the runner control plane via host.k3d.internal (Linux only).
      LEOFLOW_E2E_HOST_ADDR: host.k3d.internal
      PYTHONPATH: parser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the gate below can diff origin/<base>...HEAD (the
          # merge-base must be present). checkout + gate always run; the heavy
          # steps are guarded, so this job always reports its (required) check.
          fetch-depth: 0
      - uses: ./.github/actions/docker-hub-mirror
      # Docs/tooling-only PRs validate nothing here; skip the k3d run but keep
      # reporting this required check. Computes the base..head diff and runs the
      # heavy steps only when a file outside the allowlist changed.
      #
      # .changes/ is in the allowlist because a changelog fragment is inert data
      # that only the release cut reads. Every PR carries one now, including the
      # docs-only ones this gate exists to spare, so leaving it out would have
      # made the skip unreachable for exactly those.
      - name: Gate heavy E2E on code changes
        id: gate
        env:
          # Through the environment, not interpolated into the command text:
          # ${{ }} is substituted before the shell sees it, and git refnames
          # permit ';', '$(' and backticks.
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          # The warm pools leg decides by path outside pull requests too: the
          # merge queue's base commit, or the commit before a push.
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.before }}
          WARM_POOLS: ${{ matrix.warm_pools }}
        run: |
          if [ "$WARM_POOLS" = on ]; then
            bash scripts/ci-heavy-gate.sh --scope warm-pools "$EVENT_NAME" "${BASE_REF:-$BASE_SHA}"
          else
            bash scripts/ci-heavy-gate.sh "$EVENT_NAME" "$BASE_REF"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install k3d + kubectl + migrate
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/v5.7.4/install.sh | TAG=v5.7.4 bash
          curl -fsSLO "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1
      - name: Apply migrations
        if: steps.gate.outputs.run == 'true'
        run: ~/go/bin/migrate -path migrations -database "postgres://leoflow:leoflow@localhost:5432/leoflow?sslmode=disable" up
      - name: Build binaries
        if: steps.gate.outputs.run == 'true'
        run: make build
      - name: Run the k3d deploy e2e (warm pools ${{ matrix.warm_pools }})
        if: steps.gate.outputs.run == 'true'
        env:
          DEXAFLOW_E2E_WARM_POOLS: ${{ matrix.warm_pools }}
        run: bash test/e2e/deploy-e2e.sh

  # ─────────────────────────────────────────────────────────────────────
  # TDD discipline check: every new exported function in production code
  # must have a corresponding test added or modified in the same PR.
  # This is a best-effort heuristic; reviewers verify the spirit of ADR 0011.
  # ─────────────────────────────────────────────────────────────────────
  tdd-check:
    name: TDD discipline (commit pattern check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify test commits exist for production changes
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          PROD_FILES=$(git diff --name-only "$BASE" "$HEAD" -- '*.go' ':!*_test.go' ':!vendor/*' ':!proto/*' | wc -l)
          TEST_FILES=$(git diff --name-only "$BASE" "$HEAD" -- '*_test.go' | wc -l)
          echo "Production .go files changed: $PROD_FILES"
          echo "Test .go files changed: $TEST_FILES"
          if [ "$PROD_FILES" -gt 0 ] && [ "$TEST_FILES" -eq 0 ]; then
            echo "::warning::Production code changed without test changes. Verify ADR 0011 was followed."
          fi

  # The text rules of AGENTS.md section 2 on what a pull request adds: no
  # em dash in an added line, no attribution trailer or footer in a commit
  # message (#1573). The pre-commit and commit-msg hooks run the same
  # script.
  new-text:
    name: Text rules (added lines and commit messages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: No em dash added, no attribution trailer
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/lint-new-text.sh --range "$BASE" "$HEAD"

  # Developer Certificate of Origin (#1575): every commit of a pull request
  # is signed off by its author. Merge commits and Dependabot are exempt.
  dco:
    name: DCO (every commit signed off by its author)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Every commit signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/dco-check.sh --range "$BASE" "$HEAD"

  # ─────────────────────────────────────────────────────────────────────
  # Build all binaries
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/dexaflow ./cmd/dexaflow
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/dexaflow-server ./cmd/dexaflow-server
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/dexaflow-agent ./cmd/dexaflow-agent
          # Pre-rename entry points, as `make build` and install.sh create them.
          for b in "" -server -agent; do ln -sf "dexaflow$b" "bin/leoflow$b"; done

      - name: Check agent binary size (<20MB per ADR 0004)
        run: |
          SIZE=$(stat -c%s bin/dexaflow-agent)
          MAX=20971520  # 20 MB
          echo "leoflow-agent size: $SIZE bytes (max: $MAX)"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "::error::leoflow-agent exceeds 20MB cap (see ADR 0004)"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────
  # Validate OpenAPI spec (ADR 0013)
  # ─────────────────────────────────────────────────────────────────────
  openapi-lint:
    name: OpenAPI spec lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install redocly CLI
        run: npm install -g @redocly/cli@2.54.3

      - name: Lint OpenAPI spec
        run: redocly lint docs/api/openapi.yaml

  # ─────────────────────────────────────────────────────────────────────
  # Dependabot directory check. Dependabot does not report a directory
  # with no manifest — it finds nothing and says nothing — so an entry
  # for a renamed or nonexistent path looks configured and updates
  # nothing. Three docker entries pointed at /runtime/python-3.1{0,1,2},
  # none of which are in the tree, and no base image was ever updated.
  # A missing update is invisible by definition, so it needs a gate.
  # ─────────────────────────────────────────────────────────────────────
  dependabot-dirs:
    name: Dependabot directories resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml
      - name: Check every dependabot directory exists
        run: bash scripts/check-dependabot-dirs.sh
      # #1560: CONTRIBUTING.md promises fork contributors that no pull request
      # workflow uses a repository secret or runs on pull_request_target. A
      # cut-time-only gate would let a PR break that promise and stay green.
      # Shares this job so the check costs no extra runner.
      - name: Workflows stay safe for pull requests from forks
        run: bash scripts/check-fork-safe-workflows.sh
      # #1688: a path filter does not apply to tag pushes, so a path-filtered
      # push trigger without a ref filter runs on every release tag.
      - name: Path-filtered workflows stay off tag pushes
        run: bash scripts/check-workflow-tag-runs.sh

  # ─────────────────────────────────────────────────────────────────────
  # Stale deploy-path check. The old GKE deploy directory was renamed to
  # `deploy/k8s` (#690, cloud-agnostic recipe). A leftover reference to the
  # old path in a script comment, README, docs link, or .gitignore points at
  # a directory that no longer exists — scripts `cd` into nothing, doc links
  # 404 — and no build step resolves the string, so the rot is invisible
  # without a gate. (The guard script owns the literal old-path string.)
  # ─────────────────────────────────────────────────────────────────────
  # Container images the runner pulls in `Initialize containers`, before any
  # step, must come from a registry that does not rate-limit anonymous pulls by
  # shared source IP (#1007). Allowlist, parsed from the workflow YAML.
  # ─────────────────────────────────────────────────────────────────────
  service-image-registry:
    name: Service images avoid a source-IP-rate-limited registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check every workflow container image comes from an allowed registry
        run: bash scripts/check-service-image-registry.sh

  # ─────────────────────────────────────────────────────────────────────
  # Container-scan ignore list. Every finding we accept must say why and carry
  # an expiry date, and the file holding them must actually be passed to a scan.
  # Trivy honours `expired_at` — a lapsed entry stops suppressing, so neglect
  # makes a finding come back rather than stay hidden — but nothing in Trivy
  # requires an entry to have an expiry or a rationale at all, which makes the
  # permanent unexplained entry the easiest one to write. The other half is
  # wiring: a renamed ignore file, or a dropped `--ignorefile` flag, leaves
  # entries that look accepted and suppress nothing. Both ends are checked.
  # ─────────────────────────────────────────────────────────────────────
  trivyignore-entries:
    name: Container-scan ignore list is reviewable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml
      - name: Check every accepted finding has a reason and an expiry
        run: bash scripts/check-trivyignore-entries.sh

  # ─────────────────────────────────────────────────────────────────────
  # The migrate binary we ship and the one CI scans must be one binary.
  # `deploy/Dockerfile.migrate` compiles our `./cmd/dexaflow-migrate` (#1020),
  # which security.yaml's `govulncheck ./...` covers only while the image keeps
  # building that package with no build tags and the wrapper keeps importing
  # its pgx5 driver. Same for the Go pin: Trivy keys stdlib findings to the
  # toolchain in the binary. Each drift stays green while the coverage stops
  # meaning anything, which is the shape of the gap #1039 closed.
  # ─────────────────────────────────────────────────────────────────────
  migrate-cli-build-tags:
    name: Shipped migrate CLI is the one CI scans
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the migrate CLI build tags and toolchain pin
        run: bash scripts/check-migrate-cli-build-tags.sh

  # ─────────────────────────────────────────────────────────────────────
  # Script self-tests. cut-release.sh and the check-* gates hold logic nothing
  # else exercises — the tag normalizers, FLAKE_RE (which decides whether a red
  # run is rerun or stops a release), and the gates' ref comparisons. A defect
  # there surfaces mid-release. Discovery is by self_test() definition, so a new
  # script's cases join this job by existing. No network, milliseconds.
  # ─────────────────────────────────────────────────────────────────────
  script-selftests:
    name: Script self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # check-changelog-structure.sh validates changelog fragments with PyYAML,
      # and its self-test feeds it broken ones.
      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml
      - name: Run every scripts/*.sh self-test
        run: bash scripts/check-script-selftests.sh

  # ─────────────────────────────────────────────────────────────────────
  # The Lite cold-start release gate pre-pulls the Postgres image by tag, and
  # that job has no checkout (it installs from the published release), so the
  # tag is duplicated in release.yaml. Checked here rather than only in the
  # cut's own pre-flight: a bump to docker-compose.dev.yaml would otherwise go
  # green through all of CI and surface mid-release.
  # ─────────────────────────────────────────────────────────────────────
  lite-prepull-tag:
    name: Lite pre-pull tag matches the compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml
      - name: Check the Lite pre-pull tag
        run: bash scripts/check-lite-prepull-matches-compose.sh

  # ─────────────────────────────────────────────────────────────────────
  # Which Python lines we publish a task base image for is stated in five
  # files, and only the schema enum is enforced by anything (the CLI's
  # Validate() rejects everything else). By #1031 they had already drifted in
  # both directions. Both directions fail in the user's build, minutes in: a
  # selectable version with no published leg is a `docker pull` 404, a
  # published leg outside the enum is a compile that refuses a good image.
  # ─────────────────────────────────────────────────────────────────────
  python-runtime-matrix:
    name: Published Python matrix agrees everywhere
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml
      - name: Check the published Python matrix against the schema enum
        run: bash scripts/check-python-runtime-matrix.sh

  # ─────────────────────────────────────────────────────────────────────
  # Duplicated version facts (#1036). A version string written in two places
  # with nothing between them drifts, and the failure is not a broken build —
  # it is that somebody reads one copy and reasons correctly from a false
  # premise. That happened three times in one day: the Go toolchain said 1.26.6,
  # 1.26.3, 1.26.4 and 1.27 in four files; a job named "Trivy (image scan)" ran
  # a filesystem scan; and the two Python lists were read as one.
  #
  # One job rather than five, because they are one class and each runs in
  # milliseconds — but one STEP per gate, so the check that went red names
  # itself in the job summary before anyone opens the log. Each gate prints both
  # locations and both values.
  # ─────────────────────────────────────────────────────────────────────
  version-facts:
    name: Duplicated version facts agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml
      - name: Go toolchain is one fact with one value
        run: bash scripts/check-go-toolchain-pin.sh
      - name: Host Python interpreters relate correctly to the published matrix
        run: bash scripts/check-python-host-interpreters.sh
      - name: golangci-lint pin agrees between make lint and CI
        run: bash scripts/check-golangci-lint-pin.sh
      - name: Actions and CI tools are pinned, checkouts drop the token
        run: bash scripts/check-workflow-pins.sh
      - name: Lite Postgres tag agrees with the container Lite starts
        run: bash scripts/check-lite-postgres-tag.sh
      - name: Runtime data variant pins the base's Task SDK and certifi
        run: bash scripts/check-runtime-data-pins.sh
      - name: Embedded Airflow UI pin agrees with the committed bundle
        run: bash scripts/check-airflow-ui-pin.sh
      - name: Startup probe budget covers the boot bounds the code states
        run: bash scripts/check-startup-probe-budget.sh
      # The Hugo pin check landed with a self-test wired into `Script
      # self-tests` and its REAL check reachable only through cut-release.sh's
      # run_gates(). That is too late to be useful: drifting HUGO_VERSION
      # between the two website workflows stayed green all the way to the
      # release cut, where the failure lands on whoever is cutting rather than
      # whoever caused it. Same argument that put the golangci-lint pin in this
      # job.
      - name: Hugo pin agrees between the website build and deploy
        run: bash scripts/check-hugo-version-pin.sh
      # Same shape again: landed with a self-test in `Script self-tests` and its
      # REAL check reachable only through cut-release.sh's run_gates(), which
      # only runs at cut time. A PR that edits website/hugo.toml's fallback menu
      # or website/scripts/ci/versions.json without the other drifted silently
      # through review, which is the exact failure this gate exists to catch,
      # so it cannot itself be cut-time-only.
      - name: Docs version menu agrees between versions.json and hugo.toml
        run: bash scripts/check-docs-version-menu.sh
      # Two more of the same shape that never got their real check wired in:
      # only their self-tests ran. CodeQL refuses to run when its init and
      # analyze steps sit on different commits, which a per-sub-action
      # Dependabot bump produces; the Playwright pin keeps the root
      # package.json and the e2e-sso-login job's PLAYWRIGHT_VERSION on one version.
      - name: Every codeql-action step is pinned to the same commit
        run: bash scripts/check-codeql-action-pins.sh
      - name: Playwright pin agrees between package.json and CI
        run: bash scripts/check-playwright-pin.sh

  # ─────────────────────────────────────────────────────────────────────
  stale-deploy-path:
    name: No stale legacy deploy path
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check no stale legacy deploy path remains
        run: bash scripts/check-no-stale-deploy-path.sh
      # ADR 0069: files that configure one editor or assistant stay local.
      # Shares this job so the check costs no extra runner.
      - name: No tool-specific context files are tracked
        run: bash scripts/check-no-tool-context.sh

  # ─────────────────────────────────────────────────────────────────────
  # Python parser tests — matrix across every Python the host detector
  # claims to support (`internal/setup/detect.go` pythonCandidates). If a
  # new minor is added to that list, add it here too — otherwise the
  # detector promises compatibility we never verified, which is exactly
  # the silent-regression risk #220 (F2) flagged. Only 3.11/3.12/3.13 are
  # generally available today; bump as 3.14+ ship and stabilise.
  #
  # This is the HOST interpreter that parses a dag.py, not the interpreter
  # inside the published task base image — a different list on purpose, checked
  # by a different thing (the base-image list is the schema enum, gated by
  # scripts/check-python-runtime-matrix.sh). #1031 read the two as one.
  python-parser:
    name: Python parser tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: parser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v --cov=leoflow_parser --cov-fail-under=70

  # ─────────────────────────────────────────────────────────────────────
  # OpenMetadata REST contract
  #
  # Two layers on purpose. A Go test cannot prove that OpenMetadata's pydantic
  # models accept our bodies, and the defect this guards was exactly that: a
  # field that is valid JSON, valid against our own OpenAPI spec, and rejected by
  # OM's type, so every DAG failed validation and no pipeline was ingested while
  # OM's Test Connection stayed green. So Go writes the six responses OM reads
  # and Python judges them against OM's own vendored models.
  # ─────────────────────────────────────────────────────────────────────
  om-contract:
    name: OpenMetadata REST contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pydantic
        run: pip install --upgrade pip && pip install 'pydantic>=2'

      # om_models.py is a verbatim copy of OpenMetadata's own models, pinned to a
      # release tag. The pin is the whole value: an edited copy would validate our
      # bodies against a model OM does not have, which is a green gate over a
      # broken integration. Refreshing the copy means updating both files.
      - name: Check the vendored OpenMetadata models are unedited
        run: cd test/om-contract && shasum -a 256 -c om_models.py.sha256

      - name: Capture the responses OpenMetadata reads
        env:
          LEOFLOW_OM_GOLDEN: ${{ runner.temp }}/om-golden
        run: go test ./internal/api/ -run TestWriteOpenMetadataGoldenBodies -count=1

      - name: Validate them against OpenMetadata's own models
        run: python3 test/om-contract/validate.py "${{ runner.temp }}/om-golden"

  # ─────────────────────────────────────────────────────────────────────
  # Python task runtime tests
  # ─────────────────────────────────────────────────────────────────────
  python-runtime:
    name: Python runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v --cov=leoflow_runtime --cov-fail-under=90

  # runtime-authoring-contract (#17): the names a user's dag.py imports at its
  # top must resolve inside the TASK image, not only at parse time. runner.py
  # re-imports the DAG module for every python task, so `from leoflow import
  # dbt_group` runs again in the pod — and `leoflow` existed only in the
  # parser's compile-time shim, so the hybrid shape the docs teach (ADR 0043)
  # compiled green and then died on its own first line, in Lite and in Pro.
  #
  # python-runtime above installs no Airflow on purpose, so that file skips
  # there. This leg installs the Task SDK at the version runtime/Dockerfile
  # pins — read from the Dockerfile, not repeated here, so the two cannot drift
  # — and installs the runtime with a real `pip install` rather than PYTHONPATH,
  # because the package was silently dropped from the wheel once already
  # (hatchling resolved the repo's root-anchored /leoflow ignore against its own
  # root). The explicit import step runs BEFORE pytest so this job cannot go
  # green by skipping everything, which is the one way a contract leg lies.
  runtime-authoring-contract:
    name: Runtime authoring contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Resolve the Task SDK version the base image pins
        id: sdk
        run: |
          v=$(awk -F= '/^ARG AIRFLOW_TASK_SDK_VERSION=/{print $2; exit}' runtime/Dockerfile)
          [ -n "$v" ] || { echo "no AIRFLOW_TASK_SDK_VERSION in runtime/Dockerfile"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "task SDK: $v"
          # Third copy of the pin: Lite installs it into every per-DAG venv. The
          # Dockerfile is the source of truth; this stops the two from drifting.
          grep -q "apache-airflow-task-sdk==$v" internal/cli/dev.go ||
            { echo "internal/cli/dev.go pins a different Task SDK than runtime/Dockerfile ($v)"; exit 1; }
      - name: Install the way the image does
        run: |
          python -m pip install --quiet pytest ./runtime/python \
            "apache-airflow-task-sdk==${{ steps.sdk.outputs.version }}"
      - name: The authoring imports must resolve, from the installed wheel
        run: |
          python - <<'PY'
          import dexaflow, leoflow, airflow.sdk
          for mod in (dexaflow, leoflow):
              print(mod.__name__ + ":", mod.__file__)
              assert "site-packages" in mod.__file__, \
                  f"{mod.__name__} resolved from the source tree, not the wheel: {mod.__file__}"
          assert leoflow.dbt_group is dexaflow.dbt_group, "leoflow must re-export dexaflow"
          PY
      - name: The installed wheel carries the three packages and nothing else
        run: |
          python - <<'PY'
          import pathlib, sys, sysconfig
          site = pathlib.Path(sysconfig.get_paths()["purelib"])
          bad = []
          for pkg in ("dexaflow", "leoflow", "leoflow_runtime"):
              d = site / pkg
              if not (d / "__init__.py").is_file():
                  sys.exit(f"{pkg} is not in the installed wheel — go:embed/hatchling dropped it")
              bad += [str(f.relative_to(site)) for f in d.rglob("*")
                      if f.is_file() and f.suffix != ".py" and "__pycache__" not in f.parts]
          if bad:
              sys.exit("the wheel carries non-source files: " + ", ".join(sorted(bad)))
          names = ("dexaflow", "leoflow", "leoflow_runtime")
          print("wheel clean:", ", ".join(n for n in names if (site / n).is_dir()))
          PY
      - name: Authoring contract
        run: python -m pytest runtime/python/tests/test_leoflow_authoring.py -q
      # The context the runtime builds against the pinned Task SDK's Context and
      # RuntimeTaskInstance (#1843): a pin bump that widens the gap fails here.
      - name: Task context contract
        run: python -m pytest runtime/python/tests/test_task_sdk_context_contract.py -q
      # A captured operator's on_failure_callback, read off its task in a real
      # dag.py (#484): the Airflow-free runtime job cannot import one.
      - name: Operator callback contract
        run: python -m pytest runtime/python/tests/test_task_sdk_operator_callback.py -q
