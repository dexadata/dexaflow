name: E2E Helm rolling upgrade

# A Helm rolling upgrade from the previous release with tasks in flight
# (#2305): the previous release's chart and images are installed with two
# replicas and a PodDisruptionBudget, a long task, a fan-out and a cron DAG
# run, and `helm upgrade` moves the release to this tree while they do. The
# Service must keep a ready endpoint, every task must succeed, no cron run may
# be created twice and the schema must be ready on the new version. It runs on
# release candidates, on pull requests that change the chart, the migrations
# or the server boot path, and on demand.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+-rc.*"]
  workflow_dispatch:
    inputs:
      previous:
        description: "Release to upgrade from, such as v0.5.9 (empty: the newest GA tag)"
        required: false
        default: ""
  pull_request:
    branches: [main, "release-*"]
    paths:
      - "helm/**"
      - "migrations/**"
      - "internal/serverapp/**"
      - "cmd/dexaflow-server/**"
      - "cmd/dexaflow-migrate/**"
      - "test/e2e/helm-rolling-upgrade-e2e.sh"
      - ".github/workflows/e2e-helm-upgrade.yaml"

permissions:
  contents: read

# A newer push to the same pull request supersedes this run; every other run
# gets a group of its own (see e2e-replaced-database.yaml).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOPROXY: https://proxy.golang.org|direct
  GO_VERSION: "1.26.11"
  PYTHON_VERSION: "3.11"

jobs:
  rolling-upgrade:
    name: kind, previous release to this tree with tasks in flight
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tags, to find the previous GA release.
          fetch-depth: 0
      - uses: ./.github/actions/docker-hub-mirror
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.0
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: dexaflow-upgrade
      - name: Upgrade the previous release with tasks in flight
        env:
          DEXAFLOW_E2E_KIND_CLUSTER: dexaflow-upgrade
          DEXAFLOW_E2E_PREVIOUS: ${{ inputs.previous }}
        run: bash test/e2e/helm-rolling-upgrade-e2e.sh
