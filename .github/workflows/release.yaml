name: Release

on:
  push:
    tags: ["v*"]

# Least-privilege default: read-only at the top level. Each job that needs to
# write (the release publish, the migrate image push, the gate's draft-edit)
# opts in explicitly. OpenSSF Scorecard Token-Permissions check penalises any
# write that lives at the workflow scope.
permissions:
  contents: read

# Stage, verify, promote (ADR 0071). Every job before `gate` builds, pushes and
# signs only immutable, versioned artifacts, and GoReleaser publishes the
# GitHub release without marking it Latest (`make_latest: false`), so the
# smokes can download it from the public URL while unpinned users keep the
# previous GA. `promote`, which needs a green `gate`, is the only job that
# moves a public pointer: the Helm chart, the Latest release and the moving
# `py3.N` runtime tags. Before this, the chart went out about 30 seconds after
# the tag and Latest moved before any smoke ran (#1684).

env:
  # proxy.golang.org sometimes resets a large module download ("stream error:
  # INTERNAL_ERROR"), which failed whole jobs before any test ran. With "|" Go
  # falls back to the module's own source on any proxy error (with "," only on
  # 404/410); go.sum and sum.golang.org still verify every module.
  GOPROXY: https://proxy.golang.org|direct
  GO_VERSION: "1.26.10"
  REGISTRY: ghcr.io

jobs:
  # ── The chart's tag gates, before anything is published ──
  # These lived in helm-release.yaml, which pushed the chart on the tag event.
  # The push moved to `promote`; the gates stay at the front, so a chart that
  # does not match the tag fails the run before GoReleaser publishes anything.
  # The full chart contract suite (helm unittest, template-checks,
  # rbac-covers-executor, kubeconform) runs per PR in helm-ci.yaml.
  chart-preflight:
    name: Chart preflight (version, lint, contract)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One build date for the run: the runtime image's amd64 and arm64 halves
    # build on different runners and must bake the same date (#1686).
    outputs:
      build_date: ${{ steps.stamp.outputs.date }}
    steps:
      - name: Stamp build date
        id: stamp
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.0

      # ADR 0028: the source Chart.yaml moves in lockstep with the tag, because
      # `helm install ./helm/dexaflow` from the tag's tree uses it as is.
      - name: Gate, chart version and appVersion match the tag (ADR 0028)
        run: bash scripts/check-chart-version-matches-tag.sh

      - name: Gate, helm lint
        run: helm lint helm/dexaflow

      - name: Gate, chart contract (env and Secret keys render)
        run: bash scripts/helm-template-checks.sh

  release:
    name: Build, sign, publish
    needs: chart-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # GoReleaser creates the GitHub release.
      packages: write   # Push the server, MCP and CLI images to GHCR.
      id-token: write   # Cosign keyless signing via Sigstore OIDC.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # ── Sigstore cosign for keyless signing ──
      # Pin cosign to the 2.4.x line: cosign 3.x changed `sign-blob` to write a
      # Sigstore bundle by default, which breaks GoReleaser's
      # --output-signature/--output-certificate recipe ("create bundle file:
      # open : no such file or directory").
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3

      # ── syft for SBOM generation ──
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # ── QEMU + Buildx so the arm64 control-plane image builds on the amd64 runner ──
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── The release body, from CHANGELOG.md rather than from the commits ──
      # A GA is cut from its rc, so the only commit between the two tags is the
      # promotion: GoReleaser's generated list made v0.4.7's page one line long
      # while CHANGELOG.md held 35 entries for it. This composes the body from
      # the section written for humans, and fails loudly rather than publishing
      # an empty one, which is indistinguishable from a good release.
      # ── GoReleaser handles the build, packaging, signing, and release ──
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # Pin to the v2 major (what GoReleaser auto-locks `latest` to anyway):
          # silences the "using latest" warning and keeps releases reproducible
          # against a known major line (no surprise v3 jump).
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── The release body, and proof that it reached the page ──
      # v0.4.8 shipped with an EMPTY body. The notes were composed correctly
      # (the script emits 17 entries for that tag and its self-test passes),
      # handed to GoReleaser as --release-notes, and never appeared. The build
      # was green throughout, because nothing downstream ever looked at the
      # published page.
      #
      # So the body is set with `gh release edit`, which is ours and not a flag
      # whose behaviour depends on whether another pipe is enabled, and then it
      # is READ BACK. Composing the right notes is not the goal; the goal is a
      # page that carries them, and only the read-back can tell those apart.
      - name: Set the release body from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash scripts/release-notes.sh "$TAG" > "${RUNNER_TEMP}/release-notes.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"

      - name: Verify the published release body carries the changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)"
          bytes=$(printf '%s' "$body" | wc -c | tr -d ' ')
          entries=$(printf '%s' "$body" | grep -c '^- ' || true)
          sections=$(printf '%s' "$body" | grep -c '^### ' || true)
          echo "published body: ${bytes} bytes, ${entries} entries, ${sections} sections"
          if [ "${bytes:-0}" -lt 200 ] || [ "${entries:-0}" -lt 1 ] || [ "${sections:-0}" -lt 1 ]; then
            echo "::error::the published release body does not carry the changelog (${bytes} bytes, ${entries} entries, ${sections} sections)"
            exit 1
          fi

  # ── Build + push leoflow-migrate (golang-migrate + Dexaflow migrations)
  # The Helm chart's migration Job (#34/#48) defaults to
  # ghcr.io/dexadata/leoflow-migrate:<tag>; this job publishes that image,
  # multi-arch, on every release tag. It builds from the tag's source and uses
  # nothing GoReleaser produces, so it starts after the chart preflight, in
  # parallel with the release job rather than after it (#1686); the gate
  # waits on it. Dockerfile.migrate cross-compiles for the target from the
  # build platform, so the arm64 half needs no native runner.
  #
  # Dockerfile.migrate builds cmd/dexaflow-migrate, the wrapper over
  # golang-migrate's library (#1020), cross-compiled inside the Dockerfile, and
  # copies migrations/ on top. VERSION and GIT_COMMIT are passed as build args
  # so `-version` names the release the way GoReleaser stamps the server (tag
  # without the leading `v`). docker/build-push-action is the simpler shape
  # than GoReleaser's dockers block, and it builds the same file the blocking
  # Trivy gate in security.yaml scans on every PR.
  migrate-image:
    name: Build + push dexaflow-migrate image
    needs: chart-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless cosign signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Published under its name since the rename and its pre-rename
          # name: one build, both tags, same digest, both signed below.
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/dexaflow-migrate
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/leoflow-migrate
          # ref,event=tag stamps the tag verbatim (v0.0.1-prealpha.N); the
          # semver pattern strips the leading `v` so users pinning by version
          # (0.0.1-prealpha.N) work too. Server publishes BOTH forms from
          # GoReleaser (one docker build, two manifest names), so any operator
          # pin against either convention resolves to the same digest. No
          # `:latest` for pre-alpha tags — GoReleaser doesn't push `:latest`
          # for leoflow-server either, so the two images stay in sync.
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Version stamp
        id: stamp
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build + push (multi-arch)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.migrate
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.stamp.outputs.version }}
            GIT_COMMIT=${{ steps.stamp.outputs.commit }}

      # Mirror the supply-chain posture of leoflow-server: keyless cosign sign
      # every published tag by digest (ADR 0014). Without `--yes` cosign would
      # prompt for OIDC confirmation; CI passes the Sigstore challenge via the
      # GH OIDC token from id-token: write. Signing goes through the retry
      # wrapper so a transient OIDC blip (issue #773) retries instead of failing.
      - name: Sign image with cosign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            ./scripts/cosign-retry.sh sign --yes "${tag}@${DIGEST}"
          done

  # ── Build + push the Dexaflow task base image (runtime/Dockerfile)
  # A DAG image is `FROM ghcr.io/dexadata/leoflow-runtime:py<ver>` (ADR 0003):
  # the base ships the leoflow-agent (PID 1) and the leoflow_runtime helper, so a
  # `dexaflow compile --build` needs nothing but a registry. Before this job the
  # base only existed locally (built from a source checkout), which blocked
  # testing Pro without the repo (#318). One leg per supported Python so an author
  # picks the interpreter via `python_version`. Multi-arch + keyless cosign mirror
  # leoflow-server/leoflow-migrate.
  #
  # The matrix below is a COPY. The source of truth is the `python_version` enum
  # in internal/domain/schemas/leoflow-yaml-schema.json — the list the CLI's
  # Validate() actually enforces — and scripts/check-python-runtime-matrix.sh
  # fails when the two disagree. Publishing a leg nobody can select, or letting an
  # author select a leg nobody publishes, both surface as a `docker pull` 404
  # inside the user's own build, which is the furthest point from the cause (#1031).
  #
  # py3.10 is DEPRECATED: Python 3.10 goes EOL 2026-10-31 and docker-library/python
  # stops rebuilding an EOL line the day after, so the base freezes with whatever
  # OS CVEs it has. The leg keeps being published until then because `base_image`
  # pins make a silent drop a broken build for somebody else; the schema carries
  # the removal date and `dexaflow compile` warns the author.
  runtime-image-build:
    name: Build dexaflow-runtime base (py${{ matrix.python }}, ${{ matrix.arch }})
    # Builds from the tag's source and uses nothing GoReleaser produces, so it
    # starts after the chart preflight, not after the release job (#1686).
    needs: chart-preflight
    # Each platform builds on a runner of its own architecture. The arm64 half
    # used to build under QEMU on amd64 and took 13 to 18 minutes per Python,
    # the critical path of every release run (#1686). ubuntu-24.04-arm is the
    # hosted arm64 runner public repositories get.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/dexaflow-runtime
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      # Pushed by digest, with no tag: `runtime-image` puts the two platform
      # images under one multi-arch manifest and tags that.
      - name: Build + push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: runtime/Dockerfile
          # Stamp the baked agent with the release version/commit/date, so
          # `leoflow-agent version` in a task pod is traceable to a commit (matches
          # the cosign-signed release binaries' provenance).
          build-args: |
            PYTHON_VERSION=${{ matrix.python }}
            GO_VERSION=${{ env.GO_VERSION }}
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ needs.chart-preflight.outputs.build_date }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/dexaflow-runtime,push-by-digest=true,name-canonical=true,push=true

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-digest-py${{ matrix.python }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Publish the Dexaflow task base image (runtime/Dockerfile)
  # A DAG image is `FROM ghcr.io/dexadata/leoflow-runtime:py<ver>` (ADR 0003):
  # the base ships the leoflow-agent (PID 1) and the leoflow_runtime helper, so a
  # `dexaflow compile --build` needs nothing but a registry. Before this job the
  # base only existed locally (built from a source checkout), which blocked
  # testing Pro without the repo (#318). One leg per supported Python so an author
  # picks the interpreter via `python_version`. Multi-arch + keyless cosign mirror
  # leoflow-server/leoflow-migrate. The two platform images come from
  # `runtime-image-build`; this job joins them under one manifest list, tags
  # it under both names and signs it, so digests, tags and signatures keep
  # the shape they had when one job built both platforms (#1686).
  #
  # The matrix below is a COPY, as is the one of `runtime-image-build`. The
  # source of truth is the `python_version` enum
  # in internal/domain/schemas/leoflow-yaml-schema.json — the list the CLI's
  # Validate() actually enforces — and scripts/check-python-runtime-matrix.sh
  # fails when either disagrees. Publishing a leg nobody can select, or letting an
  # author select a leg nobody publishes, both surface as a `docker pull` 404
  # inside the user's own build, which is the furthest point from the cause (#1031).
  #
  # py3.10 is DEPRECATED: Python 3.10 goes EOL 2026-10-31 and docker-library/python
  # stops rebuilding an EOL line the day after, so the base freezes with whatever
  # OS CVEs it has. The leg keeps being published until then because `base_image`
  # pins make a silent drop a broken build for somebody else; the schema carries
  # the removal date and `dexaflow compile` warns the author.
  runtime-image:
    name: Publish dexaflow-runtime base (py${{ matrix.python }})
    needs: runtime-image-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless cosign signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-digest-py${{ matrix.python }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Published under its name since the rename and its pre-rename
          # name: one manifest, both tags, same digest, both signed below.
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/dexaflow-runtime
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/leoflow-runtime
          # Only the immutable per-release pin (py3.11-v0.0.2-rc.1). The moving
          # line tag (py3.11), which the docs and a development build's
          # generated Dockerfile default to, is re-pointed by `promote` after
          # the gate, for a GA of the newest minor only (ADR 0071). Pushing it
          # here moved it on every rc and before any smoke ran (#1684). No bare
          # `:latest`: the tag must always name a Python version.
          tags: |
            type=raw,value=py${{ matrix.python }}-${{ github.ref_name }}

      # One manifest list over the two platform images, pushed under every tag
      # of both names. It must hold exactly linux/amd64 and linux/arm64, or the
      # job fails before anything is signed.
      - name: Create the multi-arch manifest
        id: manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/dexaflow-runtime
          DIGESTS: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          mapfile -t digests < <(ls "$DIGESTS")
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "::error::want the amd64 and arm64 digests, got ${#digests[@]}: ${digests[*]}"
            exit 1
          fi
          args=()
          for tag in $TAGS; do args+=(-t "$tag"); done
          for d in "${digests[@]}"; do args+=("${SOURCE}@sha256:${d}"); done
          docker buildx imagetools create "${args[@]}"
          first=$(printf '%s\n' "$TAGS" | head -n1)
          digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r .digest)
          platforms=$(docker buildx imagetools inspect --raw "$first" |
            jq -r '[.manifests[].platform | select(.os != "unknown") | .os + "/" + .architecture] | sort | join(",")')
          if [ "$platforms" != "linux/amd64,linux/arm64" ]; then
            echo "::error::the manifest of $first holds $platforms, want linux/amd64,linux/arm64"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign image with cosign (keyless)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            ./scripts/cosign-retry.sh sign --yes "${tag}@${DIGEST}"
          done

  # ── Faithful install smoke: run the REAL `curl | sh` of the just-published
  # release in a clean container per distro and verify the binary plus the managed
  # CPython actually run. This catches install-path bugs (PATH, checksum, tar, the
  # relocatable CPython, glibc/musl) — the class of failure that previously only
  # surfaced on real machines. GoReleaser publishes pre-releases (publicly
  # downloadable, so `curl | sh` works here); if ANY distro fails, the `gate` job
  # below retracts the release to a draft. Net effect: a release only survives if
  # it installs cleanly on every supported distro ("só corta se passar").
  install-smoke:
    name: Install smoke (${{ matrix.image }})
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: sh # Alpine ships busybox sh, not bash; keep every distro on sh.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "mirror.gcr.io/library/debian:12", python: managed, prep: "apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq && apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -qq curl ca-certificates tar" }
          - { image: "mirror.gcr.io/library/ubuntu:24.04", python: managed, prep: "apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq && apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -qq curl ca-certificates tar" }
          - { image: "mirror.gcr.io/library/fedora:41", python: any, prep: "dnf install -y -q tar curl --allowerasing" }
          - { image: "quay.io/rockylinux/rockylinux:9", python: any, prep: "dnf install -y -q tar curl --allowerasing" }
          - { image: "mirror.gcr.io/opensuse/leap:15", python: any, prep: "zypper --no-gpg-checks -n in -y curl tar gzip" }
          - { image: "mirror.gcr.io/library/archlinux:latest", python: any, prep: "pacman -Sy --noconfirm archlinux-keyring && pacman -Syu --noconfirm curl tar" }
          - { image: "mirror.gcr.io/library/alpine:3.20", python: managed, prep: "apk add --no-cache curl tar" }
    steps:
      - name: Install prerequisites (curl + tar)
        # Retry the whole prep. apt-get carries Acquire::Retries inline, but
        # dnf/zypper/pacman/apk have none, and each distro is an independent
        # chance to fail the gate and retract the release (#983 / #979).
        run: |
          n=0
          until ${{ matrix.prep }}; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::prerequisite install failed after 3 attempts"
              exit 1
            fi
            echo "prerequisite install failed (attempt ${n}/3); retrying in 10s"
            sleep 10
          done

      - name: Install Dexaflow via the published install.sh
        env:
          LEOFLOW_VERSION: ${{ github.ref_name }} # pin to the just-pushed tag
        run: |
          # Fetch and run as two steps. `curl … | sh` under `shell: sh` (sh -e,
          # no pipefail) reports the PIPELINE's status, which is sh's — and sh
          # succeeds on empty input, so a failed fetch exits 0 and the step
          # passes. Verified: a 404 through that pipe gives exit 0.
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.sh" -o /tmp/install.sh
          sh /tmp/install.sh

      # Setup records the interpreter it chose in setup.json: a host Python
      # 3.11 to 3.13 when the image ships one, otherwise the managed CPython it
      # downloaded (#1700). Check that interpreter, whichever it is, and on the
      # legs marked `python: managed` (images with no python3 at all, glibc and
      # musl) require the download, so the relocatable CPython path stays
      # proven on every release. `python: any` legs report what setup chose.
      - name: Verify the binary and the Python setup chose run
        env:
          EXPECT: ${{ matrix.python }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -eu
          dexaflow version
          state="$HOME/.dexaflow"
          managed="$state/python/bin/python3.11"
          py="$(sed -n 's/.*"python":[[:space:]]*"\([^"]*\)".*/\1/p' "$state/setup.json")"
          if [ -z "$py" ]; then
            echo "::error::$state/setup.json names no python"
            exit 1
          fi
          ver="$("$py" --version 2>&1)"
          case "$ver" in
            "Python 3.11."* | "Python 3.12."* | "Python 3.13."*) ;;
            *)
              echo "::error::setup chose $py, which reports '$ver', not Python 3.11 to 3.13"
              exit 1
              ;;
          esac
          if [ "$py" = "$managed" ]; then source=managed; else source=host; fi
          echo "setup chose the $source interpreter $py ($ver)"
          echo "install smoke $IMAGE: $source interpreter $py ($ver)" >>"$GITHUB_STEP_SUMMARY"
          if [ "$EXPECT" = "managed" ]; then
            if [ "$source" != "managed" ]; then
              echo "::error::$IMAGE is the leg that proves the managed CPython download, but setup used the host $py; move this leg to python: any and mark an image with no python3 as managed"
              exit 1
            fi
            if [ ! -s "$state/python/.py-version" ]; then
              echo "::error::$managed exists but the download sentinel $state/python/.py-version does not; the managed CPython was not installed by setup"
              exit 1
            fi
          fi

  # ── Cold-start smoke (#96): the actual user flow we cannot reproduce in
  # any other gate — install fresh, run `dexaflow setup`, boot `dexaflow lite`,
  # wait for /readyz to respond. Catches the class of bug where the binary
  # is installed correctly but boot fails (Postgres race / connection bugs /
  # agent port collision / etc.).
  #
  # Uses `--postgres docker` (the user-facing default when Docker is present)
  # rather than `--postgres managed`. The relocatable Postgres bundle links
  # against system libs (libicuuc, libxml2, lz4, zstd, …) whose ABI varies
  # by distro: we tried pinning ubuntu:22.04 + libicu70, but the bundle still
  # failed at `postgres --version` because other unbundled deps were missing
  # in the slim image. The Docker path side-steps the host-libs question
  # entirely AND exercises the postgres-retry fix (the race that motivated
  # this smoke in the first place: docker-compose health vs. TCP accept).
  # Runs on the GitHub-hosted ubuntu-latest runner so Docker is already
  # available — no `container:` field needed.
  # The managed path is gated on bare ubuntu:22.04 and ubuntu:24.04 by
  # lite-managed-pg-distros.yaml (#279):
  # the missing libraries were libxml2 and Kerberos, never the ICU release.
  lite-cold-start-smoke:
    name: Lite cold-start (boot + /readyz, docker PG)
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Dexaflow via the published install.sh
        env:
          LEOFLOW_VERSION: ${{ github.ref_name }}
        run: |
          # Fetch and run as two steps. `curl … | sh` under `shell: sh` (sh -e,
          # no pipefail) reports the PIPELINE's status, which is sh's — and sh
          # succeeds on empty input, so a failed fetch exits 0 and the step
          # passes. Verified: a 404 through that pipe gives exit 0.
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.sh" -o /tmp/install.sh
          sh /tmp/install.sh
      - name: dexaflow setup (non-interactive, defaults)
        run: |
          set -eu
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p /tmp/ws
          dexaflow setup --workspace /tmp/ws </dev/null
      # Take the image download off the boot clock. `dexaflow lite --postgres
      # docker` brings up the embedded compose (docker-compose.dev.yaml,
      # materialized under ~/.leoflow on a binary-only install), so on a fresh
      # runner the pull otherwise happens inside the poll below.
      #
      # This step is an OPTIMIZATION and must never be fatal. It is the only
      # thing this job gained that could retract a signed release on its own,
      # and a registry outage is not a fact about our code. On failure the pull
      # simply happens inside the boot budget instead, which is what used to
      # happen anyway — the budget is now wide enough to absorb it.
      #
      # (Three attempts help a 503 or a TLS reset. They do nothing for a Docker
      # Hub anonymous rate limit, whose window is hours; that is precisely why
      # this must warn rather than fail.)
      #
      # The tag is written out rather than read from the compose on purpose:
      # this job deliberately has no checkout, because it tests the binary-only
      # install path. scripts/check-lite-prepull-matches-compose.sh is what
      # keeps the two from drifting.
      - name: Pre-pull the Postgres image the Lite compose uses
        run: |
          set -u
          for i in 1 2 3; do
            docker pull postgres:16 && exit 0
            echo "pull attempt $i failed; retrying in 10s" >&2
            sleep 10
          done
          echo "::warning::could not pre-pull postgres:16; the pull will happen inside the boot budget instead"
      - name: Boot dexaflow lite and wait for /readyz
        run: |
          set -eu
          export PATH="$HOME/.local/bin:$PATH"
          # This job stays cheap only because `dexaflow setup </dev/null` above is
          # non-interactive and persists lite_executor: subprocess. If that
          # default ever flips to k8s, `dexaflow lite` starts building a k3d
          # cluster inside the budget below and this job will look flaky.
          #
          # Background lite; capture stdout+stderr so we can dump on failure.
          dexaflow lite --postgres docker --port 8088 --host 127.0.0.1 >/tmp/lite.log 2>&1 &
          LITE_PID=$!
          # 240s, not 60. What retracted v0.4.5-rc.1 was NOT the image pull —
          # the log shows `postgres Pulled` and the container Healthy well
          # inside the minute. What was still running at the timeout is the
          # per-DAG venv: `pip install` of the task runtime sdist plus
          # apache-airflow-task-sdk, an uncached PyPI resolve with a local
          # hatchling build. First-run boot legitimately contains that.
          #
          # ci.yaml's lite UI smoke budgets 180s (60 x sleep 3) for the same
          # boot on the CHEAPER managed-Postgres path — and the venv install is
          # on that path too, since ensureWorkspaceDagVenvs runs before
          # startDevServer. Its own comment says "its venv installs first", so
          # the repo already knew. This gate had 60s for the heavier path.
          #
          # It has bitten twice, not once: v0.4.5-rc.1 attempt 1 at 60s and
          # v0.4.3 GA attempt 1 at 61s — two of nine first attempts. Across the
          # seven green releases the step ran 40-50s (mean 45.7, sigma 3.6), so
          # 60s was ~4 sigma out and the tail is a PyPI download.
          #
          # 240s is ~5x the median and 4x under the job's own timeout-minutes:
          # 15, which is the real hang net.
          ready=0
          started=$SECONDS
          for _ in $(seq 1 240); do
            if curl -fsS http://127.0.0.1:8088/readyz >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          took=$((SECONDS - started))
          if [ "$ready" -ne 1 ]; then
            echo "::error::/readyz never responded after 240s"
            echo "--- lite log (tail) ---"
            tail -200 /tmp/lite.log || true
            kill -TERM "$LITE_PID" 2>/dev/null || true
            exit 1
          fi
          # Raising the ceiling would otherwise hide a boot that doubled, so the
          # latency is still reported — as a warning, not a failure.
          # 75s, derived rather than picked: 1.5x the slowest of the last seven
          # green releases (40-50s, mean 45.7, sigma 3.6 — and those figures
          # INCLUDE the image pull the step above now removes, so the new
          # baseline is lower). The regression this exists to catch is one
          # heavyweight wheel entering the task-runtime dep tree, worth +20-40s;
          # a 90s threshold would not have spoken until boot nearly doubled.
          if [ "$took" -gt 75 ]; then
            echo "::warning::lite cold-start took ${took}s — the last seven green releases ran 40-50s including an image pull this job no longer does. Investigate before it reaches the 240s ceiling."
          fi
          echo "✓ /readyz responded in ${took}s"
          # Also to the summary, so the trend is readable across releases
          # without pulling job logs through the API.
          echo "lite cold-start: /readyz in ${took}s (ceiling 240s, warn 75s)" >>"$GITHUB_STEP_SUMMARY"
          # Graceful shutdown; assert SIGTERM is honored (otherwise the
          # process becomes a CI zombie and future runs leak).
          kill -TERM "$LITE_PID"
          wait "$LITE_PID" 2>/dev/null || true
      # The runner has a system Python 3.12 and no python3.11 on PATH, so setup
      # runs the parser on the host 3.12 and downloads nothing, and the starter
      # DAG (python_version "3.11", as `dexaflow init` writes it) gets the
      # managed CPython 3.11 when `dexaflow lite` builds its venv (#1700).
      # Check both interpreters whichever way they were resolved, and report
      # which, rather than assuming a managed CPython that setup may not fetch.
      - name: Verify the parser and starter venv interpreters
        run: |
          set -eu
          state="$HOME/.dexaflow"
          py="$(sed -n 's/.*"python":[[:space:]]*"\([^"]*\)".*/\1/p' "$state/setup.json")"
          if [ -z "$py" ]; then
            echo "::error::$state/setup.json names no python"
            exit 1
          fi
          pver="$("$py" --version 2>&1)"
          case "$pver" in
            "Python 3.11."* | "Python 3.12."* | "Python 3.13."*) ;;
            *)
              echo "::error::setup chose $py, which reports '$pver', not Python 3.11 to 3.13"
              exit 1
              ;;
          esac
          venv="$state/dev/venvs/hello/bin/python"
          vver="$("$venv" --version 2>&1)"
          case "$vver" in
            "Python 3.11."*) ;;
            *)
              echo "::error::the starter DAG declares python_version 3.11 but its venv $venv reports '$vver'"
              exit 1
              ;;
          esac
          if [ -x "$state/python/bin/python3.11" ]; then managed=present; else managed=absent; fi
          echo "lite cold-start: parser on $py ($pver), starter venv on $vver, managed CPython $managed" | tee -a "$GITHUB_STEP_SUMMARY"

  # ── Upgrade-in-place smoke (#150): install the previous non-draft prerelease,
  # then install THIS tag on top, asserting the new version is in place. Catches
  # the install.sh bug class where a fresh box succeeds but layering over an
  # existing ~/.leoflow/ breaks. The gate retracts the release to a draft on
  # failure, same as install-smoke. Skipped automatically when there is no
  # previous non-draft release to upgrade from (the first published tag).
  upgrade-smoke:
    name: Upgrade smoke (previous → ${{ github.ref_name }})
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mirror.gcr.io/library/ubuntu:24.04
    steps:
      - name: Install prerequisites
        run: |
          apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -qq curl ca-certificates tar git
          # gh CLI for release listing
          mkdir -p /etc/apt/keyrings
          chmod 755 /etc/apt/keyrings
          out=$(mktemp) && curl -sL https://cli.github.com/packages/githubcli-archive-keyring.gpg > "$out" && cat "$out" > /etc/apt/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
          apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -qq gh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run upgrade smoke
        env:
          LEOFLOW_REPO: ${{ github.repository }}
          LEOFLOW_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh test/release/upgrade-smoke.sh

  # ── Build provenance and SBOM attestations (#1562) ──
  # The release already carries cosign signatures and one syft SBOM per
  # archive. This adds SLSA build provenance (actions/attest) for the four
  # archives and for every image this run pushed (server, mcp, cli, migrate and each
  # runtime leg, by digest, so the leoflow-* names that share a digest are
  # covered too), the archive SBOMs attested against the archive they describe,
  # and an SPDX SBOM attached to each image with `cosign attest`. The chart's
  # provenance is made in `promote`, where the chart is pushed. Verification
  # is on the installation page (`gh attestation verify`,
  # `cosign verify-attestation`).
  #
  # The provenance names this workflow run as the builder, so it can live in a
  # job of its own: it reads the archives back from the release (and checks
  # them against checksums.txt) and the images by the digest their versioned
  # tag carries, and touches nothing else. The archive provenance bundle is
  # also uploaded as `<name>.intoto.jsonl`, for offline `--bundle` checks and
  # for Scorecard's Signed-Releases check. Only versioned objects get
  # attestations: no public pointer moves here (ADR 0071). The `gate` retracts
  # the release if this job fails, as it does for a missing signature.
  attest:
    name: Attest provenance and SBOMs
    needs: [release, migrate-image, runtime-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write       # Upload the provenance bundle to the release.
      packages: write       # Push the cosign SBOM attestations next to the images.
      id-token: write       # Sigstore signing of every attestation.
      attestations: write   # Store the GitHub attestations.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the archives and SBOMs, check them against checksums.txt
        id: archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern 'dexaflow_*.tar.gz' --pattern 'dexaflow_*.tar.gz.sbom.json' --pattern checksums.txt
          (cd dist && sha256sum -c checksums.txt)
          bash scripts/release-attest.sh archives dist "$TAG"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve the image digests
        env:
          TAG: ${{ github.ref_name }}
          REGISTRY_PREFIX: ${{ env.REGISTRY }}/${{ github.repository_owner }}
        run: bash scripts/release-attest.sh images "$TAG" images.sha256 images.refs

      - name: Provenance for the archives
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/dexaflow_*.tar.gz

      - name: Provenance for the images
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: images.sha256

      # One step per platform: actions/attest takes one SBOM per call.
      # `release-attest.sh archives` above fails on a platform not listed here.
      - name: SBOM attestation (linux_amd64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/dexaflow_${{ steps.archives.outputs.version }}_linux_amd64.tar.gz
          sbom-path: dist/dexaflow_${{ steps.archives.outputs.version }}_linux_amd64.tar.gz.sbom.json
      - name: SBOM attestation (linux_arm64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/dexaflow_${{ steps.archives.outputs.version }}_linux_arm64.tar.gz
          sbom-path: dist/dexaflow_${{ steps.archives.outputs.version }}_linux_arm64.tar.gz.sbom.json
      - name: SBOM attestation (darwin_amd64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/dexaflow_${{ steps.archives.outputs.version }}_darwin_amd64.tar.gz
          sbom-path: dist/dexaflow_${{ steps.archives.outputs.version }}_darwin_amd64.tar.gz.sbom.json
      - name: SBOM attestation (darwin_arm64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/dexaflow_${{ steps.archives.outputs.version }}_darwin_arm64.tar.gz
          sbom-path: dist/dexaflow_${{ steps.archives.outputs.version }}_darwin_arm64.tar.gz.sbom.json

      - name: SPDX SBOM on each image (cosign attest)
        run: bash scripts/release-attest.sh sbom images.refs

      # One JSON line per bundle, the format `gh attestation verify --bundle`
      # reads. --clobber keeps a re-run idempotent.
      - name: Upload the archive provenance to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          VERSION: ${{ steps.archives.outputs.version }}
        run: |
          set -euo pipefail
          out="dist/dexaflow_${VERSION}.intoto.jsonl"
          jq -c . "$BUNDLE" > "$out"
          gh release upload "$TAG" "$out" --repo "$GITHUB_REPOSITORY" --clobber

  # ── Verify the control-plane server image is cosign-signed (#772). GoReleaser
  # signs it keyless in the `release` job via docker_signs; this job proves the
  # signature is actually there and verifiable, so an unsigned image — or one
  # whose signing silently flaked past the retry wrapper — cannot ship. The
  # `gate` job below retracts the release to a draft if this fails.
  #
  # Keyless verification pins BOTH the OIDC issuer (GitHub's token provider) and
  # the certificate identity (the exact workflow file + tag ref that signed),
  # otherwise `cosign verify` would accept a signature from any Sigstore identity.
  # Verifying the `:v<tag>` manifest is sufficient: it and the un-prefixed
  # `:<version>` manifest resolve to the same digest, and both were signed.
  verify-server-signature:
    name: Verify dexaflow-server, dexaflow-mcp and dexaflow-cli image signatures
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: cosign verify dexaflow-server
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/dexaflow-server:${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Through the same wrapper every `cosign sign` uses, rather than a
          # second retry policy that drifts from it. verify fetches the Sigstore
          # TUF root and talks to Rekor and Fulcio, none of which we control, and
          # an unretried flake here retracts the release to a draft (#983).
          ./scripts/cosign-retry.sh verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github\.com/${REPO}/\.github/workflows/release\.yaml@refs/tags/" \
            "${IMAGE}"

      - name: cosign verify dexaflow-mcp
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/dexaflow-mcp:${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Signed by the same docker_signs block as the server image, so the
          # same identity pins apply.
          ./scripts/cosign-retry.sh verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github\.com/${REPO}/\.github/workflows/release\.yaml@refs/tags/" \
            "${IMAGE}"

      # The CLI image pipelines pull by tag (#1708), from the same GoReleaser
      # docker_signs block: an unsigned one retracts the release like the others.
      # It is then run, because what it is for is the programs next to the
      # binary: a CLI that reports another version, or a python3, git or uv
      # missing, fails the first `dexaflow deploy` of every pipeline using it.
      - name: cosign verify and run dexaflow-cli
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/dexaflow-cli:${{ github.ref_name }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ./scripts/cosign-retry.sh verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github\.com/${REPO}/\.github/workflows/release\.yaml@refs/tags/" \
            "${IMAGE}"
          got="$(docker run --rm "$IMAGE" version --json | jq -r .version)"
          [ "$got" = "${TAG#v}" ] || { echo "::error::${IMAGE} runs dexaflow ${got}, want ${TAG#v}"; exit 1; }
          for tool in python3 git uv; do
            docker run --rm --entrypoint "$tool" "$IMAGE" --version
          done

      # Every step above is logged in, so a private package passes them while
      # every pipeline's anonymous pull is denied. A new GHCR package can start
      # private, and the first rc is the run that creates it: an rc warns, a GA
      # fails (RELEASING.md, "A new image").
      - name: dexaflow-cli pulls without credentials (warns on an rc, fails a GA)
        env:
          REPO_IMAGE: ${{ github.repository_owner }}/dexaflow-cli
          TAG: ${{ github.ref_name }}
        run: bash scripts/release-check-public.sh "$REPO_IMAGE" "$TAG"

  # ── Release gate: if any of the smoke jobs OR the migrate-image build
  # failed, retract the release to a draft so a pinned `curl | sh` stops
  # handing users a broken build. Runs always() so it can act on any failure.
  # Its success is what `promote` waits for; nothing public has moved before
  # that (ADR 0071), so a retraction here leaves no chart and no Latest behind.
  gate:
    name: Gate release on install + lite-cold-start + upgrade + migrate + runtime image + server signature
    needs: [release, install-smoke, lite-cold-start-smoke, upgrade-smoke, migrate-image, runtime-image, verify-server-signature, attest]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # Edit the published release back to a draft on failure.
    steps:
      - name: Retract release to draft on smoke or image failure
        if: needs.install-smoke.result != 'success' || needs.lite-cold-start-smoke.result != 'success' || needs.upgrade-smoke.result != 'success' || needs.migrate-image.result != 'success' || needs.runtime-image.result != 'success' || needs.verify-server-signature.result != 'success' || needs.attest.result != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          echo "::error::release blocked: install-smoke=${{ needs.install-smoke.result }} lite-cold-start-smoke=${{ needs.lite-cold-start-smoke.result }} upgrade-smoke=${{ needs.upgrade-smoke.result }} migrate-image=${{ needs.migrate-image.result }} runtime-image=${{ needs.runtime-image.result }} verify-server-signature=${{ needs.verify-server-signature.result }} attest=${{ needs.attest.result }}; retracting ${GITHUB_REF_NAME} to a draft."
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft
          # Print the recovery, because a plain re-run CANNOT work and the reader
          # has no way to know that from here (#979, observed on v0.4.5-rc.1).
          # Most smoke jobs install with `curl … install.sh | sh`, which downloads
          # from the PUBLIC release-asset URL. A draft's assets are not served
          # there, so every re-run of a retracted release fails on the download —
          # the failure looks identical to the original one, and the obvious next
          # move (cut a new tag) is the expensive one, since tags are immutable
          # (ADR 0033). Re-publish FIRST, then re-run.
          cat >> "${GITHUB_STEP_SUMMARY}" <<EOF
          ## ${GITHUB_REF_NAME} retracted to a draft

          A plain re-run will fail on the asset download, not on whatever failed
          here: \`install.sh\` fetches the public release-asset URL and a draft
          does not serve one. Re-publish first.

          **If the failure was transient** (see #1007 for the service-container
          pull class, #983 for unretried network steps):

          \`\`\`bash
          gh release edit ${GITHUB_REF_NAME} --repo ${GITHUB_REPOSITORY} --draft=false
          gh run rerun ${GITHUB_RUN_ID} --failed
          \`\`\`

          \`scripts/cut-release.sh\` does this for you when it is driving the
          cut — it re-publishes before classifying the failure. This summary is
          for the case where nobody is running it.

          **If the failure was real**, leave it drafted and cut the next tag.
          EOF
          exit 1
      - name: Confirm release passed all gates and ensure it is published
        if: needs.install-smoke.result == 'success' && needs.lite-cold-start-smoke.result == 'success' && needs.upgrade-smoke.result == 'success' && needs.migrate-image.result == 'success' && needs.runtime-image.result == 'success' && needs.verify-server-signature.result == 'success' && needs.attest.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          echo "install smoke + lite cold-start + upgrade smoke + migrate-image + runtime-image + server-signature passed; ${GITHUB_REF_NAME} stays published."
          # Idempotently ensure the release is published. On the first green run this
          # is a no-op (the release job already published it). On a green RE-RUN after
          # an earlier run retracted the release to a draft (e.g. a transient cosign
          # download flake failed a smoke job), this un-drafts it — closing the gap
          # where a passing re-run left the release stuck as a draft, needing a manual
          # `gh release edit --draft=false`. --draft=false leaves the prerelease flag
          # untouched, so an rc stays a pre-release.
          #
          # --latest=false is load-bearing: GitHub marks a release Latest by
          # default when it goes from draft to published, which would move the
          # pointer here, before `promote` ran (ADR 0071).
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest=false

  # ── Promote: the only job that moves a public pointer (ADR 0071) ──
  # Runs once `gate` is green, in the order a user would trip over a gap:
  # 1. every image the chart or the moving tags reference exists and carries
  #    this repository's release signature;
  # 2. the chart is pushed and signed, as `dexaflow` and as `leoflow` (the name
  #    installs from before the rename upgrade with), for rc and GA alike;
  # 3. for a GA of the newest minor only, the moving `py3.N` runtime tags are
  #    re-pointed at this release's digests, and the release is marked Latest,
  #    which is what install.sh resolves without a pinned version.
  # An rc and a patch of an older minor stop after step 2; the reason is in the
  # step summary. Every step is idempotent, so a failed promote is recovered by
  # re-running this job alone.
  promote:
    name: Promote (verify images, chart, py3.N, Latest)
    needs: gate
    if: needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # Mark the release Latest.
      packages: write   # Push the chart and re-point the py3.N tags on GHCR.
      id-token: write   # Cosign keyless signing of the chart and its provenance.
      attestations: write   # Store the chart build provenance attestation.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide which pointers this tag may move
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash scripts/release-promote-plan.sh "$TAG" | tee -a "$GITHUB_OUTPUT"

      - name: Verify the images the chart and the moving tags reference
        env:
          TAG: ${{ github.ref_name }}
          REGISTRY_PREFIX: ${{ env.REGISTRY }}/${{ github.repository_owner }}
        run: bash scripts/release-verify-images.sh "$TAG" --runtime

      # Stamp version and appVersion from the tag (ADR 0028), without the `v`:
      # a chart version is SemVer 2, and the image tags the chart defaults to
      # are the un-prefixed ones. The same templates are published twice, as
      # `dexaflow` and as `leoflow`: the chart name feeds the selector labels,
      # so a release installed before the rename upgrades in place only with
      # the chart name it was installed with. Each pushed digest is also written
      # to charts.sha256 (checksums format) for the provenance step below.
      - name: Package, push and sign the charts (dexaflow and leoflow)
        env:
          TAG: ${{ github.ref_name }}
          CHARTS: oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
          SIGN_PREFIX: ${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
        run: |
          set -euo pipefail
          version="${TAG#v}"
          helm package helm/dexaflow --version "$version" --app-version "$version"
          legacy="$(mktemp -d)/leoflow"
          cp -R helm/dexaflow "$legacy"
          sed -i 's/^name: dexaflow$/name: leoflow/' "$legacy/Chart.yaml"
          grep -q '^name: leoflow$' "$legacy/Chart.yaml"
          helm package "$legacy" --version "$version" --app-version "$version"
          : > charts.sha256
          for name in dexaflow leoflow; do
            helm push "${name}-${version}.tgz" "$CHARTS" 2>&1 | tee push.log
            digest="$(awk '/Digest: /{print $2}' push.log)"
            if [ -z "$digest" ]; then
              echo "::error::could not parse the pushed ${name} chart digest from helm push output"
              exit 1
            fi
            printf '%s  %s\n' "${digest#sha256:}" "${SIGN_PREFIX}/${name}" >> charts.sha256
            ./scripts/cosign-retry.sh sign --yes "${SIGN_PREFIX}/${name}@${digest}"
            # Read the signature back with the same identity pins the images
            # use, so a sign that silently flaked cannot ship (#1687).
            ./scripts/cosign-retry.sh verify \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yaml@refs/tags/" \
              "${SIGN_PREFIX}/${name}@${digest}" >/dev/null
            echo "chart ${name} ${version} @ ${digest}, signed and verified" >> "$GITHUB_STEP_SUMMARY"
          done

      # SLSA build provenance for both charts, by the digest just pushed (#1562).
      # The chart is only pushed here, after the gate, so its provenance is made
      # here too and not in the `attest` job. A failure stops before any pointer
      # moves below.
      - name: Provenance for the charts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: charts.sha256

      # Re-point py3.N at the digest py3.N-<tag> already carries, under both
      # image names. No rebuild and no re-sign: the signature is on the digest,
      # which the verify step above just checked. The digest is read back and
      # compared, so a copy that re-wrapped the index cannot pass silently.
      - name: Move the py3.N runtime tags
        if: steps.plan.outputs.latest == 'true'
        env:
          TAG: ${{ github.ref_name }}
          PREFIX: ${{ env.REGISTRY }}/${{ github.repository_owner }}
        run: |
          set -euo pipefail
          digest_of() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest; }
          pythons="$(jq -r '.. | objects | select(has("python_version")) | .python_version.enum? // empty | .[]' internal/domain/schemas/leoflow-yaml-schema.json)"
          [ -n "$pythons" ] || { echo "::error::no Python line found in the schema enum"; exit 1; }
          for py in $pythons; do
            for image in dexaflow-runtime leoflow-runtime; do
              src="${PREFIX}/${image}:py${py}-${TAG}"
              dst="${PREFIX}/${image}:py${py}"
              want="$(digest_of "$src")"
              docker buildx imagetools create --tag "$dst" "$src"
              got="$(digest_of "$dst")"
              if [ "$got" != "$want" ]; then
                echo "::error::${dst} points at ${got}, expected ${want} from ${src}"
                exit 1
              fi
              echo "${dst} -> ${want}" >> "$GITHUB_STEP_SUMMARY"
            done
          done

      - name: Mark the release Latest
        if: steps.plan.outputs.latest == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [ "$latest" != "$TAG" ]; then
            echo "::error::releases/latest returns ${latest} after marking ${TAG} Latest"
            exit 1
          fi
          echo "${TAG} is Latest" >> "$GITHUB_STEP_SUMMARY"

      - name: Record what was not moved
        if: steps.plan.outputs.latest != 'true'
        env:
          REASON: ${{ steps.plan.outputs.reason }}
        run: |
          echo "Latest and the py3.N runtime tags were not moved: ${REASON}" >> "$GITHUB_STEP_SUMMARY"
