# Requires a docs update when a PR changes user-facing surface
# (see scripts/check-docs-updated.sh).
#
# A standalone workflow — not a job in ci.yaml — for the same reason as the
# CHANGELOG guard: it triggers on `labeled` / `unlabeled` too, so applying
# `skip-docs` re-runs THIS guard alone and the exemption takes effect at once.
# It also triggers on `edited`: a `Skip-docs: <reason>` line in the
# description is the opt-out, and adding that line has to re-run the guard.
#
# Why it exists: taskPodSecurity.readOnlyRootFilesystem — the security hardening
# of the v0.4.5 tranche — shipped in rc.3 with zero mentions anywhere under
# website/content/. It had been validated on a real cluster the same day. The
# CHANGELOG guard was added after the same failure repeated at least eight times
# with changelog entries; this is that lesson applied one surface earlier.
name: Docs guard

on:
  pull_request:
    branches: [main, "release-*"]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  # The merge queue (#1569): see docs-guard-queue below.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

# A newer push to the same pull request supersedes this run, so the older one
# is cancelled instead of holding runners the newer one needs. Every other run
# (pushes to main and release-*, tags, schedules, manual runs) gets a group of
# its own, keyed by run id: a shared group would still cancel a WAITING run
# when a third one arrives, whatever cancel-in-progress says, and
# cut-release.sh refuses to tag a commit whose run was cancelled. The head
# sha is part of the pull request key here: this guard also runs on labeled
# and unlabeled, and a label added to the same commit (cut-release.sh opens its
# prepare pull request with one) must not cancel the run of that commit.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}-{2}', github.workflow, github.event.pull_request.number, github.event.pull_request.head.sha) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-guard:
    name: Docs updated for user-facing changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Dependabot is exempt by author, not by label — the same reasoning the
    # CHANGELOG guard documents: keying on the author keeps one mechanism and
    # survives a label being removed. The skip-docs label no longer skips the
    # job: the script accepts it only with a reason in the description.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The changed-file list comes from the API rather than a git diff: the
      # CHANGELOG guard can fetch --depth=1 because it compares one file's
      # content, but a file LIST needs a merge base, and a shallow clone has
      # none. Asking gh sidesteps the fetch-depth question entirely.
      - name: Collect the changed files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        # The files endpoint, paginated: `gh pr diff` refuses a PR touching more
        # than 300 files (HTTP 406), which a rename legitimately does.
        run: |
          gh api --paginate "repos/${{ github.repository }}/pulls/${PR}/files" \
            --jq '.[].filename' > /tmp/changed.txt
      # A `Skip-docs: <reason>` line passes with or without the label, so a
      # pull request from a fork, whose author cannot apply labels, can opt
      # out too (#1560). The body comes from the event payload, which is
      # current on `edited`, the event that adding the line fires.
      - name: Require a docs update (or a Skip-docs line with a reason)
        env:
          SKIP_DOCS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'skip-docs') && '1' || '0' }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/check-docs-updated.sh HEAD /tmp/changed.txt
      # No page may tell a reader to install a release older than the newest GA
      # (#1555). Reads website/scripts/ci/versions.json, so it needs no network
      # and judges the whole tree, not only the files this PR changed: a GA
      # that lands makes every leftover pin stale at once, and the docs
      # promotion PR, which bumps the README pins, is where that shows.
      - name: No page pins a release older than the newest GA
        run: bash scripts/check-stale-versions.sh

  # Same name in the merge queue, so the check can be made required. The docs
  # were judged on the pull request against its own diff; the queue commit
  # adds only the base's newer commits, which were judged on theirs.
  docs-guard-queue:
    name: Docs updated for user-facing changes
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Judged on the pull request
        run: echo "The docs were checked on the pull request; nothing to re-check in the merge queue."
