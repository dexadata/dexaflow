name: E2E external secrets (k3d + LocalStack)

# ADR 0060: the external secrets resolver is a pod-side Python subprocess the
# agent drives; its stdout is a strict-JSON channel. Unit tests use a fake
# backend and cannot catch stdout corruption from a REAL provider's logging, so
# this gate runs the resolver against an emulated AWS Secrets Manager (LocalStack)
# in a real task pod on k3d — declaration-scoped, resolved from the backend, not
# the vault. Keyless identity (IRSA / Pod Identity / Workload Identity) is the one
# piece LocalStack cannot emulate and remains the EKS/GKE cluster validation.
on:
  push:
    paths:
      - "internal/agent/**"
      - "runtime/python/**"
      - "internal/executor/**"
      - "test/e2e/secrets-localstack.sh"
      - "test/e2e/lib.sh"
      - ".github/workflows/secrets-e2e.yaml"
  pull_request:
    paths:
      - "internal/agent/**"
      - "runtime/python/**"
      - "internal/executor/**"
      - "test/e2e/secrets-localstack.sh"
      - "test/e2e/lib.sh"
      - ".github/workflows/secrets-e2e.yaml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes this run, so the older one
# is cancelled instead of holding runners the newer one needs. Every other run
# (pushes to main and release-*, tags, schedules, manual runs) gets a group of
# its own, keyed by run id: a shared group would still cancel a WAITING run
# when a third one arrives, whatever cancel-in-progress says, and
# cut-release.sh refuses to tag a commit whose run was cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets-e2e:
    name: External secrets resolver (LocalStack Secrets Manager)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # A fresh datastore per run — deliberately not shared, so the scheduler is
      # never handed leftover queued task instances from another cluster (which
      # would ImagePullBackOff and add noise).
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: leoflow
          POSTGRES_PASSWORD: leoflow
          POSTGRES_DB: leoflow
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: mirror.gcr.io/library/redis:7
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # The control plane runs on the runner; k3d pods dial it via host.k3d.internal
      # (Linux only — Docker Desktop uses host.docker.internal, the e2e default).
      LEOFLOW_E2E_HOST_ADDR: host.k3d.internal
      # leoflow compile spawns `python3 -m leoflow_parser`; the parser needs no
      # install — just PYTHONPATH (the airflow-free shim).
      PYTHONPATH: parser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install k3d + kubectl + migrate
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/v5.7.4/install.sh | TAG=v5.7.4 bash
          curl -fsSLO "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - name: Apply migrations
        run: ~/go/bin/migrate -path migrations -database "postgres://leoflow:leoflow@localhost:5432/leoflow?sslmode=disable" up
      - name: Build binaries
        run: make build
      - name: Run the external-secrets k3d + LocalStack e2e
        run: bash test/e2e/secrets-localstack.sh
