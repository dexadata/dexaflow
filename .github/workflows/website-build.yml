name: Website (Hugo+Docsy) build check

# Build check for the Hugo + Docsy documentation site under website/. The MkDocs +
# mike migration is complete: Hugo is now the published docs (deployed separately by
# website-deploy.yml). This workflow ONLY builds the site with `hugo --gc --minify`
# to prove a PR keeps it green — it never deploys anywhere and never touches the
# gh-pages branch.
#
# Scoped to website/** so it only fires on changes that can affect the site build.
on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website-build.yml"]
  pull_request:
    branches: [main, "release-*"]
    paths: ["website/**", ".github/workflows/website-build.yml"]
  workflow_dispatch:

# Least-privilege: read-only. No pages/deploy permissions on purpose — this job
# must never be able to publish.
permissions:
  contents: read

# Pin the toolchain. Docsy needs the Hugo EXTENDED build (SCSS) and Go (Hugo Modules).
env:
  HUGO_VERSION: "0.165.0"

# A newer push to the same pull request supersedes this run, so the older one
# is cancelled instead of holding runners the newer one needs. Every other run
# (pushes to main and release-*, tags, schedules, manual runs) gets a group of
# its own, keyed by run id: a shared group would still cancel a WAITING run
# when a third one arrives, whatever cancel-in-progress says, and
# cut-release.sh refuses to tag a commit whose run was cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: hugo --gc --minify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Docsy's "last modified" + enableGitInfo want full history.
          fetch-depth: 0

      - name: Setup Go (for Hugo Modules)
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: website/go.mod

      - name: Setup Node (for Docsy PostCSS/autoprefixer)
        uses: actions/setup-node@v7
        with:
          # Node 22 LTS (NOT 20): Hugo Extended sandboxes the PostCSS/autoprefixer
          # subprocess with Node's Permission Model — it invokes node with
          # `--permission --allow-fs-read=<computed allowlist> --import=<resolver>`.
          # The `--permission` flag only exists on Node >= 22.13 / 24; on Node 20.x
          # node aborts with `bad option: --permission`, which fails the SCSS->CSS
          # transform of main.css and thus the whole production build (`hugo --gc
          # --minify`). Local builds passed only because dev machines run newer Node.
          node-version: "22"

      - name: Setup Python (for pdoc + generator post-processing)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Hugo Extended
        run: |
          set -euo pipefail
          url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          curl -sSL "$url" -o /tmp/hugo.deb
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - name: Install PostCSS toolchain
        working-directory: website
        run: npm ci

      # Regenerate the reference trees BEFORE hugo (parity with the live MkDocs
      # docs.yml pipeline: CLI from Cobra, Go from gomarkdoc, the OpenAPI spec for
      # Scalar, and the Python runtime API from pdoc). The generated trees ARE
      # committed (so a fresh clone / preview builds without these toolchains);
      # rerunning them here guarantees the committed pages can never drift from
      # source. Run from the repo root — each script cd's to the root itself.
      - name: Generate CLI reference (Cobra)
        run: ./website/scripts/gen-cli.sh
      - name: Generate Go reference (gomarkdoc)
        run: ./website/scripts/gen-go.sh
      - name: Refresh OpenAPI spec (Scalar)
        run: ./website/scripts/gen-openapi.sh
      - name: Generate Python runtime API (pdoc)
        run: ./website/scripts/gen-python.sh

      # No `hugo mod get -u` — that would upgrade past the pinned Docsy version in
      # go.mod. `hugo --gc` auto-downloads modules at exactly the pinned versions.
      - name: Build (no deploy)
        working-directory: website
        run: hugo --gc --minify --logLevel info

      # Link/image check over the RENDERED site. Nothing checked internal links
      # before, so a page or asset that moved (the README-image / doc-link 404 class)
      # shipped silently. Run OFFLINE on purpose: the bug class is broken *internal*
      # relative links/images, and offline resolves every root-relative /leoflow/…
      # href and img src against the built output deterministically — no flaky
      # external fan-out across thousands of doc links. External-link and governance-
      # Markdown coverage lives in link-check.yml. Behaviour is in ../lychee.toml.
      - name: Check links & images in the built site
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --no-progress
            --offline
            --root-dir "${{ github.workspace }}/website/public"
            "website/public/**/*.html"
          fail: true

      - name: Upload built site (artifact only — NOT a deploy)
        uses: actions/upload-artifact@v7
        with:
          name: website-public
          path: website/public
          retention-days: 7
          if-no-files-found: error
