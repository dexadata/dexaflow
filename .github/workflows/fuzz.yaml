name: Fuzz

# The long run of the native Go fuzz targets (#1571): every target, a few
# minutes each, via scripts/fuzz.sh. Not on pull requests: `go test ./...` in
# the CI workflow already replays every seed and every committed crasher under
# testdata/fuzz/ as a regression test, and a fuzz run is open-ended work the
# few runners we have should not spend on every push. Nightly on main, and by
# hand (workflow_dispatch) with a chosen time per target or a subset of targets.
#
# A failing input is uploaded as an artifact. To keep it, copy it into the
# package's testdata/fuzz/<Target>/ in the pull request that fixes the crash,
# so the regular test run replays it from then on.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Time per target (a go test -fuzztime value)"
        default: "5m"
      targets:
        description: "Regexp of the targets to run (empty: all)"
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-run-${{ github.run_id }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.10"

jobs:
  fuzz:
    name: Fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run every fuzz target
        env:
          FUZZTIME: ${{ inputs.fuzztime || '5m' }}
          FUZZ: ${{ inputs.targets }}
        run: bash scripts/fuzz.sh

      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers-${{ github.run_id }}
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
