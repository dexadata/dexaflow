schema_version: "1.0"
dag_id: mssql_load
description: Compute rows and load them into an external Microsoft SQL Server via a managed Connection.
owner: examples
tags:
  - example
python_version: "3.11"
dependencies:
  - pymssql==2.3.2
# The managed Connection this DAG reads (ADR 0045, ADR 0055). Declaring it keeps
# the DAG valid once secret delivery is scoped to the declared set.
connections:
  - mssql_target
