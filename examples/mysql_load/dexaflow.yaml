schema_version: "1.0"
dag_id: mysql_load
description: Compute rows and load them into an external MySQL/MariaDB via a managed Connection.
owner: examples
tags:
  - example
python_version: "3.11"
dependencies:
  - PyMySQL==1.1.1
# The managed Connection this DAG reads (ADR 0045, ADR 0055). Declaring it keeps
# the DAG valid once secret delivery is scoped to the declared set.
connections:
  - my_db
