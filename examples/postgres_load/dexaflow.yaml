schema_version: "1.0"
dag_id: postgres_load
description: Compute rows and load them into an external Postgres via a managed Connection.
owner: examples
tags:
  - example
python_version: "3.11"
dependencies:
  - psycopg2-binary==2.9.10
# The managed Connection this DAG reads (ADR 0045, ADR 0055). Declaring it keeps
# the DAG valid once secret delivery is scoped to the declared set.
connections:
  - pg_target
