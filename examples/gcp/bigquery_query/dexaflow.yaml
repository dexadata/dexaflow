schema_version: "1.0"
dag_id: gcp_bigquery_query
description: "A single BigQuery operator (BigQueryInsertJobOperator) querying a public dataset via the generic operator path (ADR 0040)."
owner: examples
tags:
  - example
python_version: "3.11"
# The connectors: sugar expands at compile to apache-airflow-providers-google,
# which provides the BigQuery operators and the google_cloud_platform hook. ADR 0038.
connectors:
  - gcp

# A Pro deploy pushes the DAG image to a registry your cluster can pull from.
# Leave this commented out when the target or the cluster already names one
# (dexaflow target add --registry, or the cluster's deploy defaults).
# registry:
#   url: ghcr.io/your-org        # Docker Hub, ECR, Artifact Registry, ACR, GHCR or private
#   image_name: gcp_bigquery_query   # optional: defaults to the dag_id
