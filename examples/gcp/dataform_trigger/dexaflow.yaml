schema_version: "1.0"
dag_id: gcp_dataform_trigger
description: "Compile a Dataform repository and run its workflow via the Google provider operators (ADR 0040), chaining compile -> invoke with ti.xcom_pull."
owner: examples
tags:
  - example
python_version: "3.11"
# The connectors: sugar — this one line expands at compile to
# apache-airflow-providers-google, which provides the Dataform operators and the
# google_cloud_platform Connection hook. ADR 0038.
connectors:
  - gcp

# A Pro deploy pushes the DAG image to a registry your cluster can pull from.
# Leave this commented out when the target or the cluster already names one
# (dexaflow target add --registry, or the cluster's deploy defaults).
# registry:
#   url: ghcr.io/your-org        # Docker Hub, ECR, Artifact Registry, ACR, GHCR or private
#   image_name: gcp_dataform_trigger   # optional: defaults to the dag_id
