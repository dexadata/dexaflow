schema_version: "1.0"
dag_id: postgres_hook_load
description: "Load rows into an external Postgres using Airflow's PostgresHook, with the provider declared via the connectors: sugar."
owner: examples
tags:
  - example
python_version: "3.11"
# The connectors: sugar — this one line expands at compile to
# apache-airflow-providers-postgres, which pulls PostgresHook and its psycopg2
# driver. Contrast examples/postgres_load, which pins the raw driver in
# dependencies: and uses psycopg2 directly. ADR 0038.
connectors:
  - postgres
# The managed Connection this DAG reads via PostgresHook(postgres_conn_id=...)
# (ADR 0045, ADR 0055) — distinct from connectors: above, which is the pip
# provider package (ADR 0038). Declaring it keeps the DAG valid once secret
# delivery is scoped to the declared set.
connections:
  - pg_target
