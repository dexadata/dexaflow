schema_version: "1.0"
dag_id: redis_load
description: Compute a key-value payload and write it into a Redis hash via a managed Connection.
owner: examples
tags:
  - example
python_version: "3.11"
dependencies:
  - redis==5.2.1
# The managed Connection this DAG reads (ADR 0045, ADR 0055). Declaring it keeps
# the DAG valid once secret delivery is scoped to the declared set.
connections:
  - redis_target

# A Pro deploy pushes the DAG image to a registry your cluster can pull from.
# Leave this commented out when the target or the cluster already names one
# (dexaflow target add --registry, or the cluster's deploy defaults).
# registry:
#   url: ghcr.io/your-org        # Docker Hub, ECR, Artifact Registry, ACR, GHCR or private
#   image_name: redis_load   # optional: defaults to the dag_id
