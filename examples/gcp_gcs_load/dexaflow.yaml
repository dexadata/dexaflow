schema_version: "1.0"
dag_id: gcp_gcs_load
description: Write + read a GCS object via a managed google_cloud_platform Connection (key or keyless/ADC).
owner: examples
tags:
  - example
python_version: "3.11"
dependencies:
  - google-auth==2.35.0
  - google-cloud-storage==2.18.2
  - google-cloud-secret-manager==2.20.2

# The managed Connection and Variable this DAG reads (ADR 0045, ADR 0055):
# the google_cloud_default Connection for credentials and the GCS_BUCKET
# Variable for the target bucket. Declaring them keeps the DAG valid once
# secret delivery is scoped to the declared set.
connections:
  - google_cloud_default
variables:
  - GCS_BUCKET

# Keyless on Pro/GKE: run the task pod as a Kubernetes ServiceAccount bound to a
# GCP service account via Workload Identity, so credentials come from the
# metadata server (no key). Create/annotate the KSA per the README, or drop this
# block and use key mode (keyfile_dict) / host ADC on Lite subprocess.
tasks:
  gcs_roundtrip:
    execution:
      service_account: leoflow-gcs

# A Pro deploy pushes the DAG image to a registry your cluster can pull from.
# Leave this commented out when the target or the cluster already names one
# (dexaflow target add --registry, or the cluster's deploy defaults).
# registry:
#   url: ghcr.io/your-org        # Docker Hub, ECR, Artifact Registry, ACR, GHCR or private
#   image_name: gcp_gcs_load   # optional: defaults to the dag_id
