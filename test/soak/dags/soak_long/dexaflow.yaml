schema_version: "1.0"
dag_id: soak_long
description: "Soak: one long-running task that must outlive the agent-lost threshold without being reaped, with a dependent tail."
owner: soak
tags:
  - soak
  - long
# No python_version: the battery must boot on whatever CPython the box has.
# Pinning one here makes the harness refuse to start on a machine without that
# exact interpreter, which is a portability failure, not a fidelity win: the
# soak measures the scheduler, not the runtime version.
tasks:
  long_task:
    # Well past the 90 s agent-lost threshold and the 60 s pod-lost floor, so a
    # heartbeat regression fails this task instead of hiding behind a short body.
    # The declared timeout is comfortably above the body so the task only fails
    # here when something actually went wrong, never on a slow laptop.
    execution_timeout_seconds: 900
