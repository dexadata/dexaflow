# GoReleaser configuration for Dexaflow pre-alpha releases.
#
# Produces static (CGO-free) binaries for linux/darwin × amd64/arm64, bundles all
# three binaries per platform into a single archive (so install.sh fetches the CLI,
# server, and agent in one download), publishes SHA-256 checksums, an SBOM per
# archive, cosign keyless signatures (the checksums file AND the control-plane
# image manifests), and a control-plane container image on GHCR.
version: 2

project_name: dexaflow

before:
  hooks:
    - go mod tidy

builds:
  - id: dexaflow
    main: ./cmd/dexaflow
    binary: dexaflow
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: &ldflags
      - -s -w
      - -X github.com/dexadata/dexaflow/internal/version.version={{ .Version }}
      - -X github.com/dexadata/dexaflow/internal/version.gitCommit={{ .Commit }}
      - -X github.com/dexadata/dexaflow/internal/version.buildDate={{ .Date }}
  - id: dexaflow-server
    main: ./cmd/dexaflow-server
    binary: dexaflow-server
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: *ldflags
  - id: dexaflow-agent
    main: ./cmd/dexaflow-agent
    binary: dexaflow-agent
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: *ldflags
  - id: dexaflow-mcp
    main: ./cmd/dexaflow-mcp
    binary: dexaflow-mcp
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    # dexaflow-mcp carries its version in `package main` (var version), so it needs
    # the unqualified `main.version` ldflag — the shared *ldflags anchor targets
    # internal/version.* and would leave main.version at its "dev" default.
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

archives:
  - id: dexaflow
    # One archive per platform containing all four binaries; install.sh extracts
    # them and adds the pre-rename leoflow* entry points as links.
    ids: [dexaflow, dexaflow-server, dexaflow-agent, dexaflow-mcp]
    formats: [tar.gz]
    name_template: "dexaflow_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - id: archive
    artifacts: archive

# Cosign keyless signing of the checksums file. Verifying the checksums covers
# every archive listed in it. Requires id-token: write (set in the workflow).
signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
    artifacts: checksum
    output: true

# Control-plane container image (the binary embeds the UI). Built per arch and
# joined into a multi-arch manifest.
dockers:
  # Each per-arch image gets BOTH tag forms — `{{ .Version }}` (no `v`, the
  # GoReleaser default) AND `v{{ .Version }}` (the raw git tag). The migrate
  # workflow already publishes both forms via docker/metadata-action; keeping
  # server symmetric means a chart `--set image.tag=<X>` pin works no matter
  # which convention the operator follows.
  #
  # Signed keyless by the `docker_signs:` block below — both manifest tags, by
  # digest — so the control-plane image the Helm chart deploys carries the same
  # supply-chain posture (ADR 0014) as dexaflow-migrate and dexaflow-runtime, which
  # the release workflow signs in their own jobs.
  - id: server-amd64
    ids: [dexaflow-server]
    goarch: amd64
    dockerfile: deploy/Dockerfile.server.release
    image_templates:
      - "ghcr.io/dexadata/dexaflow-server:{{ .Version }}-amd64"
      - "ghcr.io/dexadata/dexaflow-server:v{{ .Version }}-amd64"
      # Pre-rename name, same image: values files that pin
      # image.repository: .../leoflow-server keep pulling new releases.
      - "ghcr.io/dexadata/leoflow-server:{{ .Version }}-amd64"
      - "ghcr.io/dexadata/leoflow-server:v{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/dexadata/dexaflow"
  - id: server-arm64
    ids: [dexaflow-server]
    goarch: arm64
    dockerfile: deploy/Dockerfile.server.release
    image_templates:
      - "ghcr.io/dexadata/dexaflow-server:{{ .Version }}-arm64"
      - "ghcr.io/dexadata/dexaflow-server:v{{ .Version }}-arm64"
      # Pre-rename name, same image: values files that pin
      # image.repository: .../leoflow-server keep pulling new releases.
      - "ghcr.io/dexadata/leoflow-server:{{ .Version }}-arm64"
      - "ghcr.io/dexadata/leoflow-server:v{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/dexadata/dexaflow"

docker_manifests:
  - name_template: "ghcr.io/dexadata/dexaflow-server:{{ .Version }}"
    image_templates:
      - "ghcr.io/dexadata/dexaflow-server:{{ .Version }}-amd64"
      - "ghcr.io/dexadata/dexaflow-server:{{ .Version }}-arm64"
  # `v`-prefixed manifest pointing at the same per-arch images. Pulls of
  # `:v0.0.1-prealpha.N` and `:0.0.1-prealpha.N` resolve to identical digests.
  - name_template: "ghcr.io/dexadata/dexaflow-server:v{{ .Version }}"
    image_templates:
      - "ghcr.io/dexadata/dexaflow-server:v{{ .Version }}-amd64"
      - "ghcr.io/dexadata/dexaflow-server:v{{ .Version }}-arm64"
  # The same two manifests under the pre-rename image name.
  - name_template: "ghcr.io/dexadata/leoflow-server:{{ .Version }}"
    image_templates:
      - "ghcr.io/dexadata/leoflow-server:{{ .Version }}-amd64"
      - "ghcr.io/dexadata/leoflow-server:{{ .Version }}-arm64"
  - name_template: "ghcr.io/dexadata/leoflow-server:v{{ .Version }}"
    image_templates:
      - "ghcr.io/dexadata/leoflow-server:v{{ .Version }}-amd64"
      - "ghcr.io/dexadata/leoflow-server:v{{ .Version }}-arm64"

# Cosign keyless signing of the control-plane image. `artifacts: manifests`
# signs each multi-arch manifest (`:{{ .Version }}` and `:v{{ .Version }}`) by
# its digest — the reference an operator actually pulls — so both tag shapes are
# covered. GoReleaser resolves the pushed manifest digest and substitutes it for
# ${digest}; `${artifact}@${digest}` therefore signs by digest, never by the
# mutable tag. Requires id-token: write (set in the workflow) for the Sigstore
# OIDC challenge; `--yes` skips cosign's interactive confirmation in CI.
#
# The command is the `scripts/cosign-retry.sh` wrapper rather than `cosign`
# itself: a transient GitHub-OIDC blip once failed a `cosign sign` mid-release
# and drafted an otherwise-good build, so every signature retries with backoff.
# The migrate/runtime workflow steps route through the same wrapper.
docker_signs:
  - id: server
    cmd: ./scripts/cosign-retry.sh
    artifacts: manifests
    args:
      - sign
      - "${artifact}@${digest}"
      - "--yes"
    output: true

release:
  github:
    owner: dexadata
    name: leoflow
  # Pre-alpha tags (v0.x.y-alpha.N) are pre-releases; GoReleaser auto-detects the
  # prerelease suffix, but make it explicit.
  prerelease: auto
  name_template: "{{ .Tag }}"
  # The body is not set here. GoReleaser creates the release, and a workflow
  # step then writes the body with `gh release edit` from
  # scripts/release-notes.sh and reads it back to prove it landed.
  #
  # It WAS handed to GoReleaser as --release-notes, and v0.4.8 shipped with an
  # empty page: the flag was accepted, the notes were correct, and nothing
  # appeared. Rather than chase which pipe consumes the flag under which
  # config, the body is now written by a command whose effect can be read back,
  # and the read-back is what fails the release.
  #
  # It used to be GoReleaser's commit list, and on a GA that list is empty by
  # construction: a GA is cut from its rc, so the only commit between the two
  # tags is the promotion. v0.4.7's page says one line while CHANGELOG.md holds
  # 35 entries for it. The exclude filters were dead too, anchored as `^docs:`
  # against commits that are all scoped (`docs(changelog):`).

changelog:
  # Not generated: the notes come from CHANGELOG.md. The full commit list is a
  # compare link in the footer instead of a filtered copy.
  disable: true
