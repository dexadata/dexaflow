kind: Added
body: |-
  **`dexaflow auth login` signs in with the cluster's single sign-on.** With
  no username or password given, it asks the server whether single sign-on is
  on (`GET /api/v2/auth/methods`) and, when it is, opens the browser on the
  server's own sign-in, or prints the URL with `--no-browser`. The server runs
  the same OIDC flow, tenant pin and role mapping as the UI, then sends the
  browser back to a loopback port the CLI listens on (`127.0.0.1` or `[::1]`
  only) with a one-time code. The CLI exchanges it, with a PKCE (S256)
  verifier only it holds, on `POST /api/v2/auth/cli/token` for the same token
  a password login saves for that server. The code works once and expires
  after 60 seconds, every refusal is the same 400, and the exchange shares
  the rate limit of the OIDC routes. No IdP configuration changes. `--sso`
  asks for single sign-on explicitly and `--timeout` bounds the wait. A
  username or password, or a server without single sign-on, keeps the
  password login. `pkg/client` gains `GetAuthMethods` and
  `ExchangeCLILoginCode`. (#1704)
