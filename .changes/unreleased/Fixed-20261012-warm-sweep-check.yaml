kind: Fixed
body: '**A warm worker that does not confirm the `/tmp` and `/dev/shm` sweep is now reported, and can be refused (#1678).** Under `execution.warm_read_only_root_filesystem` the sweep between attempts is done by the agent in the task image, so a DAG image built on a runtime older than v0.5.1 ran with the read-only root while nothing emptied those paths, and nothing in the server or the worker log said so. The warm worker now states in its registration whether it does the sweep. With the read-only root on, a worker that does not confirm it logs a WARN with `reason=attempt_home_sweep_unconfirmed` and counts in `dexaflow_scheduler_decisions_total{decision_type="warm_worker_sweep_unconfirmed"}`, and keeps serving, since images built on runtimes from v0.5.1 sweep without being able to confirm it. The new `execution.warm_require_attempt_home_sweep` (Helm: `execution.warmRequireAttemptHomeSweep`, default `false`) refuses such a worker instead, so that DAG version''s attempts run on dedicated pods (`decision_type="warm_worker_refused_no_sweep"`). With the read-only root off nothing changes.'
time: 2026-10-12T12:30:00.000000+00:00
