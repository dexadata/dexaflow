kind: Fixed
body: |-
  **Re-running `PUT /api/v2/service/tenants/{tenant}` repairs a drifted role
  ladder.** A tenant the service API created copied the built-in roles'
  permissions from `default` once, and later calls only added grants, so a
  permission removed from a built-in role survived on every other tenant. The
  call now makes each built-in role's grants match its `default` counterpart,
  which also removes a grant added to a built-in role in that tenant by hand;
  put tenant-specific grants on a custom role. Custom roles keep all of their
  permissions. (#1305)
time: 2026-10-04T18:10:00.000000000-03:00
