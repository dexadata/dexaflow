kind: Security
body: |-
  **go-jose is updated to 4.1.6 (CVE-2026-116587).** Earlier versions could
  spend unbounded time parsing a JWK set that contains RSA keys. The server
  parses the key set it downloads from a configured token issuer, such as an
  OIDC identity provider or a CI provider, before it verifies a token.
