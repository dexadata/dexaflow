kind: Changed
body: '**The log view shows why an attempt failed** (#945): when the control plane recorded a failure reason, the attempt''s logs in the UI start with an error-level `Failure reason: ...` line, above the lines the task wrote. Before, the reason reached the UI only for an attempt with no logs at all, so a task that wrote logs and then failed showed its logs without the cause.'
