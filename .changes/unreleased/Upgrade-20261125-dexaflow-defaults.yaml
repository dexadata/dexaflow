kind: Upgrade
body: '**Server defaults use the dexaflow names** (#2155): `executor.task_namespace` defaults to `dexaflow`, `database.url` to `postgres://dexaflow:dexaflow@localhost:5432/dexaflow`, `logs.dir` to `/var/log/dexaflow`, `executor.task_secret_mount_path` to `/etc/dexaflow/secrets`, `executor.agent_path` to `dexaflow-agent`, and the task `User-Agent` to `dexaflow/<server version>`. An install outside the chart that relied on the old task namespace or database URL must pin them before upgrading (`DEXAFLOW_EXECUTOR_TASK_NAMESPACE=leoflow`, `DEXAFLOW_DATABASE_URL`). The old logs directory and agent binary are still used, with a warning, when they are the only ones present, and the task Secret is also mounted at `/etc/leoflow/secrets` while the mount path is the default. See [Upgrading to 0.6.0: server defaults use the dexaflow names](https://dexaflow.dexadata.ai/operate/upgrades/version-notes/#upgrading-to-060-server-defaults-use-the-dexaflow-names).'
time: 2026-11-25T14:20:00.000000+00:00
