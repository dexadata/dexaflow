kind: Security
body: '**`install.sh` verifies the release signature when cosign is installed.** Before, it only checked the archive against `checksums.txt` from the same release, so a tampered release passed. With cosign v2 or later on `PATH`, it now verifies the keyless signature of `checksums.txt` against the exact release workflow and tag (`dexadata/dexaflow`, or `neochaotic/leoflow` for releases before v0.5.0) and refuses to install on any failure. Without cosign it installs as before and prints one line saying the signature was not checked. `DEXAFLOW_INSTALL_REQUIRE_SIGNATURE=1` makes a missing cosign fatal, and `DEXAFLOW_INSTALL_SKIP_SIGNATURE=1` skips the check for a machine that cannot reach Sigstore (both also as `LEOFLOW_*`). The installation docs now give the exact signer identity instead of a pattern that matched any workflow on any ref. (#1563)'
