kind: Fixed
body: '**A warm pool''s GC anchor no longer leaks when its workers were never created.** The reconciler creates a dag_version''s anchor ConfigMap (`leoflow-pool-<dag_version>`) before its warm workers, and only drained versions that still had a warm pod. When every create was refused (an admission policy or webhook on the task namespace, for example) the version had an anchor and no pod, so once it went inactive its anchor stayed forever. The reconciler now also lists the anchors and deletes the one of any version that is neither active nor has a warm pod left; no pod references it, so nothing is cascaded. If the anchors cannot be listed it does nothing that tick and records `warm_pool_anchor_list_error`. The chart's executor Role now grants `list` on ConfigMaps for this; an install with its own RBAC needs the same grant, or the sweep stays off and only that error is recorded. (#1500)'
