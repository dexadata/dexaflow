kind: Fixed
body: |-
  **The browser session is kept renewed while the user works in the UI.**
  `POST /api/v2/auth/token/renew` now accepts the `_token` session cookie via
  candidate tokens and rewrites the refreshed session cookie server-side when
  called same-origin. The served UI shell injects a lightweight session keeper
  script that periodically renews the session and renews when the tab regains
  visibility. `POST /ui/auth/token` accurately reports the remaining TTL from
  JWT claims, the login page displays a distinct service-unavailable message
  during database outages, and in-app deep links are preserved across post-login
  redirects. (#1127)
