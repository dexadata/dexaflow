kind: Fixed
body: '**One connection no key can decrypt no longer empties the connections list.** A connection whose `extra` no configured secret key opens (after a key rotation that dropped the old key, for example) made `GET /api/v2/connections` answer 500 for every connection of the tenant, so the Admin Connections page showed nothing. The list now returns every connection and shows that one with its `extra` masked and `extra_unreadable: true`, logging a warning; reading it alone answers 500 with a message that names the connection and how to recover (add the old key back as a later `DEXAFLOW_SECRET_KEY` entry, or delete the connection and set it again). Variables got the same treatment in 0.5.4. (#1677)'
