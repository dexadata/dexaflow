kind: Added
body: '**Releases carry SLSA build provenance and attested SBOMs.** From this release on, every archive and every image the release workflow pushes (`dexaflow-server`, `dexaflow-mcp`, `dexaflow-migrate`, each `dexaflow-runtime:py3.N-<tag>`, and the `leoflow-*` names sharing their digests) has a GitHub build provenance attestation, checkable with `gh attestation verify ... --repo dexadata/dexaflow`. Each archive''s SPDX SBOM is attested against that archive, each image carries an SPDX SBOM as a cosign attestation (`cosign verify-attestation --type spdxjson`), and the archive provenance is published on the release as `dexaflow_<version>.intoto.jsonl` for offline checks. The installation page shows the commands, and the image signature example now uses the exact signer identity. (#1562)'
time: 2026-10-12T22:45:00.000000+00:00
