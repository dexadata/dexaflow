kind: Fixed
body: '**A task pod that starts too slowly no longer spends a retry on a dead credential.** Under the default env-var agent token transport the attempt credential is minted at dispatch with a 10 minute TTL, and the dispatch-lost reaper deferred on a `Pending` pod however long it waited. A pod still pulling a large image on a freshly provisioned node could start after its credential ran out: the agent was refused at registration, the attempt log stayed empty, and the failure consumed one of the task''s retries (a task with `retries: 0` failed outright). A pod still `Pending` 8 minutes after its task was queued is now failed as `start_expired`, an infra failure the planner re-places with a fresh credential without spending a retry; the pod is deleted and `killed: start_expired ...` is appended to the attempt''s log. A pod already `Running` is left alone, the credential''s TTL is unchanged, and the `exchange` transport, whose credential is minted when the agent starts, is not affected. The server''s startup ladder check now also requires the dispatch-lost threshold to fall inside that start deadline. (#1126)'
