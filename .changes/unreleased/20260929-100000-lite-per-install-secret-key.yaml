kind: Security
body: |-
  **Leoflow Lite no longer encrypts connection passwords with a key published in
  this repository.** Every Lite install shared the same constant, so anyone
  holding a Lite database file read every stored credential in it without work,
  while the documentation said "encrypted at rest" (#486). A database file
  travels far more easily than shell access does: a backup, a synced home
  directory, a support bundle, a resold laptop.

  A new install generates its own key at `leoflow setup` and never accepts the
  published one. An existing install is told plainly what it is exposed to, and
  moves with **`leoflow lite rotate-key`**: one command that re-encrypts every
  stored secret onto a fresh key and records it only after the re-encryption
  succeeded, so an interrupted run leaves the old key working and can be run
  again.

  **`LEOFLOW_SECRET_KEY` accepts a comma-separated list for operators.** The
  first entry encrypts and decrypts, later entries only decrypt, and the control
  plane re-encrypts onto the first entry at startup and reports what it moved.
  Same rule as Airflow's `fernet_key`. This replaces ADR 0019's previous
  position, that a key change invalidates existing ciphertexts and connections
  are re-entered. A row no configured key can open is left untouched and
  reported, never overwritten, and a row another writer changed mid-pass is left
  to that writer.

  **Upgrade note:** because the value is split on commas and trimmed, a raw
  32-character passphrase containing a comma, or with leading or trailing
  whitespace, no longer parses. Hex and base64 keys are unaffected.

  Two ways to lose credentials were closed along the way. `leoflow lite
  reset-password` read the key through the config loader, which overlays
  `LEOFLOW_*` environment variables, and wrote the result back: an operator with
  `LEOFLOW_SECRET_KEY` exported would have had the shell value persisted over
  the real key. And every rewrite of `config.yaml` is now atomic and 0600
  enforced: it previously left an existing world-readable file world-readable
  while adding an encryption key to it, and a crash mid-write could take the
  encryption key, the JWT secret and the admin hash together.
