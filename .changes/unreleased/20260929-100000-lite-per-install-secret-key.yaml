kind: Security
body: |-
  **Leoflow Lite no longer encrypts connection passwords with a key published in
  this repository, and existing installs are migrated off it automatically.**
  Every Lite install shared the same constant, so anyone holding a Lite database
  file read every stored credential in it without work, while the documentation
  said "encrypted at rest" (#486). A database file travels far more easily than
  shell access does: a backup, a synced home directory, a support bundle, a
  resold laptop.

  An install that predates this gets a per-install key on its next start, keeps
  the old one as decrypt-only, and has its stored secrets re-encrypted onto the
  new key at startup. Nothing to run, and nothing orphaned.

  **`LEOFLOW_SECRET_KEY` now accepts a comma-separated list for operators too**:
  the first entry encrypts and decrypts, later entries only decrypt, and the
  control plane re-encrypts onto the first entry at startup and reports how many
  rows it moved. That is the same rule as Airflow's `fernet_key`. It replaces
  the previous advice in ADR 0019, which was that a key change invalidates
  existing ciphertexts and connections are re-entered. A row that no configured
  key can open is left untouched and reported, never overwritten.

  Three ways to lose credentials were closed along the way. `leoflow lite
  reset-password` read the key through the config loader, which overlays
  `LEOFLOW_*` environment variables, and wrote the result back: an operator with
  `LEOFLOW_SECRET_KEY` exported would have had the shell value persisted over
  the real key. `leoflow uninstall` deletes `config.yaml` while preserving the
  datastore, promising in its help text that "a reinstall keeps your data", so
  the key is now preserved with the datastore and adopted by the reinstall. And
  a fresh install no longer accepts the published constant at all, since it
  never wrote anything under it.
