kind: Added
body: '**Pro can run a DAG from its source, with no image build.** With `execution.source_mode.enabled` and a digest-pinned `execution.source_mode.image`, a version whose image is that runtime image runs from the `dag.py` it was registered with: the task pod gets the source in an annotation, projected read only as `dag.py` through a downward API volume, and runs from there. Registering such a version answers `400` when its source is empty or over 128 KiB. Source-mode versions never use warm workers. Off by default; every other version runs as before. See the Source mode operate page. (ADR 0067, #1475)'
time: 2026-10-08T22:00:00.000000+00:00
