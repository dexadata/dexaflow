kind: Added
body: '**Pro can run a DAG from its source, with no image build.** With `execution.source_mode.enabled` and an `execution.source_mode.image` pinned by a full `@sha256:` digest (also read from the legacy `LEOFLOW_EXECUTION_SOURCE_MODE_*` variables), a version whose image is that runtime image runs from the `dag.py` it was registered with: the task pod gets the source in an annotation, projected read only as `dag.py` through a downward API volume, and runs from there. Registering such a version answers `400` when its source is empty or over 128 KiB. A version registered on that image before the mode was turned on is checked again at dispatch, and an attempt over the cap fails once with the same message. The control-plane pod cache drops the source annotation; exclude it in your log shipper too. Source-mode versions never use warm workers. Off by default; every other version runs as before. See the Source mode operate page. (ADR 0067, #1475)'
