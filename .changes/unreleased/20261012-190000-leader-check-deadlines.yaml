kind: Fixed
body: '**A scheduler leader cut off from its database now steps down.** The leadership check and the campaign attempt ran with no deadline on a session with no statement timeout, so when the database host disappeared without a TCP reset (a failover that moved its address, a partition, a lost node) the leader waited on the dead socket for about 15 minutes without stepping down, while a follower on the new primary could take the lock: two schedulers at once. Each check and attempt now runs under a deadline of one check interval (5 s), a check that cannot confirm the lock in time counts as failed, and the leader steps down after 3 of them. The leader session also asks Postgres for TCP keepalives and a 60 s `tcp_user_timeout`, so the server frees the lock of a vanished leader within about a minute instead of about two hours. (#1599)'
