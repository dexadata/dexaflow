kind: Changed
body: |-
  **Failed task pods settle within seconds.** The leader now settles a task
  pod that failed as soon as its pod watch sees it, instead of at the next 30
  second reconcile sweep: an `OOMKilled` container, an eviction or a pod the
  cluster stopped is usually recorded, and retried or re-placed, within
  seconds. The sweep keeps running and settles any event that was missed, the
  change adds no request to the Kubernetes API, each such settle counts as
  `pod_event_settled` in `dexaflow_scheduler_decisions_total`, and
  `executor.pod_event_settle: false` turns it off (#2330).
time: 2026-11-25T18:00:00.000000000+00:00
