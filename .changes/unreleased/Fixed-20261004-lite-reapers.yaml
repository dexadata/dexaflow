kind: Fixed
body: '**Lite now reaps runs whose agent died.** Lite ran no reaper at all, so a run whose agent subprocess died without reporting sat `running` forever. Lite now runs the orphan-run, agent-lost and dispatch-lost reapers every 30 s on the leader, behind the same post-election settling grace as Pro. Agent-lost and dispatch-lost act only once the attempt''s agent process is gone (checked by its recorded PID), so a live agent is never re-placed beside a second one. The task''s own process group counts as well: an agent killed outright leaves its task running, so the agent records the task''s process group and the attempt reads alive while any process of it exists; once the agent is confirmed dead, the reaper stops that orphaned group (SIGTERM, then SIGKILL, only for a group this server recorded and could verify) before it re-places the attempt, so two copies of a task never run on one try. A TI whose agent died after reporting RUNNING but before its first heartbeat is also failed as agent_lost in Lite, once it has run past the agent-lost threshold and only when its agent and task process group are both gone. (#916)'
