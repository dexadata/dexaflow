kind: Fixed
body: '**Lite now reaps runs whose agent died.** Lite ran no reaper at all, so a run whose agent subprocess died without reporting sat `running` forever. Lite now runs the orphan-run, agent-lost and dispatch-lost reapers every 30 s on the leader, behind the same post-election settling grace as Pro. Agent-lost and dispatch-lost act only once the attempt''s agent process is gone (checked by its recorded PID), so a live agent is never re-placed beside a second one. (#916)'
time: 2026-10-04T15:00:00.000000+00:00
