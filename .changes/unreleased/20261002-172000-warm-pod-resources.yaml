kind: Fixed
body: |-
  **Warm worker pods are sized and placed like the dedicated pods they stand in
  for.** Warm pods used to be created with no requests or limits, even when
  `executor.defaults.resources_cpu` / `resources_memory` were set, and a task
  placed on one silently lost its own `execution` placement (node selector,
  tolerations, affinity, topology spread, priority or runtime class, resource
  claims, labels, annotations) and its own resources. Warm pods now carry the
  platform default resources as request and limit, or
  `execution.warm_pod_resources_cpu` / `warm_pod_resources_memory` (Helm:
  `execution.warmPodResources`) when set. A task that declares any placement, or
  resources the warm pod does not cover, now runs on a dedicated pod instead.
  Only warm pools are affected.
time: 2026-10-02T17:20:00.000000000-03:00
