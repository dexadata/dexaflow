kind: Added
body: '**Chart values for SSO sign-out** (#1165, ADR 0110): `auth.oidc.logout` (`idp` by default, or `local`) and `auth.oidc.postLogoutRedirectUrl` render `DEXAFLOW_AUTH_OIDC_LOGOUT` and `DEXAFLOW_AUTH_OIDC_POST_LOGOUT_REDIRECT_URL` while `auth.oidc.enabled` is on. Any other `logout` value is refused at render.'
