kind: Security
body: |-
  **Built with Go 1.26.9 and golang.org/x/net v0.60.0.** Go 1.26.6 and x/net v0.58.0 carry denial-of-service fixes in `net/http` and HTTP/2 handling published after v0.5.2 (GO-2026-5932, GO-2026-6599, GO-2026-6600, GO-2026-6603 to GO-2026-6605, GO-2026-6607 to GO-2026-6613, GO-2026-6617). The server, agent, CLI and images are rebuilt with the patched toolchain and module.
time: 2026-10-09T13:00:00.000000+00:00
