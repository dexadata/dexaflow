kind: Fixed
body: '**The control plane now says why it refused an agent''s credential.** An agent RPC refused for its bearer was answered `Unauthenticated` with no server-side trace, so an attempt whose credential had lapsed was later reaped as `agent_lost` and read as a network fault. Every refusal now writes a WARN line, `rejected agent bearer token`, with a `reason` (`expired`, `wrong_audience`, `bad_signature`, `wrong_issuer`, `not_yet_valid`, `malformed`, `invalid` or `missing`), the RPC and the caller''s address; for an expired credential it also names the attempt (`ti`, `run`, `task`, `try`, `epoch`) and when it lapsed. The token is never logged. The line is rate limited to ten per reason per minute, and the new counter `dexaflow_agent_token_rejections_total{reason}` counts every refusal. (#1125)'
