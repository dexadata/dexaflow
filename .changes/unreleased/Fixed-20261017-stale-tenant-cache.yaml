kind: Fixed
body: |-
  **Tenant writes now recover from stale cached tenant IDs on recreate or restore.**
  When a tenant is deleted and recreated or the database is restored while the
  server is running, writes that encounter a foreign-key constraint violation
  against `tenants` (SQLSTATE 23503) drop the stale cached tenant ID and retry
  once with the refreshed ID. In addition, `DeleteTenant` now explicitly
  invalidates the tenant cache in the running process. (#1614)
