kind: Security
body: |-
  **Leoflow Lite no longer encrypts connection passwords with a key published
  in this repository.** Every Lite install shared the same constant, so anyone
  holding a Lite database file read every stored credential in it without work,
  while the documentation said "encrypted at rest" (#486). A database file
  travels far more easily than shell access does: a backup, a synced home
  directory, a support bundle, a resold laptop.

  `leoflow setup` now generates a random per-install key and persists it beside
  the per-install JWT secret, so a reinstall rotates it.

  Rotating a key cannot orphan what the old one wrote, so the server accepts a
  read-only `LEOFLOW_SECRET_KEY_FALLBACK`. Values it opens are readable exactly
  as before, and nothing is ever written under it. Lite sets it to the old
  constant automatically. Trying two keys is safe only because AES-GCM is
  authenticated: a wrong key fails to open rather than returning plausible
  garbage.

  `leoflow lite reset-password` rewrites `config.yaml`, and now carries the key
  forward. Dropping it would have left the next boot falling back to the
  published constant while the rows were encrypted under the real key, turning
  a password reset into unreadable credentials.

  **An install created before this keeps its existing key and behaviour.**
  Migrating those rows onto a per-install key, so the published constant can be
  deleted, is the remaining half of #486.
