kind: Changed
body: '**SSO sign-out ends the identity provider session** (#1165, ADR 0110): under `auth.provider: oidc`, sign-out now sends the browser to the issuer''s `end_session_endpoint` with the login''s ID token as `id_token_hint`, so the sign-in button no longer signs the user straight back in. The ID token is kept in an HttpOnly cookie scoped to the sign-out route. `auth.oidc.post_logout_redirect_url` sets where the IdP returns the browser, and `auth.oidc.logout: local` keeps the local-only sign-out. An issuer that publishes no `end_session_endpoint` (Google, Cognito) keeps the local sign-out, with a warning at boot. See [Upgrading to 0.6.0: SSO sign-out ends the identity provider session](https://dexaflow.dexadata.ai/operate/upgrades/version-notes/#upgrading-to-060-sso-sign-out-ends-the-identity-provider-session).'
