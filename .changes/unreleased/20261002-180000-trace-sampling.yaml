kind: Added
body: |-
  Trace sampling is configurable. `observability.otel.sample_ratio` (default `1`, every request traced) keeps a share of new root traces and follows the parent's decision for requests inside a sampled trace, and `observability.otel.skip_probe_spans` (default `false`) stops recording spans for `/healthz`, `/readyz` and `/static/*`. Both also read the legacy `LEOFLOW_*` names.
