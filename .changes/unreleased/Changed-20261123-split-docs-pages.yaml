body: '**The CI/CD and upgrade guides are split into shorter pages** (#2152): "CI/CD & deploy" keeps the deploy itself and gains pages for change, rollback and promotion, credentials and the CLI in CI, the `dexaflow ci init` pipelines, and the Argo, Tekton, Jenkins, buildah and kaniko recipes; "Upgrades" keeps the procedure and moves the per-release notes to "Version notes". Old links, including links to a moved section, land on the page that now holds it.'
