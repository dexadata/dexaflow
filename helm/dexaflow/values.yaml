# Default values for the Leoflow control plane chart.

image:
  # -- Control-plane image. Published by GoReleaser on every tag, signed with cosign.
  repository: ghcr.io/dexadata/dexaflow-server
  # -- Image tag. Defaults to `.Chart.appVersion` when empty; to pin a specific release set `--set image.tag=v0.4.0-rc.2` (the `v`-prefix and no-`v` forms are both published and resolve to the same digest, so either works).
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# -- Number of control-plane replicas. The scheduler leader-elects (ADR 0009), so `>1` is HA-safe (active-passive scheduler, active-active API) and is the recommended production posture: a single replica evicted by consolidation, a drain, or a node upgrade costs a full restart (image pull + boot + leadership, tens of seconds) during which nothing dispatches; a standby replica turns that into seconds of failover. The shipped default stays `1` because HA needs a log store every replica can write — see `logs.persistence.accessMode` / `logs.sink` — and the chart refuses to render `>1` onto the default single-writer PVC. `examples/values-ha.yaml` is the one-file HA profile.
replicaCount: 1

# -- Pod `terminationGracePeriodSeconds` for the control plane. Empty (default) omits the field: Kubernetes applies its own 30s, a default install's pod spec is unchanged, and no downtime is added to a single-replica `Recreate` upgrade (a chart default would). An explicit `0` and an explicit `null` are treated the same as empty — the field is omitted and **Kubernetes' 30s applies**. The chart deliberately does NOT render a literal `0`: that means SIGKILL with no grace at all, so nothing drains — in-flight HTTP requests are cut, the dispatch pool never settles (task instances are left stuck `queued`), open agent log streams are never flushed, and any `deployment.preStopSleepSeconds` becomes unsatisfiable. If you truly want no grace, set it on the pod spec yourself; the chart's `0` means "the Kubernetes default applies". A voluntary eviction sends SIGTERM and waits this long before SIGKILL. What the grace buys is headroom for the HTTP shutdown (in-flight requests get up to 10s) and the dispatch-pool drain (in-flight dispatches settle instead of leaving task instances stuck `queued`). It does NOT decide leadership handoff — the scheduler lease is released within a tick of SIGTERM and frees anyway when the connection drops. With tasks running, open agent log streams are closed and flushed at SIGTERM and the gRPC stop is bounded (5s, then forced), so the shutdown completes within the default 30s instead of being SIGKILLed. `deployment.preStopSleepSeconds` runs INSIDE this grace and ahead of everything above, so count it in the budget. The HA profile sets `60` for drain headroom under load.
terminationGracePeriodSeconds: ""

# -- Pod `topologySpreadConstraints` for the control plane (standard K8s schema), rendered on every control-plane Deployment. A constraint that omits `labelSelector` gets the Deployment's own selector labels, so a values file need not know the release name or role. Empty by default. Set for HA: consolidation bin-packs both replicas onto one node unless told otherwise, and two replicas on one node are one replica — a node failure takes the whole control plane, and the PDB then blocks that node's drain. Use `whenUnsatisfiable: ScheduleAnyway`, not `DoNotSchedule`: the latter leaves the second replica Pending on a single-node cluster, where the PDB then blocks every drain.
topologySpreadConstraints: []

# Control-plane Deployment shape.
deployment:
  # -- Update strategy: `RollingUpdate`, `Recreate`, or `""` (auto). Auto picks `Recreate` when `logs.persistence` is a ReadWriteOnce/ReadWriteOncePod PVC — a RollingUpdate surges a second pod that Multi-Attach-deadlocks on the single-writer volume and the rollout never converges (#868/#282) — and `RollingUpdate` otherwise (RWX or ephemeral emptyDir). Set explicitly to override, EXCEPT that an explicit `RollingUpdate` over a single-writer logs PVC now fails the render: an override defeated the auto-selection and walked back into the same deadlock, with no second pod to serve while the rollout was wedged. The value is an allowlist of those three, trimmed first: any other spelling fails the render, because it used to be rendered verbatim into `spec.strategy.type` and compared exactly — so a lowercase `rollingupdate` skipped both the refusal and the auto-selection and the apiserver rejected the install, while `RollingUpdate ` with a trailing space skipped the refusal and the apiserver ACCEPTED it, delivering the deadlock the refusal exists to prevent.
  strategy: ""

  # -- Seconds the control-plane container sleeps in its `lifecycle.preStop` hook before the process is signalled. `0` (default) omits the `lifecycle` block entirely. Endpoint removal is asynchronous: a terminating replica stays in kube-proxy's and every client's endpoint set for a propagation window, so task pods keep opening NEW agent log streams against a control plane that is already shutting down — and each one creates an empty log object for an attempt whose lines then have nowhere to land. This sleep spends the propagation window before SIGTERM, so those streams land on a replica that will still be alive to flush them. It uses the native `sleep` hook action rather than `exec`, because the image is distroless and has no shell. That action is gated on `PodLifecycleSleepAction`, which is beta and on by default from Kubernetes **1.30** and alpha and **off** in 1.29 (absent before that): below 1.30 the apiserver nils the field and its own validation then rejects the resulting empty `preStop: {}` with "must specify a handler type", which fails the install rather than dropping the hook. The chart therefore renders the hook only on 1.30+ and omits it below, so a 1.27-1.29 install still works — without the sleep, and the install notes say so rather than leaving the omit silent. Two limits of a version test, both real: a **helm 3** client rendering through `helm template | kubectl apply` defaults its capabilities to v1.20.0 and so omits the hook even against a 1.31 cluster — `helm install`/`helm upgrade` and Argo CD/Flux resolve the cluster's real capabilities, so the blessed paths are correct and the direction of failure is the safe one (a missing optimization, never a rejected install). And the version test is a proxy for a feature gate, not the gate itself: a self-managed 1.30+ apiserver started with `--feature-gates=PodLifecycleSleepAction=false` renders the hook and has the Deployment rejected exactly as before this gate existed, because nothing in discovery reports gate state. It runs INSIDE `terminationGracePeriodSeconds` and ahead of the drain, so it adds to the shutdown budget — count it when sizing the grace. Kubernetes validates the sleep as `0 < seconds <= terminationGracePeriodSeconds` and rejects a sleep ABOVE the grace, so the chart refuses to render one that does not fit the effective grace — 30 when `terminationGracePeriodSeconds` is left unset, nil or `0`, because the renderer omits the field on all three and Kubernetes' own default is then what the pod gets. The chart draws its line one step tighter than upstream draws it: a sleep EQUAL to the grace is a spec the apiserver accepts, but it leaves zero budget for the shutdown that runs after the sleep, so the chart refuses that too and says which of the two rules it is applying. Off by default, because a replica the streams can move TO is what makes it worth anything, and neither shipped topology has one: `replicaCount` is 1, an RWO logs PVC auto-selects the `Recreate` strategy, and in split mode the agent gRPC lives on the scheduler side, whose Deployment is pinned to a single replica. On those the sleep buys nothing **for agent log streams** and adds its own seconds of downtime to every upgrade — the same reason `terminationGracePeriodSeconds` ships empty. That is the scheduler-side singleton case, not the whole story: the hook renders on BOTH split Deployments on purpose, and on the api side with `split.api.replicaCount` > 1 the same sleep spends the same endpoint-propagation window for HTTP and UI requests, where a second endpoint really is there to take them. Set it (5 is a sensible start, and `examples/values-ha.yaml` ships that) once a second replica is serving agent gRPC. Note what it does NOT do: an already-established gRPC connection is pinned by conntrack and gets `Unavailable` at SIGTERM regardless of any sleep — only streams not yet opened are moved — and 5s is at the low end when a service-mesh sidecar is in the path.
  preStopSleepSeconds: 0

# ADR 0049 — split the control plane into two Deployments by role. OFF by default:
# the chart renders a single `all`-role Deployment that is byte-identical to the
# pre-0049 monolith, so existing installs upgrade in place with no topology change.
# Turn it on for enterprise scale: the API (HTTP + UI) becomes its own active-active
# Deployment with a RESTRICTED identity (no pod-create / apiserver RBAC), and the
# scheduler (reconciler + dispatch + agent gRPC) becomes a single-leader Deployment
# that keeps the privileged identity. The security payoff is that a compromised or
# SSRF'd API cannot reach the apiserver — see ADR 0048/0049.
split:
  # -- Render separate `api` and `scheduler` Deployments instead of one `all` Deployment. Pro-only (Lite is single-host and never splits).
  enabled: false
  api:
    # -- API Deployment replicas (active-active; HPA-friendly). Ignored unless split.enabled.
    replicaCount: 2
  scheduler:
    # -- Scheduler Deployment replicas. Pinned to 1 by the chart regardless of this value — the scheduler is a single leader (ADR 0009); a field is kept only for clarity. Ignored unless split.enabled.
    replicaCount: 1

# -- Namespace where the control plane creates task pods + per-run staging PVCs.
# The chart wires this into both the executor RBAC (Role/RoleBinding) AND the
# server (LEOFLOW_EXECUTOR_TASK_NAMESPACE), so the server acts on exactly the
# namespace it is granted — override it freely (#480).
taskNamespace: leoflow

# ServiceAccount that TASK pods run as (distinct from the control-plane
# serviceAccount above). On GKE, annotate it for Workload Identity so tasks reach
# GCP keylessly — the google_cloud_platform connector's recommended auth (ADR
# 0035). Reference it per-task via `execution.service_account: <name>` in
# leoflow.yaml. Created in `taskNamespace`.
taskServiceAccount:
  # -- Create a ServiceAccount in taskNamespace for task pods to run as. When true,
  # task pods DEFAULT to this ServiceAccount (no per-DAG `execution.service_account`
  # needed) — so keyless secret access works out of the box; a DAG may still set
  # `execution.service_account` to override per task. NOTE: the auto-default is wired
  # only when `create: true`. If you bring your own pre-existing SA (`create: false`
  # + `name:`), task pods do NOT auto-default to it — reference it per-DAG via
  # `execution.service_account: <name>` (which always works), or let the chart both
  # create and default to it with `create: true`.
  create: false
  # -- Name of the task ServiceAccount. With `create: true` it becomes the default
  # task-pod SA; you can also reference it explicitly as `execution.service_account`.
  name: leoflow-task
  # -- Annotations. GKE Workload Identity: `iam.gke.io/gcp-service-account: GSA@PROJECT.iam.gserviceaccount.com`. EKS IRSA: `eks.amazonaws.com/role-arn: ...`.
  annotations: {}
  # -- Pull secrets for private DAG images. Kubernetes auto-injects these into
  # every task pod that runs as this SA, so a `leoflow deploy` to a private
  # registry can be pulled (ADR 0041). Reference an existing docker-registry
  # secret, e.g. `[{name: regcred}]`.
  imagePullSecrets: []

serviceAccount:
  # -- Create a dedicated ServiceAccount for the leoflow-server. Set `false` only if you bring your own via `name`.
  create: true
  # -- Override the ServiceAccount name. Defaults to the chart fullname when empty.
  name: ""
  # -- ServiceAccount annotations, the usual home of a cloud-identity binding for the object log sink: IRSA on EKS (`eks.amazonaws.com/role-arn`), Workload Identity on GKE (`iam.gke.io/gcp-service-account`). EKS **Pod Identity** — AWS's current recommendation — needs no annotation at all: leave this empty and create a Pod Identity association against the ServiceAccount instead. In split mode this one value is rendered onto BOTH ServiceAccounts, and both need the identity (the scheduler writes task logs, any api replica reads them back).
  annotations: {}

rbac:
  # -- Create the Role + RoleBinding the pod-per-task executor needs in `taskNamespace`: create/get/list/watch/delete on pods, get on pods/log, create/delete on persistentvolumeclaims for the per-run staging volume (ADR 0022), and create/get/delete on configmaps for the warm-pool GC anchor (ADR 0058 D11). Additionally, when `auth.agentTokenTransport` is `exchange`, a ClusterRole + ClusterRoleBinding granting `create` on `authentication.k8s.io/tokenreviews` — cluster-scoped because the TokenReview API is, and the only cluster-scoped objects this chart creates. The grant is checked against the code's actual API calls by `scripts/rbac-covers-executor.sh` in CI, so this list cannot silently fall behind the code again. Set `false` only if you bring your own Role — and then that check does not protect you.
  create: true

# Hardening applied to the pods that run task code. Task images come from DAG
# authors, so this is the boundary between the platform and code it does not
# control. Every task pod always gets the protections that cost nothing — no
# privilege escalation, all capabilities dropped, RuntimeDefault seccomp, and no
# ServiceAccount token. The switch below adds the one that depends on the image.
# Both are cluster-operator decisions on purpose: they are not exposed in the DAG
# spec, so an author cannot elevate their own task.
taskPodSecurity:
  # -- Refuse to start a task container whose image runs as UID 0. This completes Pod Security Admission's `restricted` set, so a `restricted` namespace will admit your task pods. On by default: the runtime base image runs as the numeric non-root UID 65532 (`USER 65532:65532`, the distroless `nonroot` UID) and the `examples/` images inherit it, and the executor pairs it with a pod-level `fsGroup` so the per-run staging PVC stays writable. **This default changed from `false` to `true`** — a fleet whose task images legitimately run as root must set this to `false` (or rebuild those images non-root), else every such task pod fails to start with `CreateContainerConfigError` ("container has runAsNonRoot and image will run as root"). This is a cluster-wide switch by design: pod security is not a per-DAG setting, so a DAG author cannot elevate their own task.
  runAsNonRoot: true
  # -- Mount every task container's root filesystem read-only. Off by default deliberately: `restricted` does not require it, and it breaks ordinary Python tasks that write to `/tmp`, the pip cache, or a matplotlib config dir. Turn it on for a fleet of tasks known to write only to their mounted volumes.
  readOnlyRootFilesystem: false

# Lowest-precedence (L0) per-cluster task defaults (ADR 0023). Applied at dispatch
# only where a task/DAG left the value empty; a DAG that pins its own resources
# always wins, keeping the dag.json artifact portable across clusters.
executor:
  defaults:
    # -- Default CPU **and** memory for a task that declares none of its own. Set
    # BOTH: the control plane applies each value as its own request AND limit, and
    # Kubernetes grants Guaranteed QoS (least likely to be throttled/evicted under
    # node pressure) only when requests == limits for cpu AND memory. Setting just
    # one lands the task in **Burstable** with NO request or limit at all on the
    # other dimension — nothing else fills it in — and the control plane logs a boot
    # WARN naming the missing key (#802). Empty (default) leaves tasks with no
    # platform resource floor, i.e. BestEffort QoS unless the DAG sets its own
    # (#725). Kubernetes quantities.
    resources:
      # -- Default CPU request+limit (e.g. `250m`, `1`). Empty = unset. Set together with `memory`.
      cpu: ""
      # -- Default memory request+limit (e.g. `256Mi`, `1Gi`). Empty = unset. Set together with `cpu`.
      memory: ""
    # -- Default size + StorageClass for the per-run staging volume when the DAG
    # enabled staging without pinning them (#743). Env-only override path: the
    # chart mounts no server config file, so these render as LEOFLOW_* env. Empty
    # leaves the PVC on the cluster's default StorageClass and an unset size.
    staging:
      # -- Default staging PVC size (e.g. `10Gi`). Empty = unset.
      size: ""
      # -- Default staging PVC StorageClass (e.g. the cluster's RWX class). Empty = cluster default.
      storageClass: ""

# -- Ports the leoflow-server listens on. http: API + UI, metrics: Prometheus
# /metrics, grpc: agent ↔ control plane channel (task pods dial back here).
ports:
  http: 8080
  metrics: 9090
  grpc: 9091

service:
  # -- Service type. `ClusterIP` for internal-only; `LoadBalancer` to expose externally; `NodePort` for k3d/kind.
  type: ClusterIP
  # -- Service annotations (e.g. cloud LB controller hints, ExternalDNS).
  annotations: {}

# config maps to LEOFLOW_* env. Non-secret settings live here; secrets below.
ui:
  # -- How often the bundled SPA re-polls DAG, run and task-instance state, in seconds. Empty uses the server's production-safe default of 30s. It is POLLING, so this multiplies request and query load by the number of open browser tabs, not by the number of users: 5s is thirty tabs' worth of traffic at 30s, and 1s is what `leoflow lite` uses precisely because Lite is one person against a local database. Lower it when operators watch runs progress and the metadata database has room; the honest way to choose is to measure one refresh cycle against your own DAG count rather than to copy Lite (#1196). A zero or negative value is not an error and not a fast refresh: the server falls back to 30s, deliberately, so a misconfigured variable cannot drop the interval to 0 and hammer the database.
  autoRefreshIntervalSeconds: ""

config:
  # -- Directory inside the pod where task logs are written. Mounted from `logs.persistence` (a PVC by default) so logs survive pod restarts. Set `logs.persistence.enabled: false` to fall back to an ephemeral emptyDir (dev only).
  logsDir: /var/log/leoflow
  scheduler:
    # -- Run the scheduler loop. Disable only for read-only API-only replicas (rare).
    enabled: true
    # -- Scheduler loop interval in milliseconds. Lower = faster reactivity, higher CPU. 1000ms is the production-tested default.
    loopIntervalMs: 1000
  cors:
    # -- CORS origins the API accepts (`server.cors.allowed_origins`). Leoflow serves its UI same-origin with the API, so most deployments need no entry here. Empty (the default) renders nothing and leaves the server's own default in place, which is what every install has actually been running: this key was documented but read by no template until #1144, so whatever was set here was silently ignored. It now takes effect, so check the value you have. The previous documented default of `["*"]` is not restored and is now rejected at render time, because rendering it would have widened CORS to every origin on the next `helm upgrade` for anyone who only ever copied it out of this file; set `LEOFLOW_SERVER_CORS_ALLOWED_ORIGINS` through `extraEnv` if you want the wildcard deliberately. Rendered as a comma-joined `LEOFLOW_SERVER_CORS_ALLOWED_ORIGINS`, which viper splits back into a list.
    allowedOrigins: []
  # -- Proxy IPs/CIDRs whose `X-Forwarded-For` the server honors when resolving the client IP (`server.trusted_proxies`). Empty (default) trusts NO proxy, so a spoofed XFF cannot forge the client IP. Behind an ingress this MUST be set to the ingress/pod CIDR, otherwise every request is attributed to the ingress IP and the per-IP login rate-limit locks out the whole deployment on a few bad logins (#725). Rendered as a comma-joined `LEOFLOW_SERVER_TRUSTED_PROXIES` env var, which viper splits into a list.
  trustedProxies: []
  # -- gRPC address task pods dial back to reach the control plane. Defaults to the in-cluster Service DNS on `ports.grpc` when empty. Override for cross-cluster or external task pods.
  agentControlPlaneAddr: ""

# Persistent log storage for the control plane (#227 — Pro alpha).
# Task pods stream logs over gRPC to the control plane, which writes them under
# `config.logsDir`. By default this directory lives on a PVC so logs survive
# pod restarts. For multi-replica HA the log store must be writable by every
# replica: the recommended path is the object-store sink below with
# `persistence.enabled: false` (no PVC at all); the alternative is `accessMode:
# ReadWriteMany` on a storage class that supports it (EFS, GCP Filestore, Azure
# Files, NFS, CephFS, Longhorn-rwx). A ReadWriteOnce / ReadWriteOncePod PVC
# attaches to one node / one pod, so a second replica hangs in ContainerCreating
# on a Multi-Attach error — the chart refuses to render that combination. When
# you do not need durable logs (dev / throwaway clusters), set `enabled: false`
# with the `disk` sink to use an emptyDir instead — logs vanish on pod restart.
logs:
  persistence:
    # -- Persist control-plane logs in a PVC (default ON). Disable for the object-store sink (HA — the bucket owns durability) or for an ephemeral emptyDir (dev only — logs lost on pod restart, and per-pod at `replicaCount > 1`).
    enabled: true
    # -- PVC size for control-plane logs. ~1 GB/day per ~1000 active task runs is a sane starting point.
    size: 50Gi
    # -- StorageClass for the PVC. Empty uses the cluster default. Specify an RWX class when `accessMode: ReadWriteMany`.
    storageClass: ""
    # -- PVC access mode — one of `ReadWriteOnce`, `ReadWriteMany`, `ReadWriteOncePod`; any other value (a typo, an empty string, or `ReadOnlyMany`, which the log-writing control plane cannot use) FAILS the render, because an unrecognized mode used to skip both the single-writer refusal and the `Recreate` auto-selection and fail at the apiserver instead. `ReadWriteOnce` (default) is fine for single-replica deployments. At `replicaCount > 1` (or an HPA / split with more than one mounter) the chart FAILS the render on `ReadWriteOnce` / `ReadWriteOncePod` — a single-writer volume Multi-Attach-deadlocks the extra pods silently — so HA needs either `ReadWriteMany` here or `persistence.enabled: false` + the object-store `sink`. Also drives `deployment.strategy`: an RWO/RWOP PVC auto-selects `Recreate` (a rolling upgrade would Multi-Attach-deadlock).
    accessMode: ReadWriteOnce
  # Object-store log backend (opt-in). Set `sink.provider` to `s3` or `gcs` and task
  # logs ship to a bucket instead of the PVC — `s3` for AWS S3 / MinIO / Ceph RGW,
  # `gcs` for Google Cloud Storage (native SDK, not S3 interop). This removes the
  # need for an RWX log PVC at `replicaCount > 1`: set `logs.persistence.enabled:
  # false` and let the bucket own durability. Auth is keyless-first (ADR 0035/0056):
  # bind THIS control-plane ServiceAccount to a cloud identity — IRSA
  # (`serviceAccount.annotations`: `eks.amazonaws.com/role-arn`) or EKS Pod Identity
  # (no annotation; create a Pod Identity association against the ServiceAccount)
  # for `s3`, Workload Identity (`iam.gke.io/gcp-service-account`) for `gcs` — and
  # leave the credential fields empty. In split mode the annotations land on BOTH
  # ServiceAccounts and both need the identity: the scheduler writes task logs and
  # any api replica reads them back. Retention is owned by the bucket's lifecycle policy,
  # not the in-cluster log janitor.
  sink:
    # -- Durable task-log backend: `disk` (default — the PVC above), `s3` (AWS S3, MinIO, Ceph RGW), or `gcs` (Google Cloud Storage). Object storage is opt-in; `disk` leaves the on-disk path unchanged.
    provider: disk
    # -- Target bucket. Required when `provider` is `s3` or `gcs`.
    bucket: ""
    # -- Optional key prefix under which attempt objects are laid out (`{prefix}/{tenant}/{dag}/{run}/{task}/{try}.log`).
    prefix: ""
    # -- [s3] Store region (e.g. `us-east-1`). Required by AWS S3; ignored by some S3-compatible stores.
    region: ""
    # -- [s3] Endpoint override for S3-compatible stores (MinIO, Ceph RGW). Empty uses the AWS default. NOT the way to reach GCS — use `provider: gcs`.
    endpoint: ""
    # -- [s3] Use path-style addressing (bucket in the path, not the host). Required by MinIO and some S3-compatible stores.
    forcePathStyle: false
    # -- [s3] Name of a Secret with keys `accessKeyId` and `secretAccessKey` for static credentials. Discouraged — prefer keyless (IRSA). Empty (recommended) uses the ambient credential chain. (For `gcs`, use keyless Workload Identity — the discouraged file escape hatch is a config-level `logs.sink.credentials_file`.)
    existingSecret: ""

# Database (Postgres). Provide an external URL, or a pre-existing secret.
database:
  # -- External Postgres DSN. Required for Pro (the embedded datastore is Lite-only); the chart `fail`s the install if neither this nor `existingSecret` is set. Example: `postgres://user:pass@host:5432/leoflow?sslmode=disable`.
  url: ""
  # -- Name of a Secret with key `databaseUrl` (takes precedence over `url`).
  existingSecret: ""
  # -- Name of a ConfigMap with key `ca.crt` holding the managed-Postgres CA bundle (#315). When set, the chart mounts it at `/etc/leoflow/db-ca/ca.crt` — in the control plane **and in the pre-install migration Job** (#1052), which reads the same DSN — so the operator can pin `sslmode=verify-full&sslrootcert=/etc/leoflow/db-ca/ca.crt` in the DSN. Empty (default) means TLS still works via `sslmode=require`, but the server cert is NOT verified — the connection is encrypted but MITM-vulnerable, the standard managed-DB posture before this knob.
  caConfigMap: ""
  # -- Max concurrent open DB connections (Postgres-side load gate). Increase for high-throughput Pro deployments.
  maxOpenConns: 20
  # -- Max idle DB connections kept in the pool. Should be ≤ `maxOpenConns`.
  maxIdleConns: 5

# Redis (XCom + locks).
redis:
  # -- External Redis URI. Required for Pro (the embedded XCom is Lite-only). Example: `redis://host:6379/0`, or `rediss://host:6380/0` for TLS.
  url: ""
  # -- Name of a Secret with key `redisUrl` (takes precedence over `url`).
  existingSecret: ""
  # -- Name of a ConfigMap with a `ca.crt` key containing the PEM CA bundle the client trusts when negotiating TLS to a `rediss://` URL (#312). Required when the managed-Redis server cert is signed by a provider / per-instance CA that is not in the system roots — Memorystore SERVER_AUTHENTICATION, ElastiCache in-transit encryption, Azure Cache for Redis. Mounted read-only at `/etc/leoflow/redis-ca` and exposed to the server via `LEOFLOW_REDIS_CA_FILE`. Leave empty when Redis uses a public CA or no TLS.
  caConfigMap: ""

auth:
  # -- HMAC secret signing API + agent JWTs. Set inline OR reference an existing Secret via `existingSecret`. Generate with `openssl rand -base64 64`.
  jwtSecret: ""
  # -- Name of a Secret with key `jwtSecret` (takes precedence over `jwtSecret`).
  existingSecret: ""
  # -- API + agent JWT lifetime in seconds. Default 1h; raise for longer agent sessions.
  tokenTtlSeconds: 3600
  # Trusted-issuer handoff (#1284): a platform that already signs its users in
  # opens a UI session for them by posting a short-lived token its own issuer
  # signed to POST /api/v2/auth/session. Leoflow verifies it against the
  # issuer's public JWKS and signs in the existing user linked to the token's
  # subject; it never creates users or grants roles. Off until `issuer` is set.
  trustedIssuer:
    # -- The exact `iss` of the issuer's tokens. Empty (the default) disables the handoff and renders none of these keys.
    issuer: ""
    # -- Name of the issuer, 1-40 lowercase letters, digits or `-`. Users are linked under `issuer:<name>`, so keep it stable once users exist.
    name: ""
    # -- Where the issuer publishes its public signing keys. `https`, or `http` on a loopback host.
    jwksUrl: ""
    # -- The `aud` the tokens must carry for this Leoflow.
    audience: ""
    # -- The string claim naming the Leoflow tenant.
    tenantClaim: tenant_id
    # -- Tenants the issuer may sign in to; `["*"]` allows every tenant. Required when `issuer` is set.
    allowedTenants: []
    # -- Longest `exp - iat` a handoff token may have. `0` uses 900 seconds; at most 3600.
    maxLifetimeSeconds: 0
    # -- Origins (`scheme://host[:port]`, no path) whose pages may post a handoff, typically your portal. Any other `Origin`, or none, is refused, so another site cannot sign a visitor in as someone else. Required when `issuer` is set.
    allowedOrigins: []
  # How the in-pod agent obtains its control-plane credential, whether secret
  # delivery is bound to task-instance liveness, and what a task is allowed to
  # fetch (ADR 0055). All three ship on the value that is byte-for-byte today's
  # behavior, and all three are stamped into the pod env even at their defaults,
  # so the chart — not an out-of-band `kubectl set env` that a `helm upgrade`
  # would never notice — is their source of truth. For the first two that is a
  # security coupling (ADR 0058 D2 rests on them); for `secretScoping` it is
  # discoverability: it decides whether a task receives the whole tenant vault,
  # so the file an operator reads has to show it and its default (#803).
  # -- Agent credential transport: `envvar` (default) puts the task-scoped bearer in a plaintext `LEOFLOW_AGENT_TOKEN` env var on the Pod object; `exchange` mounts a projected ServiceAccount token that the agent trades once — via a control-plane TokenReview — for the task-scoped JWT, so no bearer sits in plaintext on the pod spec. `exchange` needs the cluster-scoped TokenReview grant the chart renders with it (`rbac.create`), and is a hard prerequisite of `execution.warmPoolsEnabled` (ADR 0058 D2). Server-wide: switching it changes how EVERY task pod authenticates, warm or dedicated.
  agentTokenTransport: envvar
  # -- Secret-delivery liveness gate: `observe` (default) logs and audits a would-have-denied when the calling task instance is no longer live but still delivers the secrets; `enforce` denies. Required at `enforce` by `execution.warmPoolsEnabled` (ADR 0058 D2) — a reused pod's superseded attempt would otherwise still resolve secrets. Run `observe` first and read the audit trail before flipping.
  secretLivenessMode: observe
  # -- Scope-by-declaration policy for secret delivery: `permissive` (default) delivers the WHOLE tenant vault to every task regardless of what its `leoflow.yaml` declares, and only logs + audits a warning when a task declared a narrower non-empty set; `enforce` delivers only the declared subset; `off` disables scoping and its warning entirely. `enforce` denies secrets to a DAG that declares NONE, which — the declaration schema being new — is most DAGs, so run `permissive` first and read the scope-warning trail before flipping. A clean trail proves only that no DAG whose declarations still RESOLVE is over-served: the warning counts only declared names that actually resolve, so it says nothing about a DAG that declares nothing, nor about one whose declared names were since deleted from the vault (an all-stale declaration counts as zero) (#800). Operator-scoped, never DAG-author-settable.
  secretScoping: permissive

  # OIDC / SSO login (server `auth.provider: oidc`). OFF by default, and off means
  # absent: with `enabled: false` not one of the keys below reaches the pod, so an
  # install that does not use SSO renders exactly the spec it renders today.
  #
  # SSO was unreachable from this chart until now, and the reason is worth stating
  # because it shapes everything below. Two of the server's OIDC settings are MAPS
  # (`tenantClaims` and `roleMappings`) and a map has no environment-variable
  # route at all: viper binds env only for the scalar leaves registered in
  # `serverDefaults`, and these two are deliberately not registered (a Google `hd`
  # key is a dotted domain, and viper's "." delimiter would split it into nested
  # maps and fail to decode, internal/config/server.go, #826). The server reads
  # them straight from the YAML file named by `LEOFLOW_CONFIG`. The chart had no
  # such file and no volume to put one in, so `auth.provider: oidc` could only ever
  # fail boot closed on the missing tenant pin (#1143).
  #
  # So the two maps (and ONLY the two maps) travel in a ConfigMap that the chart
  # mounts read-only at /etc/leoflow/oidc and points `LEOFLOW_CONFIG` at. Every
  # other key travels as an env var, the way the rest of this chart delivers server
  # settings. That the file is PARTIAL is the point, not an omission: viper ranks
  # env above file, and a key absent from a config file keeps the value it already
  # had, so nothing in the ConfigMap can override, blank or resurrect a setting
  # made anywhere else, including a `helm upgrade` that changes only the maps.
  #
  # `clientSecret` is the one key that must not go there. A ConfigMap is readable by
  # anything with get on the namespace and is not encrypted at rest, so the secret
  # takes the same route `jwtSecret` takes: inline into the chart-managed Secret, or
  # `oidc.existingSecret` for an out-of-band one, delivered by secretKeyRef.
  oidc:
    # -- Turn on the OIDC/SSO login flow (sets `auth.provider: oidc`). While off, none of the keys below render at all (no env vars, no ConfigMap, no volume) so a non-SSO install is unaffected by this block existing. Turning it on makes SSO the login path for everyone except `breakGlassEmails`, so configure those before you flip it or an IdP misconfiguration locks every operator out of the UI.
    enabled: false
    # -- The IdP's issuer URL, `https://` only (the ID token's `iss` is pinned to it, a token from any other issuer is rejected). Entra: `https://login.microsoftonline.com/<tenant-id>/v2.0`. Google Workspace: `https://accounts.google.com`. Okta: `https://<org>.okta.com`.
    issuer: ""
    # -- The registered application (client) id. It is also the expected `aud` of every ID token, so it must be the client the redirect URL below is registered against.
    clientId: ""
    # -- The client secret, used ONLY for the authorization-code exchange (ID-token verification is keyless, against the issuer's published JWKS). Set inline OR reference an existing Secret via `oidc.existingSecret`. Never goes into the ConfigMap.
    clientSecret: ""
    # -- Name of a Secret with key `oidcClientSecret` (takes precedence over `clientSecret`). Separate from `auth.existingSecret` on purpose: the JWT signing key and the IdP client secret rotate on different schedules and are usually owned by different people. Like every `existingSecret` in this chart it is outside the `checksum/secret` annotation's visibility, so rotating it needs a manual `kubectl rollout restart`.
    existingSecret: ""
    # -- This server's callback URL as registered with the IdP; it must end in `/api/v2/auth/oidc/callback` and be reachable from the browser, not from inside the cluster. `https://` is required except on loopback hosts, so this is the ingress hostname, never the Service name.
    redirectUrl: ""
    # -- OAuth scopes requested at login. The shipped three are what the flow needs; add the IdP's groups scope (Okta `groups`, Entra exposes groups without one) when `roleMappings` is used, or the `groupsClaim` arrives empty and every user resolves to zero roles. Rendered comma-joined into one env var, viper's decode hook splits it back into a list, the same mechanism `config.trustedProxies` uses.
    scopes:
      - openid
      - email
      - profile
    # -- ID-token claim carrying the user's IdP groups; its values are what `roleMappings` matches on. Entra emits `groups` (object ids unless the app registration is configured to emit names); Okta emits whatever the groups claim is named in the authorization server.
    groupsClaim: groups
    # -- Maps an IdP group value → an existing Leoflow role name. Default-DENY: a group with no entry here grants nothing. This is one of the two keys that CANNOT travel as an env var, so the chart writes it into the mounted `config.yaml`. Keys are quoted on render, which is what lets a dotted group name (`app.admins`) survive (#826). Optional, leave empty and every user falls back to `defaultRole`.
    roleMappings: {}
    # -- Single role granted to an authenticated user who resolves to ZERO mapped roles. Empty (the default) keeps strict default-deny, which with an empty `roleMappings` means a successful SSO login that can see nothing, correct, and a confusing first experience. Set a read-only role such as `viewer` while you work the group mapping out. It must name a role that already exists for the resolved tenant; an unknown name fails the login closed.
    defaultRole: ""
    # -- Which claim identifies the tenant: `tid` on Entra, `hd` on Google Workspace. REQUIRED with `enabled: true`, together with `tenantClaims` it is the tenant pin, and the chart refuses to render without both.
    tenantClaim: ""
    # -- Maps each accepted `tenantClaim` VALUE → a Leoflow tenant name. REQUIRED and non-empty with `enabled: true`. A claim value that is not a key here is rejected with a generic 403 whose cause reaches only the audit log (which, in an SSO-only deployment, nobody can log in to read (#1143)) and it never falls back to the `default` tenant. This is the second key that cannot travel as an env var, so it too is written into the mounted `config.yaml` with its keys quoted: a Google `hd` value is always a dotted domain. Example: `{"example.com": "default"}`. The VALUE must name a tenant that already exists: `default` is created by the first migration and nothing in Leoflow creates another, so map to it unless you created the tenant yourself. The server checks this at boot and warns.
    tenantClaims: {}
    # -- Login-level email-domain allowlist layered ON TOP of the tenant pin, not a replacement for it. Checked only after the pin and `email_verified` have passed, so the domain is trustworthy by then. Empty (the default) imposes no extra restriction. It gates EVERY OIDC login, not only JIT-provisioned ones. Rendered comma-joined, omitted when empty.
    allowedEmailDomains: []
    # -- Local password logins still accepted while SSO is on; every other password login is rejected. This is the lock-out escape hatch: with the list empty, an IdP outage or a wrong `tenantClaims` entry leaves nobody able to reach the UI, including the operator who has to fix it. Put at least one break-glass admin here before enabling SSO, and make sure it is an address with a LOCAL PASSWORD account: listing an address that has no password row (or only an SSO-provisioned one, which has no password at all) produces a hatch that does not open, because the allowlist admits it and the credential store then rejects it like a wrong password. The server checks this at boot and warns. Rendered comma-joined, omitted when empty.
    breakGlassEmails: []
    # -- Create the Leoflow user row on first successful OIDC login. ON here, unlike the server default, because OFF means no SSO login can succeed at all: a login resolves its user by `(provider, subject)` alone and the only code path that ever writes those two columns is this one, so there is no supported way to pre-provision an account an SSO login will match, and every first login is denied with a generic 403 whose reason (`no_user_jit_off`) reaches only the audit log. Turning it on is not a widening of who may log in: the tenant pin, `email_verified` and `allowedEmailDomains` decide that, and the created row carries only the roles `roleMappings`/`defaultRole` resolve, which is none by default. One case it cannot serve either way: an address that already has a LOCAL password account in the same tenant collides on the users table's unique (tenant, email) and is denied `jit_failed`, so do not create local accounts for the addresses your users sign in with.
    jitProvisioning: true
    # -- Start the login flow on the sign-in page instead of rendering it. OFF by default, because turning it on removes the sign-in page from a deployment that relies on it. Turn it on where that page is a screen to acknowledge for nothing: an edge proxy has already authenticated the session, or SSO is the only way in and the click adds nothing. It is SUPPRESSED in two cases, and both matter. A refused sign-on returns to this page carrying `sso_error`, and redirecting that would bounce the denial straight back to the IdP: an infinite loop with no surface left to read the error on. And `?local=1` always renders the form, so a `breakGlassEmails` account can reach it when the IdP is the thing that is broken, without an operator having to edit values and roll out to get back in.
    autoRedirect: false
    # -- Tolerance in seconds applied to the ID token's `exp`/`iat`/`nbf` checks, to absorb clock drift between the IdP and this server. The shipped 60 is the server's own default; raise it only if boot-time clock sync is genuinely unreliable, since it widens the window a replayed token stays valid.
    clockSkewSeconds: 60

# Warm worker pools (ADR 0058) — reuse one task pod across many attempts of the
# SAME dag_version, instead of one pod per attempt. OFF by default: every attempt
# gets its own dedicated pod, byte-for-byte today's behavior, and none of the
# tuning below is even sent to the server.
#
# Turning them on is a SECURITY decision before it is a performance one. A reused
# pod holds one live credential across attempts, so per-attempt identity is the
# only thing keeping a superseded attempt from still resolving secrets — hence the
# ADR 0058 D2 coupling: `warmPoolsEnabled` requires `auth.agentTokenTransport=
# exchange` AND `auth.secretLivenessMode=enforce`. The chart refuses to render
# without both (the server refuses to boot on the same coupling).
#
# The knobs below are operator-scoped on purpose — a DAG author cannot set them —
# and their defaults are exactly the server's, so enabling the flag alone inherits
# the documented bounds rather than an accidental configuration.
execution:
  # -- Reuse one warm pod across many attempts of a dag_version (ADR 0058). OFF = dedicated pod-per-task. Requires `auth.agentTokenTransport: exchange` AND `auth.secretLivenessMode: enforce`; the chart fails the render otherwise. Read ADR 0058's "Measurement & enable readiness" before enabling on a shared cluster — the go/no-go bar is stated in rates on a real cluster, not in unit tests.
  warmPoolsEnabled: false
  # -- Warm workers kept ready per dag_version when a DAG declares no warmth of its own (ADR 0058 D6). `0` (default) is scale-to-zero: nothing idles until a DAG asks for it. Ignored while `warmPoolsEnabled` is false.
  minIdleWorkers: 0
  # -- Cap on the warm workers a single dag_version may hold (ADR 0058 D6). Also the ceiling a DAG author's own warmth request is clamped to. Ignored while `warmPoolsEnabled` is false.
  maxPoolSize: 8
  # -- Attempts a warm worker serves before it drains and recycles (ADR 0058 D9). Bounds credential-leak and stale-image exposure by forcing a fresh pod periodically. Ignored while `warmPoolsEnabled` is false.
  maxAttemptsPerWorker: 50
  # -- Wall-clock lifetime of a warm worker before it drains and recycles, independent of the attempt count (ADR 0058 D9). A Go duration string (`1h`, `30m`). Recycle is a graceful drain, never a mid-attempt kill. Ignored while `warmPoolsEnabled` is false.
  maxWorkerLifetime: 1h
  # -- How long an idle warm worker is kept before it is recycled (ADR 0058 D6). A Go duration string (`5m`, `90s`). This is also what drains the pool of a superseded dag_version after a deploy. Ignored while `warmPoolsEnabled` is false.
  workerIdleTtl: 5m
  # -- Cap on the TOTAL warm pods one tenant may hold across ALL its dag_versions (ADR 0058 M4). Where `maxPoolSize` bounds one version, this bounds a tenant's aggregate footprint so one team cannot pin idle pods and starve neighbours on a shared cluster. Enforced by refusing to create new warm pods, never by deleting a busy worker. Ignored while `warmPoolsEnabled` is false.
  maxWarmPodsPerTenant: 100

# -- Extra environment variables appended to the control-plane container, for
# server settings this chart does not model as a first-class value (see
# `docs/configuration.md` for the full `LEOFLOW_*` surface). Standard K8s `env`
# entries, so `valueFrom` works, and a `value` is always rendered as a string
# (Kubernetes rejects a numeric one). Appended AFTER the chart-managed entries; do
# not use it to redefine one — the chart refuses to render an entry that shadows a
# variable whose value it guards (the warm-pool / agent-credential coupling).
# Example: `[{name: LEOFLOW_SCHEDULER_DISPATCH_WORKERS, value: "4"}]`.
extraEnv: []

# secretKey (LEOFLOW_SECRET_KEY) is the 32-byte key the control plane uses to
# encrypt connection passwords + Extra blobs at rest (ADR 0019). Without it,
# Connection management is disabled and the API rejects writes with 503
# (Variables still work). Set it, or reference an existing secret.
#
# Generate one with:  openssl rand -hex 32   (64 hex chars = 32 bytes)
# NOT `-hex 16`: that yields 32 characters, which the server accepts as 32
# RAW bytes — a valid AES-256 key carrying only 128 bits of entropy, with
# nothing to tell you. The server warns at boot if it sees that shape.
# -- AES-256 key encrypting Connection passwords + Extra at rest (ADR 0019). MUST be exactly 32 raw bytes OR 64-char hex OR base64-of-32-bytes. Without it, Connection management is disabled (Variables still work).
secretKey: ""
# -- Name of a Secret with key `secretKey` (takes precedence over `secretKey`).
secretKeyExistingSecret: ""

# bootstrap creates the initial admin user on first start when set.
bootstrap:
  # -- Initial admin password (first install only). Leave empty to skip the bootstrap; the operator then creates the first admin out-of-band.
  password: ""
  # -- Name of a Secret with key `bootstrapPassword` (takes precedence over `password`).
  existingSecret: ""

# migrations runs golang-migrate as a pre-install/pre-upgrade hook Job before the
# server starts. The image must contain the migrations and migrate binary.
migrations:
  enabled: true
  image:
    # -- leoflow-migrate image: the golang-migrate CLI compiled from the version in our `go.mod`, plus the Leoflow SQL migrations, on distroless static. Published per release by `release.yaml`, signed with cosign, multi-arch (amd64 + arm64).
    repository: ghcr.io/dexadata/dexaflow-migrate
    # -- Migration image tag. Defaults to `.Chart.appVersion` when empty. Pin to the same tag as `image.tag` (both server and migrate publish both `v`-prefix and no-`v` forms — use whichever convention you prefer, they resolve to the same digest): `--set migrations.image.tag=v0.4.0-rc.2`.
    tag: ""
    pullPolicy: IfNotPresent
  # -- Path inside the migrate image where the SQL files live. Must match the COPY destination in `deploy/Dockerfile.migrate`.
  path: /migrations
  # -- Resources for the migration Job container. Small on purpose — the work is a few dozen DDL statements — but **not empty**: with no requests the pod is BestEffort, and a namespace `ResourceQuota` on `requests.cpu`/`requests.memory` then rejects it at admission, which fails `helm install` because this is a pre-install hook (#1053). BestEffort is also first out under node pressure, and an eviction part-way through leaves the schema dirty. Limits stay within **2:1** of requests on both axes on purpose: a namespace `LimitRange` with `maxLimitRequestRatio` is as common as a quota, and a wider ratio is rejected at admission — the same install-wedge the requests are here to prevent. Keep the limits: a quota on `limits.*` rejects a pod that declares none. Clearing the block needs explicit nulls (`--set-json 'migrations.resources=null'`, or `migrations:\n  resources: null` in a values file for Argo CD / Flux, which cannot pass `--set-json`) — Helm coalesces chart defaults back into a bare `{}`, so `{}` leaves these values in place.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # Pod security for the pre-install/pre-upgrade Job. K8s' restricted Pod
  # Security Admission requires runAsNonRoot + a numeric runAsUser on
  # every pod, including hook Jobs. The Deployment is hardened identically
  # (top-level podSecurityContext); these defaults mirror that posture so
  # restricted-PSA clusters accept the migration Job too.
  #
  # The image itself already runs as UID 65532 (deploy/Dockerfile.migrate,
  # #1039) rather than as root the way the old `migrate/migrate` base did, so
  # these values now agree with the image instead of overriding it. Kept
  # explicit all the same: a restricted namespace verifies the POD spec, and an
  # operator overriding `migrations.image` must land on a UID that can read
  # /migrations (world-readable, mode 644).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    # restricted PSA requires a RuntimeDefault seccomp profile; set pod-level.
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    # migrate is a static Go binary writing only to the DB (advisory lock for
    # migration mutex). No /tmp writes, no log files. Safe to lock the root
    # FS read-only — tightest restricted-PSA posture. Verified against the
    # image this chart defaults to by applying all 26 migrations with
    # `docker run --rm --read-only -u 65532:65532 --cap-drop ALL
    # leoflow-migrate -path=/migrations -database=<dsn> up`.
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532
    capabilities:
      drop: ["ALL"]

# TLS for the agent <-> control plane gRPC channel (issue #58). Mandatory here,
# not optional: this chart hardcodes LEOFLOW_UI_EDITION=pro (deployment.yaml) and
# the Pro server refuses to boot without a gRPC cert/key, so there is no plaintext
# deployment to opt into. TLS stays ON — what is now optional is WHERE the cert
# material comes from:
#   - auto-generated (default): with autoGenerate=true and no serverCertSecret /
#     caConfigMap supplied, the chart mints a STABLE self-signed CA + server cert
#     itself (#690). A fresh cloud cluster (e.g. EKS Auto Mode) installs with TLS
#     on and NO cert-manager and NO pre-created Secret. The material is generated
#     once and reused across `helm upgrade` (via lookup), so the CA never rotates.
#   - BYO / cert-manager (production): set BOTH serverCertSecret AND caConfigMap
#     and the chart uses them verbatim, ignoring auto-gen. This is the recommended
#     production path and the ONLY supported path for GitOps (ArgoCD/Flux): a
#     cluster-less `helm template` render cannot `lookup` the existing Secret, so
#     auto-gen would rotate the CA on every sync. Use cert-manager for GitOps.
agentTLS:
  # -- Enable TLS on the agent ↔ control plane gRPC channel (#58). Keep this `true`: the chart marks every deployment as the production edition (`LEOFLOW_UI_EDITION=pro`), and that edition refuses to boot without a gRPC cert/key — setting this to `false` yields a crash-looping control plane ("the Pro edition requires TLS on the agent gRPC channel"), not a plaintext deployment. The same edition marker also rejects `LEOFLOW_AGENT_ALLOW_INSECURE_SECRETS=true`, so secrets cannot accidentally travel a plaintext channel. For a plaintext local loop use the Lite dev server, not this chart.
  enabled: true
  # -- Auto-generate a stable self-signed CA + gRPC server cert when neither `serverCertSecret` nor `caConfigMap` is supplied (#690), so `helm install` needs no cert-manager and no pre-created Secret. The material is minted once and reused on every `helm upgrade` (via `lookup`) so the CA never rotates and running agents keep trusting it. Fine for quickstart / simple clusters. Set `false` (and supply nothing) to force the old fail-fast when no cert is provided. **Not for GitOps** (ArgoCD/Flux): a cluster-less render can't `lookup` the live Secret and would rotate the CA every sync — use BYO/cert-manager there. For production, prefer BYO below (rotation, real chain of trust).
  autoGenerate: true
  # -- Name of a `kubernetes.io/tls` Secret (with `tls.crt`/`tls.key`) for the gRPC server. Set this **and** `caConfigMap` to bring your own (BYO), typically a cert-manager `Certificate` — the chart then uses them verbatim and skips auto-generation. Leave empty to let `autoGenerate` mint one.
  serverCertSecret: ""
  # -- Name of a ConfigMap with key `ca.crt`. Mounted into task pods so the agent verifies the server cert. Set this **and** `serverCertSecret` for BYO (typically a cert-manager trust-bundle). Leave empty to let `autoGenerate` mint one.
  caConfigMap: ""

# Mount a Kubernetes Secret read-only into every task pod (cloud-agnostic), so a
# task can read ANY credential that lives in the cluster's secret store — a GCP
# service-account key, an AWS credentials file, an Azure cert, a private CA, etc.
# — referenced by a connection (e.g. the google_cloud_platform `key_path`) instead
# of being stored in Leoflow (ADR 0035; Leoflow is not a key manager). You create
# the Secret (`kubectl create secret generic ...`); the chart only mounts it.
# Prefer keyless (Workload Identity) over this; use it when keyless is unavailable.
taskSecret:
  # -- Name of an existing Kubernetes Secret to mount into task pods. Empty = none.
  name: ""
  # -- Read-only mount path in the task pod. A connection references files here, e.g. `/etc/leoflow/secrets/key.json`.
  mountPath: /etc/leoflow/secrets

# External secrets backend (ADR 0060): resolve a declared Connection/Variable
# pod-side from a provider store (AWS Secrets Manager, …) under the pod's own
# keyless identity, instead of Leoflow's vault. Empty `backend` = disabled (the
# vault is the only source — the default). Operator-only config.
secrets:
  # -- Provider secrets-backend class the in-pod resolver drives (e.g. `airflow.providers.amazon.aws.secrets.secrets_manager.SecretsManagerBackend`). Empty disables external secrets.
  backend: ""
  # -- Backend kwargs as a JSON object string (e.g. `'{"connections_prefix":"airflow/connections","variables_prefix":"airflow/variables","region_name":"us-east-1"}'`). A kind is served iff its `*_prefix` is present. Keyless auth (IRSA / Workload Identity) uses the task pod's ServiceAccount — set `taskServiceAccount` accordingly.
  backendKwargs: ""

observability:
  otel:
    # -- Export OpenTelemetry traces. When false, internal spans are no-ops.
    enabled: false
    # -- OTLP/gRPC endpoint URL, e.g. `otel-collector:4317`. Required when `otel.enabled: true`.
    endpoint: ""
  # -- Log format: `json` (production / log aggregators) or `console` (dev / human-readable).
  logFormat: json
  # -- Log level: `debug`, `info`, `warn`, `error`. Production default is `info`.
  logLevel: info

# -- Resource requests + limits for the leoflow-server container. `250m`/`256Mi` requests are a floor for a small Pro (50–500 DAGs) — bump CPU+memory for larger deployments. The request guarantees the control plane its CPU shares under node contention (so a task-pod burst can't starve it); the actual probe-timeout fix is `probes.liveness.timeoutSeconds` below (CFS throttling is bounded by the CPU *limit*, not the request). See #860.
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

# -- Liveness/readiness probes for the leoflow-server container. Exposed so an operator can loosen the timeout under load: a busy scheduler can miss a 1s `/healthz` during a task-pod burst and be kubelet-killed mid-run, which cascades in-flight tasks to agent_lost (#860). Defaults are deliberately forgiving (5s liveness / 3s readiness timeout, 3 failures) rather than Kubernetes' 1s/3. `readiness.timeoutSeconds` has a **floor of 3** and the render fails below it: /readyz bounds its own work at 2s so it answers before the kubelet gives up, and a shorter kubelet timeout inverts that and you get a bare timeout instead of a 503 naming the failing dependency (#1041). To react faster, lower `readiness.periodSeconds` or `failureThreshold` instead.
probes:
  # -- Startup gate for the control-plane boot. Kubernetes runs neither the liveness nor the readiness probe until this one succeeds, so a slow boot reads as "not ready yet" instead of being killed and restarted. Without it liveness points at the same API listener the boot has not bound yet, and any boot-path dependency that is slow or stuck becomes a restart loop whose every cycle is recorded as `Completed exit=0`, because SIGTERM is handled cleanly (#1083). The budget is `periodSeconds * failureThreshold` = 180s, and it is sized from the server's own boot bounds rather than picked: the Postgres connect retry is 30s and runs TWICE (the request pool and the dedicated probe pool), the pod-informer warm-up is bounded at 10s (#1141), and on top of those sit credential detection for an object-store log sink and OIDC discovery, neither of which carries a bound of its own. That is 70s of code-defined budget before anything cloud-shaped, and a gate tighter than the boot would kill a pod that was about to come up, which is the loop again. Generous on purpose, because the two directions are not symmetric: a boot that FAILS returns an error and the process exits 1, so CrashLoopBackOff reports it promptly no matter what this says, and the gate only bounds a boot that HANGS, where a restart is a lottery ticket rather than a fix. The render refuses a budget at or below the liveness budget it replaces (10 + 3*20 = 70s), since that only moves the kill from one probe to the other. It probes `/healthz`, never `/readyz`: a failing startup probe RESTARTS the container, so gating it on dependency health would turn a database outage into a crash loop, which is the exact thing `/healthz` is deliberately static to avoid. Nothing is lost by that, because readiness still gates endpoint membership on `/readyz` once the gate opens. Set `enabled: false` to go back to liveness policing the boot.
  startup:
    enabled: true
    periodSeconds: 5
    failureThreshold: 36
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# HorizontalPodAutoscaler for the control plane. Safe because the scheduler
# leader-elects (ADR 0009) — scaling the Deployment adds API/UI replicas while
# exactly one scheduler stays active. Disabled by default; flip `enabled: true`
# in production after sizing replicas.
autoscaling:
  # -- Enable HPA for the leoflow-server Deployment. Requires metrics-server.
  enabled: false
  # -- Minimum replicas. HPA never scales below this. Must be at least 1: the apiserver rejects a lower minimum unless the HPAScaleToZero feature gate is on, which this chart does not assume.
  minReplicas: 2
  # -- Maximum replicas. HPA never scales above this. Must be at or above `minReplicas`, and the render is refused otherwise — these are independent values with independent defaults, so overriding only this one used to produce a HorizontalPodAutoscaler the apiserver rejects at install (#947).
  maxReplicas: 6
  # -- Target average CPU utilization across replicas (percent). HPA scales out when exceeded.
  targetCPUUtilizationPercentage: 70
  # -- Target average memory utilization (percent). Empty = not used. Add only if your workload is memory-bound (rare for a control plane).
  targetMemoryUtilizationPercentage: ""
  # -- HPA scaling behavior (scale-up/scale-down policies). See K8s docs for autoscaling/v2 `behavior` schema.
  behavior: {}

# PodDisruptionBudget so voluntary disruptions — node drains, cluster and node
# auto-upgrades, autoscaler consolidation / bin-packing — keep at least one
# control-plane replica serving while another is evicted. It turns itself on
# exactly when that is safe: `enabled` unset (auto) renders the PDB when the
# guaranteed replica floor is above one (`replicaCount`, or the HPA's
# `minReplicas`, or `split.api.replicaCount` in split mode).
#
# Why not always on: a PDB with `minAvailable: 1` over a SINGLE replica blocks
# every voluntary eviction of that pod. Node drains hang on it, cluster/node
# auto-upgrades stall (platforms that bound the wait override it after a while),
# and the pod still dies to involuntary disruptions (node failure, spot
# reclamation). It protects the pod at the cost of cluster operations — an
# informed trade an operator may still choose with an explicit `enabled: true`.
podDisruptionBudget:
  # -- (bool) Tri-state. Unset/empty (default) = auto: the PDB renders iff the guaranteed replica floor is `> 1`. `true` forces it on (on a single replica this blocks node drains and auto-upgrades — an informed choice; NOTES warns). `false` forces it off. The quoted string spellings `"true"` / `"false"` are accepted too, because Argo CD's `helm.parameters` and helm `--set-string` pass every override as a string — reading those as "not a boolean" used to fall through to auto, so a forced-on budget silently never rendered. Any OTHER non-empty value fails the render rather than falling back to auto.
  enabled:
  # -- Minimum replicas that must remain up during voluntary disruption. Set only ONE of minAvailable / maxUnavailable — a PDB spec carries exactly one, the apiserver rejects both together, and the chart fails the render on the pair rather than letting the install fail after a clean render.
  minAvailable: 1
  # -- Maximum replicas allowed unavailable during voluntary disruption. Set only ONE of minAvailable / maxUnavailable — setting this one means clearing `minAvailable` (`""`), since the chart fails the render when both are set.
  maxUnavailable: ""
  # -- `spec.unhealthyPodEvictionPolicy` (policy/v1, GA since Kubernetes 1.27; older apiservers prune the field — set `""` to omit it). `AlwaysAllow` (default) lets unhealthy pods be evicted even when the budget is unmet: with the Kubernetes default `IfHealthyBudget`, both replicas unready (bad DB credentials after a rotation, image-pull failure, wedged rollout) means even the broken pods cannot be evicted and node drains hang on an already-down control plane.
  unhealthyPodEvictionPolicy: AlwaysAllow

# NetworkPolicy for the control plane (requires a CNI that enforces it). The
# template defaults to permissive egress so enabling it doesn't silently break
# DB/Redis/kube-apiserver access — tighten per environment after install.
# Task-pod egress NetworkPolicy (ADR 0047/0048). Contains the SSRF/metadata risk
# at the network layer for the pods that run untrusted code — the control plane
# never runs it (ADR 0048). Off by default; requires a CNI that enforces policy.
taskNetworkPolicy:
  # -- Enable the task-pod egress NetworkPolicy in `taskNamespace`. Denies ingress, allows DNS + the control-plane gRPC, then all other egress except the blocked ranges below.
  enabled: false
  # -- ALSO deny RFC1918 private ranges, which on most clusters takes the apiserver with them — but not always: GKE's newer default Service range (34.118.224.0/20) is outside RFC1918, so print your own Service CIDR before assuming. IPv4 only, so on dual-stack an IPv6 metadata or apiserver endpoint is unaffected. OFF by default: a DAG calling an internal service is legitimate, and the policy cannot tell that from the apiserver by IP (ADR 0047). Turn on for high-security clusters; the control-plane gRPC is re-allowed explicitly.
  blockPrivateNetworks: false
  # -- Extra CIDRs to add to the egress `except` list (e.g. a specific internal admin subnet).
  extraExcept: []
  # -- Extra raw egress rules appended verbatim (e.g. allow a specific data store when blockPrivateNetworks is on).
  extraEgress: []
  # -- Host CIDRs within the always-blocked cloud-metadata range to RE-ALLOW, scoped to a single host each. Needed for keyless external-secrets auth that reaches a metadata/link-local endpoint: GKE Workload Identity (`169.254.169.254/32`) and EKS Pod Identity (`169.254.170.23/32`). AWS IRSA needs nothing here (it uses the public STS endpoint). Empty keeps the full metadata block. **One host per entry is enforced, not merely documented: the render FAILS on anything wider than an IPv4 `/32` or an IPv6 `/128`** — and on a bare address, a malformed CIDR or a scalar instead of a list. A wider entry would not widen the hatch, it would remove the block: NetworkPolicy egress rules are additive, so a rule allowing `169.254.0.0/16` overrides the `except` in the allow-all rule and the manifest still shows a block that no longer exists. To reach a wider range that is NOT the metadata range, use `extraEgress`.
  allowMetadataEgress: []

networkPolicy:
  # -- Enable NetworkPolicy gating ingress + egress on the control-plane pods. Requires a CNI that enforces policies (Calico/Cilium/etc.).
  enabled: false
  # -- NetworkPolicy `from` rules for HTTP + gRPC ingress (task pods dial back). Empty = allow from any pod in any namespace. Tighten with e.g. `[{namespaceSelector: {}}]` for same-namespace only.
  ingressFrom: []
  # -- NetworkPolicy `from` rules for the metrics port (Prometheus scrape). **Narrow this**: the default below allows any namespace, and the metrics listener is unauthenticated and labels its series with `dag_id` and `task_id`. Replace it with your Prometheus namespace, e.g. `[{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}]`. An empty list means no rule at all, which an Ingress-typed policy denies — that was the old default, and it made `networkPolicy.enabled` plus `metrics.serviceMonitor.enabled` a scrape target that never answered and failed nothing at install (#1067). Stated as a real value rather than left to a comment about what empty means, because a magic empty is how #1067 happened.
  metricsFrom:
    - namespaceSelector: {}
  # -- Explicit egress rules. Empty = allow-all (DNS is ALWAYS allowed regardless). Lock down to your DB/Redis/kube-apiserver endpoints in regulated environments.
  egress: []

# Prometheus Operator ServiceMonitor for /metrics (ADR 0010). Requires the
# monitoring.coreos.com CRDs (kube-prometheus-stack).
metrics:
  serviceMonitor:
    # -- Enable ServiceMonitor for Prometheus scraping. Requires kube-prometheus-stack CRDs.
    enabled: false
    # -- Namespace for the ServiceMonitor resource. Defaults to the release namespace; override when Prometheus expects ServiceMonitors in a dedicated namespace.
    namespace: ""
    # -- Prometheus scrape interval.
    interval: 30s
    # -- Prometheus scrape timeout (must be ≤ interval).
    scrapeTimeout: 10s
    # -- Extra labels on the ServiceMonitor. Required when the Prometheus instance has a `serviceMonitorSelector` filter (e.g. `{release: kube-prometheus-stack}`).
    additionalLabels: {}

ingress:
  # -- Enable an Ingress resource exposing the control plane via HTTP/HTTPS. Requires an Ingress controller (nginx/traefik/etc.) in the cluster.
  enabled: false
  # -- Ingress class name (e.g. `nginx`). Leave empty to use the cluster default.
  className: ""
  # -- Ingress annotations (controller-specific: rewrites, TLS, auth, etc.).
  annotations: {}
  # -- Host + path rules. Each host maps to one or more path entries routed to the leoflow-server's `http` port.
  hosts:
    - host: leoflow.local
      paths:
        - path: /
          pathType: Prefix
  # -- TLS configuration. Each entry maps hosts to a TLS Secret (typically a cert-manager Certificate Secret).
  tls: []

# -- Extra annotations on the control-plane pod template. EKS/Karpenter opt-in: `karpenter.sh/do-not-disrupt: "true"` exempts the pod's node from Karpenter's voluntary disruption (consolidation, drift, expiration), trading maintenance friction — that node is never consolidated or upgraded by Karpenter while the pod runs — for eviction protection. Not set by default; a second replica plus the auto PDB is the platform-neutral answer.
podAnnotations: {}
# podSecurityContext: K8s enforces `runAsNonRoot: true` by verifying the UID.
# The control-plane image (deploy/Dockerfile.server) sets `USER nonroot:nonroot`
# — a named user, not a numeric UID — so K8s cannot prove non-root and rejects
# the pod with `CreateContainerConfigError: container has runAsNonRoot and
# image has non-numeric user (nonroot)`. Pin `runAsUser` / `runAsGroup` to the
# `nonroot` distroless UID (65532, the de-facto standard from Google's distroless
# images) so the enforcement passes. Override if you bake your own image.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  # restricted Pod Security Admission requires a RuntimeDefault (or Localhost)
  # seccomp profile. Set at the pod level so every container inherits it.
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop: ["ALL"]

# -- Pod nodeSelector (standard K8s scheduling label match).
nodeSelector: {}
# -- Pod tolerations (standard K8s — allow scheduling on tainted nodes).
tolerations: []
# -- Pod affinity rules (standard K8s — co-locate or anti-affinity).
affinity: {}
