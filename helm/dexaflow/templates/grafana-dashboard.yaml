{{- /*
Grafana dashboard of the control plane (#1577), shipped as a ConfigMap that the
Grafana sidecar of kube-prometheus-stack (or any sidecar watching the label in
metrics.grafanaDashboard.labels) loads. The JSON lives in dashboards/ so it can
be imported by hand too; its queries read only metrics the server registers,
which internal/tools/metricsref checks.
*/ -}}
{{- $gd := (.Values.metrics | default dict).grafanaDashboard | default dict }}
{{- if $gd.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "leoflow.fullname" . }}-dashboards
  namespace: {{ $gd.namespace | default .Release.Namespace }}
  labels:
    {{- include "leoflow.labels" . | nindent 4 }}
    {{- with $gd.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $gd.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
{{- end }}
