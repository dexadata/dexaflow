{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "leoflow.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "leoflow.labels" . | nindent 4 }}
  {{- $annotations := dict -}}
  {{- /* #1998: with no ready server pod ingress-nginx answers from the
  default backend; 502 and 504 (a pod lost mid-request) are sent there too.
  503 is not intercepted, so the server's own outage page and API problems
  (#1099) still reach the client while a pod answers. */ -}}
  {{- if .Values.ingress.maintenancePage.enabled -}}
    {{- $_ := set $annotations "nginx.ingress.kubernetes.io/custom-http-errors" "502,504" -}}
    {{- $_ := set $annotations "nginx.ingress.kubernetes.io/default-backend" (include "leoflow.suffixRole" (dict "base" (include "leoflow.fullname" .) "role" "maintenance")) -}}
  {{- end -}}
  {{- with .Values.ingress.annotations -}}
    {{- $annotations = merge (deepCopy .) $annotations -}}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                # ADR 0049: in split mode the HTTP API lives on the api Service
                # ("<fullname>-api"); the bare fullname Service does not exist.
                name: {{ include "leoflow.roleName" (dict "ctx" $ "role" (ternary "api" "all" $.Values.split.enabled)) }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end -}}
