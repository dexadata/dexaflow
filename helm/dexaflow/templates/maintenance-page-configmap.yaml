{{- if and .Values.ingress.enabled .Values.ingress.maintenancePage .Values.ingress.maintenancePage.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "leoflow.fullname" . }}-maintenance
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "leoflow.labels" . | nindent 4 }}
data:
  index.html: |-
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Dexaflow is Unavailable</title>
      {{- if gt (int (default 10 .Values.ingress.maintenancePage.refreshSeconds)) 0 }}
      <meta http-equiv="refresh" content="{{ .Values.ingress.maintenancePage.refreshSeconds }}">
      {{- end }}
      <style>
        body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          background-color: #f8fafc;
          color: #1e293b;
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          margin: 0;
          padding: 1.5rem;
        }
        .container {
          background: #ffffff;
          border: 1px solid #e2e8f0;
          border-radius: 8px;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
          max-width: 480px;
          padding: 2.5rem;
          text-align: center;
        }
        h1 {
          color: #2c4089;
          font-size: 1.5rem;
          font-weight: 600;
          margin-top: 0;
          margin-bottom: 1rem;
        }
        p {
          color: #64748b;
          font-size: 0.95rem;
          line-height: 1.5;
          margin-bottom: 1.5rem;
        }
        .operator-text {
          background-color: #f1f5f9;
          border-radius: 4px;
          padding: 0.75rem 1rem;
          font-size: 0.875rem;
          color: #334155;
          margin-bottom: 1.5rem;
        }
        a {
          color: #2c4089;
          text-decoration: none;
          font-weight: 500;
        }
        a:hover {
          text-decoration: underline;
        }
        .spinner {
          border: 3px solid #e2e8f0;
          border-top: 3px solid #2c4089;
          border-radius: 50%;
          width: 24px;
          height: 24px;
          animation: spin 1s linear infinite;
          margin: 0 auto 1.5rem auto;
        }
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </head>
    <body>
      <div class="container">
        <div class="spinner"></div>
        <h1>Dexaflow is unavailable</h1>
        <p>{{ default "Dexaflow is currently unavailable, retrying. This page will refresh automatically." .Values.ingress.maintenancePage.message | html }}</p>
        {{- if .Values.ingress.maintenancePage.operatorText }}
        <div class="operator-text">{{ .Values.ingress.maintenancePage.operatorText | html }}</div>
        {{- end }}
        {{- if .Values.ingress.maintenancePage.statusUrl }}
        <p><a href="{{ .Values.ingress.maintenancePage.statusUrl | html }}" target="_blank" rel="noopener noreferrer">{{ default "Status page" .Values.ingress.maintenancePage.statusText | html }} &rarr;</a></p>
        {{- end }}
      </div>
    </body>
    </html>
{{- end -}}
