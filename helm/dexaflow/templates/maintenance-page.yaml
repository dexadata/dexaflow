{{- /*
Optional static maintenance page (#1998). When no server pod is ready the
Service has no endpoints, and ingress-nginx answers from the Service named in
its default-backend annotation instead of its own error page. That Service is
this small nginx: every path answers 503 with the page below, a Retry-After and
no caching, so a browser shows "Dexaflow is unavailable, retrying" and reloads
by itself, and an API client still sees a 503.

The pods carry their own app.kubernetes.io/name ("<name>-maintenance"), so no
control-plane Service or PodDisruptionBudget selects them.
*/ -}}
{{- if and .Values.ingress.enabled .Values.ingress.maintenancePage.enabled }}
{{- $mp := .Values.ingress.maintenancePage }}
{{- $name := include "leoflow.suffixRole" (dict "base" (include "leoflow.fullname" .) "role" "maintenance") }}
{{- $refresh := int $mp.refreshSeconds }}
{{- $image := printf "%s:%s" $mp.image.repository $mp.image.tag }}
{{- with $mp.image.digest }}
{{- $image = printf "%s@%s" $image . }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "leoflow.maintenanceLabels" . | nindent 4 }}
data:
  default.conf: |-
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      add_header Cache-Control "no-store" always;
      {{- if gt $refresh 0 }}
      add_header Retry-After "{{ $refresh }}" always;
      {{- end }}
      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }
      location = /maintenance.html {
        internal;
      }
      location / {
        return 503;
      }
      error_page 502 503 504 /maintenance.html;
    }
  maintenance.html: |-
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Dexaflow is unavailable</title>
      {{- if gt $refresh 0 }}
      <meta http-equiv="refresh" content="{{ $refresh }}">
      {{- end }}
      <style>
        body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          background-color: #f8fafc;
          color: #1e293b;
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          margin: 0;
          padding: 1.5rem;
        }
        .container {
          background: #ffffff;
          border: 1px solid #e2e8f0;
          border-radius: 8px;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
          max-width: 480px;
          padding: 2.5rem;
          text-align: center;
        }
        h1 {
          color: #2c4089;
          font-size: 1.5rem;
          font-weight: 600;
          margin-top: 0;
          margin-bottom: 1rem;
        }
        p {
          color: #64748b;
          font-size: 0.95rem;
          line-height: 1.5;
          margin-bottom: 1.5rem;
        }
        .operator-text {
          background-color: #f1f5f9;
          border-radius: 4px;
          padding: 0.75rem 1rem;
          font-size: 0.875rem;
          color: #334155;
          margin-bottom: 1.5rem;
        }
        a {
          color: #2c4089;
          text-decoration: none;
          font-weight: 500;
        }
        a:hover {
          text-decoration: underline;
        }
        .spinner {
          border: 3px solid #e2e8f0;
          border-top: 3px solid #2c4089;
          border-radius: 50%;
          width: 24px;
          height: 24px;
          animation: spin 1s linear infinite;
          margin: 0 auto 1.5rem auto;
        }
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </head>
    <body>
      <div class="container">
        <div class="spinner"></div>
        <h1>Dexaflow is unavailable</h1>
        <p>{{ default "Dexaflow is currently unavailable, retrying. This page will refresh automatically." $mp.message | html }}</p>
        {{- if $mp.operatorText }}
        <div class="operator-text">{{ $mp.operatorText | html }}</div>
        {{- end }}
        {{- if $mp.statusUrl }}
        {{- if not (regexMatch "^https?://" $mp.statusUrl) }}
        {{- fail (printf "ingress.maintenancePage.statusUrl=%q must be an http:// or https:// URL" $mp.statusUrl) }}
        {{- end }}
        <p><a href="{{ $mp.statusUrl | html }}" target="_blank" rel="noopener noreferrer">{{ default "Status page" $mp.statusText | html }} &rarr;</a></p>
        {{- end }}
      </div>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "leoflow.maintenanceLabels" . | nindent 4 }}
spec:
  replicas: {{ $mp.replicas }}
  selector:
    matchLabels:
      {{- include "leoflow.maintenanceSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "leoflow.maintenanceSelectorLabels" . | nindent 8 }}
      annotations:
        # subPath mounts do not follow ConfigMap updates: roll the pods instead.
        checksum/page: {{ printf "%s%s%s%s%s%d" $mp.message $mp.operatorText $mp.statusUrl $mp.statusText $image $refresh | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with $mp.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: {{ $image | quote }}
          imagePullPolicy: {{ $mp.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with $mp.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: page
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: page
              mountPath: /usr/share/nginx/html/maintenance.html
              subPath: maintenance.html
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: page
          configMap:
            name: {{ $name }}
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "leoflow.maintenanceLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "leoflow.maintenanceSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
