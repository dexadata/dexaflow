{{- /*
NetworkPolicy of the in-cluster builder (#1883, path 4 of ADR 0073). On by default with the
builder, unlike the control-plane and task policies: build steps run code from
Dockerfiles, and the cloud metadata endpoint would hand them the node's
credentials. A CNI that does not enforce policies ignores it.

- Ingress is denied: the daemon has no port, and `kubectl exec` reaches the pod
  through the kubelet, not the pod network.
- Egress allows DNS, then everything except the cloud metadata range and
  builder.networkPolicy.extraExcept: base images, package indexes and the
  registry the image is pushed to are wherever the people who deploy put them.
*/ -}}
{{- if and .Values.builder.enabled .Values.builder.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "leoflow.builderName" . }}
  namespace: {{ include "leoflow.builderNamespace" . }}
  labels:
    {{- include "leoflow.builderLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "leoflow.builderSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
              {{- with .Values.builder.networkPolicy.extraExcept }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
    {{- with .Values.builder.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
