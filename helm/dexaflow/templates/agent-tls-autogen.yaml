{{- /*
Zero-prereq agent TLS (#690). When agentTLS is enabled but the operator supplied
neither serverCertSecret nor caConfigMap, and agentTLS.autoGenerate is on (the
default), the chart itself mints the agent-gRPC trust material: a self-signed CA
plus a server leaf signed by it. This lets `helm install` bring up a fresh cloud
cluster (EKS Auto Mode, etc.) with TLS ON and NO cert-manager and NO pre-created
Secret — cert-manager / BYO stays the opt-in production path (see values.yaml).

CA STABILITY is the load-bearing invariant. The material is generated exactly
ONCE and reused on every `helm upgrade` via `lookup`: without this, each upgrade
would mint a fresh CA and every already-running agent would fail its gRPC dial
with `x509: certificate signed by unknown authority`. The generated Secret in the
release namespace is the single source of truth; the CA ConfigMap task pods mount
derives its ca.crt from the same material.

NOTE for GitOps (ArgoCD / Flux): a cluster-less `helm template` render cannot
`lookup` the live Secret, so a server-side render followed by client-side apply
would rotate the CA on every sync. GitOps users should use BYO/cert-manager, not
auto-gen — see the agentTLS note in values.yaml.
*/ -}}
{{- if eq (include "leoflow.agentTLS.autoGenerated" .) "true" -}}
{{- $secretName := include "leoflow.agentTLS.serverCertSecretName" . -}}
{{- $caConfigMapName := include "leoflow.agentTLS.caConfigMapName" . -}}
{{- $ns := .Release.Namespace -}}
{{- $cn := include "leoflow.fullname" . -}}
{{- $scheduler := include "leoflow.roleName" (dict "ctx" . "role" "scheduler") -}}
{{- /*
SANs cover every name the agent can dial the control-plane gRPC service by. The
default ("all") Service is the bare fullname; under split (ADR 0049) the gRPC
endpoint moves to the "<fullname>-scheduler" Service, so cover both. Mirrors the
proven set in deploy/k8s/02-install-leoflow.sh. Go's TLS verifier ignores the CN,
so the fullname MUST appear here as a SAN, not only as the Subject CN.
*/ -}}
{{- $dnsNames := list
  $cn
  (printf "%s.%s" $cn $ns)
  (printf "%s.%s.svc" $cn $ns)
  (printf "%s.%s.svc.cluster.local" $cn $ns)
  $scheduler
  (printf "%s.%s.svc" $scheduler $ns)
  (printf "%s.%s.svc.cluster.local" $scheduler $ns)
  "localhost"
-}}
{{- /*
Reuse-or-generate. lookup returns the live Secret during `helm install/upgrade`
(and nil during a cluster-less `helm template`, which is why the auto-gen path is
not for GitOps). On upgrade we re-emit the stored bytes verbatim so the CA never
rotates; only a first install with no existing Secret generates fresh.
*/ -}}
{{- $existing := lookup "v1" "Secret" $ns $secretName -}}
{{- $tlsCrtB64 := "" -}}
{{- $tlsKeyB64 := "" -}}
{{- $caCrtPEM := "" -}}
{{- if and $existing $existing.data (index $existing.data "tls.crt") (index $existing.data "ca.crt") -}}
{{- $tlsCrtB64 = index $existing.data "tls.crt" -}}
{{- $tlsKeyB64 = index $existing.data "tls.key" -}}
{{- $caCrtPEM = index $existing.data "ca.crt" | b64dec -}}
{{- else -}}
{{- $ca := genCA "leoflow-agent-ca" 3650 -}}
{{- /*
The leaf is minted for the full CA lifetime (10y), NOT the usual 1y: auto-gen is
a zero-ops default with no in-chart renewal loop, and lookup-reuse deliberately
freezes the material across upgrades — so a short leaf would silently expire and
break every agent with no operator action having occurred. Fleets that want
rotation use cert-manager (BYO), which owns renewal.
*/ -}}
{{- $cert := genSignedCert $cn (list "127.0.0.1") $dnsNames 3650 $ca -}}
{{- $tlsCrtB64 = $cert.Cert | b64enc -}}
{{- $tlsKeyB64 = $cert.Key | b64enc -}}
{{- $caCrtPEM = $ca.Cert -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "leoflow.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $tlsCrtB64 }}
  tls.key: {{ $tlsKeyB64 }}
  # ca.crt travels with the Secret too so lookup-reuse has a single source of
  # truth for the CA on every subsequent upgrade (the ConfigMap below is derived).
  ca.crt: {{ $caCrtPEM | b64enc }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $caConfigMapName }}
  # Task pods mount this ConfigMap, and they run in taskNamespace (which may
  # differ from the release namespace) — so it must live there, alongside the
  # executor Role (rbac.yaml) and task ServiceAccount.
  namespace: {{ .Values.taskNamespace }}
  labels:
    {{- include "leoflow.labels" . | nindent 4 }}
data:
  ca.crt: |
{{ $caCrtPEM | trimSuffix "\n" | indent 4 }}
{{- end -}}
