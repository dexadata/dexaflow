{{/*
Two Secrets, deliberately, because two consumers need the same credentials at
two different moments in a release.

The DURABLE one is an ordinary tracked resource and is what the control-plane
Deployment reads. It must never be a hook: under Argo CD a before-hook-creation
hook is deleted and recreated in separate passes of one operation, hooks are
excluded from the compared state, and self-heal reconciles only tracked
resources. An operation interrupted between the two halves therefore removes it
permanently while the Application still reports Synced, and the Deployment cannot
start (#1142, observed in production: both replicas in CreateContainerConfigError
for 4h47m with no alert, because Argo's Deployment health can only report
Degraded on ProgressDeadlineExceeded, which a pod that dies from node replacement
rather than a spec change never reaches).

The HOOK one exists only for the migration Job, which runs in the pre-install /
pre-upgrade phase, before the normal manifest is applied, and so cannot read the
durable Secret on a first install. It carries the one key that Job reads and
nothing else, and it is deleted when the hook succeeds so it does not outlive the
operation that created it.

Keys are only included when an inline value is set; an existingSecret means the
operator supplies that credential themselves.
*/}}
{{- $needsDB := and (not .Values.database.existingSecret) .Values.database.url -}}
{{- $needsRedis := and (not .Values.redis.existingSecret) .Values.redis.url -}}
{{- $needsJWT := and (not .Values.auth.existingSecret) .Values.auth.jwtSecret -}}
{{- $needsBootstrap := and (not .Values.bootstrap.existingSecret) .Values.bootstrap.password -}}
{{- $needsSecretKey := and (not .Values.secretKeyExistingSecret) .Values.secretKey -}}
{{- /* The IdP client secret follows jwtSecret exactly: inline here, or out-of-band
     via auth.oidc.existingSecret. It is the one OIDC setting that must never reach
     the oidc ConfigMap, which is readable by anything with get on the namespace and
     is not encrypted at rest. Gated on oidc.enabled as well as on the value being
     set, so a leftover clientSecret in a values file of an install that has since
     turned SSO off does not keep materialising a Secret key nothing reads. */ -}}
{{- $needsOIDC := and .Values.auth.oidc.enabled (not .Values.auth.oidc.existingSecret) .Values.auth.oidc.clientSecret -}}
{{- if or $needsDB $needsRedis $needsJWT $needsBootstrap $needsSecretKey $needsOIDC -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "leoflow.credentialsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "leoflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $needsDB }}
  databaseUrl: {{ .Values.database.url | quote }}
  {{- end }}
  {{- if $needsRedis }}
  redisUrl: {{ .Values.redis.url | quote }}
  {{- end }}
  {{- if $needsJWT }}
  jwtSecret: {{ .Values.auth.jwtSecret | quote }}
  {{- end }}
  {{- if $needsBootstrap }}
  bootstrapPassword: {{ .Values.bootstrap.password | quote }}
  {{- end }}
  {{- if $needsSecretKey }}
  secretKey: {{ .Values.secretKey | quote }}
  {{- end }}
  {{- if $needsOIDC }}
  oidcClientSecret: {{ .Values.auth.oidc.clientSecret | quote }}
  {{- end }}
{{- end -}}
{{- if and $needsDB .Values.migrations.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "leoflow.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "leoflow.labels" . | nindent 4 }}
  annotations:
    # Weight -5 so it precedes the migration Job at weight 0, on both Helm and
    # Argo (which maps pre-install/pre-upgrade to PreSync and the weight to the
    # sync wave). hook-succeeded is safe here and only here: nothing long-lived
    # reads this copy, and both engines delete succeeded hooks after the whole
    # hook phase rather than per hook, so the Job has always run by then.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
stringData:
  databaseUrl: {{ .Values.database.url | quote }}
{{- end }}
