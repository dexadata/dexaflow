{{- /*
ServiceAccount of the builder pod (#1883, path 4 of ADR 0073). Nothing binds a Role to it
and the pod mounts no token: the builder never calls the Kubernetes API.
*/ -}}
{{- if .Values.builder.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "leoflow.builderName" . }}
  namespace: {{ include "leoflow.builderNamespace" . }}
  labels:
    {{- include "leoflow.builderLabels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
