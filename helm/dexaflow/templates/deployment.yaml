{{- /*
The Pro edition (this chart) must use EXTERNAL managed datastores and must
never fall back to Lite's embedded backends (embedded Postgres / in-process XCom
+ tailer — ADR 0026/0027). The server selects embedded backends when no Redis URL
is set, so fail the install loudly with a clear message if Postgres or Redis is
not configured, rather than letting a misconfigured Pro deploy run embedded.
*/}}
{{- if and (not .Values.database.existingSecret) (not .Values.database.url) -}}
{{- fail "database.url or database.existingSecret is required: the Pro edition needs an external Postgres (the embedded datastore is Lite-only)." -}}
{{- end -}}
{{- if and (not .Values.redis.existingSecret) (not .Values.redis.url) -}}
{{- fail "redis.url or redis.existingSecret is required: the Pro edition needs an external Redis (the embedded XCom + log tailer is Lite-only)." -}}
{{- end -}}
{{- /*
Validate `secretKey` length up-front so a wrong key fails the install
with a clear error, not at runtime with a silent 503 on the Connections
API. The server's ParseKey (internal/secrets/cipher.go) accepts exactly
32 raw bytes OR 64-char hex OR base64-of-32-bytes; for chart-time
validation we cover the two unambiguous shapes (raw 32, hex 64) — the
base64 forms vary in padding so we let the server fall through. When
`secretKeyExistingSecret` is set, skip — the chart can't reach into an
out-of-band Secret to validate its contents (operator's responsibility).
*/ -}}
{{- if and .Values.secretKey (not .Values.secretKeyExistingSecret) -}}
{{- $len := len .Values.secretKey -}}
{{- if and (ne $len 32) (ne $len 64) -}}
{{- fail (printf "secretKey must be exactly 32 raw bytes or 64-char hex (got %d chars). Generate with: openssl rand -hex 32 (64 hex chars). See ADR 0019." $len) -}}
{{- end -}}
{{- end -}}
{{- /*
LEOFLOW_UI_EDITION below is the literal "pro" — this chart has no Lite mode — and
guardTLSForEdition refuses boot when a Pro control plane has no gRPC cert/key. So
agentTLS.enabled=false does not deploy a plaintext control plane, it deploys a
crash-looping one, and the operator only learns why from container logs. Refuse at
render instead. Keep the edition literal: it is the sole marker both boot guards
key on, so turning it into a value would hand operators a free one-flag bypass of
the TLS requirement AND of the insecure-secrets rejection. See #459, ADR 0014.
*/ -}}
{{- $agentTLS := .Values.agentTLS | default dict -}}
{{- if not $agentTLS.enabled -}}
{{- fail "agentTLS.enabled=false is not a supported configuration: this chart always deploys the Pro edition (LEOFLOW_UI_EDITION=pro) and the Pro control plane refuses to boot without a gRPC cert/key, so disabling TLS yields a CrashLoopBackOff (\"the Pro edition requires TLS on the agent gRPC channel\"), not a plaintext deployment. Provision a cert (cert-manager) and set agentTLS.serverCertSecret + agentTLS.caConfigMap. For a plaintext local loop use the Lite dev server (`leoflow dev lite`), not this chart." -}}
{{- end -}}
{{- /*
agentTLS pairs a server cert with a CA the task pods trust. The chart supplies
that material one of two ways: BYO (serverCertSecret + caConfigMap, typically
cert-manager) or auto-gen (agent-tls-autogen.yaml mints a stable self-signed CA +
server cert when autoGenerate is on — the #690 zero-prereq default). Only fail
when TLS is on, auto-gen is OFF, and the operator supplied no CA: that is the sole
combination with no CA at all, which would ship a control plane whose task pods
fail the cert chain (x509: unknown authority) and hang. See #280, #690.
*/ -}}
{{- if and .Values.agentTLS.enabled (not .Values.agentTLS.autoGenerate) (not .Values.agentTLS.caConfigMap) -}}
{{- fail "agentTLS has no CA source: task pods need a CA trust bundle to verify the gRPC server cert (otherwise the agent's dial fails x509: certificate signed by unknown authority and tasks hang). Either keep agentTLS.autoGenerate=true (default — the chart mints a stable self-signed CA + server cert, no cert-manager needed, #690), or set agentTLS.serverCertSecret + agentTLS.caConfigMap for BYO/cert-manager (production). See #280, #690." -}}
{{- end -}}
{{- /*
A ReadWriteOnce logs PVC attaches to a single node (ReadWriteOncePod to a single
pod), so more than one control-plane pod mounting it — static (replicaCount > 1)
or via the HPA (autoscaling.enabled with maxReplicas > 1, where replicaCount is
ignored) — leaves the extra pods stuck in ContainerCreating on a Multi-Attach
error while helm reports success. HA must never deploy onto a single-writer
volume silently, so refuse at render. The effective ceiling is maxReplicas when
autoscaling is on, else replicaCount; split adds the scheduler to the api
replicas (leoflow.logMounterCeiling holds the one definition). The message leads
with the recommended HA log path (object-store sink, no PVC at all) and names
RWX as the alternative.
*/ -}}
{{- $logMounters := include "leoflow.logMounterCeiling" . | int -}}
{{- $logsAccessMode := .Values.logs.persistence.accessMode -}}
{{- /*
Both the single-writer refusal below and the `Recreate` strategy auto-selection
in _controlplane-deployment.tpl test this value against the two single-writer
SPELLINGS, which made it a denylist: an empty value, or a typo like
`readWriteMany`, matched neither branch, so it skipped the guard AND the
auto-selection and left the install to fail at the apiserver — or, worse, to
surge a RollingUpdate onto a volume only one pod can hold. Turn it into an
allowlist of the three modes the control plane can actually use. ReadOnlyMany is
a real Kubernetes mode and deliberately not one of them: the control plane
WRITES task logs into this volume. Only checked when a PVC is actually rendered
— with persistence off nothing reads the value, and refusing dead config would
be noise (#905).
*/ -}}
{{- if .Values.logs.persistence.enabled -}}
{{- if not (has $logsAccessMode (list "ReadWriteOnce" "ReadWriteOncePod" "ReadWriteMany")) -}}
{{- fail (printf "logs.persistence.accessMode=%q (kind %s) is not a PersistentVolumeClaim access mode the control plane can use: set ReadWriteOnce (single replica — the chart default), ReadWriteMany (HA, on an RWX StorageClass: EFS, Filestore, Azure Files, NFS, CephFS, Longhorn-rwx) or ReadWriteOncePod. ReadOnlyMany is a real access mode but the control plane WRITES task logs into this volume, so it is refused here too. An unrecognized value matched neither the single-writer refusal nor the Recreate update-strategy auto-selection, so the install rendered clean and then failed at the apiserver — or surged a RollingUpdate onto a volume only one pod can hold. See #905." (toString $logsAccessMode) (kindOf $logsAccessMode)) -}}
{{- end -}}
{{- end -}}
{{- $singleWriter := or (eq $logsAccessMode "ReadWriteOnce") (eq $logsAccessMode "ReadWriteOncePod") -}}
{{- /*
The strategy auto-selection (#868) picks `Recreate` over a single-writer logs
PVC precisely because a RollingUpdate surges a replacement pod before the old
one releases the volume, and the surge pod then hangs in ContainerCreating on a
Multi-Attach error with the rollout never converging. But the auto-selection
only runs when deployment.strategy is EMPTY, so an explicit override walked
straight back into the deadlock — and at the shipped replicaCount of 1 there is
no second pod to serve while the rollout is wedged. The multi-pod version of
this shape is already refused above; this is the same volume physics at one
replica, so refuse it here rather than let helm report success over a control
plane that never comes back (#905).

It judges leoflow.deploymentStrategy, the TRIMMED and validated value the
template renders, not the raw one: comparing the raw value let `RollingUpdate `
past this refusal into a spec the apiserver accepts once YAML drops the space.
That helper also records the assumption both sides rest on — that the chart
renders no maxSurge knob — and what a future PR adding one owes this guard.
*/ -}}
{{- if and (eq (include "leoflow.deploymentStrategy" .) "RollingUpdate") .Values.logs.persistence.enabled $singleWriter -}}
{{- fail (printf "deployment.strategy=RollingUpdate cannot roll over logs.persistence.accessMode=%s: a RollingUpdate surges a replacement pod before the old one is gone, and a single-writer volume attaches to one node/pod, so the surge pod hangs in ContainerCreating on a Multi-Attach error and the rollout never converges — on a single replica that is a control plane that never comes back, while helm reports success. Leave deployment.strategy empty and the chart auto-selects Recreate for a single-writer logs PVC, or move the logs off it: logs.persistence.enabled=false with logs.sink.provider=s3|gcs (recommended), or logs.persistence.accessMode=ReadWriteMany on an RWX StorageClass. See #905." $logsAccessMode) -}}
{{- end -}}
{{- if and (gt $logMounters 1) .Values.logs.persistence.enabled $singleWriter -}}
{{- fail (printf "more than one control-plane pod would mount the logs PVC (replicaCount > 1, autoscaling.maxReplicas > 1, or split.enabled), but logs.persistence.accessMode=%s attaches the volume to a single node/pod: the extra pods hang in ContainerCreating with a Multi-Attach error while the install reports success. HA needs a log store every replica can write. Recommended: set logs.persistence.enabled=false and ship task logs to object storage (logs.sink.provider=s3|gcs with logs.sink.bucket). Alternative: logs.persistence.accessMode=ReadWriteMany on an RWX StorageClass (EFS, Filestore, Azure Files, NFS, CephFS, Longhorn-rwx). Or keep a single replica. See helm/dexaflow/examples/values-ha.yaml." $logsAccessMode) -}}
{{- end -}}
{{- /*
Split with no PVC and the disk sink is not risky, it is broken: the scheduler pod
is the only writer and it writes into its own emptyDir, while every api pod
serves logs from its own (empty) emptyDir — no task log is ever readable from the
API/UI, and nothing in the cluster reports it. Non-split multi-replica emptyDir is
merely unreliable (the leader's own API can still read what it wrote), so that
shape gets a NOTES warning instead of a refusal.
*/ -}}
{{- if and .Values.split.enabled (not .Values.logs.persistence.enabled) (eq .Values.logs.sink.provider "disk") -}}
{{- fail "split.enabled with logs.persistence.enabled=false and logs.sink.provider=disk cannot serve task logs: the scheduler pod writes them into its own emptyDir and every api pod reads from its own, so no task log is ever readable from the API/UI. Ship task logs to object storage (logs.sink.provider=s3|gcs with logs.sink.bucket), or use a ReadWriteMany logs PVC (logs.persistence.enabled=true, logs.persistence.accessMode=ReadWriteMany). See helm/dexaflow/examples/values-ha.yaml." -}}
{{- end -}}

{{- /*
Two different rules, and a refusal has to name the right one. Upstream validation
is 0 < seconds <= terminationGracePeriodSeconds, so a sleep ABOVE the grace
renders cleanly and then fails the install at the apiserver — the same shape as
every other combination this file refuses at render time. A sleep EQUAL to the
grace is VALID upstream; the `ge` below refuses it as the chart's own policy,
because the sleep runs before SIGTERM and that same grace still has to cover the
~35s of shutdown that follows, so spending all of it on the sleep guarantees a
SIGKILL mid-drain. Checked against the EFFECTIVE grace: the chart ships
terminationGracePeriodSeconds unset, which means the apiserver's own default of
30, not "no limit". Deliberately NOT gated on the apiserver version the way the
hook itself is (#918): below 1.30 the hook does not render, but the value pair is
still a contradiction the operator asked for, and telling them now beats a
rejected install on their next control-plane upgrade.
*/ -}}
{{- $preStopSleep := int .Values.deployment.preStopSleepSeconds -}}
{{- if gt $preStopSleep 0 -}}
{{- $grace := 30 -}}
{{- $graceNote := "Kubernetes' own default, because the rendered pod spec carries no terminationGracePeriodSeconds" -}}
{{- /* Model the RENDERED spec, not the raw value. _controlplane-deployment.tpl
     emits the field under `{{ with .Values.terminationGracePeriodSeconds }}`,
     which omits it for nil, 0 and "" alike — so on all three the pod spec
     carries no grace and the apiserver applies its own 30, which is what the
     guard has to reason about. Matching `with`'s truthiness here by
     construction is what keeps the two from disagreeing: a bare
     `terminationGracePeriodSeconds:` key in a layered values file and Helm's
     documented `--set terminationGracePeriodSeconds=null` both produce nil, and
     reading nil as "the grace is 0" refused a legal install for a reason the
     rendered spec never had (#918). An explicit 0 lands the same way on
     purpose: the renderer omits it, so 30 applies. */ -}}
{{- if .Values.terminationGracePeriodSeconds -}}
{{- $grace = int .Values.terminationGracePeriodSeconds -}}
{{- $graceNote = "the terminationGracePeriodSeconds this install sets" -}}
{{- end -}}
{{- if ge $preStopSleep $grace -}}
{{- fail (printf "deployment.preStopSleepSeconds=%d does not fit the effective termination grace of %ds (%s). Kubernetes validates the preStop sleep as 0 < seconds <= terminationGracePeriodSeconds, so a sleep ABOVE the grace is rejected by the apiserver and the install fails even though the render looked fine. A sleep EQUAL to the grace the apiserver accepts; this chart refuses it too, because the sleep runs BEFORE SIGTERM and that same grace still has to cover the shutdown that follows (HTTP <=10s + dispatch drain <=15s + gRPC stop <=10s, about 35s if every bound is hit), so spending the whole grace on the sleep guarantees a SIGKILL mid-drain. Give the shutdown real headroom rather than a second: raise terminationGracePeriodSeconds (the HA profile ships 60) or lower deployment.preStopSleepSeconds." $preStopSleep $grace $graceNote) -}}
{{- end -}}
{{- end -}}

{{- /*
The startup gate has one job: give boot MORE room than the liveness probe gave
it. Liveness and readiness both target the API listener, which binds at the END
of boot, so before the gate existed the kubelet answered a slow or stuck boot by
restarting the container (#1083). A startup budget at or below the liveness
budget does not undo that; it only moves the kill from one probe to the other,
and the loop is exactly where it was, now wearing a fix. The tests pin the
shipped numbers, which is a different thing: an operator reaches this with a
single `--set probes.startup.failureThreshold`, and the render is the only place
that sees both budgets at once.
*/ -}}
{{- /* `helm upgrade --reuse-values` from a chart that predates probes.startup
     hands these templates a values tree with no such key, so every dereference
     below has to tolerate its absence or the render fails outright for every
     operator using that flag. Absent means "the gate this chart added is not
     configured", which is the same as disabled. */ -}}
{{- if and .Values.probes.startup .Values.probes.startup.enabled -}}
{{- $startupBudget := mul (int .Values.probes.startup.periodSeconds) (int .Values.probes.startup.failureThreshold) -}}
{{- $livenessBudget := add (int .Values.probes.liveness.initialDelaySeconds) (mul (int .Values.probes.liveness.periodSeconds) (int .Values.probes.liveness.failureThreshold)) -}}
{{- if le $startupBudget $livenessBudget -}}
{{- fail (printf "probes.startup gives boot a budget of %ds (periodSeconds %d * failureThreshold %d), which is not more than the %ds the liveness probe would have allowed (initialDelaySeconds %d + periodSeconds %d * failureThreshold %d). The startup gate exists to give a slow boot MORE room than liveness did: at or below the liveness budget it only changes which probe kills the container, and the restart loop leoflow hit in #1083 stays exactly where it was. Raise probes.startup.failureThreshold or probes.startup.periodSeconds, or set probes.startup.enabled=false to hand the boot back to liveness deliberately." $startupBudget (int .Values.probes.startup.periodSeconds) (int .Values.probes.startup.failureThreshold) $livenessBudget (int .Values.probes.liveness.initialDelaySeconds) (int .Values.probes.liveness.periodSeconds) (int .Values.probes.liveness.failureThreshold)) -}}
{{- end -}}
{{- end -}}

{{- /*
Warm worker pools reuse ONE pod — holding ONE live credential — across many
attempts, so per-attempt identity is the only thing that stops a superseded
attempt from still resolving secrets. That identity exists only when the agent
trades a projected ServiceAccount token for a per-attempt JWT (exchange
transport) AND the liveness gate actually denies rather than just logging
(enforce). ADR 0058 D2 therefore makes both a hard prerequisite, and the server
validates the same coupling fail-closed at boot. Rendering the mismatch would
not produce a less-safe deployment — it would produce a CrashLoopBackOff whose
cause is visible only in container logs. Refuse here instead, in the chart's
vocabulary, so the operator sees which values to change.
*/ -}}
{{- if .Values.execution.warmPoolsEnabled -}}
{{- if or (ne .Values.auth.agentTokenTransport "exchange") (ne .Values.auth.secretLivenessMode "enforce") -}}
{{- fail "execution.warmPoolsEnabled requires auth.agentTokenTransport=exchange AND auth.secretLivenessMode=enforce: a warm pod reuses one pod across many attempts, and only a per-attempt token that dies with its attempt keeps a superseded attempt from still resolving secrets (ADR 0058 D2). The server enforces the same coupling at boot, so this install would CrashLoopBackOff instead of running warm pools." -}}
{{- end -}}
{{- end -}}
{{- /*
extraEnv is an escape hatch for settings the chart does not model — not a way
around the guard above. These three variables are the ones the chart validates
against each other, so an extraEnv entry redefining any of them could enable
warm pools while the render guard looked at the (still safe) values. Refuse it.
Deliberately only these three: a blanket "no shadowing any chart-managed name"
check would need a list that drifts out of date, and shadowing a non-coupled
variable is an operator's own business.
*/ -}}
{{- $guarded := list "LEOFLOW_EXECUTION_WARM_POOLS_ENABLED" "LEOFLOW_AUTH_AGENT_TOKEN_TRANSPORT" "LEOFLOW_AUTH_SECRET_LIVENESS_MODE" -}}
{{- range .Values.extraEnv -}}
{{- if has .name $guarded -}}
{{- fail (printf "extraEnv must not set %s: warm pools and the agent-credential posture they depend on are coupled by a render-time guard (ADR 0058 D2), and setting them through the escape hatch would skip it. Use execution.warmPoolsEnabled, auth.agentTokenTransport and auth.secretLivenessMode instead." .name) -}}
{{- end -}}
{{- end -}}

{{- /*
config.cors.allowedOrigins shipped with a documented default of `["*"]` while no
template read it (#1144), so that exact value is what an install started from
`helm show values` carries verbatim in its own values file while the server has
actually been running its own default (http://localhost:8080). Now that the key
renders, accepting the wildcard would take such a deployment to "every origin
allowed" on the next `helm upgrade`, with nothing in its values changing to show
for it. Refuse at render time: that is the one channel a GitOps sync surfaces,
since Argo CD never renders NOTES.txt. The UI is served same-origin with the
API, so the wildcard buys nothing an explicit origin list does not.

`helm upgrade --reuse-values` reaches this with nobody having set the key:
that flag does not merge the new chart's defaults, it rebuilds the previous
release's COALESCED values, so the old chart's own `["*"]` default is what
arrives here. The refusal is still the right answer, because the alternative is
rendering a wildcard the operator never chose, but the message has to name the
flag or it sends them looking for a value that is not in their values file.
*/ -}}
{{- $corsOrigins := .Values.config.cors.allowedOrigins | default list -}}
{{- /*
Normalise first: `--set config.cors.allowedOrigins=*` yields a bare string, and
sprig's `join` returns a scalar unchanged, so that shape reaches the env var as a
working wildcard while `has` on a non-slice would never see it.
*/ -}}
{{- if not (kindIs "slice" $corsOrigins) -}}
{{- $corsOrigins = list $corsOrigins -}}
{{- end -}}
{{- if has "*" $corsOrigins -}}
{{- fail "config.cors.allowedOrigins must not contain \"*\": that lets a page on any origin read this API's responses cross-origin, and no template read this key before #1144, so rendering the wildcard would silently widen an install that has been running the server default (http://localhost:8080). List the exact origins the UI is served from. Dexaflow serves its UI same-origin with the API, so most deployments need no entry at all and should leave the list empty. If you want the wildcard deliberately, set LEOFLOW_SERVER_CORS_ALLOWED_ORIGINS through extraEnv. If you never set this key at all and are seeing this on an upgrade, you used --reuse-values: it does not merge the new chart's defaults, it rebuilds the PREVIOUS release's coalesced values, so a 0.4.6 release carries that chart's [\"*\"] default into this render even though no template ever read it. Re-run with --reset-then-reuse-values, which starts from this chart's defaults and lays your own values over them." -}}
{{- end -}}

{{- /*
OIDC/SSO (#1143). The server's validateOIDC fails boot closed on a missing
issuer, client id, redirect URL or tenant pin, and reports every miss in one
error on purpose, each boot failure on Kubernetes costs a values edit, an
upgrade and a rollout to learn the next one. Do the same check at render time,
for the same reason one step earlier: a chart that renders an unsatisfiable SSO
config hands the operator a CrashLoopBackOff whose cause is visible only in
container logs, and a GitOps sync shows a green apply over it.

The tenant pin is in the required set because it decides whether ANY login can
succeed, not merely how a login is labelled: a claim value that is absent or
unmapped is rejected 403 and never falls back to the default tenant, so an
install missing it authenticates everyone and admits no one, and the cause is
audited into a system that, in an SSO-only deployment, nobody can log in to read.

Collected and reported together rather than one `fail` per key, mirroring the
server's own message, so one render names everything that is missing.
*/ -}}
{{- $oidc := .Values.auth.oidc -}}
{{- if $oidc.enabled -}}
{{- $missing := list -}}
{{- if not $oidc.issuer -}}{{- $missing = append $missing "auth.oidc.issuer" -}}{{- end -}}
{{- if not $oidc.clientId -}}{{- $missing = append $missing "auth.oidc.clientId" -}}{{- end -}}
{{- if not $oidc.redirectUrl -}}{{- $missing = append $missing "auth.oidc.redirectUrl" -}}{{- end -}}
{{- if not $oidc.tenantClaim -}}{{- $missing = append $missing "auth.oidc.tenantClaim" -}}{{- end -}}
{{- if not $oidc.tenantClaims -}}{{- $missing = append $missing "auth.oidc.tenantClaims" -}}{{- end -}}
{{- if $missing -}}
{{- fail (printf "auth.oidc.enabled requires %s to be set: the server refuses to boot without them (internal/config/server.go validateOIDC), so this install would CrashLoopBackOff rather than serve SSO. tenantClaim + tenantClaims are the TENANT PIN and are required together, tenantClaim names the claim carrying the tenant (`tid` on Entra, `hd` on Google Workspace) and tenantClaims maps each value of it you accept to a Dexaflow tenant. Without the pin every SSO login is rejected with a generic 403 (audited as tenant_not_allowed) that never falls back to the default tenant. tenantClaims is a MAP: the chart delivers it in a mounted ConfigMap because no LEOFLOW_AUTH_OIDC_* env var can carry one. To keep serving password logins while SSO is configured, set auth.oidc.enabled=false." (join ", " $missing)) -}}
{{- end -}}
{{- if not (hasPrefix "https://" $oidc.issuer) -}}
{{- fail (printf "auth.oidc.issuer must be an https:// URL (got %q): discovery and the JWKS fetch that verifies every ID token run over it, and the server rejects a non-https issuer at boot. Use the IdP's issuer exactly as published in its /.well-known/openid-configuration." $oidc.issuer) -}}
{{- end -}}
{{- /*
extraEnv renders after the chart-managed block and last-wins, so an entry setting
LEOFLOW_CONFIG would repoint the server at a file that is not the mounted one,
and the tenant pin, which has no other route, would vanish with it. The failure
then looks exactly like a missing pin the operator can see configured in the
ConfigMap next to the pod. Refuse it, narrowly and only while SSO is on: pointing
LEOFLOW_CONFIG somewhere of your own is a legitimate thing to do in an install
that does not depend on this chart's file.
*/ -}}
{{- range .Values.extraEnv -}}
{{- if eq .name "LEOFLOW_CONFIG" -}}
{{- fail "extraEnv must not set LEOFLOW_CONFIG while auth.oidc.enabled: it renders after the chart-managed env and wins, repointing the server away from the mounted OIDC ConfigMap, which is the only route auth.oidc.tenantClaims and auth.oidc.roleMappings have, since neither map can travel in an env var. Boot would then fail on a tenant pin the operator can see sitting in the ConfigMap. Put the maps in auth.oidc.tenantClaims / auth.oidc.roleMappings instead." -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- /*
Render one "all" Deployment (default, byte-identical to the pre-0049 monolith) or,
when split.enabled, separate api and scheduler Deployments — ADR 0049. The
scheduler is always a single leader (ADR 0009), so its replica count is pinned to 1
here regardless of split.scheduler.replicaCount.
*/ -}}
{{- if .Values.split.enabled }}
{{- include "leoflow.controlPlaneDeployment" (dict "ctx" . "role" "api" "replicas" .Values.split.api.replicaCount) | nindent 0 }}
---
{{- include "leoflow.controlPlaneDeployment" (dict "ctx" . "role" "scheduler" "replicas" 1) | nindent 0 }}
{{- else }}
{{- include "leoflow.controlPlaneDeployment" (dict "ctx" . "role" "all" "replicas" .Values.replicaCount) | nindent 0 }}
{{- end }}
