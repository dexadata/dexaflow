{{/*
The OIDC config file, deliberately PARTIAL, and deliberately the only file this
chart mounts as server config.

It carries exactly the two settings that have no other route into the server:
auth.oidc.tenant_claims and auth.oidc.role_mappings are maps, and viper binds
environment variables only for the scalar leaves registered in serverDefaults. The
two maps are not registered there (a Google Workspace `hd` key is a dotted domain,
and viper's "." key delimiter would split it into nested maps and fail to decode,
#826), so the server decodes them straight from the raw YAML named by
LEOFLOW_CONFIG. Without this file `auth.provider: oidc` cannot boot: validateOIDC
requires the tenant pin and reports the miss with a hint that says, correctly, that
no LEOFLOW_AUTH_OIDC_* variable can carry the map (#1143).

Everything else stays on the env-var path the rest of this chart uses, and keeping
the file partial is what makes the two halves safe to combine: viper ranks env
ABOVE the config file, and a key absent from the file simply keeps whatever value
it already had. So this file can never override an env var the Deployment sets, and
can never blank a server default by mentioning a section it does not fill in.

Keys are quoted on render because they are user-supplied and dotted by nature: an
`hd` value is always a domain, and an IdP group name may be dotted too. The
server's own regression test for #826 feeds it exactly this shape.

Not a helm hook, unlike secret.yaml: the migration Job has no use for OIDC config,
so this only has to exist before the Deployment's pods start, which the normal
manifest ordering already guarantees.
*/}}
{{- if .Values.auth.oidc.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "leoflow.oidcConfigMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "leoflow.labels" . | nindent 4 }}
data:
  config.yaml: |
    # Rendered by the leoflow chart. Partial on purpose: every other server
    # setting arrives as a LEOFLOW_* environment variable, which outranks this
    # file. Edit helm values, not this ConfigMap, a `helm upgrade` replaces it.
    auth:
      oidc:
        tenant_claims:
          {{- range $claimValue, $tenant := .Values.auth.oidc.tenantClaims }}
          {{ $claimValue | quote }}: {{ $tenant | quote }}
          {{- end }}
        {{- if .Values.auth.oidc.roleMappings }}
        role_mappings:
          {{- range $group, $role := .Values.auth.oidc.roleMappings }}
          {{ $group | quote }}: {{ $role | quote }}
          {{- end }}
        {{- end }}
{{- end -}}
