suite: the startup probe survives an upgrade from a chart that never had it
templates:
  - deployment.yaml
  - secret.yaml
release:
  name: leoflow
# The pre-rename naming (what charts/leoflow renders), which existing
# installs depend on; default dexaflow naming is in chart_name_test.yaml.
set:
  nameOverride: leoflow
  database.url: postgres://h/d
  redis.url: redis://h/0
  auth.jwtSecret: jwt
tests:
  # `helm upgrade --reuse-values` does NOT merge the new chart's defaults: helm
  # rebuilds the previous release's coalesced values and uses them as the new
  # chart's values. probes.startup is the only key this chart gained since 0.4.6,
  # so upgrading a 0.4.6 release with that flag hands the new templates a values
  # tree in which probes.startup does not exist at all.
  #
  # Dereferencing it unguarded turned that into
  #   nil pointer evaluating interface {}.enabled
  # which is a hard render failure for every operator using the flag. Nothing
  # caught it because every test and every CI install starts from the chart's own
  # defaults, where the key is always present.
  #
  # `probes.startup: null` is a stand-in for that absence and not a model of the
  # upgrade: it removes ONE key while every other value still comes from this
  # chart's defaults, whereas the real flag replaces the whole tree with the old
  # release's. It pins this dereference and nothing else. What the flag does to
  # the chart as a whole is only visible to a harness that renders these
  # templates with an older release's values as the chart's own defaults.
  - it: an upgrade whose values predate the key still renders
    set:
      probes.startup: null
    template: deployment.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: and the gate is simply absent rather than half-rendered
    set:
      probes.startup: null
    template: deployment.yaml
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].startupProbe

  # The likely next move after an upgrade renders without the gate: reach for the
  # one flag whose name matches the feature. Under `--reuse-values` that produces
  # probes.startup = {enabled: true} and NOTHING else, because periodSeconds and
  # failureThreshold live only in the new chart's defaults, which that flag
  # discards. The budget guard is what stands between that and a container spec
  # carrying `periodSeconds:` with no value, so it has to stay OUTSIDE the
  # enabled check's siblings and fire on the partial map.
  #
  # The siblings are nulled by name because this harness deep-merges `set` into
  # the chart's defaults rather than replacing the subtree, so `enabled: true`
  # alone would quietly keep the shipped 5 and 36. `int` reads an explicit null
  # and an absent key identically, which is what makes the two shapes the same
  # here.
  - it: half-enabling the gate on an upgraded value tree is refused, not rendered
    set:
      probes.startup:
        enabled: true
        periodSeconds: null
        failureThreshold: null
    template: deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: 'probes.startup gives boot a budget of 0s (periodSeconds 0 * failureThreshold 0), which is not more than the 70s the liveness probe would have allowed (initialDelaySeconds 10 + periodSeconds 20 * failureThreshold 3). The startup gate exists to give a slow boot MORE room than liveness did: at or below the liveness budget it only changes which probe kills the container, and the restart loop leoflow hit in #1083 stays exactly where it was. Raise probes.startup.failureThreshold or probes.startup.periodSeconds, or set probes.startup.enabled=false to hand the boot back to liveness deliberately.'
