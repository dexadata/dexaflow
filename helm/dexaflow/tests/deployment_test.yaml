suite: control-plane Deployment env + security context
templates:
  # secret.yaml is in scope so the deployment's `checksum/secret` annotation
  # (#316) can resolve its `include` reference. helm-unittest only loads the
  # templates it sees here; an include of an out-of-scope template raises
  # `no template "..." associated`.
  - deployment.yaml
  - secret.yaml
release:
  name: leoflow
# The chart always deploys the Pro edition and now refuses to render without agent
# TLS (#459), so every case needs a cert pair. Set it once here; the cases that
# exercise the TLS wiring itself override these per-test.
# The pre-rename naming (what charts/leoflow renders), which existing
# installs depend on; default dexaflow naming is in chart_name_test.yaml.
set:
  nameOverride: leoflow
  agentTLS.enabled: true
  agentTLS.serverCertSecret: leoflow-tls
  agentTLS.caConfigMap: leoflow-ca
tests:
  - it: fails the install if database.url AND database.existingSecret are both empty
    template: deployment.yaml
    set:
      redis.url: redis://host/0
      auth.jwtSecret: jwt
    asserts:
      - failedTemplate:
          errorMessage: "database.url or database.existingSecret is required: the Pro edition needs an external Postgres (the embedded datastore is Lite-only)."

  - it: fails the install if redis.url AND redis.existingSecret are both empty
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      auth.jwtSecret: jwt
    asserts:
      - failedTemplate:
          errorMessage: "redis.url or redis.existingSecret is required: the Pro edition needs an external Redis (the embedded XCom + log tailer is Lite-only)."

  - it: omits LEOFLOW_SECRET_KEY env entry when neither secretKey nor secretKeyExistingSecret is set
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      # NOT setting secretKey / secretKeyExistingSecret
    asserts:
      - hasDocuments:
          count: 1
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_SECRET_KEY

  - it: wires LEOFLOW_SECRET_KEY from chart-managed Secret when secretKey is inline
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      secretKey: leoflow-unittest-secretkey-32by!
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: leoflow-credentials
                key: secretKey

  - it: wires LEOFLOW_SECRET_KEY from existingSecret when secretKeyExistingSecret is set
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      secretKeyExistingSecret: my-external-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: my-external-key
                key: secretKey

  - it: fails the install with a clear error when secretKey is set but wrong length (not 32 raw bytes / 64 hex chars)
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      secretKey: too-short-12345
    asserts:
      - failedTemplate:
          errorMessage: "secretKey must be exactly 32 raw bytes or 64-char hex (got 15 chars). Generate with: openssl rand -hex 32 (64 hex chars). See ADR 0019."

  - it: accepts 32-byte raw secretKey (AES-256)
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      secretKey: leoflow-unittest-secretkey-32by!
    asserts:
      - hasDocuments:
          count: 1

  - it: accepts 64-char hex secretKey (AES-256 encoded)
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      secretKey: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef  # gitleaks:allow — fixture, all-hex zeros pattern, not a credential
    asserts:
      - hasDocuments:
          count: 1

  - it: skips length validation when secretKeyExistingSecret is set (chart can't validate an out-of-band Secret)
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      secretKey: too-short-12345          # would normally fail
      secretKeyExistingSecret: my-key     # but the existingSecret takes precedence; chart can't validate it
    asserts:
      - hasDocuments:
          count: 1

  # #316: the pod template carries a `checksum/secret` annotation derived from
  # the chart-rendered Secret. Without it, `helm upgrade` that only changes
  # database.url / redis.url / jwtSecret (the values backing the Secret's
  # keys via secretKeyRef) updates the Secret but leaves the running pod on
  # the OLD values until a manual `kubectl rollout restart`. The annotation
  # tying the podTemplate's spec hash to the Secret content closes that gap.
  - it: "#316 — pod template carries a checksum/secret annotation tied to the rendered Secret"
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/secret"]
      # The checksum is a 64-char hex sha256 — pinpoint shape (not value)
      # so a value change here is intentional, not flaky.
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/secret"]
          pattern: "^[a-f0-9]{64}$"

  - it: "#316 — checksum/secret CHANGES when a Secret-backed value changes (proves the rollout-trigger)"
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt-original-value
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/secret"]
          # The exact hash here is the snapshot of THIS values set; the next
          # test changes one value and expects a different hash. Without the
          # annotation both renders would have identical podTemplate specs
          # and `helm upgrade` would silently leave the old credentials live.
          pattern: "^[a-f0-9]{64}$"

  # #315 — Postgres CA injection knob. When database.caConfigMap is set, the
  # podTemplate gains a `db-ca` ConfigMap volume + a volumeMount at
  # /etc/leoflow/db-ca. Operators then pin
  # `sslmode=verify-full&sslrootcert=/etc/leoflow/db-ca/ca.crt` on the DSN —
  # pgx reads sslrootcert natively, so no Go-side wiring is needed.
  - it: "#315 — no db-ca volume rendered when database.caConfigMap is unset (regression guard)"
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
    asserts:
      - notExists:
          path: spec.template.spec.volumes[?(@.name == 'db-ca')]
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == 'db-ca')]

  - it: "#315 — database.caConfigMap mounts /etc/leoflow/db-ca/ca.crt readonly"
    template: deployment.yaml
    set:
      database.url: "postgres://h/d?sslmode=verify-full&sslrootcert=/etc/leoflow/db-ca/ca.crt"
      database.caConfigMap: managed-pg-ca
      redis.url: redis://h/0
      auth.jwtSecret: jwt
    asserts:
      # Volume: a ConfigMap named after the operator's ConfigMap, exposing
      # just the ca.crt key.
      - contains:
          path: spec.template.spec.volumes
          content:
            name: db-ca
            configMap:
              name: managed-pg-ca
              items:
                - key: ca.crt
                  path: ca.crt
      # VolumeMount: mounted readonly at the well-known path the DSN expects.
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: db-ca
            mountPath: /etc/leoflow/db-ca
            readOnly: true

  # #312 — managed-Redis verified TLS requires an operator-supplied CA bundle.
  # Without `redis.caConfigMap` set, NOTHING about the CA injection appears on
  # the rendered pod: no LEOFLOW_REDIS_CA_FILE env var, no volume, no
  # volumeMount. That is the regression guard — an unrelated chart change must
  # not start silently mounting an unconfigured CA path.
  - it: "#312 — Redis CA wiring is absent when redis.caConfigMap is unset (default)"
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: rediss://h/0
      auth.jwtSecret: jwt
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_REDIS_CA_FILE
            value: /etc/leoflow/redis-ca/ca.crt
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: redis-ca
            mountPath: /etc/leoflow/redis-ca
            readOnly: true

  # #312 — When redis.caConfigMap is set, all three pieces must appear together:
  # env var pointing at the mount path, container volumeMount at that path,
  # and a pod-level volume sourcing the named ConfigMap.
  - it: "#312 — redis.caConfigMap wires env + volumeMount + volume in one go"
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: rediss://h/0
      auth.jwtSecret: jwt
      redis.caConfigMap: redis-ca-bundle
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_REDIS_CA_FILE
            value: /etc/leoflow/redis-ca/ca.crt
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: redis-ca
            mountPath: /etc/leoflow/redis-ca
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: redis-ca
            configMap:
              name: redis-ca-bundle

  - it: pod + container securityContext pin runAsNonRoot + UID 65532 (distroless nonroot)
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 65532
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 65532
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  # The chart hardcodes LEOFLOW_UI_EDITION=pro, and the Pro server refuses to
  # boot without a gRPC cert/key. So agentTLS.enabled=false cannot produce a
  # plaintext deployment — only a crash-looping one. Fail at render instead.
  - it: fails when agentTLS.enabled is false (chart is always Pro)
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      agentTLS.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "agentTLS.enabled=false is not a supported configuration: this chart always deploys the Pro edition (LEOFLOW_UI_EDITION=pro) and the Pro control plane refuses to boot without a gRPC cert/key, so disabling TLS yields a CrashLoopBackOff (\"the Pro edition requires TLS on the agent gRPC channel\"), not a plaintext deployment. Provision a cert (cert-manager) and set agentTLS.serverCertSecret + agentTLS.caConfigMap. For a plaintext local loop use the Lite dev server (`leoflow dev lite`), not this chart."

  # Nulling the whole map (`--set agentTLS=null`) used to render a raw
  # "nil pointer evaluating interface {}.enabled" instead of the guard message.
  # It must land on the same actionable error as enabled=false.
  - it: fails with the guard message when agentTLS is nulled entirely
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      agentTLS: null
    asserts:
      - failedTemplate:
          errorMessage: "agentTLS.enabled=false is not a supported configuration: this chart always deploys the Pro edition (LEOFLOW_UI_EDITION=pro) and the Pro control plane refuses to boot without a gRPC cert/key, so disabling TLS yields a CrashLoopBackOff (\"the Pro edition requires TLS on the agent gRPC channel\"), not a plaintext deployment. Provision a cert (cert-manager) and set agentTLS.serverCertSecret + agentTLS.caConfigMap. For a plaintext local loop use the Lite dev server (`leoflow dev lite`), not this chart."

  # #280/#690: with autoGenerate OFF and no CA supplied, agentTLS.enabled would
  # silently ship a control plane whose task pods can't verify the server cert →
  # x509 unknown-authority. That is the ONLY no-CA combination now: auto-gen
  # (default) provides one otherwise. Fail loudly here.
  - it: fails when agentTLS.enabled, autoGenerate off, and no CA supplied (#280/#690)
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      agentTLS.enabled: true
      agentTLS.autoGenerate: false
      agentTLS.serverCertSecret: ""
      agentTLS.caConfigMap: ""
    asserts:
      - failedTemplate:
          errorMessage: "agentTLS has no CA source: task pods need a CA trust bundle to verify the gRPC server cert (otherwise the agent's dial fails x509: certificate signed by unknown authority and tasks hang). Either keep agentTLS.autoGenerate=true (default — the chart mints a stable self-signed CA + server cert, no cert-manager needed, #690), or set agentTLS.serverCertSecret + agentTLS.caConfigMap for BYO/cert-manager (production). See #280, #690."

  - it: renders when agentTLS.enabled with both serverCertSecret and caConfigMap (BYO, #280)
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      agentTLS.enabled: true
      agentTLS.serverCertSecret: leoflow-tls
      agentTLS.caConfigMap: leoflow-ca
    asserts:
      - hasDocuments:
          count: 1
      # BYO material is mounted verbatim.
      - contains:
          path: spec.template.spec.volumes
          content:
            name: grpc-tls
            secret:
              secretName: leoflow-tls

  # #690: the zero-prereq default. agentTLS.enabled with NEITHER a server cert
  # Secret nor a CA ConfigMap must NOT fail — autoGenerate (default true) mints
  # them, and the Deployment mounts the generated "<fullname>-agent-tls" Secret.
  - it: auto-generates and wires the cert when agentTLS.enabled and nothing is supplied (#690)
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      agentTLS.enabled: true
      agentTLS.serverCertSecret: ""
      agentTLS.caConfigMap: ""
    asserts:
      - hasDocuments:
          count: 1
      - contains:
          path: spec.template.spec.volumes
          content:
            name: grpc-tls
            secret:
              secretName: leoflow-agent-tls
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_EXECUTOR_AGENT_TLS_CA_CONFIGMAP
            value: leoflow-agent-ca

  # #282: replicaCount>1 with a ReadWriteOnce logs PVC → the second pod hangs on
  # a Multi-Attach error, silently.
  - it: fails when replicaCount>1 with a ReadWriteOnce logs PVC (#282)
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      replicaCount: 2
      logs.persistence.enabled: true
      logs.persistence.accessMode: ReadWriteOnce
    asserts:
      - failedTemplate:
          errorMessage: "more than one control-plane pod would mount the logs PVC (replicaCount > 1, autoscaling.maxReplicas > 1, or split.enabled), but logs.persistence.accessMode=ReadWriteOnce attaches the volume to a single node/pod: the extra pods hang in ContainerCreating with a Multi-Attach error while the install reports success. HA needs a log store every replica can write. Recommended: set logs.persistence.enabled=false and ship task logs to object storage (logs.sink.provider=s3|gcs with logs.sink.bucket). Alternative: logs.persistence.accessMode=ReadWriteMany on an RWX StorageClass (EFS, Filestore, Azure Files, NFS, CephFS, Longhorn-rwx). Or keep a single replica. See helm/dexaflow/examples/values-ha.yaml."

  # #282 (HPA path): autoscaling.enabled ignores replicaCount and can scale past 1
  # at RUNTIME, hitting the same Multi-Attach on a ReadWriteOnce PVC — the static
  # replicaCount check alone would miss it (found in the criterious review).
  - it: fails when autoscaling.maxReplicas>1 with a ReadWriteOnce logs PVC (#282)
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      replicaCount: 1                 # ignored when autoscaling is on
      autoscaling.enabled: true
      autoscaling.maxReplicas: 3
      logs.persistence.enabled: true
      logs.persistence.accessMode: ReadWriteOnce
    asserts:
      - failedTemplate:
          errorMessage: "more than one control-plane pod would mount the logs PVC (replicaCount > 1, autoscaling.maxReplicas > 1, or split.enabled), but logs.persistence.accessMode=ReadWriteOnce attaches the volume to a single node/pod: the extra pods hang in ContainerCreating with a Multi-Attach error while the install reports success. HA needs a log store every replica can write. Recommended: set logs.persistence.enabled=false and ship task logs to object storage (logs.sink.provider=s3|gcs with logs.sink.bucket). Alternative: logs.persistence.accessMode=ReadWriteMany on an RWX StorageClass (EFS, Filestore, Azure Files, NFS, CephFS, Longhorn-rwx). Or keep a single replica. See helm/dexaflow/examples/values-ha.yaml."

  - it: renders with autoscaling.maxReplicas>1 when the logs PVC is ReadWriteMany (#282)
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      autoscaling.enabled: true
      autoscaling.maxReplicas: 3
      logs.persistence.enabled: true
      logs.persistence.accessMode: ReadWriteMany
    asserts:
      - hasDocuments:
          count: 1

  - it: renders when replicaCount>1 with a ReadWriteMany logs PVC (#282)
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      replicaCount: 2
      logs.persistence.enabled: true
      logs.persistence.accessMode: ReadWriteMany
    asserts:
      - hasDocuments:
          count: 1

  # Task-pod hardening is cluster-operator policy, so it must reach the control
  # plane the way the operator sets it: through the chart. A field that exists in
  # values.yaml but never renders is an escape hatch nobody can pull.
  - it: stamps the task-pod hardening defaults (runAsNonRoot on, readOnly off)
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
    asserts:
      # runAsNonRoot is on by default now that the shipped task images carry
      # numeric non-root UIDs (runtime/Dockerfile: USER 65532:65532).
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_EXECUTOR_DEFAULTS_RUN_TASKS_AS_NON_ROOT
            value: "true"
      # readOnlyRootFilesystem stays off: restricted does not require it and it
      # breaks ordinary Python tasks that write to /tmp or the pip cache.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_EXECUTOR_DEFAULTS_READ_ONLY_TASK_ROOT_FILESYSTEM
            value: "false"

  - it: propagates the task-pod hardening choices when the operator overrides them
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskPodSecurity.runAsNonRoot: false
      taskPodSecurity.readOnlyRootFilesystem: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_EXECUTOR_DEFAULTS_RUN_TASKS_AS_NON_ROOT
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_EXECUTOR_DEFAULTS_READ_ONLY_TASK_ROOT_FILESYSTEM
            value: "true"

  - it: "audit H2 — control-plane pod sets seccompProfile RuntimeDefault (restricted PSA)"
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
    asserts:
      # restricted Pod Security Admission requires a RuntimeDefault (or Localhost)
      # seccomp profile at the pod or container level. The chart claimed this
      # posture in a comment but never rendered it.
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: omits the object-store log env by default (disk provider, on-disk PVC path unchanged)
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_LOGS_BACKEND
            value: s3
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_LOGS_BACKEND
            value: gcs
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_LOGS_DIR
            value: /var/log/leoflow

  - it: wires the s3 log backend + keyless config when logs.sink.provider is s3
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      logs.sink.provider: s3
      logs.sink.bucket: my-task-logs
      logs.sink.region: us-east-1
      logs.sink.endpoint: http://minio.internal:9000
      logs.sink.forcePathStyle: true
      logs.sink.layout: segmented
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_LOGS_BACKEND
            value: s3
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_LOGS_SINK_LAYOUT
            value: segmented
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_LOGS_SINK_BUCKET
            value: my-task-logs
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_LOGS_SINK_ENDPOINT
            value: http://minio.internal:9000
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_LOGS_SINK_FORCE_PATH_STYLE
            value: "true"
      # Keyless-first (ADR 0035): no static-credential env unless an existingSecret is set.
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_LOGS_SINK_ACCESS_KEY_ID

  - it: wires the gcs log backend without S3-only env when logs.sink.provider is gcs
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      logs.sink.provider: gcs
      logs.sink.bucket: gcs-task-logs
      logs.sink.prefix: team-a
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_LOGS_BACKEND
            value: gcs
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_LOGS_SINK_BUCKET
            value: gcs-task-logs
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_LOGS_SINK_PREFIX
            value: team-a
      # GCS is keyless (Workload Identity) and needs no region/endpoint/path-style.
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_LOGS_SINK_ENDPOINT
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_LOGS_SINK_FORCE_PATH_STYLE

  - it: sources static s3 credentials from a Secret when existingSecret is set
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      logs.sink.provider: s3
      logs.sink.bucket: my-task-logs
      logs.sink.existingSecret: my-object-creds
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_LOGS_SINK_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: my-object-creds
                key: accessKeyId
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_LOGS_SINK_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: my-object-creds
                key: secretAccessKey

  # #860 — the control-plane probes must be forgiving by default (a busy scheduler
  # can miss a 1s /healthz under CPU pressure and be kubelet-killed mid-run) and be
  # operator-tunable via values.
  - it: renders forgiving liveness/readiness probe defaults (timeout + failureThreshold)
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 3

  - it: lets the operator tune the probe knobs via values
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      probes.liveness.timeoutSeconds: 10
      probes.liveness.failureThreshold: 6
      probes.readiness.periodSeconds: 15
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 10
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 6
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 15

  # #1041 — the readiness timeout has a floor because /readyz bounds its own work
  # at 2s (api.probeBudget) so it answers before the kubelet gives up. A shorter
  # kubelet timeout inverts that and turns every slow-dependency probe into a bare
  # timeout, with no log line naming the dependency.
  #
  # Asserted here rather than only in scripts/check-readiness-probe-budget.sh,
  # because that gate reads the helper's definition and cannot see whether the
  # template still CALLS it: reverting this line to the raw value leaves the
  # helper defined, $min at 3, the gate green, and the floor silently gone. It
  # also runs per-PR, while the gate script's real check runs only at cut time.
  - it: refuses to render a readiness timeout below the server's own probe budget
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      probes.readiness.timeoutSeconds: 1
    asserts:
      - failedTemplate:
          errorMessage: "probes.readiness.timeoutSeconds=1 is below the 3s floor. The leoflow-server /readyz handler bounds itself at 2s so it answers before the kubelet gives up; a shorter kubelet timeout inverts that and turns every slow-dependency probe into a timeout that logs nothing, instead of a 503 naming the dependency. Raise it to 3 or more. If you need the kubelet to react faster than 3s, lower probes.readiness.periodSeconds or failureThreshold instead — those shorten time-to-unready without cutting off the answer. See #1041."

  # Argo CD's helm.parameters and `helm --set-string` pass every override as a
  # string, so the floor has to hold for "1" as well as 1 — the same reason
  # podDisruptionBudget.enabled accepts the string spellings.
  - it: refuses a string-typed readiness timeout below the floor
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      probes.readiness.timeoutSeconds: "2"
    asserts:
      - failedTemplate:
          errorMessage: "probes.readiness.timeoutSeconds=2 is below the 3s floor. The leoflow-server /readyz handler bounds itself at 2s so it answers before the kubelet gives up; a shorter kubelet timeout inverts that and turns every slow-dependency probe into a timeout that logs nothing, instead of a 503 naming the dependency. Raise it to 3 or more. If you need the kubelet to react faster than 3s, lower probes.readiness.periodSeconds or failureThreshold instead — those shorten time-to-unready without cutting off the answer. See #1041."

  - it: renders a readiness timeout at or above the floor unchanged
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      probes.readiness.timeoutSeconds: 10
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 10

  - it: defaults the control-plane resource requests high enough to answer probes under load
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 250m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 256Mi

  - it: renders the forgiving probe knobs on every split role (api + scheduler)
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      split.enabled: true
      logs.persistence.accessMode: ReadWriteMany # split = multiple mounters; an RWO PVC or per-pod emptyDir logs both fail the render
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 5
          documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 5
          documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 3
          documentIndex: 1

  # #868 — the update strategy must default to Recreate when the logs PVC is RWO
  # (a RollingUpdate surges a 2nd pod that Multi-Attach-deadlocks on the RWO PVC),
  # and stay RollingUpdate otherwise; an explicit value always wins.
  - it: defaults strategy to Recreate when the logs PVC is ReadWriteOnce
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      # logs.persistence defaults: enabled true, accessMode ReadWriteOnce
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: uses RollingUpdate when the logs PVC is ReadWriteMany
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      logs.persistence.accessMode: ReadWriteMany
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate

  - it: uses RollingUpdate when logs persistence is disabled (ephemeral emptyDir)
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      logs.persistence.enabled: false
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate

  - it: honors an explicit deployment.strategy override
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      deployment.strategy: Recreate
      logs.persistence.accessMode: ReadWriteMany
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: defaults strategy to Recreate for ReadWriteOncePod (stricter than RWO, always deadlocks a surge)
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      logs.persistence.accessMode: ReadWriteOncePod
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
