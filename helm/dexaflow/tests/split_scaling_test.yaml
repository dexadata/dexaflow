suite: split HPA + PDB target the api Deployment, never the single-leader scheduler (ADR 0049)
templates:
  - hpa.yaml
  - pdb.yaml
release:
  name: leoflow
# The pre-rename naming (what charts/leoflow renders), which existing
# installs depend on; default dexaflow naming is in chart_name_test.yaml.
set:
  nameOverride: leoflow
  split.enabled: true
tests:
  - it: the HPA scales the api Deployment (the scheduler is a single leader, never autoscaled)
    template: hpa.yaml
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 2
      autoscaling.maxReplicas: 5
    asserts:
      - equal:
          path: metadata.name
          value: leoflow-api
      - equal:
          path: spec.scaleTargetRef.name
          value: leoflow-api

  - it: the PDB protects the api Deployment's pods (component=api)
    template: pdb.yaml
    set:
      podDisruptionBudget.enabled: true
      podDisruptionBudget.minAvailable: 1
    asserts:
      - equal:
          path: metadata.name
          value: leoflow-api
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: api
