# Chart contract for the ADR 0055 secret-scoping policy (#803).
#
# `auth.secretScoping` was reachable only through `extraEnv`, so values.yaml —
# the file an operator reads to discover what is tunable — never showed the knob
# or its default. These tests pin the two properties that fix has to keep:
# the default is stamped (so the chart is the discoverable source of truth), and
# an operator who already set the variable through the escape hatch still wins
# (so the stamped value does not break their upgrade).
suite: secret scoping policy env wiring (ADR 0055 D9)
templates:
  # secret.yaml is in scope so the deployment's `checksum/secret` annotation can
  # resolve its `include` reference (same reason as deployment_test.yaml).
  - deployment.yaml
  - secret.yaml
release:
  name: leoflow
  namespace: leoflow
# The pre-rename naming (what charts/leoflow renders), which existing
# installs depend on; default dexaflow naming is in chart_name_test.yaml.
set:
  nameOverride: leoflow
  database.url: postgres://h/d
  redis.url: redis://h/0
  auth.jwtSecret: jwt
  agentTLS.enabled: true
  agentTLS.serverCertSecret: leoflow-tls
  agentTLS.caConfigMap: leoflow-ca
tests:
  # `permissive` is today's behavior byte-for-byte and stays the default: an
  # `enforce` default would deny secrets to every DAG that declares nothing,
  # which — the declaration schema being new — is nearly all of them.
  - it: stamps the secret-scoping policy at its permissive default on a default install
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_AUTH_SECRET_SCOPING
            value: "permissive"

  # The stamped default must not strand the operators who already reached this
  # policy through `extraEnv` (its only route before #803). extraEnv renders
  # AFTER the chart-managed block, and Kubernetes takes the last value for a
  # duplicated env name, so their setting survives the upgrade. This asserts the
  # ordering, not just the presence, so nobody reverses the two blocks.
  - it: keeps an extraEnv override of the scoping policy after the chart-managed entry
    template: deployment.yaml
    set:
      extraEnv:
        - name: LEOFLOW_AUTH_SECRET_SCOPING
          value: enforce
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_AUTH_SECRET_SCOPING
            value: "permissive"
      - equal:
          path: spec.template.spec.containers[0].env[-1].name
          value: LEOFLOW_AUTH_SECRET_SCOPING
      - equal:
          path: spec.template.spec.containers[0].env[-1].value
          value: "enforce"

  # The two cases above both pass if the chart stamped the value into some OTHER
  # variable and `extraEnv` happened to supply this one, so neither proves the
  # value reaches the field it names. Setting it explicitly does.
  - it: renders the operator-set scoping policy into the chart-managed entry
    template: deployment.yaml
    set:
      auth.secretScoping: enforce
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_AUTH_SECRET_SCOPING
            value: "enforce"
