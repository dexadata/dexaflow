suite: GOMEMLIMIT derived from the container memory limit
templates:
  - deployment.yaml
  - secret.yaml
release:
  name: leoflow
# The pre-rename naming (what charts/leoflow renders), which existing
# installs depend on; default dexaflow naming is in chart_name_test.yaml.
set:
  nameOverride: leoflow
  agentTLS.enabled: true
  agentTLS.serverCertSecret: leoflow-tls
  agentTLS.caConfigMap: leoflow-ca
  database.url: postgres://h/d
  redis.url: redis://h/0
  auth.jwtSecret: s
tests:
  # Off by default (ADR 0062): the rendered env is what it was before the knob.
  - it: renders no GOMEMLIMIT by default
    template: deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
          any: true

  # An upgrade with --reuse-values from a release whose values predate the
  # knob carries no goMemLimit key at all; the template must still render.
  - it: renders without a goMemLimit key at all
    template: deployment.yaml
    set:
      goMemLimit: null
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
          any: true

  # 80% of the shipped 512Mi limit, in whole MiB (Go accepts the MiB suffix).
  - it: sets GOMEMLIMIT to 80% of the shipped memory limit when enabled
    set:
      goMemLimit.enabled: true
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 409MiB

  - it: honors a custom percentage
    set:
      goMemLimit.enabled: true
      goMemLimit.percent: 90
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 460MiB

  # Every Kubernetes memory suffix an operator is likely to write, binary and
  # decimal, plus a bare byte count.
  - it: reads a Gi limit
    set:
      goMemLimit.enabled: true
      resources.limits.memory: 2Gi
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 1638MiB

  - it: reads a decimal G limit
    set:
      goMemLimit.enabled: true
      resources.limits.memory: 1G
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 762MiB

  - it: reads a decimal M limit
    set:
      goMemLimit.enabled: true
      resources.limits.memory: 500M
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 381MiB

  - it: reads a Ki limit
    set:
      goMemLimit.enabled: true
      resources.limits.memory: 1048576Ki
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 819MiB

  - it: reads a bare byte count
    set:
      goMemLimit.enabled: true
      resources.limits.memory: "1073741824"
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 819MiB

  # Both split Deployments share `resources`, so both get the same limit.
  - it: sets GOMEMLIMIT on both split Deployments
    set:
      goMemLimit.enabled: true
      split.enabled: true
      logs.persistence.accessMode: ReadWriteMany
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 409MiB
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 409MiB
        documentIndex: 1

  # A soft limit with nothing to be a fraction of is a guess; refuse it.
  - it: fails the render when enabled without a memory limit
    set:
      goMemLimit.enabled: true
      resources.limits.memory: null
    template: deployment.yaml
    asserts:
      - failedTemplate:
          errorPattern: 'goMemLimit\.enabled requires resources\.limits\.memory'

  # Decimal quantities, the P and E suffixes and decimal exponents are all
  # valid Kubernetes quantities and must be read, not refused.
  - it: reads a decimal Gi limit
    set:
      goMemLimit.enabled: true
      resources.limits.memory: 1.5Gi
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 1228MiB

  - it: reads a fractional Gi limit
    set:
      goMemLimit.enabled: true
      resources.limits.memory: 0.5Gi
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 409MiB

  - it: reads a fraction with no leading digit
    set:
      goMemLimit.enabled: true
      resources.limits.memory: ".5Gi"
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 409MiB

  - it: reads a P limit
    set:
      goMemLimit.enabled: true
      resources.limits.memory: 1P
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 762939453MiB

  - it: reads a Pi limit
    set:
      goMemLimit.enabled: true
      resources.limits.memory: 1Pi
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 858993459MiB

  # E alone is the exa suffix, not an exponent.
  - it: reads an E limit
    set:
      goMemLimit.enabled: true
      resources.limits.memory: 1E
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 762939453125MiB

  - it: reads a decimal exponent
    set:
      goMemLimit.enabled: true
      resources.limits.memory: "1e9"
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 762MiB

  - it: reads an upper-case decimal exponent
    set:
      goMemLimit.enabled: true
      resources.limits.memory: "5E8"
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 381MiB

  - it: reads a decimal with an exponent
    set:
      goMemLimit.enabled: true
      resources.limits.memory: "2.5e8"
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 190MiB

  - it: fails the render on a quantity it cannot read
    set:
      goMemLimit.enabled: true
      resources.limits.memory: 512MB
    template: deployment.yaml
    asserts:
      - failedTemplate:
          errorPattern: 'cannot read resources\.limits\.memory "512MB"'

  - it: fails the render on a percentage outside 1 to 100
    set:
      goMemLimit.enabled: true
      goMemLimit.percent: 0
    template: deployment.yaml
    asserts:
      - failedTemplate:
          errorPattern: 'goMemLimit\.percent must be between 1 and 100'
