suite: production hardening toggles (HPA / PDB / NetworkPolicy / ServiceMonitor)
release:
  name: leoflow
# The chart always deploys the Pro edition and now refuses to render without agent
# TLS (#459). These cases assert HPA / PDB / NetworkPolicy / ServiceMonitor shape,
# not TLS wiring, so satisfy the guard once here.
# The pre-rename naming (what charts/leoflow renders), which existing
# installs depend on; default dexaflow naming is in chart_name_test.yaml.
set:
  nameOverride: leoflow
  agentTLS.enabled: true
  agentTLS.serverCertSecret: leoflow-tls
  agentTLS.caConfigMap: leoflow-ca
tests:
  # ─── HPA ────────────────────────────────────────────────────────────────
  - it: HPA not rendered when autoscaling.enabled is false (default)
    templates: [hpa.yaml]
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
    asserts:
      - hasDocuments:
          count: 0

  - it: HPA rendered with min/max replicas + CPU target when autoscaling.enabled
    templates: [hpa.yaml]
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      autoscaling.enabled: true
      autoscaling.minReplicas: 3
      autoscaling.maxReplicas: 9
      autoscaling.targetCPUUtilizationPercentage: 80
      # maxReplicas>1 needs an RWX logs PVC, else the #282 guard (rightly) fails
      # the whole render — set it so this test exercises the HPA, not that guard.
      logs.persistence.accessMode: ReadWriteMany
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HorizontalPodAutoscaler
      - equal:
          path: spec.minReplicas
          value: 3
      - equal:
          path: spec.maxReplicas
          value: 9
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 80

  # ─── PDB ────────────────────────────────────────────────────────────────
  # podDisruptionBudget.enabled is unset (auto) by default: the PDB renders only
  # when the guaranteed replica floor is above one, so a default single-replica
  # install gets none (a budget over one pod would block every node drain).
  - it: PDB not rendered by default on a single replica (enabled unset = auto)
    templates: [pdb.yaml]
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
    asserts:
      - hasDocuments:
          count: 0

  - it: PDB rendered with minAvailable when enabled
    templates: [pdb.yaml]
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      podDisruptionBudget.enabled: true
      podDisruptionBudget.minAvailable: 2
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 2

  # ─── NetworkPolicy ──────────────────────────────────────────────────────
  - it: NetworkPolicy not rendered when networkPolicy.enabled is false (default)
    templates: [networkpolicy.yaml]
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
    asserts:
      - hasDocuments:
          count: 0

  - it: NetworkPolicy renders both Ingress and Egress + DNS egress when enabled
    templates: [networkpolicy.yaml]
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      networkPolicy.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NetworkPolicy
      - contains:
          path: spec.policyTypes
          content: Ingress
      - contains:
          path: spec.policyTypes
          content: Egress
      # DNS egress always allowed — the template's default that protects users
      # from silently breaking service discovery on first enable.
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 53
                protocol: UDP
              - port: 53
                protocol: TCP

  # ─── ServiceMonitor ─────────────────────────────────────────────────────
  - it: ServiceMonitor not rendered when metrics.serviceMonitor.enabled is false (default)
    templates: [servicemonitor.yaml]
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
    asserts:
      - hasDocuments:
          count: 0

  - it: ServiceMonitor renders with metrics endpoint when enabled
    templates: [servicemonitor.yaml]
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      metrics.serviceMonitor.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceMonitor
      - equal:
          path: spec.endpoints[0].port
          value: metrics
      - equal:
          path: spec.endpoints[0].path
          value: /metrics
      - equal:
          path: spec.endpoints[0].interval
          value: 30s

  # ─── The two NetworkPolicy values are independent (#804) ────────────────
  # The installation guide used to tell operators that networkPolicy.enabled
  # restricts "the control plane and task pods". It restricts neither's egress
  # and no task pod at all: the control-plane policy selects control-plane pods
  # in the release namespace, and nothing selects a task pod unless
  # taskNetworkPolicy.enabled is set. Lock the separation the sentence
  # conflated, in BOTH directions, so the corrected text cannot silently rot.
  - it: networkPolicy.enabled alone renders zero policies in the task namespace (#804)
    templates: [networkpolicy.yaml, task-networkpolicy.yaml]
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNamespace: leoflow-tasks
      networkPolicy.enabled: true
    asserts:
      # Nothing in the task namespace: the task pods are uncontained.
      - hasDocuments:
          count: 0
        template: task-networkpolicy.yaml
      # The control-plane policy renders, in the RELEASE namespace.
      - hasDocuments:
          count: 1
        template: networkpolicy.yaml
      # Separation is a matter of SELECTION, not of namespace: taskNamespace
      # defaults to the release namespace, so a namespace assertion passes for
      # free and proves nothing. Task pods carry only leoflow.io/* labels
      # (internal/executor/kubernetes.go), so pinning the whole selector map is
      # what fails if anyone widens it to reach them.
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: leoflow
            app.kubernetes.io/instance: leoflow
        template: networkpolicy.yaml
      - notExists:
          path: spec.podSelector.matchExpressions
        template: networkpolicy.yaml
      # And its egress is the empty rule, i.e. allow-all — enabling the
      # control-plane policy restricts INGRESS only until networkPolicy.egress
      # is populated. The values comment says so; the guide claimed otherwise.
      - equal:
          path: spec.egress[1]
          value: {}
        template: networkpolicy.yaml

  - it: taskNetworkPolicy.enabled alone contains task pods without any control-plane policy (#804)
    templates: [networkpolicy.yaml, task-networkpolicy.yaml]
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNamespace: leoflow-tasks
      taskNetworkPolicy.enabled: true
    asserts:
      - hasDocuments:
          count: 0
        template: networkpolicy.yaml
      - hasDocuments:
          count: 1
        template: task-networkpolicy.yaml
      - equal:
          path: metadata.namespace
          value: leoflow-tasks
        template: task-networkpolicy.yaml

  # ─── Install NOTES: the deliberately-off task-pod policy (#804) ──────────
  # taskNetworkPolicy.enabled is false by default, deliberately: the policy
  # always blocks 169.254.0.0/16, which is where both GKE Workload Identity and
  # EKS Pod Identity serve keyless credentials, and enforcement is CNI-dependent
  # (kindnet enforces nothing; the AWS VPC CNI needs its network-policy agent
  # enabled). An off-by-default security control is only honest if it is visible,
  # and the install is the moment the operator can act on it — NOTES.txt already
  # carries warnings of exactly this shape for other silent defaults.
  - it: NOTES warn that task pods are uncontained while taskNetworkPolicy is off
    template: NOTES.txt
    capabilities:
      majorVersion: 1
      minorVersion: 30
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: taskNetworkPolicy.enabled=false"
      # The WARNING must name the value to set and the two escape hatches, or it
      # is an alarm with no action attached.
      - matchRegexRaw:
          pattern: "taskNetworkPolicy.enabled=true"
      - matchRegexRaw:
          pattern: "blockPrivateNetworks"
      - matchRegexRaw:
          pattern: "allowMetadataEgress"
      # And it must not let the control-plane value stand in for it — the exact
      # substitution the installation guide made (#804).
      - matchRegexRaw:
          pattern: "networkPolicy.enabled does NOT cover task pods"

  - it: NOTES stay quiet about the task policy once it is enabled
    template: NOTES.txt
    capabilities:
      majorVersion: 1
      minorVersion: 30
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNetworkPolicy.enabled: true
    asserts:
      - notMatchRegexRaw:
          pattern: "WARNING: taskNetworkPolicy.enabled=false"

  - it: enabling only the control-plane policy does NOT silence the task-pod warning
    template: NOTES.txt
    capabilities:
      majorVersion: 1
      minorVersion: 30
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      networkPolicy.enabled: true
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: taskNetworkPolicy.enabled=false"

  # #947 — autoscaling.minReplicas and maxReplicas are independent values with
  # independent defaults (2 and 6), so overriding only one inverts them. The
  # apiserver rejects a HorizontalPodAutoscaler whose maximum is under its
  # minimum, so the render looked clean and the install failed — the exact class
  # the chart refuses everywhere else.
  - it: "issue #947 — refuses an autoscaling maximum below the minimum"
    template: hpa.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      logs.persistence.enabled: false
      autoscaling.enabled: true
      autoscaling.maxReplicas: 1
    asserts:
      - failedTemplate:
          errorMessage: "autoscaling.maxReplicas=1 is below autoscaling.minReplicas=2, and the apiserver rejects a HorizontalPodAutoscaler whose maximum is under its minimum. The two are independent values with independent defaults (min 2, max 6), so setting only one inverts them — this is what `--set autoscaling.maxReplicas=1` alone produces. Set both, or raise the maximum to at least 2. See #947."

  # Argo CD's helm.parameters and `helm --set-string` deliver every override as
  # a string, which is why the other guards in this chart accept the string
  # spellings. The refusal has to hold there too.
  - it: "issue #947 — refuses a string-typed maximum below the minimum"
    template: hpa.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      logs.persistence.enabled: false
      autoscaling.enabled: true
      autoscaling.maxReplicas: "1"
    asserts:
      - failedTemplate:
          errorMessage: "autoscaling.maxReplicas=1 is below autoscaling.minReplicas=2, and the apiserver rejects a HorizontalPodAutoscaler whose maximum is under its minimum. The two are independent values with independent defaults (min 2, max 6), so setting only one inverts them — this is what `--set autoscaling.maxReplicas=1` alone produces. Set both, or raise the maximum to at least 2. See #947."

  - it: "issue #947 — refuses a minimum below 1 (HPAScaleToZero is not assumed)"
    template: hpa.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      logs.persistence.enabled: false
      autoscaling.enabled: true
      autoscaling.minReplicas: 0
    asserts:
      - failedTemplate:
          errorMessage: "autoscaling.minReplicas=0, and a HorizontalPodAutoscaler minimum below 1 is rejected unless the HPAScaleToZero feature gate is on, which this chart does not assume. Set it to 1 or more. See #947."

  - it: "issue #947 — a consistent pair still renders"
    template: hpa.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      logs.persistence.enabled: false
      autoscaling.enabled: true
      autoscaling.minReplicas: 2
      autoscaling.maxReplicas: 5
    asserts:
      - equal:
          path: spec.minReplicas
          value: 2
      - equal:
          path: spec.maxReplicas
          value: 5

  # #1067 — an Ingress-typed policy denies what it does not match, so leaving
  # the metrics port out of every rule made it reachable from nowhere while the
  # value's own documentation claimed the opposite. networkPolicy.enabled +
  # metrics.serviceMonitor.enabled + the default was a Prometheus target that never
  # answered and failed nothing at install.
  # #1067 — the old default was an EMPTY list, which rendered no rule at all,
  # and an Ingress-typed policy denies what it does not match. So the metrics
  # port was reachable from nowhere while the value's own comment said it was
  # "reachable from wherever ingressFrom allows". networkPolicy.enabled plus
  # metrics.serviceMonitor.enabled was a target that never answered and failed
  # nothing at install.
  #
  # The default is now a real value rather than a magic empty, because a magic
  # empty whose meaning lives only in a comment is exactly how this happened.
  - it: "issue #1067 — the metrics port has an ingress rule by default"
    template: networkpolicy.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      networkPolicy.enabled: true
    asserts:
      - contains:
          path: spec.ingress[1].ports
          content:
            port: 9090
            protocol: TCP
      - exists:
          path: spec.ingress[1].from

  # The case the first attempt at this fix MISSED, and the reason the mechanism
  # changed. Folding the metrics port into the API's rule made the scrape work
  # only while ingressFrom was empty — so the careful operator, who enabled the
  # policy AND narrowed the API sources, was still broken while the changelog
  # claimed otherwise. A separate rule is independent of ingressFrom.
  - it: "issue #1067 — the scrape still works when ingressFrom is narrowed"
    template: networkpolicy.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      networkPolicy.enabled: true
      networkPolicy.ingressFrom:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
    asserts:
      - contains:
          path: spec.ingress[1].ports
          content:
            port: 9090
            protocol: TCP
      # And the API rule really is narrowed, so this is not passing by accident.
      - exists:
          path: spec.ingress[0].from

  - it: "issue #1067 — narrowing metricsFrom restricts the scrape source"
    template: networkpolicy.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      networkPolicy.enabled: true
      networkPolicy.metricsFrom:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    asserts:
      - contains:
          path: spec.ingress[1].from
          content:
            namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: monitoring
      - notContains:
          path: spec.ingress[0].ports
          content:
            port: 9090
            protocol: TCP

  # Explicitly emptying it is the way to close the port, and it stays possible.
  - it: "issue #1067 — an explicitly empty metricsFrom closes the port"
    template: networkpolicy.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      networkPolicy.enabled: true
      networkPolicy.metricsFrom: []
    asserts:
      - notExists:
          path: spec.ingress[1]
      - notContains:
          path: spec.ingress[0].ports
          content:
            port: 9090
            protocol: TCP

  # values.yaml documents the same-namespace form of networkPolicy.ingressFrom.
  # It used to suggest [{namespaceSelector: {}}], which matches every namespace
  # (#1076). Render the documented examples so the text cannot drift from what
  # the policy does.
  - it: the documented same-namespace ingressFrom renders a podSelector, not an empty namespaceSelector (#1076)
    templates: [networkpolicy.yaml]
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      networkPolicy.enabled: true
      networkPolicy.ingressFrom:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: leoflow-tasks
    asserts:
      - equal:
          path: spec.ingress[0].from[0]
          value:
            podSelector: {}
      - equal:
          path: spec.ingress[0].from[1].namespaceSelector.matchLabels
          value:
            kubernetes.io/metadata.name: leoflow-tasks
      - notExists:
          path: spec.ingress[0].from[0].namespaceSelector

  # ─── Read-only root filesystem (#1225) ──────────────────────────────────
  - it: the control-plane container runs with a read-only root filesystem and a writable /tmp
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir: {}

  - it: an operator can still opt back into a writable root filesystem
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      securityContext.readOnlyRootFilesystem: false
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: false
