suite: ui auto-refresh interval reaches the chart (#1196)
templates:
  - deployment.yaml
  - secret.yaml
release:
  name: leoflow
# The pre-rename naming (what charts/leoflow renders), which existing
# installs depend on; default dexaflow naming is in chart_name_test.yaml.
set:
  nameOverride: leoflow
  agentTLS.enabled: true
  agentTLS.serverCertSecret: leoflow-tls
  agentTLS.caConfigMap: leoflow-ca
  database.url: postgres://h/d
  redis.url: redis://h/0
  auth.jwtSecret: s
tests:
  # The setting existed and was documented, and the chart modelled nothing, so a
  # Helm operator could reach it only through extraEnv: a behavior hidden from
  # anyone reading the chart.
  - it: renders the variable when an interval is set
    set:
      ui.autoRefreshIntervalSeconds: 5
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_UI_AUTO_REFRESH_INTERVAL_SECONDS
            value: "5"

  # Unset must render NOTHING rather than an empty string. Binding the variable
  # to "" makes the server parse an empty value, and sends an operator to the
  # chart looking for a number the chart did not choose.
  - it: renders no variable at all when unset, leaving the server default in charge
    template: deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_UI_AUTO_REFRESH_INTERVAL_SECONDS
            value: ""
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_UI_AUTO_REFRESH_INTERVAL_SECONDS
            value: "0"
