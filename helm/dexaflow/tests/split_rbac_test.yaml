suite: split gives the API a restricted identity, the scheduler the privileged one (ADR 0049)
templates:
  - serviceaccount.yaml
  - rbac.yaml
release:
  name: leoflow
  namespace: leoflow
# The pre-rename naming (what charts/leoflow renders), which existing
# installs depend on; default dexaflow naming is in chart_name_test.yaml.
set:
  nameOverride: leoflow
  split.enabled: true
tests:
  - it: renders a ServiceAccount per role
    template: serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: leoflow-api
        documentIndex: 0
      - equal:
          path: metadata.name
          value: leoflow-scheduler
        documentIndex: 1

  - it: binds the executor Role ONLY to the scheduler SA — the api SA stays unbound (restricted)
    template: rbac.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
      # The privileged pod-create grant goes to the scheduler, never the api.
      - equal:
          path: subjects[0].name
          value: leoflow-scheduler
      - equal:
          path: subjects[0].namespace
          value: leoflow

  - it: still binds the single SA in non-split mode (regression)
    template: rbac.yaml
    documentIndex: 1
    set:
      split.enabled: false
    asserts:
      - equal:
          path: subjects[0].name
          value: leoflow

  # serviceAccount.annotations is ONE value rendered onto EVERY control-plane SA,
  # so in split mode the cloud identity it carries lands on both. That is what the
  # object log sink needs: the scheduler WRITES task logs to the bucket and any api
  # replica READS them back to serve the UI, so annotating only one role leaves half
  # the control plane without credentials. Locked here because values-ha.yaml states
  # it (#905).
  - it: renders serviceAccount.annotations onto BOTH split ServiceAccounts (the log-sink identity)
    template: serviceaccount.yaml
    set:
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/leoflow-control-plane
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/leoflow-control-plane
        documentIndex: 0
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/leoflow-control-plane
        documentIndex: 1
