suite: API tokens switch (auth.api_tokens.disabled)
templates:
  # secret.yaml is in scope so the deployment's `checksum/secret` annotation can
  # resolve its `include` reference (same reason as deployment_test.yaml).
  - deployment.yaml
  - secret.yaml
release:
  name: leoflow
set:
  nameOverride: leoflow
  database.url: postgres://h/d
  redis.url: redis://h/0
  auth.jwtSecret: jwt
  agentTLS.enabled: true
  agentTLS.serverCertSecret: leoflow-tls
  agentTLS.caConfigMap: leoflow-ca
tests:
  - it: renders no variable by default, so API tokens stay served as before
    template: deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_AUTH_API_TOKENS_DISABLED
          any: true

  - it: turns the tokens off when auth.apiTokens.disabled is true
    template: deployment.yaml
    set:
      auth.apiTokens.disabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_AUTH_API_TOKENS_DISABLED
            value: "true"

  # The api role serves the routes and authenticates requests, so the setting
  # must reach it when the control plane is split; both Deployments share the
  # env block.
  - it: reaches both Deployments when the control plane is split
    template: deployment.yaml
    set:
      auth.apiTokens.disabled: true
      split.enabled: true
      logs.persistence.accessMode: ReadWriteMany
    asserts:
      - hasDocuments:
          count: 2
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_AUTH_API_TOKENS_DISABLED
            value: "true"

  # helm upgrade --reuse-values from a release before this value existed
  # carries no auth.apiTokens: the render must keep the default.
  - it: keeps the tokens on when auth.apiTokens is missing
    template: deployment.yaml
    set:
      auth.apiTokens: null
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_AUTH_API_TOKENS_DISABLED
          any: true
