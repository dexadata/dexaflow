# Chart contract for the attempt credential ceiling (ADR 0055, #955).
#
# `auth.maxAttemptCredentialLifetime` was reachable only through `extraEnv`.
# These tests pin what the chart value has to keep: the default is stamped,
# an operator who already set the variable through the escape hatch still wins,
# a set value reaches the variable it names, and a value that is not a duration
# fails the render instead of crash looping the server at boot.
suite: attempt credential ceiling env wiring (ADR 0055)
templates:
  # secret.yaml is in scope so the deployment's `checksum/secret` annotation can
  # resolve its `include` reference (same reason as deployment_test.yaml).
  - deployment.yaml
  - secret.yaml
release:
  name: leoflow
  namespace: leoflow
set:
  nameOverride: leoflow
  database.url: postgres://h/d
  redis.url: redis://h/0
  auth.jwtSecret: jwt
  agentTLS.enabled: true
  agentTLS.serverCertSecret: leoflow-tls
  agentTLS.caConfigMap: leoflow-ca
tests:
  - it: stamps the ceiling at its 24h default on a default install
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_AUTH_MAX_ATTEMPT_CREDENTIAL_LIFETIME
            value: "24h"

  # extraEnv renders after the chart-managed block and Kubernetes takes the
  # last value of a duplicated name, so an existing override survives.
  - it: keeps an extraEnv override after the chart-managed entry
    template: deployment.yaml
    set:
      extraEnv:
        - name: LEOFLOW_AUTH_MAX_ATTEMPT_CREDENTIAL_LIFETIME
          value: 6h
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_AUTH_MAX_ATTEMPT_CREDENTIAL_LIFETIME
            value: "24h"
      - equal:
          path: spec.template.spec.containers[0].env[-1].name
          value: LEOFLOW_AUTH_MAX_ATTEMPT_CREDENTIAL_LIFETIME
      - equal:
          path: spec.template.spec.containers[0].env[-1].value
          value: "6h"

  - it: renders a set value quoted into the chart-managed entry
    template: deployment.yaml
    set:
      auth.maxAttemptCredentialLifetime: 1h30m
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_AUTH_MAX_ATTEMPT_CREDENTIAL_LIFETIME
            value: "1h30m"

  # 0 disables the ceiling (the server logs a WARN at boot); YAML reads a bare
  # 0 as a number, so the chart has to turn it into the string "0".
  - it: accepts 0 to disable the ceiling
    template: deployment.yaml
    set:
      auth.maxAttemptCredentialLifetime: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_AUTH_MAX_ATTEMPT_CREDENTIAL_LIFETIME
            value: "0"

  - it: fails the render on a value that is not a duration
    template: deployment.yaml
    set:
      auth.maxAttemptCredentialLifetime: 24
    asserts:
      - failedTemplate:
          errorPattern: "auth.maxAttemptCredentialLifetime must be a Go duration"
