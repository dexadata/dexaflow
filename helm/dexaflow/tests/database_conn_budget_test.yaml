suite: Postgres connection budget (default pool size, NOTES warning) (#1088)
# Each control-plane pod opens up to database.maxOpenConns connections for
# requests, plus 2 for health checks and 1 for the scheduler's leader lock, and
# nothing scales that by the replica count. At the old default (20) two replicas
# asked for 46 connections, and the smallest managed Postgres tiers (Cloud SQL
# db-f1-micro, the smallest RDS and Azure Flexible sizes) cap max_connections
# near 25 and reserve several of those: the control plane never booted, and the
# error named connection slots rather than the setting.
templates:
  - deployment.yaml
  - secret.yaml
  - NOTES.txt
release:
  name: leoflow
set:
  nameOverride: leoflow
  agentTLS.enabled: true
  agentTLS.serverCertSecret: leoflow-tls
  agentTLS.caConfigMap: leoflow-ca
  database.url: postgres://h/d
  redis.url: redis://h/0
  auth.jwtSecret: jwt
tests:
  # ─── Default: two replicas fit a 25-connection server ───────────────────
  - it: defaults the pool to 6 open and 2 idle connections per pod
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_DATABASE_MAX_OPEN_CONNS
            value: "6"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_DATABASE_MAX_IDLE_CONNS
            value: "2"

  # Backward compatibility: an operator who sized the pool keeps their value.
  - it: keeps an explicit maxOpenConns and maxIdleConns untouched
    template: deployment.yaml
    set:
      database.maxOpenConns: 20
      database.maxIdleConns: 5
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_DATABASE_MAX_OPEN_CONNS
            value: "20"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_DATABASE_MAX_IDLE_CONNS
            value: "5"

  # ─── NOTES: say the arithmetic when it exceeds a small server ───────────
  - it: NOTES stay quiet at the defaults on one replica
    template: NOTES.txt
    asserts:
      - notMatchRegexRaw:
          pattern: "Postgres connections"

  # The exact install from #1088: replicaCount=2, everything else default.
  # 2 * (6 + 3) + 1 migration Job = 19, inside a 25-connection server.
  - it: NOTES stay quiet at the defaults on two replicas
    template: NOTES.txt
    set:
      replicaCount: 2
      logs.persistence.enabled: false
      logs.sink.provider: s3
      logs.sink.bucket: b
    asserts:
      - notMatchRegexRaw:
          pattern: "Postgres connections"

  # The old default on two replicas: 2 * (20 + 3) + 1 = 47.
  - it: NOTES warn with the total and the setting when two replicas at 20 exceed a small server
    template: NOTES.txt
    set:
      replicaCount: 2
      database.maxOpenConns: 20
      logs.persistence.enabled: false
      logs.sink.provider: s3
      logs.sink.bucket: b
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: the control plane can open up to 47 Postgres connections"
      - matchRegexRaw:
          pattern: "2 pod\\(s\\) x \\(database.maxOpenConns=20 \\+ 3\\) \\+ 1 for the migration Job"
      - matchRegexRaw:
          pattern: "SQLSTATE 53300"

  # The HPA ceiling, not the floor, is what the server has to absorb.
  - it: NOTES count autoscaling.maxReplicas, not replicaCount
    template: NOTES.txt
    set:
      autoscaling.enabled: true
      autoscaling.maxReplicas: 6
      logs.persistence.enabled: false
      logs.sink.provider: s3
      logs.sink.bucket: b
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: the control plane can open up to 55 Postgres connections"

  # Without the migration Job (migrated out of band) it is not counted.
  - it: NOTES leave the migration Job out when migrations are disabled
    template: NOTES.txt
    set:
      replicaCount: 3
      migrations.enabled: false
      logs.persistence.enabled: false
      logs.sink.provider: s3
      logs.sink.bucket: b
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: the control plane can open up to 27 Postgres connections"
      - notMatchRegexRaw:
          pattern: "migration Job"
