suite: control-plane HA posture (PDB auto-on, single-writer log guard, drain grace)
# secret.yaml is in scope so the deployment's `checksum/secret` annotation can
# resolve its include; every case still targets ONE template via `template:`.
templates:
  - deployment.yaml
  - secret.yaml
  - pdb.yaml
  - NOTES.txt
release:
  name: leoflow
# The chart always deploys the Pro edition and refuses to render without agent
# TLS; satisfy that guard once here so every case exercises the HA posture only.
# The pre-rename naming (what charts/leoflow renders), which existing
# installs depend on; default dexaflow naming is in chart_name_test.yaml.
set:
  nameOverride: leoflow
  agentTLS.enabled: true
  agentTLS.serverCertSecret: leoflow-tls
  agentTLS.caConfigMap: leoflow-ca
  database.url: postgres://h/d
  redis.url: redis://h/0
  auth.jwtSecret: jwt
tests:
  # ─── PodDisruptionBudget: on exactly when it is safe ─────────────────────
  # A PDB with minAvailable 1 over a SINGLE replica blocks every voluntary
  # eviction of that pod: node drains stall, cluster and node auto-upgrades
  # wait on it (and platforms that bound the wait eventually override it). It
  # protects the pod at the cost of cluster operations, so it is safe by default
  # only when there is a second replica to fail over to.
  - it: renders no PDB by default on a single replica (auto mode)
    template: pdb.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the PDB automatically when replicaCount > 1
    template: pdb.yaml
    set:
      replicaCount: 2
      logs.persistence.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 1
      - isNull:
          path: spec.maxUnavailable

  - it: honors an explicit podDisruptionBudget.enabled=false at replicaCount > 1
    template: pdb.yaml
    set:
      replicaCount: 2
      logs.persistence.enabled: false
      podDisruptionBudget.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: honors an explicit podDisruptionBudget.enabled=true on a single replica (operator's informed choice)
    template: pdb.yaml
    set:
      replicaCount: 1
      podDisruptionBudget.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 1

  - it: keeps the maxUnavailable alternative when the operator sets it instead of minAvailable
    template: pdb.yaml
    set:
      replicaCount: 3
      logs.persistence.enabled: false
      podDisruptionBudget.minAvailable: ""
      podDisruptionBudget.maxUnavailable: 1
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1
      - isNull:
          path: spec.minAvailable

  # With the HPA on, replicaCount is ignored; the guaranteed floor is minReplicas.
  - it: auto mode uses the HPA minReplicas floor, not replicaCount, when autoscaling is on
    template: pdb.yaml
    set:
      replicaCount: 1
      autoscaling.enabled: true
      autoscaling.minReplicas: 2
      autoscaling.maxReplicas: 4
      logs.persistence.accessMode: ReadWriteMany
    asserts:
      - hasDocuments:
          count: 1

  - it: auto mode stays off when the HPA floor is a single replica
    template: pdb.yaml
    set:
      replicaCount: 3
      autoscaling.enabled: true
      autoscaling.minReplicas: 1
      autoscaling.maxReplicas: 4
      logs.persistence.accessMode: ReadWriteMany
    asserts:
      - hasDocuments:
          count: 0

  # Split mode (ADR 0049): the PDB covers the active-active api Deployment, so the
  # api replica count is the one that decides auto mode; the single-leader
  # scheduler never gets a PDB.
  - it: auto mode in split mode keys on split.api.replicaCount and targets the api Deployment
    template: pdb.yaml
    set:
      split.enabled: true
      split.api.replicaCount: 2
      logs.persistence.accessMode: ReadWriteMany
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: leoflow-api
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: api

  - it: auto mode in split mode stays off with a single api replica
    template: pdb.yaml
    set:
      split.enabled: true
      split.api.replicaCount: 1
      logs.persistence.accessMode: ReadWriteMany
    asserts:
      - hasDocuments:
          count: 0

  # ─── The tri-state accepts the string spellings a GitOps tool sends ──────
  # Argo CD's `helm.parameters` and Flux's `postRenderers` values pass every
  # override as a STRING (the same shape as `helm --set-string`), so an operator
  # asking for `podDisruptionBudget.enabled: "true"` on a single replica used to
  # get the auto default silently — a forced-on budget that never rendered, and
  # no diagnostic anywhere. Accept the string spellings, and refuse anything that
  # is neither a bool nor one of them rather than falling back to auto (#905).
  - it: honors a string-typed podDisruptionBudget.enabled=true on a single replica (Argo CD helm.parameters)
    template: pdb.yaml
    set:
      replicaCount: 1
      podDisruptionBudget.enabled: "true"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodDisruptionBudget

  - it: honors a string-typed podDisruptionBudget.enabled=false at replicaCount > 1 (Argo CD helm.parameters)
    template: pdb.yaml
    set:
      replicaCount: 2
      logs.persistence.enabled: false
      podDisruptionBudget.enabled: "false"
    asserts:
      - hasDocuments:
          count: 0

  # The helper lowercases before comparing, so `"True"` — the spelling a Python
  # or Helmfile templating layer produces from a real boolean — is accepted. That
  # was undocumented and untested; lock it so a future tightening of the compare
  # cannot drop it silently (#905).
  - it: honors an uppercase-T string podDisruptionBudget.enabled=True on a single replica
    template: pdb.yaml
    set:
      replicaCount: 1
      podDisruptionBudget.enabled: "True"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodDisruptionBudget

  # The same garbling, on the other new message: `%q` over an interface value
  # renders an integer as a quoted rune, so `enabled: 5` reported `got '\x05'`
  # and named nothing the operator had typed (#905).
  - it: names an integer podDisruptionBudget.enabled instead of a quoted rune
    template: pdb.yaml
    set:
      replicaCount: 2
      logs.persistence.enabled: false
      podDisruptionBudget.enabled: 5
    asserts:
      - failedTemplate:
          errorMessage: "podDisruptionBudget.enabled must be a boolean, the string \"true\" or \"false\", or empty for auto (got \"5\", kind float64). It is tri-state: empty renders the PodDisruptionBudget exactly when the guaranteed replica floor is above one, true forces it on, false forces it off. The string spellings are accepted because Argo CD's helm.parameters and helm --set-string pass every override as a string; any other value is refused rather than silently falling back to auto, which would leave a budget the operator asked for unrendered with no diagnostic. See #905."

  - it: refuses a podDisruptionBudget.enabled that is neither a bool nor a true/false string
    template: pdb.yaml
    set:
      replicaCount: 2
      logs.persistence.enabled: false
      podDisruptionBudget.enabled: "yes"
    asserts:
      - failedTemplate:
          errorMessage: "podDisruptionBudget.enabled must be a boolean, the string \"true\" or \"false\", or empty for auto (got \"yes\", kind string). It is tri-state: empty renders the PodDisruptionBudget exactly when the guaranteed replica floor is above one, true forces it on, false forces it off. The string spellings are accepted because Argo CD's helm.parameters and helm --set-string pass every override as a string; any other value is refused rather than silently falling back to auto, which would leave a budget the operator asked for unrendered with no diagnostic. See #905."

  # ─── minAvailable XOR maxUnavailable ─────────────────────────────────────
  # A PodDisruptionBudget spec carries one of the two, never both: the apiserver
  # rejects the pair, so rendering it fails the install after the render looked
  # fine — the shape this chart refuses at render time everywhere else. It was a
  # values-file comment until the budget became default-on for the HA profile,
  # which put the pair one `--set` away from a real install (#905).
  - it: refuses a PodDisruptionBudget with both minAvailable and maxUnavailable set
    template: pdb.yaml
    set:
      replicaCount: 2
      logs.persistence.enabled: false
      podDisruptionBudget.minAvailable: 1
      podDisruptionBudget.maxUnavailable: 1
    asserts:
      - failedTemplate:
          errorMessage: "podDisruptionBudget.minAvailable=1 and podDisruptionBudget.maxUnavailable=1 are both set: a PodDisruptionBudget spec carries exactly one of the two and the apiserver rejects both together, so the install would fail after a clean render. Set one and clear the other (podDisruptionBudget.maxUnavailable=\"\" keeps the chart's minAvailable default). See #905."

  # ─── Single-writer log volume guard ──────────────────────────────────────
  # A ReadWriteOnce / ReadWriteOncePod PVC attaches to one node / one pod. A
  # second control-plane replica scheduled elsewhere hangs in ContainerCreating
  # on a Multi-Attach error while `helm install` reports success. HA must never
  # deploy onto a single-writer volume silently.
  - it: fails the render when replicaCount > 1 with a ReadWriteOnce logs PVC
    template: deployment.yaml
    set:
      replicaCount: 2
      logs.persistence.enabled: true
      logs.persistence.accessMode: ReadWriteOnce
    asserts:
      - failedTemplate:
          errorMessage: "more than one control-plane pod would mount the logs PVC (replicaCount > 1, autoscaling.maxReplicas > 1, or split.enabled), but logs.persistence.accessMode=ReadWriteOnce attaches the volume to a single node/pod: the extra pods hang in ContainerCreating with a Multi-Attach error while the install reports success. HA needs a log store every replica can write. Recommended: set logs.persistence.enabled=false and ship task logs to object storage (logs.sink.provider=s3|gcs with logs.sink.bucket). Alternative: logs.persistence.accessMode=ReadWriteMany on an RWX StorageClass (EFS, Filestore, Azure Files, NFS, CephFS, Longhorn-rwx). Or keep a single replica. See helm/dexaflow/examples/values-ha.yaml."

  - it: fails the render when replicaCount > 1 with a ReadWriteOncePod logs PVC
    template: deployment.yaml
    set:
      replicaCount: 2
      logs.persistence.enabled: true
      logs.persistence.accessMode: ReadWriteOncePod
    asserts:
      - failedTemplate:
          errorMessage: "more than one control-plane pod would mount the logs PVC (replicaCount > 1, autoscaling.maxReplicas > 1, or split.enabled), but logs.persistence.accessMode=ReadWriteOncePod attaches the volume to a single node/pod: the extra pods hang in ContainerCreating with a Multi-Attach error while the install reports success. HA needs a log store every replica can write. Recommended: set logs.persistence.enabled=false and ship task logs to object storage (logs.sink.provider=s3|gcs with logs.sink.bucket). Alternative: logs.persistence.accessMode=ReadWriteMany on an RWX StorageClass (EFS, Filestore, Azure Files, NFS, CephFS, Longhorn-rwx). Or keep a single replica. See helm/dexaflow/examples/values-ha.yaml."

  - it: renders replicaCount > 1 with a ReadWriteMany logs PVC
    template: deployment.yaml
    set:
      replicaCount: 2
      logs.persistence.enabled: true
      logs.persistence.accessMode: ReadWriteMany
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.replicas
          value: 2

  - it: renders replicaCount > 1 with logs persistence disabled and the object sink configured
    template: deployment.yaml
    set:
      replicaCount: 2
      logs.persistence.enabled: false
      logs.sink.provider: s3
      logs.sink.bucket: leoflow-task-logs
      logs.sink.region: us-east-1
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_LOGS_BACKEND
            value: s3

  - it: renders a single replica on the default ReadWriteOnce logs PVC (unchanged default install)
    template: deployment.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.replicas
          value: 1

  # ─── The access mode is an allowlist, not a denylist ─────────────────────
  # Both the single-writer refusal above and the `Recreate` strategy
  # auto-selection used to test the access mode against the two single-writer
  # SPELLINGS, so an empty value or a typo — `readWriteMany` — matched neither,
  # skipped both, and left the install to fail at the apiserver (or, worse, to
  # surge a RollingUpdate onto a volume only one pod can hold). Refuse anything
  # that is not one of the three modes the control plane can actually use (#905).
  - it: refuses an empty logs.persistence.accessMode
    template: deployment.yaml
    set:
      logs.persistence.accessMode: ""
    asserts:
      - failedTemplate:
          errorMessage: "logs.persistence.accessMode=\"\" (kind string) is not a PersistentVolumeClaim access mode the control plane can use: set ReadWriteOnce (single replica — the chart default), ReadWriteMany (HA, on an RWX StorageClass: EFS, Filestore, Azure Files, NFS, CephFS, Longhorn-rwx) or ReadWriteOncePod. ReadOnlyMany is a real access mode but the control plane WRITES task logs into this volume, so it is refused here too. An unrecognized value matched neither the single-writer refusal nor the Recreate update-strategy auto-selection, so the install rendered clean and then failed at the apiserver — or surged a RollingUpdate onto a volume only one pod can hold. See #905."

  - it: refuses a mis-cased logs.persistence.accessMode typo
    template: deployment.yaml
    set:
      logs.persistence.accessMode: readWriteMany
    asserts:
      - failedTemplate:
          errorMessage: "logs.persistence.accessMode=\"readWriteMany\" (kind string) is not a PersistentVolumeClaim access mode the control plane can use: set ReadWriteOnce (single replica — the chart default), ReadWriteMany (HA, on an RWX StorageClass: EFS, Filestore, Azure Files, NFS, CephFS, Longhorn-rwx) or ReadWriteOncePod. ReadOnlyMany is a real access mode but the control plane WRITES task logs into this volume, so it is refused here too. An unrecognized value matched neither the single-writer refusal nor the Recreate update-strategy auto-selection, so the install rendered clean and then failed at the apiserver — or surged a RollingUpdate onto a volume only one pod can hold. See #905."

  - it: refuses ReadOnlyMany, a real access mode the control plane cannot write to
    template: deployment.yaml
    set:
      logs.persistence.accessMode: ReadOnlyMany
    asserts:
      - failedTemplate:
          errorMessage: "logs.persistence.accessMode=\"ReadOnlyMany\" (kind string) is not a PersistentVolumeClaim access mode the control plane can use: set ReadWriteOnce (single replica — the chart default), ReadWriteMany (HA, on an RWX StorageClass: EFS, Filestore, Azure Files, NFS, CephFS, Longhorn-rwx) or ReadWriteOncePod. ReadOnlyMany is a real access mode but the control plane WRITES task logs into this volume, so it is refused here too. An unrecognized value matched neither the single-writer refusal nor the Recreate update-strategy auto-selection, so the install rendered clean and then failed at the apiserver — or surged a RollingUpdate onto a volume only one pod can hold. See #905."

  # A refusal that garbles the value it names is a worse diagnostic than one that
  # names it plainly. Both new messages ran the QUOTED verb over an interface
  # value, so an integer came out as an escape sequence and a null as a Go format
  # error — and a null is precisely the shape a layered values file produces when
  # a later layer blanks a key it does not want, which is one of the shapes this
  # guard exists for. Quote the string CONVERSION instead, and name the kind so
  # "empty string" and "absent" are told apart (#905).
  - it: names a null logs.persistence.accessMode instead of printing a format error
    template: deployment.yaml
    set:
      logs.persistence.accessMode: null
    asserts:
      - failedTemplate:
          errorMessage: "logs.persistence.accessMode=\"<nil>\" (kind invalid) is not a PersistentVolumeClaim access mode the control plane can use: set ReadWriteOnce (single replica — the chart default), ReadWriteMany (HA, on an RWX StorageClass: EFS, Filestore, Azure Files, NFS, CephFS, Longhorn-rwx) or ReadWriteOncePod. ReadOnlyMany is a real access mode but the control plane WRITES task logs into this volume, so it is refused here too. An unrecognized value matched neither the single-writer refusal nor the Recreate update-strategy auto-selection, so the install rendered clean and then failed at the apiserver — or surged a RollingUpdate onto a volume only one pod can hold. See #905."

  - it: accepts ReadWriteOncePod, the third valid mode, on a single replica
    template: deployment.yaml
    set:
      logs.persistence.accessMode: ReadWriteOncePod
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.strategy.type
          value: Recreate

  # A bogus access mode with no PVC at all is dead config, not a broken install:
  # nothing reads it, so the guard stays out of the way — the same "model the
  # rendered spec" rule the drain-grace guard follows.
  - it: ignores the access mode when logs persistence is off, where nothing reads it
    template: deployment.yaml
    set:
      logs.persistence.enabled: false
      logs.persistence.accessMode: readWriteMany
      logs.sink.provider: s3
      logs.sink.bucket: leoflow-task-logs
    asserts:
      - hasDocuments:
          count: 1

  # ─── An explicit RollingUpdate must not defeat the Recreate auto-selection ─
  # A RollingUpdate surges a replacement pod BEFORE the old one is gone, and a
  # single-writer volume attaches to one node / one pod, so the surge pod hangs
  # in ContainerCreating on a Multi-Attach error and the rollout never converges.
  # The auto-selection (#868) picks Recreate for exactly this shape — but it only
  # runs when deployment.strategy is empty, so an explicit override walked
  # straight back into the deadlock, on a single replica no less, where there is
  # no other pod to serve while the rollout is wedged (#905).
  - it: refuses an explicit RollingUpdate on the default ReadWriteOnce logs PVC
    template: deployment.yaml
    set:
      deployment.strategy: RollingUpdate
    asserts:
      - failedTemplate:
          errorMessage: "deployment.strategy=RollingUpdate cannot roll over logs.persistence.accessMode=ReadWriteOnce: a RollingUpdate surges a replacement pod before the old one is gone, and a single-writer volume attaches to one node/pod, so the surge pod hangs in ContainerCreating on a Multi-Attach error and the rollout never converges — on a single replica that is a control plane that never comes back, while helm reports success. Leave deployment.strategy empty and the chart auto-selects Recreate for a single-writer logs PVC, or move the logs off it: logs.persistence.enabled=false with logs.sink.provider=s3|gcs (recommended), or logs.persistence.accessMode=ReadWriteMany on an RWX StorageClass. See #905."

  - it: refuses an explicit RollingUpdate on a ReadWriteOncePod logs PVC
    template: deployment.yaml
    set:
      deployment.strategy: RollingUpdate
      logs.persistence.accessMode: ReadWriteOncePod
    asserts:
      - failedTemplate:
          errorMessage: "deployment.strategy=RollingUpdate cannot roll over logs.persistence.accessMode=ReadWriteOncePod: a RollingUpdate surges a replacement pod before the old one is gone, and a single-writer volume attaches to one node/pod, so the surge pod hangs in ContainerCreating on a Multi-Attach error and the rollout never converges — on a single replica that is a control plane that never comes back, while helm reports success. Leave deployment.strategy empty and the chart auto-selects Recreate for a single-writer logs PVC, or move the logs off it: logs.persistence.enabled=false with logs.sink.provider=s3|gcs (recommended), or logs.persistence.accessMode=ReadWriteMany on an RWX StorageClass. See #905."

  - it: keeps an explicit Recreate on a single-writer logs PVC, which is what the auto-selection would pick
    template: deployment.yaml
    set:
      deployment.strategy: Recreate
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate

  # ─── The strategy value is an allowlist too ──────────────────────────────
  # Same denylist shape the access mode just shed. The template rendered the
  # value verbatim into spec.strategy.type and the refusal above compared it
  # EXACTLY, so a lowercase spelling bypassed the refusal AND the auto-selection
  # and the apiserver rejected the install; and the same value with a TRAILING
  # SPACE bypassed the refusal while YAML trimmed it on the way to the
  # apiserver, which then ACCEPTED it — the Multi-Attach deadlock the refusal
  # exists to prevent, reached through the refusal (#905).
  - it: refuses a lowercase deployment.strategy the apiserver would reject
    template: deployment.yaml
    set:
      deployment.strategy: rollingupdate
    asserts:
      - failedTemplate:
          errorMessage: "deployment.strategy=\"rollingupdate\" (kind string) is not a Deployment update strategy: set RollingUpdate, Recreate, or \"\" to let the chart auto-select (Recreate over a single-writer logs PVC, RollingUpdate otherwise). The value is rendered verbatim into spec.strategy.type and compared exactly, so an unrecognized spelling used to bypass both the single-writer RollingUpdate refusal and the auto-selection: the apiserver then rejected the install, or — for a spelling it accepts after trimming, like a trailing space — accepted the surge onto a volume only one pod can hold. See #905."

  - it: refuses a deployment.strategy with a trailing space, which the apiserver would ACCEPT
    template: deployment.yaml
    set:
      deployment.strategy: "RollingUpdate "
    asserts:
      - failedTemplate:
          errorMessage: "deployment.strategy=RollingUpdate cannot roll over logs.persistence.accessMode=ReadWriteOnce: a RollingUpdate surges a replacement pod before the old one is gone, and a single-writer volume attaches to one node/pod, so the surge pod hangs in ContainerCreating on a Multi-Attach error and the rollout never converges — on a single replica that is a control plane that never comes back, while helm reports success. Leave deployment.strategy empty and the chart auto-selects Recreate for a single-writer logs PVC, or move the logs off it: logs.persistence.enabled=false with logs.sink.provider=s3|gcs (recommended), or logs.persistence.accessMode=ReadWriteMany on an RWX StorageClass. See #905."

  # The allowlist trims BEFORE it compares, so stray whitespace is normalized
  # rather than refused — an exact-compare allowlist would reject this spelling
  # outright, and the operator asked for something the chart supports. The
  # trailing space is unobservable in the parsed spec (YAML strips it from a
  # plain scalar), which is exactly why the same spelling had to be caught at
  # the guard above instead.
  - it: trims whitespace off an otherwise valid deployment.strategy rather than refusing it
    template: deployment.yaml
    set:
      deployment.strategy: "Recreate "
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: allows an explicit RollingUpdate on a ReadWriteMany logs PVC
    template: deployment.yaml
    set:
      deployment.strategy: RollingUpdate
      logs.persistence.accessMode: ReadWriteMany
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate

  - it: allows an explicit RollingUpdate when the logs live in object storage, with no PVC to hold
    template: deployment.yaml
    set:
      deployment.strategy: RollingUpdate
      logs.persistence.enabled: false
      logs.sink.provider: s3
      logs.sink.bucket: leoflow-task-logs
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate

  # ─── Drain grace + eviction opt-in wiring ────────────────────────────────
  # A voluntary eviction sends SIGTERM and waits terminationGracePeriodSeconds
  # before SIGKILL. The control plane drains its HTTP servers and releases the
  # scheduler lease on SIGTERM; the grace must outlast that drain or the leader
  # is killed mid-step-down and the follower waits out the lock timeout instead.
  - it: omits terminationGracePeriodSeconds by default (Kubernetes default applies, rendered pod spec unchanged)
    template: deployment.yaml
    asserts:
      - isNull:
          path: spec.template.spec.terminationGracePeriodSeconds

  - it: renders terminationGracePeriodSeconds when set
    template: deployment.yaml
    set:
      terminationGracePeriodSeconds: 60
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 60

  - it: renders terminationGracePeriodSeconds on both split Deployments
    template: deployment.yaml
    set:
      split.enabled: true
      logs.persistence.accessMode: ReadWriteMany
      terminationGracePeriodSeconds: 60
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 60
          documentIndex: 0
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 60
          documentIndex: 1

  # ─── preStop: stop taking NEW streams before the process dies ────────────
  # Endpoint removal is asynchronous: when a replica starts terminating, kube-
  # proxy and every client still hold it in their endpoint set for a window, so
  # task pods keep OPENING log streams against a control plane that is already
  # shutting them down — each one creating an empty log object for an attempt
  # whose lines then have nowhere to land. A preStop sleep spends that window
  # doing nothing while the endpoint propagates, so the new streams land on a
  # replica that will still be there to flush them. The native `sleep` action is
  # used deliberately: the image is distroless, so an `exec` hook has no shell
  # and no sleep binary to call.
  #
  # OFF by default, and the default is the assertion: for AGENT LOG STREAMS the
  # sleep only buys something when another replica is serving agent gRPC, and no
  # shipped topology has one (replicaCount 1; split pins the scheduler, which owns
  # the agent gRPC, to one). On those it buys nothing for those streams and adds
  # its own seconds to every upgrade — the same reason
  # terminationGracePeriodSeconds ships empty. It is still rendered on BOTH split
  # Deployments on purpose (asserted below): on the api side, with
  # split.api.replicaCount > 1, the same sleep spends the same propagation window
  # for HTTP and UI requests, which do have a second endpoint to land on.
  - it: ships the preStop hook off, so a default install's pod spec is unchanged
    template: deployment.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 30
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].lifecycle

  - it: turns the preStop sleep on in the HA profile, where a second replica can take the streams
    template: deployment.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 30
    values:
      - ../examples/values-ha.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.sleep.seconds
          value: 5
      # The profile's own grace has to hold the sleep plus the drain bounds.
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 60
  # The `sleep` hook action is gated on PodLifecycleSleepAction, which is beta and
  # ON only from 1.30. On 1.29 the feature gate is alpha and OFF, so the apiserver
  # nils the field and its own validation then rejects the resulting empty
  # `preStop: {}` with "must specify a handler type" — the Deployment create is
  # REJECTED and `helm install` hard-fails, the hook is NOT silently dropped.
  # Before 1.29 the field does not exist in the API types at all, so it is pruned
  # at decode and the same empty handler is what validation sees — 1.27 and 1.28
  # behave exactly like 1.26 here, and 1.29 is the only release where the field
  # exists and the gate is off. The project's floor is 1.27 (see the installation page), so
  # the render has to be gated on the capability; a `kubeVersion` in Chart.yaml
  # would instead refuse to install on 1.27-1.29 at all.
  - it: omits the preStop hook on a 1.29 apiserver, where the sleep action is alpha and off
    template: deployment.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 29
    set:
      deployment.preStopSleepSeconds: 5
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].lifecycle

  - it: renders the preStop sleep hook when asked for on a 1.30 apiserver
    template: deployment.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 30
    set:
      deployment.preStopSleepSeconds: 5
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.sleep.seconds
          value: 5

  - it: honors an overridden preStop sleep
    template: deployment.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 30
    set:
      deployment.preStopSleepSeconds: 15
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.sleep.seconds
          value: 15

  - it: omits the lifecycle block entirely when the preStop sleep is disabled with 0
    template: deployment.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 30
    set:
      deployment.preStopSleepSeconds: 0
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].lifecycle

  # Kubernetes validates the sleep as 0 < seconds <= terminationGracePeriodSeconds.
  # The chart ships the grace unset (the apiserver applies its own 30) and used to
  # accept any preStopSleepSeconds, so `--set deployment.preStopSleepSeconds=45`
  # rendered happily and the apiserver then rejected the pod spec — a failure the
  # chart can see at render time, like every other impossible combination it
  # already refuses.
  - it: refuses a preStop sleep that does not fit the apiserver's default grace
    template: deployment.yaml
    set:
      deployment.preStopSleepSeconds: 45
    asserts:
      - failedTemplate:
          errorMessage: "deployment.preStopSleepSeconds=45 does not fit the effective termination grace of 30s (Kubernetes' own default, because the rendered pod spec carries no terminationGracePeriodSeconds). Kubernetes validates the preStop sleep as 0 < seconds <= terminationGracePeriodSeconds, so a sleep ABOVE the grace is rejected by the apiserver and the install fails even though the render looked fine. A sleep EQUAL to the grace the apiserver accepts; this chart refuses it too, because the sleep runs BEFORE SIGTERM and that same grace still has to cover the shutdown that follows (HTTP <=10s + dispatch drain <=15s + gRPC stop <=10s, about 35s if every bound is hit), so spending the whole grace on the sleep guarantees a SIGKILL mid-drain. Give the shutdown real headroom rather than a second: raise terminationGracePeriodSeconds (the HA profile ships 60) or lower deployment.preStopSleepSeconds."

  # The guard has to model the RENDERED spec, not the raw value. The renderer
  # uses `with`, which omits terminationGracePeriodSeconds for nil, 0 and ""
  # alike, so on all three the apiserver applies its own 30 and a 5s sleep is
  # legal. A bare `terminationGracePeriodSeconds:` key in a layered values file
  # and Helm's documented `--set terminationGracePeriodSeconds=null` both
  # produce nil, and a guard that treats nil as "grace is 0" refuses a legal
  # install with a reason the spec never had (#918).
  - it: accepts the preStop sleep when terminationGracePeriodSeconds is null, where the apiserver's 30 applies
    template: deployment.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 30
    set:
      terminationGracePeriodSeconds: null
      deployment.preStopSleepSeconds: 5
    asserts:
      - isNull:
          path: spec.template.spec.terminationGracePeriodSeconds
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.sleep.seconds
          value: 5

  - it: accepts the preStop sleep when terminationGracePeriodSeconds is an explicit 0, where the apiserver's 30 applies
    template: deployment.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 30
    set:
      terminationGracePeriodSeconds: 0
      deployment.preStopSleepSeconds: 5
    asserts:
      - isNull:
          path: spec.template.spec.terminationGracePeriodSeconds
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.sleep.seconds
          value: 5

  # Upstream validation accepts seconds == grace; the refusal here is the chart's
  # own policy, and the message says so. A sleep that eats the whole grace leaves
  # zero budget for the shutdown that runs after it, so the pod is SIGKILLed
  # mid-drain every time — a spec the apiserver takes and the operator does not
  # want.
  - it: refuses a preStop sleep equal to an explicitly set grace
    template: deployment.yaml
    set:
      terminationGracePeriodSeconds: 60
      deployment.preStopSleepSeconds: 60
    asserts:
      - failedTemplate:
          errorMessage: "deployment.preStopSleepSeconds=60 does not fit the effective termination grace of 60s (the terminationGracePeriodSeconds this install sets). Kubernetes validates the preStop sleep as 0 < seconds <= terminationGracePeriodSeconds, so a sleep ABOVE the grace is rejected by the apiserver and the install fails even though the render looked fine. A sleep EQUAL to the grace the apiserver accepts; this chart refuses it too, because the sleep runs BEFORE SIGTERM and that same grace still has to cover the shutdown that follows (HTTP <=10s + dispatch drain <=15s + gRPC stop <=10s, about 35s if every bound is hit), so spending the whole grace on the sleep guarantees a SIGKILL mid-drain. Give the shutdown real headroom rather than a second: raise terminationGracePeriodSeconds (the HA profile ships 60) or lower deployment.preStopSleepSeconds."

  - it: accepts a preStop sleep that fits inside a raised grace
    template: deployment.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 30
    set:
      terminationGracePeriodSeconds: 60
      deployment.preStopSleepSeconds: 20
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.sleep.seconds
          value: 20

  - it: renders the preStop sleep on both split Deployments
    template: deployment.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 30
    set:
      split.enabled: true
      logs.persistence.accessMode: ReadWriteMany
      deployment.preStopSleepSeconds: 5
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.sleep.seconds
          value: 5
          documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.sleep.seconds
          value: 5
          documentIndex: 1

  - it: passes podAnnotations through to the pod template (the Karpenter do-not-disrupt opt-in path)
    template: deployment.yaml
    set:
      podAnnotations:
        karpenter.sh/do-not-disrupt: "true"
    asserts:
      - equal:
          path: spec.template.metadata.annotations["karpenter.sh/do-not-disrupt"]
          value: "true"

  # An operator who sets the value on a cluster below 1.30 gets nothing, and the
  # render is the only place that knows it. NOTES.txt already carries four
  # warnings of exactly this shape, so say it there rather than leaving the omit
  # silent. Both the renderer and this warning ask the same helper whether the
  # hook is supported, so the two cannot drift apart (#918).
  - it: NOTES warn that the preStop sleep is dropped on a 1.29 apiserver
    template: NOTES.txt
    capabilities:
      majorVersion: 1
      minorVersion: 29
    set:
      deployment.preStopSleepSeconds: 5
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: deployment.preStopSleepSeconds=5 is set, but this apiserver"

  - it: NOTES stay quiet about the preStop sleep on a 1.30 apiserver, where it renders
    template: NOTES.txt
    capabilities:
      majorVersion: 1
      minorVersion: 30
    set:
      deployment.preStopSleepSeconds: 5
    asserts:
      - notMatchRegexRaw:
          pattern: "WARNING: deployment.preStopSleepSeconds"

  - it: NOTES stay quiet about the preStop sleep when it is off, even below 1.30
    template: NOTES.txt
    capabilities:
      majorVersion: 1
      minorVersion: 29
    set:
      deployment.preStopSleepSeconds: 0
    asserts:
      - notMatchRegexRaw:
          pattern: "WARNING: deployment.preStopSleepSeconds"

  # ─── NOTES: say the trap out loud ────────────────────────────────────────
  - it: NOTES warn when a PDB is forced onto a single replica
    template: NOTES.txt
    set:
      replicaCount: 1
      podDisruptionBudget.enabled: true
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: podDisruptionBudget.enabled=true with a single replica"

  # The warning has to follow the value's SPELLING, not its YAML type. Once the
  # helper honoured `"true"`, a string-spelled budget rendered over a single
  # replica while these two branches — still keyed on `kindIs "bool"` — stayed
  # silent, so the Argo CD path this chart exists to serve got the drain-blocking
  # budget with none of the warning that justifies allowing it. Before the string
  # spellings were honoured the operator got no budget and no warning, which was
  # at least consistent (#905).
  - it: NOTES warn when a string-typed PDB is forced onto a single replica (Argo CD helm.parameters)
    template: NOTES.txt
    set:
      replicaCount: 1
      podDisruptionBudget.enabled: "true"
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: podDisruptionBudget.enabled=true with a single replica"

  - it: NOTES stay quiet when a string-typed PDB is turned OFF at a single replica
    template: NOTES.txt
    set:
      replicaCount: 1
      podDisruptionBudget.enabled: "false"
    asserts:
      # The negative half of the spelling fix. A budget the operator turned off
      # renders nothing, so warning about one would be noise — and this is the
      # case a naive "the value is a non-empty string" test would get wrong.
      - notMatchRegexRaw:
          pattern: "WARNING: podDisruptionBudget.enabled"

  - it: NOTES warn when an uppercase-T string PDB is forced onto a single replica
    template: NOTES.txt
    set:
      replicaCount: 1
      podDisruptionBudget.enabled: "True"
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: podDisruptionBudget.enabled=true with a single replica"

  - it: NOTES warn when HA runs on ephemeral per-pod log storage with the disk sink
    template: NOTES.txt
    set:
      replicaCount: 2
      logs.persistence.enabled: false
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: more than one control-plane pod \\(up to 2\\) with logs.persistence.enabled=false and logs.sink.provider=disk"

  - it: NOTES stay quiet on the recommended HA profile (object sink, auto PDB)
    template: NOTES.txt
    set:
      replicaCount: 2
      logs.persistence.enabled: false
      logs.sink.provider: s3
      logs.sink.bucket: leoflow-task-logs
    asserts:
      - notMatchRegexRaw:
          pattern: "WARNING: more than one control-plane pod"
      - notMatchRegexRaw:
          pattern: "WARNING: podDisruptionBudget.enabled=true"

  # ─── Topology spread: two replicas on one node is one replica ────────────
  # Consolidation bin-packs both replicas onto one node unless told otherwise;
  # a node failure then takes the whole control plane, and the auto PDB (one
  # of two must stay up, both on the drained node) blocks the eviction — the
  # single-replica trap one level up. Constraints without a labelSelector get
  # the Deployment's own selector so a values file need not know the release.
  - it: renders no topologySpreadConstraints by default
    template: deployment.yaml
    asserts:
      - isNull:
          path: spec.template.spec.topologySpreadConstraints

  - it: renders topologySpreadConstraints and fills the role selector when a constraint omits labelSelector
    template: deployment.yaml
    set:
      replicaCount: 2
      logs.persistence.enabled: false
      logs.sink.provider: s3
      logs.sink.bucket: b
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: ScheduleAnyway
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 1
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels
          value:
            app.kubernetes.io/name: leoflow
            app.kubernetes.io/instance: leoflow

  - it: keeps an explicit labelSelector on a topologySpreadConstraint verbatim
    template: deployment.yaml
    set:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              team: data
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels
          value:
            team: data

  - it: renders topologySpreadConstraints on the split api Deployment with the api selector
    template: deployment.yaml
    documentIndex: 0
    set:
      split.enabled: true
      logs.persistence.accessMode: ReadWriteMany
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels["app.kubernetes.io/component"]
          value: api

  - it: renders topologySpreadConstraints on the split scheduler Deployment with the scheduler selector
    template: deployment.yaml
    documentIndex: 1
    set:
      split.enabled: true
      logs.persistence.accessMode: ReadWriteMany
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels["app.kubernetes.io/component"]
          value: scheduler

  # ─── Per-pod emptyDir logs across more than one mounter ──────────────────
  # The warning must key on the same mounter ceiling as the render guard (HPA
  # maxReplicas, split api+scheduler), not on replicaCount alone.
  - it: NOTES warn on per-pod emptyDir logs when the HPA can scale past one replica
    template: NOTES.txt
    set:
      replicaCount: 1
      autoscaling.enabled: true
      autoscaling.minReplicas: 1
      autoscaling.maxReplicas: 3
      logs.persistence.enabled: false
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: more than one control-plane pod \\(up to 3\\) with logs.persistence.enabled=false and logs.sink.provider=disk"

  # Split + emptyDir + disk sink is not risky, it is broken: the scheduler pod
  # writes every task log into its own emptyDir and each api pod reads from its
  # own, so no log is ever readable. Refuse at render.
  - it: fails the render when split.enabled with logs persistence disabled and the disk sink
    template: deployment.yaml
    set:
      split.enabled: true
      logs.persistence.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "split.enabled with logs.persistence.enabled=false and logs.sink.provider=disk cannot serve task logs: the scheduler pod writes them into its own emptyDir and every api pod reads from its own, so no task log is ever readable from the API/UI. Ship task logs to object storage (logs.sink.provider=s3|gcs with logs.sink.bucket), or use a ReadWriteMany logs PVC (logs.persistence.enabled=true, logs.persistence.accessMode=ReadWriteMany). See helm/dexaflow/examples/values-ha.yaml."

  - it: renders split.enabled with logs persistence disabled when the object sink is configured
    template: deployment.yaml
    set:
      split.enabled: true
      logs.persistence.enabled: false
      logs.sink.provider: gcs
      logs.sink.bucket: b
    asserts:
      - hasDocuments:
          count: 2

  # ─── PDB: evicting an already-broken control plane must stay possible ────
  # The Kubernetes default (IfHealthyBudget) refuses to evict even unhealthy
  # pods once the budget is not met, so with BOTH replicas unready (bad DB
  # credentials after a rotation, image-pull failure, wedged rollout) a drain
  # hangs on a control plane that is already down.
  - it: sets unhealthyPodEvictionPolicy AlwaysAllow on the auto PDB by default
    template: pdb.yaml
    set:
      replicaCount: 2
      logs.persistence.enabled: false
    asserts:
      - equal:
          path: spec.unhealthyPodEvictionPolicy
          value: AlwaysAllow

  - it: honors an explicit podDisruptionBudget.unhealthyPodEvictionPolicy
    template: pdb.yaml
    set:
      replicaCount: 2
      logs.persistence.enabled: false
      podDisruptionBudget.unhealthyPodEvictionPolicy: IfHealthyBudget
    asserts:
      - equal:
          path: spec.unhealthyPodEvictionPolicy
          value: IfHealthyBudget

  - it: omits unhealthyPodEvictionPolicy when set empty (for apiservers that prune the field)
    template: pdb.yaml
    set:
      replicaCount: 2
      logs.persistence.enabled: false
      podDisruptionBudget.unhealthyPodEvictionPolicy: ""
    asserts:
      - isNull:
          path: spec.unhealthyPodEvictionPolicy

  # ─── Upgrade call-out: a PDB that appears on `helm upgrade` ──────────────
  - it: NOTES call out an auto-rendered PDB on upgrade
    template: NOTES.txt
    release:
      name: leoflow
      upgrade: true
    set:
      replicaCount: 2
      logs.persistence.enabled: false
      logs.sink.provider: s3
      logs.sink.bucket: b
    asserts:
      - matchRegexRaw:
          pattern: "NOTE: this release renders a PodDisruptionBudget \\(auto: replica floor 2 > 1\\)"

  - it: NOTES stay quiet about the PDB on a fresh install
    template: NOTES.txt
    release:
      name: leoflow
      upgrade: false
    set:
      replicaCount: 2
      logs.persistence.enabled: false
      logs.sink.provider: s3
      logs.sink.bucket: b
    asserts:
      - notMatchRegexRaw:
          pattern: "NOTE: this release renders a PodDisruptionBudget"

  - it: NOTES do not call out a PDB the operator set explicitly
    template: NOTES.txt
    release:
      name: leoflow
      upgrade: true
    set:
      replicaCount: 2
      logs.persistence.enabled: false
      logs.sink.provider: s3
      logs.sink.bucket: b
      podDisruptionBudget.enabled: true
    asserts:
      - notMatchRegexRaw:
          pattern: "NOTE: this release renders a PodDisruptionBudget"

  # Same clause, string spelling: the note says the budget was AUTO-selected
  # ("auto: replica floor 2 > 1"), so printing it over a value the operator set
  # by hand misattributes their own decision back to them (#905).
  - it: NOTES do not call out a PDB the operator set explicitly as a string
    template: NOTES.txt
    release:
      name: leoflow
      upgrade: true
    set:
      replicaCount: 2
      logs.persistence.enabled: false
      logs.sink.provider: s3
      logs.sink.bucket: b
      podDisruptionBudget.enabled: "true"
    asserts:
      - notMatchRegexRaw:
          pattern: "NOTE: this release renders a PodDisruptionBudget"
