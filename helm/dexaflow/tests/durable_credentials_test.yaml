suite: the Deployment's credentials are a normal resource, not a hook
templates:
  - deployment.yaml
  - secret.yaml
  - migration-job.yaml
release:
  name: leoflow
# The pre-rename naming (what charts/leoflow renders), which existing
# installs depend on; default dexaflow naming is in chart_name_test.yaml.
set:
  nameOverride: leoflow
  database.url: postgres://h/d
  redis.url: redis://h/0
  auth.jwtSecret: jwt
  secretKey: leoflow-unittest-secretkey-32by!
  bootstrap.password: bootstrap-pw
tests:
  # #1142, reported from production under Argo CD 3.5.3. The Deployment consumed
  # its credentials from a Secret rendered as a pre-install/pre-upgrade HOOK.
  # Argo deletes a before-hook-creation hook and recreates it in a LATER pass of
  # the same operation, hooks are excluded from the compared state, and self-heal
  # only reconciles tracked resources. So an operation interrupted between the two
  # halves left the Secret gone, permanently, with the Application still Synced.
  # Both replicas sat in CreateContainerConfigError for 4h47m and nothing paged.
  #
  # The durable Secret must therefore be an ordinary tracked resource.
  - it: the credentials the Deployment reads are not a hook
    template: secret.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: leoflow-credentials
      - notExists:
          path: metadata.annotations["helm.sh/hook"]

  - it: the durable Secret carries every inline credential
    template: secret.yaml
    documentIndex: 0
    asserts:
      - exists: { path: stringData.databaseUrl }
      - exists: { path: stringData.redisUrl }
      - exists: { path: stringData.jwtSecret }
      - exists: { path: stringData.secretKey }
      - exists: { path: stringData.bootstrapPassword }

  - it: the Deployment reads the durable Secret, never the hook
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: leoflow-credentials
                key: databaseUrl
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: leoflow-secrets
                key: databaseUrl
          any: true
      # All five, not just the DSN. Each secretKeyRef is written out separately
      # in the template, so pinning one of them leaves the other four free to
      # drift back to the hook's name one at a time, and a Deployment that reads
      # four tracked keys and one hook key is the same outage as this bug.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_REDIS_URL
            valueFrom:
              secretKeyRef:
                name: leoflow-credentials
                key: redisUrl
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_AUTH_JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: leoflow-credentials
                key: jwtSecret
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: leoflow-credentials
                key: secretKey
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_BOOTSTRAP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: leoflow-credentials
                key: bootstrapPassword
          any: true

  # The hook copy still exists, because the migration Job runs in PreSync and
  # needs the DSN before the normal manifest is applied. It is reduced to the one
  # key that Job reads, and it is deleted when the hook succeeds so it does not
  # outlive the operation that created it.
  - it: the hook copy carries only what the migration Job reads
    template: secret.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: leoflow-secrets
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
      - exists: { path: stringData.databaseUrl }
      - notExists: { path: stringData.jwtSecret }
      - notExists: { path: stringData.redisUrl }

  - it: the migration Job reads the hook copy
    template: migration-job.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: leoflow-secrets
                key: databaseUrl
          any: true

  - it: no hook copy when there is no migration Job to feed
    set:
      migrations.enabled: false
    template: secret.yaml
    asserts:
      - hasDocuments:
          count: 1

  # The other way to reach "no hook copy": the operator supplies the DSN
  # themselves. The migration Job must follow them to that Secret, because the
  # hook name is rendered by nothing in this shape and a secretKeyRef to a name
  # that does not exist parks the pre-install hook in CreateContainerConfigError
  # until Helm times the install out.
  - it: an operator-supplied database Secret feeds the migration Job directly
    set:
      database.existingSecret: my-pg
    template: migration-job.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: my-pg
                key: databaseUrl
          any: true

  - it: no hook copy when the operator supplies the database Secret
    set:
      database.existingSecret: my-pg
    template: secret.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: leoflow-credentials
