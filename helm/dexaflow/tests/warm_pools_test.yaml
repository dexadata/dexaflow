suite: warm worker pool + agent-credential posture env wiring (ADR 0058)
templates:
  # secret.yaml is in scope so the deployment's `checksum/secret` annotation can
  # resolve its `include` reference (same reason as deployment_test.yaml).
  - deployment.yaml
  - secret.yaml
release:
  name: leoflow
  namespace: leoflow
# The pre-rename naming (what charts/leoflow renders), which existing
# installs depend on; default dexaflow naming is in chart_name_test.yaml.
set:
  nameOverride: leoflow
  database.url: postgres://h/d
  redis.url: redis://h/0
  auth.jwtSecret: jwt
  agentTLS.enabled: true
  agentTLS.serverCertSecret: leoflow-tls
  agentTLS.caConfigMap: leoflow-ca
tests:
  # The default install must stay today's behavior: dedicated pod-per-task, the
  # plaintext env-var agent credential, and liveness in observe. These three are
  # stamped even at their defaults so a `helm upgrade` reasserts them over any
  # out-of-band `kubectl set env` — the chart is the source of truth for the
  # knobs a warm pool's security depends on.
  - it: stamps warm pools OFF and the safe credential posture on a default install
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_EXECUTION_WARM_POOLS_ENABLED
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_AUTH_AGENT_TOKEN_TRANSPORT
            value: "envvar"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_AUTH_SECRET_LIVENESS_MODE
            value: "observe"

  # The D6/D9 tuning caps are inert while the flag is off (the server's
  # validateExecution returns before reading them), so an OFF install carries
  # none of them.
  - it: omits the pool tuning env while warm pools are off
    template: deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_EXECUTION_MIN_IDLE_WORKERS
            value: "0"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_EXECUTION_MAX_POOL_SIZE
            value: "8"

  - it: wires every warm-pool knob when warm pools are enabled with the ADR 0058 D2 prerequisites
    template: deployment.yaml
    set:
      execution.warmPoolsEnabled: true
      auth.agentTokenTransport: exchange
      auth.secretLivenessMode: enforce
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_EXECUTION_WARM_POOLS_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_EXECUTION_MIN_IDLE_WORKERS
            value: "0"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_EXECUTION_MAX_POOL_SIZE
            value: "8"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_EXECUTION_MAX_ATTEMPTS_PER_WORKER
            value: "50"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_EXECUTION_MAX_WORKER_LIFETIME
            value: "1h"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_EXECUTION_WORKER_IDLE_TTL
            value: "5m"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_EXECUTION_MAX_WARM_PODS_PER_TENANT
            value: "100"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_AUTH_AGENT_TOKEN_TRANSPORT
            value: "exchange"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_AUTH_SECRET_LIVENESS_MODE
            value: "enforce"

  # The chart's defaults must equal the server's Go defaults, so the values above
  # are not the only shape that has to render: an operator-tuned pool must reach
  # the server verbatim, durations included (viper parses them as strings).
  - it: passes operator-tuned pool values through verbatim
    template: deployment.yaml
    set:
      execution.warmPoolsEnabled: true
      execution.minIdleWorkers: 2
      execution.maxPoolSize: 16
      execution.maxAttemptsPerWorker: 25
      execution.maxWorkerLifetime: 30m
      execution.workerIdleTtl: 90s
      execution.maxWarmPodsPerTenant: 40
      auth.agentTokenTransport: exchange
      auth.secretLivenessMode: enforce
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_EXECUTION_MIN_IDLE_WORKERS
            value: "2"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_EXECUTION_MAX_POOL_SIZE
            value: "16"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_EXECUTION_MAX_ATTEMPTS_PER_WORKER
            value: "25"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_EXECUTION_MAX_WORKER_LIFETIME
            value: "30m"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_EXECUTION_WORKER_IDLE_TTL
            value: "90s"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_EXECUTION_MAX_WARM_PODS_PER_TENANT
            value: "40"

  # X4: warm pods inherit executor.defaults.resources unless sized explicitly, so
  # the override is stamped only when set and an unset install keeps its env.
  - it: passes warm pod resources through only when set
    template: deployment.yaml
    set:
      execution.warmPoolsEnabled: true
      execution.warmPodResources.cpu: 750m
      execution.warmPodResources.memory: 1Gi
      auth.agentTokenTransport: exchange
      auth.secretLivenessMode: enforce
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_EXECUTION_WARM_POD_RESOURCES_CPU
            value: "750m"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_EXECUTION_WARM_POD_RESOURCES_MEMORY
            value: "1Gi"

  - it: omits warm pod resources when unset
    template: deployment.yaml
    set:
      execution.warmPoolsEnabled: true
      auth.agentTokenTransport: exchange
      auth.secretLivenessMode: enforce
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_EXECUTION_WARM_POD_RESOURCES_CPU
            value: ""

  # ADR 0058 D2 is a security coupling, not a preference: the server refuses to
  # boot on it, so rendering an install that cannot boot only turns a config
  # error into a CrashLoopBackOff. Refuse at render, in both directions.
  - it: refuses to render warm pools on the env-var transport
    template: deployment.yaml
    set:
      execution.warmPoolsEnabled: true
      auth.secretLivenessMode: enforce
    asserts:
      - failedTemplate:
          errorMessage: "execution.warmPoolsEnabled requires auth.agentTokenTransport=exchange AND auth.secretLivenessMode=enforce: a warm pod reuses one pod across many attempts, and only a per-attempt token that dies with its attempt keeps a superseded attempt from still resolving secrets (ADR 0058 D2). The server enforces the same coupling at boot, so this install would CrashLoopBackOff instead of running warm pools."

  - it: refuses to render warm pools while secret liveness is only observed
    template: deployment.yaml
    set:
      execution.warmPoolsEnabled: true
      auth.agentTokenTransport: exchange
    asserts:
      - failedTemplate:
          errorMessage: "execution.warmPoolsEnabled requires auth.agentTokenTransport=exchange AND auth.secretLivenessMode=enforce: a warm pod reuses one pod across many attempts, and only a per-attempt token that dies with its attempt keeps a superseded attempt from still resolving secrets (ADR 0058 D2). The server enforces the same coupling at boot, so this install would CrashLoopBackOff instead of running warm pools."

  # The escape hatch that was missing: without it, reaching any server setting the
  # chart does not model means `kubectl set env` behind helm's back.
  - it: appends extraEnv entries to the control-plane env
    template: deployment.yaml
    set:
      extraEnv:
        - name: LEOFLOW_SCHEDULER_DISPATCH_WORKERS
          value: "4"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_SCHEDULER_DISPATCH_WORKERS
            value: "4"

  # A Kubernetes env value is a string; a YAML number or bool would be rejected by
  # the apiserver on apply, long after the render looked fine. Normalize instead
  # of leaving the operator to remember the quotes.
  - it: renders a non-string extraEnv value as a string
    template: deployment.yaml
    set:
      extraEnv:
        - name: LEOFLOW_SCHEDULER_DISPATCH_WORKERS
          value: 4
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_SCHEDULER_DISPATCH_WORKERS
            value: "4"

  - it: keeps a valueFrom extraEnv entry intact
    template: deployment.yaml
    set:
      extraEnv:
        - name: LEOFLOW_LOGS_SINK_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: my-bucket-creds
              key: accessKeyId
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_LOGS_SINK_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: my-bucket-creds
                key: accessKeyId

  # The hatch must not become a way around the D2 render guard above.
  - it: refuses an extraEnv entry that redefines a security-coupled variable
    template: deployment.yaml
    set:
      extraEnv:
        - name: LEOFLOW_EXECUTION_WARM_POOLS_ENABLED
          value: "true"
    asserts:
      - failedTemplate:
          errorMessage: "extraEnv must not set LEOFLOW_EXECUTION_WARM_POOLS_ENABLED: warm pools and the agent-credential posture they depend on are coupled by a render-time guard (ADR 0058 D2), and setting them through the escape hatch would skip it. Use execution.warmPoolsEnabled, auth.agentTokenTransport and auth.secretLivenessMode instead."
