suite: chart-managed Secret renders correctly under inline / existingSecret mixes
templates:
  - secret.yaml
release:
  name: leoflow
# The pre-rename naming (what charts/leoflow renders), which existing
# installs depend on; default dexaflow naming is in chart_name_test.yaml.
set:
  nameOverride: leoflow
tests:
  - it: renders all five keys when all inline values are set
    set:
      database.url: postgres://leoflow:p@host:5432/leoflow
      redis.url: redis://host:6379/0
      auth.jwtSecret: jwt-fixture
      secretKey: leoflow-unittest-secretkey-32by!
      bootstrap.password: admin-fixture
    documentIndex: 0
    asserts:
      # Two documents since #1142: the durable Secret the Deployment reads, plus
      # the hook copy that feeds the pre-install migration Job. The key
      # assertions below are on the durable one.
      - hasDocuments:
          count: 2
      - isKind:
          of: Secret
      - equal:
          path: stringData.databaseUrl
          value: postgres://leoflow:p@host:5432/leoflow
      - equal:
          path: stringData.redisUrl
          value: redis://host:6379/0
      - equal:
          path: stringData.jwtSecret
          value: jwt-fixture
      - equal:
          path: stringData.secretKey
          value: leoflow-unittest-secretkey-32by!
      - equal:
          path: stringData.bootstrapPassword
          value: admin-fixture

  - it: renders no chart-managed Secret when every credential references an existingSecret
    set:
      database.existingSecret: my-pg
      redis.existingSecret: my-redis
      auth.existingSecret: my-jwt
      secretKeyExistingSecret: my-key
      bootstrap.existingSecret: my-boot
    asserts:
      - hasDocuments:
          count: 0

  - it: renders only the inline keys in a mixed (inline + existingSecret) scenario
    set:
      database.existingSecret: my-pg
      redis.url: redis://host:6379/0
      auth.existingSecret: my-jwt
      secretKey: leoflow-unittest-secretkey-32by!
      bootstrap.existingSecret: my-boot
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      # databaseUrl + jwtSecret + bootstrapPassword come from external Secrets,
      # so the chart-managed Secret must NOT include those keys.
      - notExists:
          path: stringData.databaseUrl
      - notExists:
          path: stringData.jwtSecret
      - notExists:
          path: stringData.bootstrapPassword
      - equal:
          path: stringData.redisUrl
          value: redis://host:6379/0
      - equal:
          path: stringData.secretKey
          value: leoflow-unittest-secretkey-32by!

  # Rewritten for #1142. The hook annotations moved to a second, migration-only
  # Secret; the Secret the Deployment reads must carry none, because a hook is
  # deleted and recreated across passes of an Argo sync and is not restored by
  # self-heal. With only a jwtSecret inline there is no database URL, so no hook
  # copy is rendered at all.
  - it: an install with no inline database URL renders no hook copy
    set:
      auth.jwtSecret: jwt
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: metadata.annotations["helm.sh/hook"]

  - it: the hook copy keeps the ordering annotations, and gains a delete policy
    set:
      database.url: postgres://h/d
      auth.jwtSecret: jwt
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-5"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
