suite: optional PrometheusRule, schema wait (ADR 0090 decision 6) and the page and ticket groups (#2298)
templates:
  - prometheusrule.yaml
release:
  name: dexaflow
  namespace: data
set:
  agentTLS.enabled: true
  agentTLS.serverCertSecret: dexaflow-tls
  agentTLS.caConfigMap: dexaflow-ca
  database.url: postgres://h/d
  redis.url: redis://h/0
  auth.jwtSecret: s
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  # An upgrade with --reuse-values from a release whose values predate the
  # key carries no prometheusRule at all; the template must still render.
  - it: renders nothing when the values predate the key
    set:
      metrics.prometheusRule: null
    asserts:
      - hasDocuments:
          count: 0

  - it: alerts when the schema stays not ready for 5 minutes
    set:
      metrics.prometheusRule.enabled: true
    asserts:
      - isKind:
          of: PrometheusRule
      - equal:
          path: metadata.namespace
          value: data
      - equal:
          path: spec.groups[0].rules[0].alert
          value: DexaflowSchemaNotReady
      - equal:
          path: spec.groups[0].rules[0].expr
          value: dexaflow_schema_ready{namespace="data"} == 0
      - equal:
          path: spec.groups[0].rules[0].for
          value: 5m

  # Critical only for a replaced database; every other reason is a warning.
  # The label is a Prometheus template, so Helm must leave it unrendered.
  - it: is critical only when the reason is database replaced
    set:
      metrics.prometheusRule.enabled: true
    asserts:
      - equal:
          path: spec.groups[0].rules[0].labels.severity
          value: '{{ if eq $labels.reason "database replaced" }}critical{{ else }}warning{{ end }}'
      - matchRegex:
          path: spec.groups[0].rules[0].annotations.description
          pattern: '\{\{ \$labels\.reason \}\}'

  - it: takes a namespace and the labels a ruleSelector needs
    set:
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.namespace: monitoring
      metrics.prometheusRule.additionalLabels:
        release: kube-prometheus-stack
    asserts:
      - equal:
          path: metadata.namespace
          value: monitoring
      - equal:
          path: metadata.labels.release
          value: kube-prometheus-stack
      - equal:
          path: spec.groups[0].rules[0].expr
          value: dexaflow_schema_ready{namespace="data"} == 0

  - it: renders a page and a ticket group, every alert with a runbook
    set:
      metrics.prometheusRule.enabled: true
    asserts:
      - equal:
          path: spec.groups[0].name
          value: dexaflow-page
      - equal:
          path: spec.groups[1].name
          value: dexaflow-ticket
      - lengthEqual:
          path: spec.groups[0].rules
          count: 9
      - lengthEqual:
          path: spec.groups[1].rules
          count: 7
      - equal:
          path: spec.groups[0].rules[0].annotations.runbook_url
          value: https://dexaflow.dexadata.ai/operate/runbooks/schema-not-ready/
      - equal:
          path: spec.groups[1].rules[6].annotations.runbook_url
          value: https://dexaflow.dexadata.ai/operate/runbooks/mixed-versions/

  - it: takes the runbook base and the thresholds from values
    set:
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.runbookBaseURL: https://docs.example.internal/runbooks
      metrics.prometheusRule.thresholds.queueWaitP99Seconds: 60
      metrics.prometheusRule.thresholds.mixedVersionsFor: 2h
    asserts:
      - equal:
          path: spec.groups[0].rules[0].annotations.runbook_url
          value: https://docs.example.internal/runbooks/schema-not-ready/
      - matchRegex:
          path: spec.groups[0].rules[4].expr
          pattern: '> 60\n?$'
      - equal:
          path: spec.groups[1].rules[6].for
          value: 2h

  # --reuse-values from a release whose values predate the thresholds.
  - it: falls back to the documented defaults when thresholds are absent
    set:
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.thresholds: null
      metrics.prometheusRule.runbookBaseURL: null
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[4].expr
          pattern: '> 300\n?$'
      - equal:
          path: spec.groups[1].rules[6].for
          value: 30m
      - equal:
          path: spec.groups[0].rules[0].annotations.runbook_url
          value: https://dexaflow.dexadata.ai/operate/runbooks/schema-not-ready/

  - it: renders the slo group with recording rules and two burn rate alerts (#2314)
    set:
      metrics.prometheusRule.enabled: true
    asserts:
      - equal:
          path: spec.groups[2].name
          value: dexaflow-slo
      # 4 objectives x (1 objective + 4 windows), the leaderless rule, 2 alerts.
      - lengthEqual:
          path: spec.groups[2].rules
          count: 23
      - equal:
          path: spec.groups[2].rules[0].expr
          value: vector(0.99)
      - equal:
          path: spec.groups[2].rules[0].labels
          value: {namespace: data, slo: schedule_punctuality}
      - equal:
          path: spec.groups[2].rules[21].alert
          value: DexaflowErrorBudgetFastBurn
      - equal:
          path: spec.groups[2].rules[22].annotations.runbook_url
          value: https://dexaflow.dexadata.ai/operate/runbooks/error-budget-burn/

  - it: takes the objectives from values
    set:
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.slo.objectives.apiAvailability: 0.9995
    asserts:
      - equal:
          path: spec.groups[2].rules[15].expr
          value: vector(0.9995)
      - equal:
          path: spec.groups[2].rules[15].labels.slo
          value: api_availability

  - it: leaves the slo group out when slo.enabled is false
    set:
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.slo.enabled: false
    asserts:
      - lengthEqual:
          path: spec.groups
          count: 2

  # --reuse-values from a release whose values predate the slo key.
  - it: renders the slo group with the documented objectives when the key is absent
    set:
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.slo: null
    asserts:
      - equal:
          path: spec.groups[2].rules[5].expr
          value: vector(0.99)
      - equal:
          path: spec.groups[2].rules[10].expr
          value: vector(0.999)

