suite: task-pod egress NetworkPolicy (ADR 0047/0048)
templates:
  - task-networkpolicy.yaml
# The pre-rename naming (what charts/leoflow renders), which existing
# installs depend on; default dexaflow naming is in chart_name_test.yaml.
set:
  nameOverride: leoflow
tests:
  - it: not rendered when taskNetworkPolicy.enabled is false (default)
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
    asserts:
      - hasDocuments:
          count: 0

  - it: renders in taskNamespace, selects task pods, denies ingress, blocks metadata by default
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNamespace: tasks-ns
      taskNetworkPolicy.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.namespace
          value: tasks-ns
      # selects every task pod by the run-id label they carry
      - equal:
          path: spec.podSelector.matchExpressions[0].key
          value: leoflow.io/run-id
      - equal:
          path: spec.podSelector.matchExpressions[0].operator
          value: Exists
      # ingress denied (nothing dials into a task pod)
      - equal:
          path: spec.ingress
          value: []
      - contains:
          path: spec.policyTypes
          content: Egress
      # the metadata endpoint is in the egress except-list by default
      - contains:
          path: spec.egress[2].to[0].ipBlock.except
          content: 169.254.0.0/16

  - it: blockPrivateNetworks adds RFC1918 to the except-list; metadata still blocked
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNetworkPolicy.enabled: true
      taskNetworkPolicy.blockPrivateNetworks: true
    asserts:
      - contains:
          path: spec.egress[2].to[0].ipBlock.except
          content: 10.0.0.0/8
      - contains:
          path: spec.egress[2].to[0].ipBlock.except
          content: 169.254.0.0/16

  # ─── allowMetadataEgress: the escape hatch stays one host wide ───────────
  # The always-blocked 169.254.0.0/16 in the rule above is the one containment
  # this policy's security story rests on, and this list is the only way to
  # punch through it. It punches through completely if it is allowed to name a
  # range: egress rules are additive (k8s.io/api networking/v1 — outgoing
  # traffic is allowed if it matches AT LEAST ONE egress rule), so a second
  # rule allowing 169.254.0.0/16 overrides the except-list in the first one and
  # the block is gone while the rendered manifest still shows it. values.yaml
  # said "one /32 each, never the whole range" and nothing enforced it (#958).

  - it: accepts the documented GKE Workload Identity /32 and renders it as its own egress rule
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNetworkPolicy.enabled: true
      taskNetworkPolicy.allowMetadataEgress:
        - 169.254.169.254/32
    asserts:
      - equal:
          path: spec.egress[3].to[0].ipBlock.cidr
          value: 169.254.169.254/32
      # and the always-blocked range is still excepted in the allow-all rule
      - contains:
          path: spec.egress[2].to[0].ipBlock.except
          content: 169.254.0.0/16

  - it: accepts both documented hosts, one ipBlock peer each
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNetworkPolicy.enabled: true
      taskNetworkPolicy.allowMetadataEgress:
        - 169.254.169.254/32
        - 169.254.170.23/32
    asserts:
      - equal:
          path: spec.egress[3].to[0].ipBlock.cidr
          value: 169.254.169.254/32
      - equal:
          path: spec.egress[3].to[1].ipBlock.cidr
          value: 169.254.170.23/32

  - it: accepts an IPv6 /128 (EKS Pod Identity on a dual-stack cluster)
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNetworkPolicy.enabled: true
      taskNetworkPolicy.allowMetadataEgress:
        - fd00:ec2::23/128
    asserts:
      - equal:
          path: spec.egress[3].to[0].ipBlock.cidr
          value: fd00:ec2::23/128

  # WIRING, not just the helper: a padded entry renders TRIMMED. Nothing but the
  # validated helper produces that, so deleting the include from
  # task-networkpolicy.yaml — the exact hole that leaves a guard defined and
  # uncalled with every gate green — turns this red. `--set-string` and Argo CD's
  # helm.parameters both deliver the value as a string, padding included.
  - it: renders the trimmed CIDR, proving the template goes through the guard
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNetworkPolicy.enabled: true
      taskNetworkPolicy.allowMetadataEgress:
        - "  169.254.169.254/32  "
    asserts:
      - equal:
          path: spec.egress[3].to[0].ipBlock.cidr
          value: 169.254.169.254/32

  - it: adds no fourth egress rule when the list is empty (the default)
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNetworkPolicy.enabled: true

    asserts:
      - lengthEqual:
          path: spec.egress
          count: 3

  - it: refuses the whole metadata /16 — the range the policy exists to block
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNetworkPolicy.enabled: true
      taskNetworkPolicy.allowMetadataEgress:
        - "169.254.0.0/16"
    asserts:
      - failedTemplate:
          errorMessage: "taskNetworkPolicy.allowMetadataEgress[0]=\"169.254.0.0/16\" has prefix /16, which selects more than one host (IPv4 needs /32). Every entry must name exactly ONE host, because NetworkPolicy egress rules are additive: k8s.io/api networking/v1 defines outgoing traffic as allowed if it matches at least one egress rule, so an allow rule here overrides the 169.254.0.0/16 entry in the allow-all rule's except-list and anything broader than a single host reopens the cloud-metadata range this policy exists to block. Accepted: an IPv4 address with /32 (GKE Workload Identity 169.254.169.254/32, EKS Pod Identity 169.254.170.23/32) or an IPv6 address with /128; surrounding whitespace is trimmed. To reach a wider range that is NOT the metadata range, use taskNetworkPolicy.extraEgress. See #958."

  - it: refuses a /24 inside the metadata range
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNetworkPolicy.enabled: true
      taskNetworkPolicy.allowMetadataEgress:
        - "169.254.169.0/24"
    asserts:
      - failedTemplate:
          errorMessage: "taskNetworkPolicy.allowMetadataEgress[0]=\"169.254.169.0/24\" has prefix /24, which selects more than one host (IPv4 needs /32). Every entry must name exactly ONE host, because NetworkPolicy egress rules are additive: k8s.io/api networking/v1 defines outgoing traffic as allowed if it matches at least one egress rule, so an allow rule here overrides the 169.254.0.0/16 entry in the allow-all rule's except-list and anything broader than a single host reopens the cloud-metadata range this policy exists to block. Accepted: an IPv4 address with /32 (GKE Workload Identity 169.254.169.254/32, EKS Pod Identity 169.254.170.23/32) or an IPv6 address with /128; surrounding whitespace is trimmed. To reach a wider range that is NOT the metadata range, use taskNetworkPolicy.extraEgress. See #958."

  - it: refuses 0.0.0.0/0
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNetworkPolicy.enabled: true
      taskNetworkPolicy.allowMetadataEgress:
        - "0.0.0.0/0"
    asserts:
      - failedTemplate:
          errorMessage: "taskNetworkPolicy.allowMetadataEgress[0]=\"0.0.0.0/0\" has prefix /0, which selects more than one host (IPv4 needs /32). Every entry must name exactly ONE host, because NetworkPolicy egress rules are additive: k8s.io/api networking/v1 defines outgoing traffic as allowed if it matches at least one egress rule, so an allow rule here overrides the 169.254.0.0/16 entry in the allow-all rule's except-list and anything broader than a single host reopens the cloud-metadata range this policy exists to block. Accepted: an IPv4 address with /32 (GKE Workload Identity 169.254.169.254/32, EKS Pod Identity 169.254.170.23/32) or an IPv6 address with /128; surrounding whitespace is trimmed. To reach a wider range that is NOT the metadata range, use taskNetworkPolicy.extraEgress. See #958."

  - it: refuses the list where only the SECOND entry is broad, and names that index
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNetworkPolicy.enabled: true
      taskNetworkPolicy.allowMetadataEgress:
        - "169.254.169.254/32"
        - "169.254.169.0/24"
    asserts:
      - failedTemplate:
          errorMessage: "taskNetworkPolicy.allowMetadataEgress[1]=\"169.254.169.0/24\" has prefix /24, which selects more than one host (IPv4 needs /32). Every entry must name exactly ONE host, because NetworkPolicy egress rules are additive: k8s.io/api networking/v1 defines outgoing traffic as allowed if it matches at least one egress rule, so an allow rule here overrides the 169.254.0.0/16 entry in the allow-all rule's except-list and anything broader than a single host reopens the cloud-metadata range this policy exists to block. Accepted: an IPv4 address with /32 (GKE Workload Identity 169.254.169.254/32, EKS Pod Identity 169.254.170.23/32) or an IPv6 address with /128; surrounding whitespace is trimmed. To reach a wider range that is NOT the metadata range, use taskNetworkPolicy.extraEgress. See #958."

  - it: refuses a bare address with no prefix (renders clean, apiserver rejects the install)
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNetworkPolicy.enabled: true
      taskNetworkPolicy.allowMetadataEgress:
        - "169.254.169.254"
    asserts:
      - failedTemplate:
          errorMessage: "taskNetworkPolicy.allowMetadataEgress[0]=\"169.254.169.254\" has no prefix length. Every entry must name exactly ONE host, because NetworkPolicy egress rules are additive: k8s.io/api networking/v1 defines outgoing traffic as allowed if it matches at least one egress rule, so an allow rule here overrides the 169.254.0.0/16 entry in the allow-all rule's except-list and anything broader than a single host reopens the cloud-metadata range this policy exists to block. Accepted: an IPv4 address with /32 (GKE Workload Identity 169.254.169.254/32, EKS Pod Identity 169.254.170.23/32) or an IPv6 address with /128; surrounding whitespace is trimmed. To reach a wider range that is NOT the metadata range, use taskNetworkPolicy.extraEgress. See #958."

  - it: refuses an IPv4 prefix length above 32
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNetworkPolicy.enabled: true
      taskNetworkPolicy.allowMetadataEgress:
        - "169.254.169.254/33"
    asserts:
      - failedTemplate:
          errorMessage: "taskNetworkPolicy.allowMetadataEgress[0]=\"169.254.169.254/33\" has prefix /33, which is not a valid IPv4 prefix length (IPv4 needs /32). Every entry must name exactly ONE host, because NetworkPolicy egress rules are additive: k8s.io/api networking/v1 defines outgoing traffic as allowed if it matches at least one egress rule, so an allow rule here overrides the 169.254.0.0/16 entry in the allow-all rule's except-list and anything broader than a single host reopens the cloud-metadata range this policy exists to block. Accepted: an IPv4 address with /32 (GKE Workload Identity 169.254.169.254/32, EKS Pod Identity 169.254.170.23/32) or an IPv6 address with /128; surrounding whitespace is trimmed. To reach a wider range that is NOT the metadata range, use taskNetworkPolicy.extraEgress. See #958."

  - it: refuses an IPv6 prefix broader than /128
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNetworkPolicy.enabled: true
      taskNetworkPolicy.allowMetadataEgress:
        - "fd00:ec2::/64"
    asserts:
      - failedTemplate:
          errorMessage: "taskNetworkPolicy.allowMetadataEgress[0]=\"fd00:ec2::/64\" has prefix /64, which selects more than one host (IPv6 needs /128). Every entry must name exactly ONE host, because NetworkPolicy egress rules are additive: k8s.io/api networking/v1 defines outgoing traffic as allowed if it matches at least one egress rule, so an allow rule here overrides the 169.254.0.0/16 entry in the allow-all rule's except-list and anything broader than a single host reopens the cloud-metadata range this policy exists to block. Accepted: an IPv4 address with /32 (GKE Workload Identity 169.254.169.254/32, EKS Pod Identity 169.254.170.23/32) or an IPv6 address with /128; surrounding whitespace is trimmed. To reach a wider range that is NOT the metadata range, use taskNetworkPolicy.extraEgress. See #958."

  - it: refuses something that is not an address at all
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNetworkPolicy.enabled: true
      taskNetworkPolicy.allowMetadataEgress:
        - "not-an-ip/32"
    asserts:
      - failedTemplate:
          errorMessage: "taskNetworkPolicy.allowMetadataEgress[0]=\"not-an-ip/32\" is not an IPv4 or IPv6 address in CIDR form. Every entry must name exactly ONE host, because NetworkPolicy egress rules are additive: k8s.io/api networking/v1 defines outgoing traffic as allowed if it matches at least one egress rule, so an allow rule here overrides the 169.254.0.0/16 entry in the allow-all rule's except-list and anything broader than a single host reopens the cloud-metadata range this policy exists to block. Accepted: an IPv4 address with /32 (GKE Workload Identity 169.254.169.254/32, EKS Pod Identity 169.254.170.23/32) or an IPv6 address with /128; surrounding whitespace is trimmed. To reach a wider range that is NOT the metadata range, use taskNetworkPolicy.extraEgress. See #958."

  - it: refuses a non-numeric prefix length
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNetworkPolicy.enabled: true
      taskNetworkPolicy.allowMetadataEgress:
        - "169.254.169.254/all"
    asserts:
      - failedTemplate:
          errorMessage: "taskNetworkPolicy.allowMetadataEgress[0]=\"169.254.169.254/all\" has a prefix length of /all, which is not a plain decimal number without leading zeros. Every entry must name exactly ONE host, because NetworkPolicy egress rules are additive: k8s.io/api networking/v1 defines outgoing traffic as allowed if it matches at least one egress rule, so an allow rule here overrides the 169.254.0.0/16 entry in the allow-all rule's except-list and anything broader than a single host reopens the cloud-metadata range this policy exists to block. Accepted: an IPv4 address with /32 (GKE Workload Identity 169.254.169.254/32, EKS Pod Identity 169.254.170.23/32) or an IPv6 address with /128; surrounding whitespace is trimmed. To reach a wider range that is NOT the metadata range, use taskNetworkPolicy.extraEgress. See #958."

  - it: refuses a blank entry
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNetworkPolicy.enabled: true
      taskNetworkPolicy.allowMetadataEgress:
        - "169.254.169.254/32"
        - "   "
    asserts:
      - failedTemplate:
          errorMessage: "taskNetworkPolicy.allowMetadataEgress[1]=\"\" is empty. Every entry must name exactly ONE host, because NetworkPolicy egress rules are additive: k8s.io/api networking/v1 defines outgoing traffic as allowed if it matches at least one egress rule, so an allow rule here overrides the 169.254.0.0/16 entry in the allow-all rule's except-list and anything broader than a single host reopens the cloud-metadata range this policy exists to block. Accepted: an IPv4 address with /32 (GKE Workload Identity 169.254.169.254/32, EKS Pod Identity 169.254.170.23/32) or an IPv6 address with /128; surrounding whitespace is trimmed. To reach a wider range that is NOT the metadata range, use taskNetworkPolicy.extraEgress. See #958."

  # A GitOps tool that sends the override unindexed delivers a STRING, not a
  # list, and `range` over it used to die with "range can't iterate over
  # 169.254.169.254/32" — a message that names neither the value nor the fix.
  - it: refuses a scalar override with a message that names the list syntax
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNetworkPolicy.enabled: true
      taskNetworkPolicy.allowMetadataEgress: "169.254.169.254/32"
    asserts:
      - failedTemplate:
          errorMessage: "taskNetworkPolicy.allowMetadataEgress must be a list, one CIDR per entry (got \"169.254.169.254/32\", kind string). A scalar arrives when the override is sent unindexed; use list syntax instead: --set taskNetworkPolicy.allowMetadataEgress[0]=169.254.169.254/32, or --set \"taskNetworkPolicy.allowMetadataEgress={169.254.169.254/32,169.254.170.23/32}\". Every entry must name exactly ONE host, because NetworkPolicy egress rules are additive: k8s.io/api networking/v1 defines outgoing traffic as allowed if it matches at least one egress rule, so an allow rule here overrides the 169.254.0.0/16 entry in the allow-all rule's except-list and anything broader than a single host reopens the cloud-metadata range this policy exists to block. Accepted: an IPv4 address with /32 (GKE Workload Identity 169.254.169.254/32, EKS Pod Identity 169.254.170.23/32) or an IPv6 address with /128; surrounding whitespace is trimmed. To reach a wider range that is NOT the metadata range, use taskNetworkPolicy.extraEgress. See #958."

  # Review of #1065. The helper's justification claimed that not checking range
  # membership left "the same containment either way" — while naming the
  # counterexample in its own parenthesis. It is not the same: this renders, and
  # hands back the EKS apiserver ClusterIP that blockPrivateNetworks had just put
  # in the except list.
  #
  # The behaviour is deliberate — a single host is the smallest grant this field
  # can make, and an in-range check would refuse the legitimate IPv6 endpoint,
  # which lives outside 169.254.0.0/16 entirely — so it is pinned here as a
  # recorded decision rather than left as an accident.
  - it: "issue #1065 — a single host outside the metadata range renders, including one blockPrivateNetworks removed"
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNetworkPolicy.enabled: true
      taskNetworkPolicy.blockPrivateNetworks: true
      taskNetworkPolicy.allowMetadataEgress:
        - "10.96.0.1/32"
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: "10.96.0.1/32"

  # An IPv4-mapped IPv6 literal was refused in its dotted spelling and accepted
  # in its hex one — the same address, two answers, because the IPv6 shape check
  # has no `.` in its character class. The comment claimed both were refused.
  - it: "issue #1065 — refuses an IPv4-mapped IPv6 literal in its hex spelling"
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNetworkPolicy.enabled: true
      taskNetworkPolicy.allowMetadataEgress:
        - "::ffff:a9fe:a9fe/128"
    asserts:
      - failedTemplate:
          errorPattern: "IPv4-mapped IPv6 literal"

  - it: "issue #1065 — refuses an IPv4-mapped IPv6 literal in its dotted spelling"
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNetworkPolicy.enabled: true
      taskNetworkPolicy.allowMetadataEgress:
        - "::ffff:169.254.169.254/128"
    asserts:
      - failedTemplate:
          errorPattern: "IPv4-mapped IPv6 literal"

  # Sprig's atoi discards strconv's error and returns 0, so an unparseable
  # prefix used to be refused as "selects more than one host" — the right
  # outcome for the wrong reason, which is how a message stops being a
  # diagnostic.
  - it: "issue #1065 — an unparseable prefix length is refused for the right reason"
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNetworkPolicy.enabled: true
      taskNetworkPolicy.allowMetadataEgress:
        - "169.254.169.254/99999999999999999999"
    asserts:
      - failedTemplate:
          errorPattern: "too long to be one"

  - it: "issue #1065 — a leading-zero prefix says so, rather than 'not a number'"
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNetworkPolicy.enabled: true
      taskNetworkPolicy.allowMetadataEgress:
        - "169.254.169.254/032"
    asserts:
      - failedTemplate:
          errorPattern: "without leading zeros"
