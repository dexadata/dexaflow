suite: pre-install migration Job hook + hardening
templates:
  - migration-job.yaml
release:
  name: leoflow
# The pre-rename naming (what charts/leoflow renders), which existing
# installs depend on; default dexaflow naming is in chart_name_test.yaml.
set:
  nameOverride: leoflow
tests:
  - it: not rendered when migrations.enabled is false
    set:
      migrations.enabled: false
      database.url: postgres://h/d
    asserts:
      - hasDocuments:
          count: 0

  - it: rendered with pre-install/pre-upgrade hook + weight 0 + before-hook-creation,hook-succeeded
    set:
      database.url: postgres://h/d
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "0"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded

  - it: pod + container securityContext pin runAsNonRoot + UID 65532 (matches Deployment)
    set:
      database.url: postgres://h/d
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 65532
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 65532
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL
      # Migrate is a static Go binary that writes only to the DB (advisory
      # lock for migration mutex). No /tmp writes. Read-only root FS is the
      # tightest restricted-PSA posture and we can afford it here (verified
      # locally with `docker run --read-only -u 65532:65532 leoflow-migrate
      # -version` succeeding).
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: hook ordering — Secret hook (-5) precedes Job hook (0) so secretKeyRef resolves at Job start
    # This is the regression that PR #167 caught: without the Secret being a
    # hook, the pre-install Job pod fails with `secret "leoflow-secrets" not
    # found`. Unit-test the negative — the Job's hook weight MUST be > Secret's
    # (helm-template-checks.sh asserts the Secret is at -5; here we assert the
    # Job is at 0, so the ordering Secret → Job holds.).
    set:
      database.url: postgres://h/d
      auth.jwtSecret: jwt   # forces the chart-managed Secret to render
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "0"   # Secret is at "-5"; Job at "0" → Secret runs first ✓

  - it: "audit H2 — migration Job pod sets seccompProfile RuntimeDefault (restricted PSA)"
    set:
      database.url: postgres://h/d
    asserts:
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: "issue #727 — migration Job pod disables ServiceAccount token automount"
    # The migrate binary talks only to Postgres via LEOFLOW_DATABASE_URL; it
    # never calls the Kubernetes API, so it has no need for a projected SA
    # token. Leaving automount on hands the most-hardened pod in the chart the
    # namespace default SA's token — an unused credential and needless attack
    # surface. Mirrors internal/executor/kubernetes.go, which already sets
    # AutomountServiceAccountToken:false on the task pod.
    set:
      database.url: postgres://h/d
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  # #1052 — the Job reads the SAME databaseUrl secret as the control plane, so a
  # DSN carrying `sslrootcert=/etc/leoflow/db-ca/ca.crt` (the recipe values.yaml
  # documents for managed Postgres) needs the bundle mounted here too. It was
  # mounted only in the Deployment, so following the chart's own instructions
  # produced a cluster where the server came up and the pre-install Job failed.
  #
  # Invisible to every cluster test in CI: with no sslrootcert lib/pq falls back
  # to the system trust store, and an in-cluster Postgres is plaintext anyway.
  # Only a managed database with a CA outside the system roots — RDS, Cloud SQL —
  # reaches the failing path, so this assertion is the coverage.
  - it: "issue #1052 — mounts the managed-Postgres CA bundle into the migration Job"
    set:
      database.url: postgres://h/d
      database.caConfigMap: rds-ca-bundle
    asserts:
      # Whole-object `contains:`, mirroring deployment_test.yaml — literally the
      # same content blocks, because the parity between the two templates IS the
      # fix and this makes it a textual parity between the two tests.
      #
      # Index-based scalar asserts were not enough. They left `volumeMounts[0].name`
      # and `configMap.items[0].key` unasserted, and both of those surviving
      # mutations reproduce the wedge this PR exists to remove: a dangling mount
      # name is rejected by apiserver validation so the hook Job cannot be
      # created, and a wrong ConfigMap key parks the pod in ContainerCreating
      # until Helm's timeout, since the container never starts and backoffLimit
      # never engages.
      - contains:
          path: spec.template.spec.volumes
          content:
            name: db-ca
            configMap:
              name: rds-ca-bundle
              items:
                - key: ca.crt
                  path: ca.crt
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: db-ca
            mountPath: /etc/leoflow/db-ca
            readOnly: true
      # The mount has to be on the migrate container specifically — index 0 is
      # only the migrate container while it is the only one.
      - equal:
          path: spec.template.spec.containers[0].name
          value: migrate

  - it: "issue #1052 — mounts nothing when no CA ConfigMap is configured"
    set:
      database.url: postgres://h/d
    asserts:
      # Filtered rather than asserting the whole list is absent, so adding an
      # unrelated optional volume later does not fail this case for the wrong
      # reason. Same shape as the Deployment's.
      - notExists:
          path: spec.template.spec.volumes[?(@.name == 'db-ca')]
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == 'db-ca')]

  # #1053 — requests, not just limits. Without requests the pod is BestEffort: a
  # namespace ResourceQuota on requests.cpu/requests.memory rejects it at
  # admission, and because this is a pre-install hook that fails `helm install`
  # outright. BestEffort is also evicted first under node pressure, and an
  # eviction mid-`up` leaves schema_migrations dirty on a cluster whose control
  # plane has not started yet.
  - it: "issue #1053 — the migration Job requests CPU and memory (not BestEffort)"
    set:
      database.url: postgres://h/d
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 128Mi
      # The limits are pinned, not merely asserted to exist. `exists:` cannot
      # see a limit BELOW its request, which the apiserver rejects outright —
      # the same wedge, reached by a typo. The 2:1 ratio is also load-bearing:
      # a namespace LimitRange with maxLimitRequestRatio rejects anything wider.
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 200m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 256Mi

  - it: "issue #1053 — the operator can raise the migration Job's resources"
    set:
      database.url: postgres://h/d
      migrations.resources.requests.cpu: 250m
      migrations.resources.requests.memory: 512Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 250m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 512Mi

  # #1055 — the migrate hook pod must not be selectable by the control-plane
  # Service. `leoflow.roleSelectorLabels` for the default "all" role is EXACTLY
  # `leoflow.selectorLabels`, and a Service selector matches every pod whose
  # labels are a SUPERSET of it. This pod template carried that same set, so on
  # `helm upgrade` — the one path where the Service already exists while the
  # pre-upgrade hook runs — the migrate pod joined the Service's EndpointSlice
  # and the PodDisruptionBudget's healthy count. A Job pod has no readinessProbe,
  # so it is Ready the instant its container starts. The disruption-accounting
  # half is a measured loss; the traffic half is only latent today, for a reason
  # that has nothing to do with this chart's intent — see leoflow.migrateName.
  #
  # Adding a component label alongside the shared set does NOT fix it: a superset
  # still matches. The pod has to differ on a key the selector CARRIES, so the
  # Job runs under its own application name — it is its own image
  # (leoflow-migrate), not a replica of the control plane.
  #
  # The map is pinned WHOLE. Asserting that one label is present would stay green
  # if someone re-added the shared selector set beside it, which is the exact
  # regression. The cross-document property in every deployment mode is asserted
  # in tests/migrate_pod_selection_test.yaml and enforced against the real
  # rendered maps by scripts/check-migrate-pod-selection.sh.
  - it: "issue #1055 — the migrate pod carries its own app name, not the control plane's selector labels"
    set:
      database.url: postgres://h/d
    asserts:
      - equal:
          path: spec.template.metadata.labels
          value:
            app.kubernetes.io/name: leoflow-migrate
            app.kubernetes.io/instance: leoflow
            app.kubernetes.io/component: migrate

  # The suffix is applied to the chart NAME, so a nameOverride carries through and
  # the value still fits the 63-char label limit (leoflow.suffixRole truncates the
  # base to 53 first). Without that truncation a long nameOverride would produce a
  # label value the apiserver rejects — and this is a pre-install hook, so that is
  # a failed `helm install`, not a degraded one.
  - it: "issue #1055 — the migrate pod's app name follows nameOverride and stays within 63 chars"
    set:
      database.url: postgres://h/d
      nameOverride: aaaaaaaaaabbbbbbbbbbccccccccccddddddddddeeeeeeeeeeffffffffffggg
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: aaaaaaaaaabbbbbbbbbbccccccccccddddddddddeeeeeeeeeefff-migrate

  # #1056: the Job is the FIRST workload the chart runs and was the only one
  # ignoring the pod-placement values every other workload honours. On a cluster
  # with a tainted or dedicated pool — the operator set `tolerations` precisely
  # so Dexaflow lands there — the pre-install hook is unschedulable: the pod sits
  # Pending, Helm waits out the hook timeout, and the install fails with a
  # message that says nothing about scheduling.
  - it: inherits nodeSelector, tolerations and affinity from the top-level values
    set:
      database.url: postgres://h/d
      nodeSelector:
        workload: leoflow
      tolerations:
        - key: dedicated
          operator: Equal
          value: leoflow
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: [eu-west-1a]
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.workload
          value: leoflow
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: dedicated
      - equal:
          path: spec.template.spec.tolerations[0].effect
          value: NoSchedule
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: topology.kubernetes.io/zone

  # Absent values must render nothing at all: an empty `nodeSelector: {}` in the
  # pod spec is not harmless noise — it is a diff against every existing
  # release, and on some admission stacks an empty affinity block is rejected.
  - it: renders no placement keys when none are set
    set:
      database.url: postgres://h/d
    asserts:
      - notExists:
          path: spec.template.spec.nodeSelector
      - notExists:
          path: spec.template.spec.tolerations
      - notExists:
          path: spec.template.spec.affinity
