suite: split NetworkPolicies scope ingress to each role's served ports (ADR 0049)
templates:
  - networkpolicy.yaml
release:
  name: leoflow
# The pre-rename naming (what charts/leoflow renders), which existing
# installs depend on; default dexaflow naming is in chart_name_test.yaml.
set:
  nameOverride: leoflow
  split.enabled: true
  networkPolicy.enabled: true
tests:
  - it: renders one NetworkPolicy per role
    asserts:
      - hasDocuments:
          count: 2

  - it: the api policy selects api pods and opens http ingress, not grpc
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: leoflow-api
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: api
      - contains:
          path: spec.ingress[0].ports
          content:
            port: 8080
            protocol: TCP
      - notContains:
          path: spec.ingress[0].ports
          content:
            port: 9091
            protocol: TCP

  - it: the scheduler policy selects scheduler pods and opens grpc ingress, not http
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: leoflow-scheduler
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: scheduler
      - contains:
          path: spec.ingress[0].ports
          content:
            port: 9091
            protocol: TCP
      - notContains:
          path: spec.ingress[0].ports
          content:
            port: 8080
            protocol: TCP
