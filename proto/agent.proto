// proto/agent.proto
// Communication protocol between the Leoflow Control Plane and the worker Agent.
// The Agent runs as PID 1 inside every task pod and connects back to the Control Plane on startup.

syntax = "proto3";

package leoflow.agent.v1;

option go_package = "github.com/dexadata/dexaflow/proto/agent/v1;agentv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// ─────────────────────────────────────────────────────────────────────────
// Service
// ─────────────────────────────────────────────────────────────────────────
service AgentService {
    // Agent exchanges its bootstrap credential for a task-scoped agent JWT
    // (ADR 0055 Fix #3). Called once at startup ONLY when the pod was given a
    // projected ServiceAccount token instead of a plaintext token: the agent
    // presents that projected token in metadata, the Control Plane validates it
    // with a Kubernetes TokenReview, resolves the pod to its task instance, and
    // returns the task-scoped JWT the agent uses as its bearer thereafter. The
    // default (env-var) transport never calls this.
    rpc ExchangeToken (ExchangeTokenRequest) returns (ExchangeTokenResponse);

    // Agent registers with the Control Plane on container startup.
    // The JWT in metadata identifies the task instance.
    rpc Register (RegisterRequest) returns (RegisterResponse);

    // Agent fetches the task specification.
    rpc GetTaskSpec (GetTaskSpecRequest) returns (TaskSpec);

    // Agent pulls XCom values declared as inputs.
    rpc FetchXCom (FetchXComRequest) returns (FetchXComResponse);

    // Agent pushes an XCom value (typically the task return value).
    rpc PushXCom (PushXComRequest) returns (PushXComResponse);

    // Agent streams log lines back to the Control Plane.
    // Bidirectional: server sends acks; client streams logs.
    rpc StreamLogs (stream LogLine) returns (stream LogAck);

    // Agent reports task state transitions (running, success, failed).
    rpc ReportState (ReportStateRequest) returns (ReportStateResponse);

    // Agent sends periodic heartbeats during long-running tasks.
    rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);

    // Agent fetches the tenant's Variables to export as AIRFLOW_VAR_* env vars,
    // so user code resolves them via Airflow's native env secrets backend.
    rpc GetVariables (GetVariablesRequest) returns (GetVariablesResponse);

    // Agent fetches the tenant's Connections (as Airflow connection URIs) to
    // export as AIRFLOW_CONN_* env vars.
    rpc GetConnections (GetConnectionsRequest) returns (GetConnectionsResponse);

    // A warm worker awaits per-attempt assignments over a long-lived bidi stream
    // (ADR 0058 N1b). Down: the control plane pushes WorkAssignments. Up: the
    // worker sends its initial WorkerRegister, per-assignment AssignmentAcks, and
    // SlotFree signals. Gated on execution.warm_pools_enabled — the handler
    // returns FailedPrecondition when warm pools are off, so the transport is
    // inert by default.
    rpc AwaitAssignment (stream WorkerMessage) returns (stream WorkAssignment);
}

// ─────────────────────────────────────────────────────────────────────────
// Messages
// ─────────────────────────────────────────────────────────────────────────

// GetVariablesRequest is empty; the calling task instance is identified by its
// agent token in metadata (the tenant is derived from it).
message GetVariablesRequest {}

message GetVariablesResponse {
    // key -> value, exported by the agent as AIRFLOW_VAR_<KEY>.
    map<string, string> variables = 1;
}

message GetConnectionsRequest {}

message GetConnectionsResponse {
    // conn_id -> Airflow connection URI, exported as AIRFLOW_CONN_<CONN_ID>.
    map<string, string> connection_uris = 1;
}

// ExchangeTokenRequest is empty; the agent presents its projected ServiceAccount
// token as the bootstrap bearer in the authorization metadata. The Control Plane
// derives everything it needs (the pod, hence the task instance) from that token
// via a Kubernetes TokenReview.
message ExchangeTokenRequest {}

message ExchangeTokenResponse {
    // A freshly minted, task-scoped agent JWT — the same identity scoped and
    // liveness-checked on the secret path. The agent swaps its bearer to this
    // value for every subsequent RPC. Never logged.
    string agent_token = 1;
}

message RegisterRequest {
    string agent_version = 1;
    string hostname = 2;
    map<string, string> environment = 3;          // selected env vars for diagnostics
}

message RegisterResponse {
    // Server-assigned correlation token for subsequent calls.
    string session_id = 1;
    // Server clock for skew detection.
    google.protobuf.Timestamp server_time = 2;
}

message GetTaskSpecRequest {
    // The JWT in metadata already identifies the task; no payload needed.
}

message TaskSpec {
    string tenant_id = 1;
    string dag_id = 2;
    string dag_version = 3;
    string run_id = 4;
    string task_id = 5;
    int32 try_number = 6;
    string operator = 7;                          // 'python', 'bash', 'airflow_operator'
    string entrypoint = 8;
    map<string, string> environment = 9;
    map<string, XComUpstreams> xcom_input_mapping = 10;  // param_name -> ordered list of upstream task_ids (1 = single, N = fan-in)
    int32 execution_timeout_seconds = 11;
    google.protobuf.Struct extra = 12;            // operator-specific fields
    string call_args_json = 13;                   // TaskFlow literal call args, JSON-encoded (#115). Named call_args to leave 'params' free for Airflow's DAG-run params (#148).
    string operator_class = 14;                   // For operator='airflow_operator': the dotted provider operator/sensor class the runtime imports and executes (ADR 0040).
    string operator_args_json = 15;               // For operator='airflow_operator': the operator's constructor kwargs, JSON-encoded. Delivered to the runtime as LEOFLOW_OPERATOR_ARGS.
    string logical_date = 16;                      // The DagRun's logical date, RFC3339. The agent derives the runtime's LEOFLOW_TS (this value) and LEOFLOW_DS (the date) so the standalone operator context has a real ds/ts (ADR 0040). Empty leaves them unset.
    repeated string depends_on = 17;               // The task's upstream task_ids. The agent fetches each one's return_value and delivers them as the LEOFLOW_XCOM_BY_TASK map so a captured operator's ti.xcom_pull(<id>) resolves it (chained operators, ADR 0040).
    string data_interval_start = 18;               // The DagRun's data interval start, RFC3339. The agent stamps LEOFLOW_DATA_INTERVAL_START so the standalone operator context exposes data_interval_start (ADR 0040). Empty leaves it unset.
    string data_interval_end = 19;                 // The DagRun's data interval end, RFC3339. Stamped as LEOFLOW_DATA_INTERVAL_END -> context data_interval_end. Empty leaves it unset.
    string params_json = 20;                        // The DagRun's params/conf, JSON-encoded (#148). Stamped as LEOFLOW_PARAMS so the standalone operator context exposes context['params'] / {{ params.X }}. Empty leaves params={}.
    string first_reschedule_at = 21;                 // For a reschedule-mode sensor re-dispatched after poking not-ready (#380): the time it FIRST entered reschedule, RFC3339. Stamped as LEOFLOW_FIRST_RESCHEDULE_AT so get_first_reschedule_date returns the real value and the sensor honors its cumulative timeout. Empty on the first attempt.
    int32 max_tries = 22;                            // The task's total attempt budget (retries + 1). The agent stamps LEOFLOW_MAX_TRIES so the runtime fires on_failure_callback only on the terminal attempt (try_number == max_tries), never on an intermediate retry (#424).
    bool on_failure_callback = 23;                   // The task declares an Airflow on_failure_callback (#424). The agent stamps LEOFLOW_ON_FAILURE_CALLBACK=1 so the runtime re-imports dag.py and runs it in-process on the task's final failure. The callable itself is not carried.
    repeated string declared_variables = 24;         // The variable names this task declared (leoflow.yaml). The agent asks a pod-side external secret resolver only for declared names, so declaration stays the scope authority for externally-sourced secrets too (ADR 0060 / ADR 0055).
    repeated string declared_connections = 25;       // The connection ids this task declared (leoflow.yaml). Same role as declared_variables for connections.
}

// XComUpstreams is the list of upstream task_ids whose return_values feed one
// parameter. A single upstream is `task_ids: ["extract"]`; fan-in (binding a
// list of upstreams to a parameter) is `task_ids: ["a", "b", "c"]`. The runtime
// receives a JSON array when len > 1, and a single value when len == 1 — so a
// fan-in parameter is delivered as a list, a normal parameter as the value.
message XComUpstreams {
    repeated string task_ids = 1;
}

message FetchXComRequest {
    string upstream_task_id = 1;
    string key = 2;                               // defaults to 'return_value'
}

message FetchXComResponse {
    bytes value = 1;                              // JSON-encoded payload
    string content_type = 2;                      // 'application/json' by default
    int32 size_bytes = 3;
    google.protobuf.Timestamp created_at = 4;
}

message PushXComRequest {
    string key = 1;                               // defaults to 'return_value'
    bytes value = 2;                              // JSON-encoded payload, max 256KB
    string content_type = 3;
}

message PushXComResponse {
    bool accepted = 1;
    string rejection_reason = 2;                  // empty if accepted
    int32 ttl_seconds = 3;                        // server-set TTL
}

message LogLine {
    google.protobuf.Timestamp time = 1;
    LogLevel level = 2;
    string message = 3;
    string stream = 4;                            // 'stdout' or 'stderr'
    int64 line_number = 5;
}

enum LogLevel {
    LOG_LEVEL_UNSPECIFIED = 0;
    LOG_LEVEL_DEBUG = 1;
    LOG_LEVEL_INFO = 2;
    LOG_LEVEL_WARN = 3;
    LOG_LEVEL_ERROR = 4;
}

message LogAck {
    int64 acknowledged_through_line = 1;
}

message ReportStateRequest {
    TaskState state = 1;
    int32 exit_code = 2;                          // for terminal states
    string error_message = 3;                     // for failed state
    google.protobuf.Timestamp occurred_at = 4;
    // For TASK_STATE_UP_FOR_RESCHEDULE: the earliest time the scheduler may
    // re-dispatch this task instance (a reschedule-mode sensor poked not-ready).
    google.protobuf.Timestamp reschedule_at = 5;
}

enum TaskState {
    TASK_STATE_UNSPECIFIED = 0;
    TASK_STATE_RUNNING = 1;
    TASK_STATE_SUCCESS = 2;
    TASK_STATE_FAILED = 3;
    TASK_STATE_SKIPPED = 4;
    // A reschedule-mode sensor released its pod; re-dispatch at reschedule_at,
    // without consuming retry budget (ADR 0040 Phase B, #380). Distinct from
    // FAILED so the scheduler reschedules rather than failing/retrying the task.
    TASK_STATE_UP_FOR_RESCHEDULE = 5;
}

message ReportStateResponse {
    bool acknowledged = 1;
    // If the Control Plane wants the task to stop (cancellation), it signals here.
    bool should_terminate = 2;
}

message HeartbeatRequest {
    google.protobuf.Timestamp sent_at = 1;
    map<string, double> custom_metrics = 2;       // optional task-reported metrics
}

// WorkAssignment is one unit of per-attempt work the control plane hands to a
// warm worker over AwaitAssignment (ADR 0058 N1b). The control plane mints the
// attempt_token and generates assignment_id; the worker replies with an
// AssignmentAck referencing assignment_id.
message WorkAssignment {
    string assignment_id = 1;   // control-plane-generated correlation id for this hand-off
    string attempt_token = 2;   // per-attempt agent JWT the worker adopts for this attempt; NEVER logged
    string dag_run_id = 3;
    string task_id = 4;
    int32 try_number = 5;
    string dag_version_id = 6;  // the pool identity this assignment belongs to
    int64 lease_seconds = 7;    // ack deadline: unacked within it => the attempt is reclaimed
}

// WorkerMessage is everything a warm worker sends UP the AwaitAssignment stream:
// its one initial registration, then per-assignment acks and slot-free signals.
message WorkerMessage {
    oneof msg {
        WorkerRegister register = 1;
        AssignmentAck ack = 2;
        SlotFree slot_free = 3;
    }
}

// WorkerRegister is the mandatory first WorkerMessage. dag_version_id names which
// pool the worker serves. The worker's IDENTITY (registry key) is taken from its
// authenticated pod/bootstrap credential on the stream context, NOT from this
// payload — a worker must not be able to claim an arbitrary identity here.
message WorkerRegister {
    string dag_version_id = 1;
    // pod_name is the worker's OWN Kubernetes pod name, delivered to the
    // container via the downward API (LEOFLOW_POD_NAME). It is the durable key
    // the control plane binds a started attempt to (warm_worker_id on the running
    // TI) so a later reaper can match bound attempts against the live warm-pod set
    // ListWarmPods returns, even after a leader failover. Unlike an identity, it
    // is a locator, not a credential: the worker's authenticated identity still
    // comes from its bearer token on the stream context, never from this field.
    string pod_name = 2;
}

// AssignmentAck answers a WorkAssignment. started=true means the worker began the
// attempt (the control plane marks it active and cancels the lease). started=false
// means the worker refuses or cannot start it (the control plane reclaims it).
message AssignmentAck {
    string assignment_id = 1;
    bool started = 2;
}

// SlotFree signals that the worker freed an execution slot. Reserved for the
// placement layer (N1b1-place); the transport carries it now and the registry
// records it.
message SlotFree {}

message HeartbeatResponse {
    bool should_terminate = 1;
    google.protobuf.Timestamp server_time = 2;
    // A freshly minted, task-scoped agent token the control plane issues when the
    // heartbeat proves the attempt is still live (ADR 0055 Fix #4). When non-empty
    // the agent atomically swaps its bearer to this value, so a long task keeps a
    // working credential while the short per-attempt TTL bounds a stolen/finished
    // one. Empty means "keep the current token" (no renewal this beat, or the
    // attempt is superseded/past its lifetime ceiling). Never logged.
    string renewed_token = 3;
}
